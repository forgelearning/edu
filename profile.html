<script>
var SUPABASE_URL = ForgeAPI.config.url;
var SUPABASE_KEY = ForgeAPI.config.key;
var hdrs = {'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY};
function supaGet(t,p){return ForgeAPI.get(t,p);}
// responses has no anon SELECT policy, so an anonymous session reads them
// through ForgeClasses (get_linked_responses / get_student_own_responses)
// rather than a direct table read, which silently returns zero rows.



var RANKS = [
  {name:'Apprentice',min:0,max:300,color:'var(--slate)',bg:'var(--panel-2)'},
  {name:'Journeyman',min:300,max:1500,color:'var(--hot)',bg:'rgba(255,201,60,.12)'},
  {name:'Craftsman',min:1500,max:5000,color:'var(--ember)',bg:'rgba(255,107,44,.12)'},
  {name:'Forged',min:5000,max:15000,color:'var(--good)',bg:'rgba(127,217,138,.12)'},
  {name:'Master',min:15000,max:99999,color:'var(--coal)',bg:'var(--ember)'}
];

function getRank(xp){
  for(var i=RANKS.length-1;i>=0;i--){if(xp>=RANKS[i].min)return RANKS[i];}
  return RANKS[0];
}

// Classes are named "<year><letter>/<subject code>" (e.g. "12B/Bs" for a
// Year 12 A-Level class, "10A/Gg" for a Year 10 GCSE class). There's no
// separate level column, so level is derived from the year-group prefix:
// Year 12-13 = A-Level, Year 7-11 = GCSE. See school-overview.html's classLevel.
function classLevel(className) {
  var m = /^(\d+)/.exec(className || '');
  if (!m) return 'alevel';
  var year = parseInt(m[1], 10);
  return year >= 12 ? 'alevel' : 'gcse';
}

function calcGrade(acc, activeMCs, totalMCs, isGCSE) {
  // acc: overall accuracy 0-100
  // activeMCs: number of unresolved misconceptions
  // totalMCs: total unique misconceptions ever fired
  var mcClearance = totalMCs > 0 ? Math.max(0, 1 - (activeMCs / totalMCs)) : 1;
  var score = (acc * 0.6) + (mcClearance * 100 * 0.4);
  if (isGCSE) {
    if (score >= 85) return {grade:'9', next:null, color:'#ffd700', desc:'Exam-ready. Maintain accuracy and keep the Anvil clear.'};
    if (score >= 76) return {grade:'8', next:'9',  color:'var(--good)', desc:'Strong. Clear your remaining misconceptions to break into a 9.'};
    if (score >= 68) return {grade:'7', next:'8',  color:'var(--good)', desc:'Consistent top-end work. Keep the Anvil clear to push higher.'};
    if (score >= 60) return {grade:'6', next:'7',  color:'var(--hot)', desc:'Solid. Accuracy and Anvil work will push this into the 7s.'};
    if (score >= 52) return {grade:'5', next:'6',  color:'var(--hot)', desc:'Strong pass. Focus on the Anvil — misconceptions are costing marks.'};
    if (score >= 44) return {grade:'4', next:'5',  color:'var(--ember)', desc:'Standard pass. Daily sessions and re-forge work will move this up.'};
    if (score >= 36) return {grade:'3', next:'4',  color:'#b45309', desc:'Keep going. Daily sessions and re-forge work will move this.'};
    if (score >= 28) return {grade:'2', next:'3',  color:'var(--slate)', desc:'Early stage. More questions and misconception rework needed.'};
    if (score >= 18) return {grade:'1', next:'2',  color:'var(--slate)', desc:'Early stage. More questions and misconception rework needed.'};
    return             {grade:'U', next:'1',  color:'var(--bad)', desc:'Not enough data yet — complete more sessions to get a reliable band.'};
  }
  if (score >= 85) return {grade:'A*', next:null,    color:'#ffd700', desc:'Exam-ready. Maintain accuracy and keep the Anvil clear.'};
  if (score >= 72) return {grade:'A',  next:'A*',   color:'var(--good)', desc:'Strong. Clear your remaining misconceptions to break into A*.'};
  if (score >= 60) return {grade:'B',  next:'A',    color:'var(--hot)', desc:'Consistent. Accuracy and Anvil work will push this to an A.'};
  if (score >= 50) return {grade:'C',  next:'B',    color:'var(--ember)', desc:'Building. Focus on the Anvil — misconceptions are costing marks.'};
  if (score >= 40) return {grade:'D',  next:'C',    color:'#b45309', desc:'Keep going. Daily sessions and re-forge work will move this.'};
  if (score >= 30) return {grade:'E',  next:'D',    color:'var(--slate)', desc:'Early stage. More questions and misconception rework needed.'};
  return             {grade:'U',  next:'E',    color:'var(--bad)', desc:'Not enough data yet — complete more sessions to get a reliable band.'};
}

function calcXP(responses){
  var xp=0;
  responses.forEach(function(r){
    if(r.question_id&&r.question_id.endsWith('-CRU')&&r.is_correct) xp+=30;
    else if(r.reforge_attempted&&r.reforge_correct) xp+=20;
    else if(r.is_correct&&!r.reforge_attempted) xp+=10;
    if(r.question_id&&r.question_id.endsWith('-ANVIL')&&r.is_correct) xp+=30; // treat anvil correct as 30
  });
  return xp;
}

var st={studentId:null,classId:null,studentName:null,responses:[],isPaid:false,isTrial:false,trialDaysLeft:0,paidSubjects:[],activeTab:'overview',isGCSE:false,loadError:false};
var app=document.getElementById('app');
ForgeState.loading(app, { label: 'Loading your profile', body: 'Getting your progress, strengths, and focus areas ready.' });

function renderLogin(){
  var f=ForgeAuthCard.field('p-name','Your first name',{placeholder:'e.g. Alex',autocomplete:'given-name'})
       +ForgeAuthCard.field('p-code','Class code',{placeholder:'e.g. ECON-Y12-A',upper:true})
       +'<button class="auth-btn" id="p-btn" type="submit">Sign in \u2192</button>'
       +'<p class="auth-err" id="p-err"></p>';
  app.innerHTML=ForgeAuthCard.shell({
    title:'Sign in to Forge',
    sub:'Enter your name and class code to open your progress',
    foot:'No progress yet? <a href="forge-quiz.html">Start with a quiz</a>'
  },f);
  ForgeAuthCard.onSubmit(function(){document.getElementById('p-btn').onclick();});

  document.getElementById('p-btn').onclick=function(){
    var name=document.getElementById('p-name').value.trim();
    var code=document.getElementById('p-code').value.trim().toUpperCase();
    var err=document.getElementById('p-err');
    var btn=document.getElementById('p-btn');
    if(!name||!code){err.textContent='Enter your name and class code.';err.style.display='block';return;}
    btn.disabled=true;btn.textContent='Checking details…';
    // Look up via RPC \u2014 classes/students tables are no longer directly
    // readable by an anonymous (no login) name+code session.
    ForgeAPI.response(SUPABASE_URL + '/rest/v1/rpc/get_student_by_name_and_code', {
      method: 'POST', headers: Object.assign({}, hdrs, {'Content-Type':'application/json'}),
      body: JSON.stringify({ p_code: code, p_name: name })
    }).then(function(r){ return r.json(); }).then(function(rows){
      if(!Array.isArray(rows)||rows.length===0){err.textContent='Class or name not found. Make sure you\'ve done the quiz first.';err.style.display='block';btn.disabled=false;btn.textContent='Sign in \u2192';return;}
      var match = rows[0];
      st.studentId=match.student_id;st.classId=match.class_id;st.studentName=name;st.isGCSE=classLevel(match.class_name)==='gcse';
      try { localStorage.setItem('forge-student', JSON.stringify({studentId: st.studentId, classId: st.classId, classCode: code, studentName: st.studentName, classSubject: match.subject || null, isGCSE: st.isGCSE})); } catch(e) {}
      ForgeClasses.add({
        classId: st.classId, classCode: code, className: match.class_name || null,
        subject: match.subject || null, studentId: st.studentId, studentName: name
      });
      // Signing in here is still signing in — send them to the dashboard.
      // It restores from the same cached session, so no re-entry is needed.
      ForgeClasses.syncFromServer(SUPABASE_URL, SUPABASE_KEY,
        {studentId: st.studentId, classCode: code, studentName: name},
        function(){ ForgeAuth.goToLanding(); });
    });
  };
}

/* Misconception state for a set of responses. Must be processed
   chronologically (oldest first) so streaks accumulate correctly. */
function mcSummary(rows){
  var mcData={};
  rows.slice().sort(function(a,b){
    return (a.created_at||'') < (b.created_at||'') ? -1 : 1;
  }).forEach(function(r){
    if(!r.misconception_tag)return;
    var tag=r.misconception_tag;
    if(!mcData[tag])mcData[tag]={fires:0,reforgeCorrect:0,streak:0};
    if(r.reforge_attempted){
      if(r.reforge_correct){mcData[tag].reforgeCorrect++;mcData[tag].streak++;}
      else mcData[tag].streak=0;
    } else if(!r.is_correct){
      mcData[tag].fires++;mcData[tag].streak=0;
    }
  });
  var active=Object.keys(mcData).filter(function(t){return mcData[t].fires>0&&mcData[t].streak<3;});
  active.sort(function(a,b){return mcData[b].fires-mcData[a].fires;});
  return {
    data: mcData,
    active: active,
    total: Object.keys(mcData).filter(function(t){return mcData[t].fires>0;}).length
  };
}

/* Everything calcGrade needs for one slice of responses. */
function gradeFor(rows, isGCSE){
  var marked=rows.filter(function(r){return !r.reforge_attempted;});
  var right=marked.filter(function(r){return r.is_correct;}).length;
  var acc=marked.length>0?Math.round((right/marked.length)*100):0;
  var mc=mcSummary(rows);
  return {
    grade: calcGrade(acc, mc.active.length, mc.total, isGCSE),
    isGCSE: isGCSE,
    total: marked.length
  };
}

// Display names for the subject keys stored on classes and responses.
var SUBJ_LABELS = {econ:'Economics',psych:'Psychology',soc:'Sociology',geo:'Geography',bus:'Business',chem:'Chemistry',bio:'Biology',phys:'Physics',hist:'History',law:'Law',crim:'Criminology',pol:'Politics',maths:'Maths',german:'German',french:'French',cs:'Computer Science',rs:'Religious Studies',hsc:'Health & Social Care'};

/* The classes the student is in, keyed by class id. Responses are tagged
   with the class they came from, so a student taking four subjects gets a
   predicted grade per subject rather than one band computed off whichever
   class they last signed in through — and each is graded on its own scale,
   since GCSE 9-1 and A-Level A*-E aren't interchangeable. */
function classInfo(){
  var map={};
  if(!window.ForgeClasses)return map;
  ForgeClasses.list().forEach(function(c){
    if(!c.classId)return;
    map[c.classId]={
      label: (c.subject && SUBJ_LABELS[c.subject]) || c.subject || c.className || null,
      isGCSE: classLevel(c.className)==='gcse'
    };
  });
  return map;
}

function calcStreak(responses){
  if(!responses.length) return 0;
  var dates=new Set(responses.map(function(r){return r.created_at?r.created_at.substring(0,10):''}));
  var today=new Date().toISOString().substring(0,10);
  var streak=0;
  var d=new Date();
  while(true){
    var key=d.toISOString().substring(0,10);
    if(dates.has(key)){streak++;d.setDate(d.getDate()-1);}
    else break;
  }
  return streak;
}

        var saved = null;
        try { saved = JSON.parse(localStorage.getItem('forge-student') || 'null'); } catch(e) {}
        if (saved && saved.studentId && !st.studentId) {
          st.studentId = saved.studentId;
          st.classId   = saved.classId || null;
        }

        function loadProfileWithId() {
          var token = ForgeAuth.accessToken();
          var authUser = ForgeAuth.currentUser();
          if (token && authUser) {
            // Load only the currently active class row. Class history is not
            // shared across teachers or class memberships.
            if (st.studentId) {
              supaGet('responses', 'student_id=eq.' + encodeURIComponent(st.studentId) + '&order=created_at.desc').then(function(r) {
                st.responses = r || [];
                renderProfile();
              }).catch(function() { st.loadError=true; renderProfile(); });
            } else { renderProfile(); }
          } else if (st.studentId) {
            supaGet('responses','student_id=eq.'+st.studentId+'&order=created_at.desc').then(function(r){
              st.responses = r || [];
              renderProfile();
              }).catch(function(){ st.loadError=true; renderProfile(); });
          } else {
            renderProfile();
          }
        }

        // If still no studentId, look up by auth_user_id
        if (!st.studentId && ForgeAuth.currentUser()) {
          (function() {
            var _token = ForgeAuth.accessToken();
            var _uid = ForgeAuth.currentUser() ? ForgeAuth.currentUser().id : null;
            if (!_token || !_uid) return Promise.resolve([]);
            return ForgeAPI.response(SUPABASE_URL + '/rest/v1/students?select=*&auth_user_id=eq.' + _uid + '&order=created_at.asc&limit=1', {
              headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + _token }
            }).then(function(r) { return r.json(); });
          })().then(function(rows) {
            if (rows && rows.length > 0) {
              st.studentId = rows[0].id;
              try { localStorage.setItem('forge-paid-student', JSON.stringify({ studentId: rows[0].id, name: sub.name })); } catch(e) {}
            }
            loadProfileWithId();
          }).catch(function() { loadProfileWithId(); });
        } else {
          loadProfileWithId();
        }
      } else {
        checkLocalSessionProfile();
      }
    }).catch(function() { checkLocalSessionProfile(); });
  } else {
    checkLocalSessionProfile();
  }

  function checkLocalSessionProfile() {
    // Check free session
    var freeSession = null;
    try { freeSession = JSON.parse(localStorage.getItem('forge-free-session') || 'null'); } catch(e) {}
    if (freeSession && freeSession.studentId) {
      st.studentId   = freeSession.studentId;
      st.studentName = freeSession.name;
      st.classId     = null;
      // anon cannot SELECT responses directly — the read succeeds and returns
      // nothing. Go through the token-gated RPC instead.
      ForgeClasses.fetchFreeResponses(SUPABASE_URL, SUPABASE_KEY, freeSession, function(r){
        if (r === null) { st.responses = []; st.loadError = true; }
        else { st.responses = r.slice().reverse(); }
        renderProfile();
      });
      return;
    }
    // Check class session
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem('forge-student') || 'null'); } catch(e) {}
    if (saved && saved.studentId) {
      st.studentId   = saved.studentId;
      st.classId     = saved.classId;
      st.studentName = saved.studentName;
      var applyLevelAndLoad = function(){
        if (!saved.classCode) { renderLogin(); return; } // older cached session predates classCode caching — needs one re-entry
        ForgeClasses.adopt(saved);
        // The profile covers every class the student is in, not just the one
        // they last signed in through — pull in the classes they've joined on
        // any device, then their responses across all of them.
        // The sync runs first because the predicted grade needs each class's
        // name to tell GCSE classes from A-Level ones.
        var anchor = {studentId: st.studentId, classCode: saved.classCode, studentName: st.studentName};
        ForgeClasses.syncFromServer(SUPABASE_URL, SUPABASE_KEY, anchor, function(){
          ForgeClasses.fetchLinkedResponses(SUPABASE_URL, SUPABASE_KEY, anchor, function(r){
            st.responses = Array.isArray(r) ? r : [];
            renderProfile();
          });
        });
      };
      if (typeof saved.isGCSE === 'boolean') {
        st.isGCSE = saved.isGCSE;
        applyLevelAndLoad();
      } else if (st.classId) {
        // Older saved sessions predate level tracking — resolve and cache it.
        supaGet('classes','id=eq.'+st.classId).then(function(cls){
          st.isGCSE = Array.isArray(cls) && cls.length>0 && classLevel(cls[0].name)==='gcse';
          try { saved.isGCSE = st.isGCSE; localStorage.setItem('forge-student', JSON.stringify(saved)); } catch(e) {}
          applyLevelAndLoad();
        }).catch(function(){ applyLevelAndLoad(); });
      } else {
        applyLevelAndLoad();
      }
    } else {
      renderLogin();
    }
  }
})();
</script>
