if (!openSoloLogin && !openEmailLogin && ForgeAuth.hasSession()) {
  ForgeAuth.getSession().then(function(result) {
    if (result && result.subscriber) {
      var sub    = result.subscriber;
      var access = result.access;
      state.studentName  = sub.name;
      ForgeClasses.use(sub.name);
      state.paidSubjects = sub.subjects || [];

      // Restore cached studentId if available
      try {
        var paidCache = JSON.parse(localStorage.getItem('forge-paid-student') || 'null');
        if (paidCache && paidCache.studentId) state.studentId = paidCache.studentId;
        var linkedStudent = JSON.parse(localStorage.getItem('forge-student') || 'null');
        if (linkedStudent && linkedStudent.studentId && linkedStudent.classId) {
          state.studentId = linkedStudent.studentId;
          state.classId = linkedStudent.classId;
          state.studentName = linkedStudent.studentName || state.studentName;
        }
      } catch(e) {}

      if (access === 'pro') {
        state.isPaid  = true;
        state.isTrial = false;
      } else if (access === 'trial') {
        state.isPaid       = false;
        state.isTrial      = true;
        state.trialDaysLeft = result.daysLeft;
      } else {
        state.isPaid  = false;
        state.isTrial = false;
      }
      // Signed-in accounts load no history here otherwise; fetch it so the
      // results screen can show rank progress.
      var xpToken = ForgeAuth.accessToken && ForgeAuth.accessToken();
      var xpUser = ForgeAuth.currentUser && ForgeAuth.currentUser();
      if (xpToken && xpUser && ForgeClasses.fetchAuthResponses) {
        ForgeClasses.fetchAuthResponses(xpToken, xpUser.id, function(rows, error) { if (!error) setXPHistory(rows); });
      }
      if (access === 'expired') {
        state.phase = 'trial-expired';
      } else if (state.paidSubjects.length === 1 && SUBJECTS[state.paidSubjects[0]]) {
        state.subject      = state.paidSubjects[0];
        state.classSubject = state.paidSubjects[0];
        state.phase        = 'banks';
      } else {
        state.phase = 'subjects';
      }
      render();
      return;
    }
    if (result) {
      ForgeAuth.restoreFreeStudent().then(function(freeSession) {
        state.studentName = freeSession.name;
        state.studentId = freeSession.studentId;
        state.classId = null;
        state.isPaid = false;
        state.isTrial = false;
        ForgeClasses.use(freeSession.name);
        settleRequestedSubject();
        ForgeClasses.fetchAuthResponses(ForgeAuth.accessToken(), ForgeAuth.currentUser().id, function(responses, error) {
          if (error) { requestedCheck = false; render(); return; }
          state.responseHistory = responses || [];
          state.weightMap = buildWeightMap(responses || []);
          state.bankStats = buildBankStats(responses || []);
          setXPHistory(responses);
          if (state.phase === 'banks' || requestedCheck) render();
        });
        render();
      }).catch(function() { render(); });
      return;
    }
    render();
  }).catch(function() { render(); });
} else {
  var restored = false;
  if (!openClassJoin && !openSoloLogin && !openEmailLogin) try {
    var savedSession = JSON.parse(localStorage.getItem('forge-student') || 'null');
    if (savedSession && savedSession.studentName && savedSession.classId && !(ForgeStudyMode.isIndependent() && !requestedClassId)) {
      state.studentId    = savedSession.studentId    || null;
      state.classId      = savedSession.classId;
      state.classCode    = savedSession.classCode || null;
      state.studentCode  = savedSession.studentCode || null;
      state.studentName  = savedSession.studentName;
      state.classSubject = savedSession.classSubject || null;
      state.isPaid       = false;
      state.isTrial      = false;

      // Sessions from before multi-class support only know about one class —
      // fold it into the list so it sits alongside any joined since.
      ForgeClasses.adopt(savedSession);

      function settlePhase() {
        // Class sync can finish after the requested bank has already opened.
        // Preserve that assignment route instead of returning to the picker.
        if (requestedBankStarted && state.bank && BANKS[state.bank]) {
          state.subject = getSubjectForBank(state.bank);
          state.phase = 'quiz';
          return;
        }
        if (requestedSubject && SUBJECTS[requestedSubject]) {
          state.subject = requestedSubject;
          state.phase = 'banks';
          requestedSubject = null;
          return;
        }
        var joined = ForgeClasses.subjects(SUBJECTS);
        if (joined.length === 1) {
          state.subject      = joined[0];
          state.classSubject = joined[0];
          state.phase        = 'banks';
        } else if (joined.length > 1) {
          state.phase = 'subjects';
        } else if (state.classSubject && SUBJECTS[state.classSubject]) {
          state.subject = state.classSubject;
          state.phase   = 'banks';
        } else {
          state.phase = 'subjects';
          // Stored without a subject (the classes table has no anon SELECT
          // policy, so this has to come back through the RPC).
          ForgeClasses.backfillSubjects(SUPABASE_URL, SUPABASE_KEY, function() {
            var subs = ForgeClasses.subjects(SUBJECTS);
            if (subs.length === 1) {
              state.subject = subs[0]; state.classSubject = subs[0]; state.phase = 'banks';
            }
            if (subs.length) render();
          });
        }
      }

      settlePhase();
      // Pick up classes joined on the student's other devices.
      ForgeClasses.syncFromServer(SUPABASE_URL, SUPABASE_KEY, {
        studentId: state.studentId, classCode: savedSession.classCode, studentName: state.studentName
      }, function() { settlePhase(); render(); });
      if (state.studentId && savedSession.classCode) {
        // Same loader as Home and Profile. It sends the student code, which a
        // coded class requires: the legacy get_student_own_responses answers []
        // there, so this page used to start every coded student from zero XP
        // (the results card disagreed with the league's rank) and with no
        // spaced-repetition history.
        ForgeClasses.fetchLinkedResponses(SUPABASE_URL, SUPABASE_KEY, {
          studentId: state.studentId, classId: state.classId, classCode: savedSession.classCode,
          studentCode: state.studentCode, studentName: state.studentName, subject: state.classSubject
        }, function(responses, error) {
          // A check set cannot be chosen without the history; open practice.
          if (error) { state.weightMap = {}; if (requestedCheck) { requestedCheck = false; render(); } return; }
          state.responseHistory = responses;
          state.weightMap = buildWeightMap(responses);
          state.bankStats = buildBankStats(responses);
          setXPHistory(responses);
          if (state.phase === 'banks' || requestedCheck) render();
        });
      }
      restored = true;
    }
  } catch(e) {}

  if (!openClassJoin && !openSoloLogin && !openEmailLogin && !restored) {
    var freeSession = loadFreeSession();

    if (freeSession && freeSession.studentId) {
      state.studentName   = freeSession.name;
      ForgeClasses.use(freeSession.name);
      state.studentId     = freeSession.studentId;
      state.classId       = null;
      state.isPaid        = false;
      state.isTrial       = false;
      settleRequestedSubject();
      ForgeClasses.fetchFreeResponses(SUPABASE_URL, SUPABASE_KEY, freeSession, function(responses) {
        state.responseHistory = responses || [];
        state.weightMap = buildWeightMap(responses || []);
        state.bankStats = buildBankStats(responses || []);
        setXPHistory(responses);
        if (state.phase === 'banks' || requestedCheck) render();
      });
      restored = true;
    }
  }
  document.addEventListener('forge-content-ready', function () { if (state.phase === 'bank') render(); });

  // Mobile browsers suspend a page aggressively when the user switches apps
  // or locks the screen. Persist the current question before that happens so
  // returning to Forge resumes the same session rather than losing context.
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden' && typeof forgeSaveSession === 'function') forgeSaveSession();
  });
  window.addEventListener('pagehide', function () {
    if (typeof forgeSaveSession === 'function') forgeSaveSession();
  });
  render();
}


function renderMandarinReader() {
  var mrs = state.mrState || { submitted:{}, tfSel:{}, mcqSel:{}, correct:0, total:5, passageIdx:0 };
  state.mrState = mrs;
  var p = MANDARIN_PASSAGES[mrs.passageIdx || 0];
  var qs = p.questions;
  var done = Object.keys(mrs.submitted).length;
  var pct = Math.round(done / qs.length * 100);

  var h = '';

  // Back button
  h += '<button type="button" class="back-btn" data-forge-action="quiz-subjects">\u2190 Subjects</button>';

  // Progress
  h += '<div class="progress-bar"><div class="progress-fill" style="width:'+pct+'%;background:#e8472a"></div></div>';

  // Layout wrapper
  h += '<div class="forge-u-12ooiq4" id="mr-layout">';

  // PASSAGE PANEL
  h += '<div class="forge-u-pii2wz">';
  h += '<div class="forge-u-qbousq">\u6587</div>';
  h += '<div class="forge-u-nu69iv">'+p.typeTag+'</div>';
  h += '<div class="forge-u-luj9k5">'+p.title+'</div>';
  h += '<div class="forge-u-1w5fxlz">'+p.subtitle+'</div>';
  h += '<div class="forge-u-5eru22"></div>';
  h += '<div class="forge-u-1hkpawr">';
  p.lines.forEach(function(l){
    h += '<span class="forge-u-e8ercf">'+l.n+'</span>'+l.t+'<br>';
  });
  h += '</div>';
  h += '<div class="forge-u-1pgsjgp">';
  h += '<div class="forge-u-pyk7ku">Key Vocabulary</div>';
  p.vocab.forEach(function(v){
    h += '<div class="forge-u-xdhlla">';
    h += '<span class="forge-u-1l0vflr">'+v.zh+'</span>';
    h += '<span class="forge-u-1rucfid">'+v.py+'</span>';
    h += '<span class="forge-u-rb0caf">'+v.en+'</span>';
    h += '</div>';
  });
  h += '</div></div>';

  // QUESTIONS PANEL
  h += '<div class="forge-u-1us3s6h">';
  h += '<div class="forge-u-1o5fony">阅读理解 · Reading Comprehension</div>';
  h += '<div class="forge-u-1u2l3ir">Questions 1–'+qs.length+'</div>';

  // Score panel if complete
  if (done >= qs.length) {
    var spct = Math.round(mrs.correct / qs.length * 100);
    // Not rank names: ranks come from lifetime XP (scripts/forge-ranks.js), and a
    // reading score labelled "Forged" contradicted the rank shown everywhere else.
    var grade = spct >= 80 ? '🔥 Excellent' : spct >= 60 ? '⚒️ Good' : '🔨 Keep forging';
    h += '<div class="forge-u-1j8pxz2">';
    h += '<div class="forge-u-1ndegov">'+mrs.correct+'/'+qs.length+'</div>';
    h += '<div class="forge-u-1gda80a">Questions answered correctly</div>';
    h += '<div class="forge-u-tp123k">';
    h += '<div class="forge-u-1950rq5"><div class="forge-u-pn05gc">'+mrs.correct+'</div><div class="forge-u-qqzwkq">Correct</div></div>';
    h += '<div class="forge-u-1950rq5"><div class="forge-u-pn05gc">'+(qs.length-mrs.correct)+'</div><div class="forge-u-qqzwkq">Review</div></div>';
    h += '<div class="forge-u-1950rq5"><div class="forge-u-pn05gc">'+grade+'</div><div class="forge-u-qqzwkq">Result</div></div>';
    h += '</div>';
    h += '<button type="button" class="forge-u-1qc89jz" data-forge-action="mr-reset">Try again</button>';
    h += '</div>';
  }

  // Questions
  qs.forEach(function(q, qi) {
    var isSubmitted = !!mrs.submitted[q.id];
    var isCorrect = mrs.submitted[q.id] === true;
    var borderCol = isSubmitted ? (isCorrect ? 'var(--good)' : 'var(--bad)') : 'var(--line)';

    h += '<div id="mr-card-'+q.id+'" style="background:var(--panel);border:1px solid '+borderCol+';border-radius:var(--radius-md);padding:20px;margin-bottom:14px">';

    // Header
    var badgeColors = {tf:'rgba(201,168,76,0.15)|#c9a84c|rgba(201,168,76,0.3)', find:'rgba(99,179,237,0.12)|#63b3ed|rgba(99,179,237,0.25)', mcq:'rgba(154,117,237,0.12)|#b794f4|rgba(154,117,237,0.25)', format:'rgba(232,71,42,0.12)|#e8472a|rgba(232,71,42,0.25)', grammar:'rgba(72,187,120,0.12)|#68d391|rgba(72,187,120,0.25)'};
    var bc = (badgeColors[q.type]||'rgba(255,255,255,.08)|#8A857E|rgba(255,255,255,.15)').split('|');
    h += '<div class="forge-u-mc4cc1">';
    h += '<span class="forge-u-18ybfd3">'+(qi+1)+'.</span>';
    h += '<span style="font-size:9px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;padding:3px 7px;border-radius:var(--radius-xs);background:'+bc[0]+';color:'+bc[1]+';border:1px solid '+bc[2]+';flex-shrink:0">'+q.badge+'</span>';
    h += '</div>';

    // Question text
    var qtext = q.textZh ? '<span class="forge-u-ztv68m">'+q.text+'</span>' : q.text;
    h += '<div class="forge-u-1kslj0g">'+qtext+'</div>';
    if (q.textZh && q.subtext) {
      h += '<div class="forge-u-1n87nb9">'+q.subtext+'</div>';
    }

    // Input
    if (q.type === 'tf') {
      var tfVal = mrs.tfSel[q.id] || '';
      h += '<div class="forge-u-153sad2">';
      ['true','false'].forEach(function(v){
        var sel = tfVal === v;
        h += '<button type="button" data-forge-action="mr-select-tf" data-question-id="'+q.id+'" data-value="'+v+'" style="flex:1;padding:9px;border-radius:var(--radius-sm);border:1px solid '+(sel?'#c9a84c':'var(--line)')+';background:'+(sel?'rgba(201,168,76,0.08)':'transparent')+';color:'+(sel?'#c9a84c':'#8A857E')+';font-size:13px;font-weight:600;cursor:pointer;font-family:\'Poppins\',sans-serif">'+(v==='true'?'✓ True':'✗ False')+'</button>';
      });
      h += '</div>';
      h += '<div id="mr-just-area-'+q.id+'" style="display:'+(tfVal?'block':'none')+'">';
      h += '<div class="forge-u-1da1bnv">Justify — quote directly from the text (in Chinese):</div>';
      h += '<textarea class="forge-u-1v8to55" id="mr-just-'+q.id+'" placeholder="Copy the relevant characters from the passage…"></textarea>';
      h += '</div>';
      h += '<button type="button" data-forge-action="mr-submit" data-question-id="'+q.id+'" id="mr-sbtn-'+q.id+'" '+(isSubmitted||!tfVal?'disabled':'')+' style="width:100%;padding:10px;border-radius:var(--radius-sm);border:none;background:#e8472a;color:#fff;font-family:\'Poppins\',sans-serif;font-size:13px;font-weight:600;cursor:pointer;margin-top:12px;opacity:'+(isSubmitted||!tfVal?'.4':'1')+'">Check answer</button>';
    } else if (q.type === 'find') {
      h += '<div class="forge-u-paoxfs">📌 '+q.lineRef+'</div>';
      h += '<input class="forge-u-1ldj335" id="mr-find-'+q.id+'" data-forge-action="mr-find-input" data-question-id="'+q.id+'" placeholder="Type the character(s) here…">';
      h += '<button type="button" class="forge-u-9r1sf3" data-forge-action="mr-submit" data-question-id="'+q.id+'" id="mr-sbtn-'+q.id+'" disabled>Check answer</button>';
    } else {
      var selK = mrs.mcqSel[q.id] || '';
      q.opts.forEach(function(o){
        var sel = selK === o.k;
        var corr = isSubmitted && o.k === q.answer;
        var wrong = isSubmitted && sel && !corr;
        var borderC = corr ? 'var(--good)' : wrong ? 'var(--bad)' : sel ? '#c9a84c' : 'var(--line)';
        var bgC = corr ? 'rgba(127,217,138,.08)' : wrong ? 'rgba(255,90,90,.07)' : sel ? 'rgba(201,168,76,.06)' : 'var(--panel-2)';
        var letterC = corr ? 'var(--good)' : wrong ? 'var(--bad)' : sel ? '#c9a84c' : '#8A857E';
        var textStyle = o.zh ? 'font-family:\'Noto Sans SC\',STHeiti,SimHei,sans-serif;font-size:14px' : '';
        h += '<button type="button" data-forge-action="mr-select-mcq" data-question-id="'+q.id+'" data-letter="'+o.k+'" style="display:flex;align-items:flex-start;gap:10px;padding:11px 13px;border-radius:var(--radius-sm);border:1px solid '+borderC+';background:'+bgC+';cursor:pointer;text-align:left;width:100%;margin-bottom:7px;font-family:\'Poppins\',sans-serif">';
        h += '<span style="width:20px;height:20px;border-radius:50%;border:1px solid '+letterC+';display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;color:'+letterC+'">'+o.k+'</span>';
        h += '<span style="font-size:13px;line-height:1.5;color:var(--white);padding-top:1px;'+textStyle+'">'+o.t+'</span>';
        h += '</button>';
      });
      h += '<button type="button" data-forge-action="mr-submit" data-question-id="'+q.id+'" id="mr-sbtn-'+q.id+'" '+(isSubmitted||!selK?'disabled':'')+' style="width:100%;padding:10px;border-radius:var(--radius-sm);border:none;background:#e8472a;color:#fff;font-family:\'Poppins\',sans-serif;font-size:13px;font-weight:600;cursor:pointer;margin-top:4px;opacity:'+(isSubmitted||!selK?'.4':'1')+'">Check answer</button>';
    }

    // Feedback
    if (isSubmitted) {
      h += '<div style="margin-top:12px;padding:12px 14px;border-radius:var(--radius-sm);'+(isCorrect?'background:rgba(127,217,138,.1);border:1px solid rgba(127,217,138,.25)':'background:rgba(255,90,90,.08);border:1px solid rgba(255,90,90,.2)')+'">';
      h += '<div style="font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;margin-bottom:5px;color:'+(isCorrect?'var(--good)':'var(--bad)')+'">'+(isCorrect?'✓ Correct':'✗ Review')+'</div>';
      h += '<div class="forge-u-rpxuuv">'+q.fb[isCorrect?'correct':'incorrect']+'</div>';
      h += '</div>';
    }

    h += '</div>';
  });

  h += '</div></div>'; // close questions panel + layout

  app.innerHTML = h;
}

function mrSelectTF(qid, val) {
  if (state.mrState.submitted[qid]) return;
  state.mrState.tfSel[qid] = val;
  render();
}

function mrFindInput(qid) {
  var el = document.getElementById('mr-find-'+qid);
  var btn = document.getElementById('mr-sbtn-'+qid);
  if (!el || !btn) return;
  var hasVal = el.value.trim().length > 0;
  btn.disabled = !hasVal;
  btn.style.opacity = hasVal ? '1' : '.4';
}

function mrSelectMCQ(qid, letter) {
  if (state.mrState.submitted[qid]) return;
  state.mrState.mcqSel[qid] = letter;
  render();
}

function mrSubmit(qid) {
  if (state.mrState.submitted[qid]) return;
  var p = MANDARIN_PASSAGES[state.mrState.passageIdx || 0];
  var q = p.questions.find(function(x){ return x.id === qid; });
  var isCorrect = false;

  if (q.type === 'tf') {
    var tfOk = state.mrState.tfSel[qid] === q.tfAnswer;
    var just = (document.getElementById('mr-just-'+qid)||{}).value || '';
    var justOk = just.trim().length > 0 && q.justKeys.some(function(kw){ return just.includes(kw); });
    isCorrect = tfOk && justOk;
  } else if (q.type === 'find') {
    var val = ((document.getElementById('mr-find-'+qid)||{}).value||'').trim();
    isCorrect = val.includes(q.answer);
  } else {
    isCorrect = state.mrState.mcqSel[qid] === q.answer;
  }

  state.mrState.submitted[qid] = isCorrect;
  if (isCorrect) state.mrState.correct++;

  // Log to Supabase
  if (state.studentId) {
    var row = { student_id: state.studentId, class_id: state.classId, question_id: qid, bank: 'MAN-EXP-1', subject: 'mandarin', selected_option: isCorrect ? q.answer : '?', is_correct: isCorrect, misconception_tag: isCorrect ? null : 'MC-MAN-01', reforge_attempted: false, reforge_correct: null };
    if (state.classId && state.studentCode) {
      ForgeStudentCode.recordResponse(state.studentId,state.classCode,state.studentCode,row).catch(function() {});
    } else {
      supa.insert('responses', row);
    }
  }

  render();
}
