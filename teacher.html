<title>Forge — Teacher Sign In</title>
<meta name="description" content="Live misconception heatmaps, class overview, and auto-generated corrective starters — see exactly what to teach next.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/auth.css">
<link rel="stylesheet" href="css/sidebar.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--coal);color:var(--slate);font-family:Inter,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh}
h1,h2,h3{font-family:'Sora',sans-serif;color:var(--white);line-height:1.1;letter-spacing:-.015em}
.mono{font-family:'JetBrains Mono',monospace}
.wrap{max-width:1180px;margin:0 auto;padding:28px 32px}
.tag{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ember)}
.logo{font-family:'Sora',sans-serif;font-weight:800;font-size:20px;color:var(--white);text-decoration:none;display:inline-flex;align-items:center;gap:8px;margin-bottom:0}
.logo .spark{width:9px;height:9px;background:var(--ember);border-radius:var(--radius-xs);transform:rotate(45deg);box-shadow:0 0 10px rgba(255,107,44,.7)}
.theme-toggle{background:var(--panel);border:1px solid var(--line);color:var(--slate);font-family:'JetBrains Mono',monospace;font-size:12px;padding:6px 12px;border-radius:var(--radius-sm);cursor:pointer;z-index:99}
.theme-toggle:hover{color:var(--white);border-color:var(--ember)}

.teacher-entry{display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,440px);gap:clamp(40px,7vw,96px);align-items:center;max-width:none;margin:0;min-height:calc(100vh - 136px)}
.teacher-entry-copy{max-width:68ch;padding:24px 0}
.teacher-entry-copy .tag{display:block;margin-bottom:12px}
.teacher-entry-copy h1{font-size:clamp(30px,4vw,48px);margin-bottom:18px}
.teacher-entry-copy p{font-size:17px;color:var(--slate);max-width:62ch;margin-bottom:20px}
.teacher-entry-copy ul{margin:0 0 24px 20px;color:var(--slate);font-size:15px;line-height:1.7}
.teacher-entry-copy li{margin-bottom:7px}
.teacher-entry-copy strong{color:var(--white)}
.teacher-entry-links{display:flex;flex-wrap:wrap;gap:12px;font-size:13px}
.teacher-entry .auth-stage{min-height:0;padding:32px 0}
@media(max-width:820px){.teacher-entry{grid-template-columns:1fr;gap:8px;min-height:0}.teacher-entry-copy{padding:24px 0 0}.teacher-entry-copy h1{font-size:32px}.teacher-entry .auth-stage{padding-top:20px}}

/* join */
.join-input{width:100%;padding:12px 14px;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--panel);color:var(--white);font-family:Inter,sans-serif;font-size:15px;margin-bottom:14px;text-transform:uppercase}
.join-input:focus{outline:none;border-color:var(--ember)}
.join-input::placeholder{color:#7A756E;text-transform:none}
.join-btn{width:100%;padding:13px;border-radius:var(--radius-sm);background:var(--ember);color:#fff;border:none;font-family:Inter,sans-serif;font-weight:600;font-size:15px;cursor:pointer}
.join-btn:hover{background:var(--hot)}
.join-btn:disabled{opacity:.5;cursor:wait}
.join-err{color:var(--bad);font-size:13px;margin-top:10px;display:none}

/* dashboard */
.dash-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:10px}
.dash-header h1{font-size:24px}
.dash-meta{font-size:13px;color:var(--slate)}
.dash-meta b{color:var(--hot)}

.tabs{display:inline-flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-md);padding:4px;margin-bottom:24px;flex-wrap:wrap}
.tab{font-family:Inter,sans-serif;font-weight:600;font-size:13px;color:var(--slate);background:transparent;border:none;padding:9px 18px;border-radius:var(--radius-sm);cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--white)}
.tab.active{background:var(--ember);color:var(--coal)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);padding:24px;margin-bottom:18px}
.card-title{font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#8A857E;margin-bottom:14px}

.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-md);padding:16px;text-align:center}
.stat-n{font-family:'Sora',sans-serif;font-size:28px;font-weight:800;display:block}
.stat-l{font-size:11px;color:#8A857E;margin-top:4px;display:block;font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.04em}

/* heatmap */
.heat-row{display:grid;grid-template-columns:110px 1fr 80px 100px 60px;gap:10px;align-items:center;padding:10px 14px;border-radius:var(--radius-md);background:var(--panel-2);border:1px solid var(--line);font-size:13px;margin-bottom:6px}
.heat-row.high{border-color:rgba(255,90,90,.35)}
.heat-row.med{border-color:rgba(255,201,60,.25)}
.heat-tag{font-size:11px;color:var(--coal);background:var(--hot);padding:2px 8px;border-radius:var(--radius-xs);font-weight:600;white-space:nowrap;font-family:'JetBrains Mono',monospace}
.heat-label{color:var(--white);font-size:13px}
.heat-spec{color:#8A857E;font-size:11px;font-family:'JetBrains Mono',monospace}
.heat-bar{height:6px;background:var(--line);border-radius:var(--radius-xs);overflow:hidden}
.heat-fill{height:100%;border-radius:var(--radius-xs);background:var(--ember)}
.heat-count{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--slate);text-align:right}

/* class table */
.class-table{width:100%;border-collapse:collapse;font-size:13px}
.class-table th{font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#8A857E;font-weight:600;padding:8px 10px;text-align:left;border-bottom:1px solid var(--line)}
.class-table td{padding:10px;border-bottom:1px solid var(--line);color:var(--white)}
.class-table tr:hover{background:var(--panel-2)}
.class-table tr{cursor:pointer}
.class-table .acc{font-family:'JetBrains Mono',monospace;font-weight:700}

/* student detail */
.back-btn{background:none;border:none;cursor:pointer;font-size:13px;color:#8A857E;font-family:Inter,sans-serif;margin-bottom:16px;padding:0}
.back-btn:hover{color:var(--white)}
.mc-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:var(--radius-md);background:var(--panel-2);border:1px solid var(--line);margin-bottom:6px;font-size:13px}
.mc-item .mc-detail{flex:1;color:var(--slate)}
.mc-item .mc-fires{font-family:'JetBrains Mono',monospace;font-size:12px}

/* empty state */
.empty{text-align:center;padding:48px 20px;color:var(--slate)}
.empty h3{color:var(--white);margin-bottom:8px}

.panel{display:none}
.panel.active{display:block}

/* teacher home — the classes a teacher owns, one card each */
.home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-bottom:22px}
.class-card{position:relative;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);padding:18px;cursor:pointer;font:inherit;color:inherit;transition:border-color .15s,transform .15s}
.class-card:hover{border-color:var(--ember);transform:translateY(-2px)}
.class-card .cc-subj{font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--ember);display:block;margin-bottom:8px}
.class-card .cc-name{font-family:'Sora',sans-serif;font-weight:700;font-size:16px;color:var(--white);display:block;line-height:1.25}
.class-card .cc-meta{font-size:12px;color:#8A857E;margin-top:8px;display:block}
.class-card .cc-code{font-family:'JetBrains Mono',monospace;color:var(--slate)}
.class-card.cc-new{border-style:dashed;display:flex;align-items:center;justify-content:center;color:var(--ember);font-weight:600;font-size:14px;min-height:104px}
.home-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:13px;color:#8A857E}
.home-link{background:none;border:none;padding:0;font:inherit;font-weight:600;color:var(--ember);cursor:pointer}
.home-link:hover{color:var(--hot)}

/* login tabs */
.login-tabs{display:flex;gap:0;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius-md);padding:3px;margin-bottom:22px}
.login-tab{flex:1;padding:9px 0;border:none;background:transparent;color:var(--slate);font-family:Inter,sans-serif;font-weight:600;font-size:13px;cursor:pointer;border-radius:var(--radius-sm);transition:background .15s,color .15s}
.login-tab.active{background:var(--ember);color:#1A1816}
[data-theme="light"] .login-tab.active{color:#fff}
.login-tab:hover:not(.active){color:var(--white)}

/* subject select */

function _saveTeacherSession(session) {

function _loadTeacherSession() {
  try { return JSON.parse(localStorage.getItem(TEACHER_SESSION_KEY) || 'null'); } catch(e) { return null; }
}
function _clearTeacherSession() {
  try { localStorage.removeItem(TEACHER_SESSION_KEY); } catch(e) {}

  return 'forge-teacher-joined-classes-' + (currentTeacher && currentTeacher.id ? currentTeacher.id : 'anon');

var TeacherAuth = {
  signUp: function(email, password) {
    return fetch(SUPABASE_URL + '/auth/v1/signup', {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email, password: password })
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.error || !data.access_token) {
        return Promise.reject(new Error(data.error_description || data.msg || data.error || 'Sign-up failed'));
      }
      _saveTeacherSession({ access_token: data.access_token, refresh_token: data.refresh_token, user: data.user });
      return data;
    });
  },
  signIn: function(email, password) {
    return fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email, password: password })
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.error || !data.access_token) {
        return Promise.reject(new Error(data.error_description || data.msg || data.error || 'Incorrect email or password'));
      }
      _saveTeacherSession({ access_token: data.access_token, refresh_token: data.refresh_token, user: data.user });
      return data;
    });
  },
  refreshSession: function(refreshToken) {
    return fetch(SUPABASE_URL + '/auth/v1/token?grant_type=refresh_token', {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: refreshToken })
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.error || !data.access_token) {
        _clearTeacherSession();
        return Promise.reject(new Error('Session expired'));
      }
      _saveTeacherSession({ access_token: data.access_token, refresh_token: data.refresh_token, user: data.user });
      return data;
    });
  },
  signOut: function() {
    var saved = _loadTeacherSession();
    if (saved && saved.access_token) {
      fetch(SUPABASE_URL + '/auth/v1/logout', {
        method: 'POST',
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + saved.access_token }
      }).catch(function() {});
    }
    _clearTeacherSession();
  },
  // Resolve current session, refreshing the access token if needed.
  // Returns { access_token, user } or null.
  getSession: function() {
    var saved = _loadTeacherSession();
    if (!saved || !saved.access_token) return Promise.resolve(null);
    return fetch(SUPABASE_URL + '/auth/v1/user', {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + saved.access_token }
    })
    .then(function(r) {
      if (r.status === 401 && saved.refresh_token) {
        return TeacherAuth.refreshSession(saved.refresh_token).then(function(data) {
          return { access_token: data.access_token, user: data.user };
        });
      }
      if (!r.ok) return null;
      return r.json().then(function(user) { return { access_token: saved.access_token, user: user }; });
    })
    .catch(function() { return null; });
  }
};

function supaGet(table, params) {
  var url = SUPABASE_URL + '/rest/v1/' + table + '?select=*';
  if (params) url += '&' + params;
  return fetch(url, { headers: headers }).then(function(r) { return r.json(); });
}

// PostgREST returns an array for a successful list query, but an error payload
// is an object. Keep dashboard rendering safe when a policy or network error
// returns that object instead of allowing `.map()` to break the whole class view.
function rowsOrEmpty(value) {
  return Array.isArray(value) ? value : [];
}

function supaDelete(table, id) {
  return fetch(SUPABASE_URL + '/rest/v1/' + table + '?id=eq.' + id, {
    method: 'DELETE',
    headers: headers
  }).then(function(r) { return r.ok; });
}

function supaPatch(table, id, row) {
  return fetch(SUPABASE_URL + '/rest/v1/' + table + '?id=eq.' + id, {
    method: 'PATCH',
    headers: Object.assign({}, headers, { 'Content-Type': 'application/json', 'Prefer': 'return=representation' }),
    body: JSON.stringify(row)
  }).then(function(r) {
    if (!r.ok) {
      return r.text().then(function(t) {
        return Promise.reject(new Error('PATCH failed ' + r.status + ': ' + t));
      });
    }
    return r.json();
  });
}

function supaInsert(table, row) {
  return fetch(SUPABASE_URL + '/rest/v1/' + table, {
    method: 'POST',
    headers: Object.assign({}, headers, { 'Content-Type': 'application/json', 'Prefer': 'return=representation' }),
    body: JSON.stringify(row)
  }).then(function(r) {
    return r.json().then(function(data) {
      if (!r.ok) {
        var msg = (data && (data.message || data.error || data.hint)) || ('HTTP ' + r.status);
        return Promise.reject(new Error(msg));
      }
      return data;
    });
  });
}

    if (!r.ok) return false;
    return r.json();
  }).catch(function() { return false; });
}

  "MC-INF-01":{type:"sort",title:"Inflation or Disinflation?",instruction:"Sort these statements into Inflation, Disinflation, or Deflation. One fits two categories — be ready to justify.",items:["Price level rising at 4%","Price level rising at 2%, down from 4%","Price level falling","CPI at 103, up from 101","The rate of inflation is slowing","Prices are lower than last year"]},
  "MC-INF-03":{type:"diagnose",title:"Diagnose the Diagram",instruction:"A student drew AD/AS to show demand-pull inflation but made two errors. Identify both and correct them.",prompt:"Student labelled the shift 'AD moves right' and wrote 'result: higher prices AND higher output', showing the new equilibrium on a vertical LRAS."},
  "MC-INF-07":{type:"correct",title:"Spot the Error",instruction:"Find and correct the error in this student sentence.",prompt:"'The Bank of England's MPC must keep inflation at 0%, as higher prices damage the economy.'",answer:"Target is 2% CPI (symmetric). The MPC writes to the Chancellor if inflation exceeds 3% or falls below 1%."},
  "MC-GRO-01":{type:"distinguish",title:"Level vs Rate",instruction:"Label each GDP figure as 'level of GDP', 'rate of growth', or 'both'. Write one sentence explaining the difference.",items:["UK GDP: £2.2 trillion","GDP grew by 0.4% last quarter","GDP per capita rose from £32,000 to £33,500","The economy is 18% larger than in 2010"]},
  "MC-GRO-03":{type:"diagram",title:"Gap Check",instruction:"Draw an AD/AS diagram showing a positive output gap. Label actual GDP, potential GDP, and the price level. Explain in one sentence why it is called 'positive'.",prompt:"Common error: students draw actual GDP below potential and still call it positive."},
  "MC-EMP-01":{type:"classify",title:"Who Counts?",instruction:"Decide whether each person is ILO unemployed, claimant count unemployed, or economically inactive. One person may fit two categories.",items:["Jake, 19, not working but looking and available","Priya, 35, left work to care for children","Marcus, 24, working 3 hours/week (wants more)","Aisha, 28, claiming Universal Credit while job hunting","Lena, 67, retired"]},
  "MC-EMP-03":{type:"evaluate",title:"Short Run or Long Run?",instruction:"Mark each claim T (true in short run), L (long run only), or F (false). Justify each.",items:["Lower unemployment always means higher inflation","The long-run Phillips curve is vertical","The MPC can reduce unemployment permanently by cutting rates","Worker expectations adjust — removing the permanent trade-off"]},
  "MC-BOP-02":{type:"correct",title:"Spot the Confusion",instruction:"Identify the conceptual error and rewrite correctly.",prompt:"'The UK's current account deficit is the same as the government's fiscal deficit — both measure the gap between government income and spending.'"},
  "MC-BOP-03":{type:"diagram",title:"Draw the J-Curve",instruction:"Sketch a J-curve showing the effect of sterling depreciation on the current account over time. Label the initial worsening phase, turning point, and improvement phase. Add a 6-word explanation of why it worsens first.",prompt:"Common error: students draw immediate improvement after depreciation."},
  "MC-AD-01":{type:"correct",title:"Fix the Formula",instruction:"A student wrote: AD = C + S + G + (X − M). Identify the error and correct it. Explain why savings belongs in a different model.",answer:"AD = C + I + G + (X − M). Savings is a withdrawal from the circular flow, not a component of AD."},
  "MC-AD-04":{type:"diagram",title:"What Happens to Prices?",instruction:"On an AD/AS diagram, show a rightward shift in AD. Mark the new equilibrium. Does the price level rise or fall? Why does the answer depend on where the economy is on the SRAS curve?",prompt:"Common error: students state AD shifting right always causes lower prices."},
  "MC-AS-01":{type:"sort",title:"SRAS or LRAS?",instruction:"Sort these factors into 'shifts SRAS only', 'shifts LRAS only', or 'shifts both'. Justify one controversial placement.",items:["Oil price rise","Worker productivity improvement","Infrastructure investment","Rise in nominal wages","Technological innovation","Consumer confidence falls"]},
  "MC-FIS-01":{type:"distinguish",title:"Policy Match",instruction:"Match each action to 'fiscal' or 'monetary'. Three are ambiguous — annotate why.",items:["MPC cuts the base rate","Chancellor raises income tax","Government increases road spending","BoE buys government bonds (QE)","Government introduces Help to Buy","MPC raises rates to 5.25%"]},
  "MC-MON-04":{type:"chain",title:"QE Transmission Chain",instruction:"Complete the chain from start to finish. Each arrow must be a specific mechanism, not 'the economy improves'.",prompt:"BoE buys £60bn of government bonds → [step] → [step] → [step] → aggregate demand rises. Common error: students say QE 'prints money that goes straight to consumers'."},
  "MC-NI-01":{type:"classify",title:"Injection or Withdrawal?",instruction:"Classify each item as Injection (J) or Withdrawal (W). Then write the equilibrium condition using I, G, X, S, T, M.",items:["Consumer spending on imports","Government NHS spending","Household savings","Export revenue from UK services","Corporation tax receipts","Business investment"]},
  "MC-SI-01":{type:"correct",title:"Fix the Stat",instruction:"A student wrote: 'Asch found that 37% of participants conformed.' Identify the error and write the three correct Asch statistics.",answer:"37% = conformity on critical trials. 75% = participants who conformed at least once. ~32% = overall conformity rate across all trials."},
  "MC-SI-03":{type:"correct",title:"Milgram: Check the Figure",instruction:"A student wrote: 'Milgram showed that most people refused to obey.' Correct this and name one variation that significantly reduced obedience.",answer:"65% delivered maximum 450V in the baseline. Obedience fell to 40% when authority gave orders by phone; to 20% when the study moved from Yale."},
  "MC-MEM-01":{type:"diagram",title:"Reconstruct the MSM",instruction:"From memory, draw the Multi-Store Model. Label all three stores with capacity and duration. Mark the two processes between them. Identify one criticism.",prompt:"Common error: students reverse transfer direction or omit the rehearsal loop."},
  "MC-MEM-08":{type:"scenario",title:"Which Type of Interference?",instruction:"State whether proactive or retroactive interference is operating in each scenario. Write one sentence explaining the direction of disruption.",items:["You learned French first — your Spanish keeps coming out as French","You learn a new phone PIN and can no longer recall the old one","New revision notes keep pushing out the original version","Old work password resurfaces instead of the current one"]},
  "MC-ATT-01":{type:"correct",title:"Bowlby: Spot the Error",instruction:"Find and correct the error.",prompt:"'Bowlby argued that infants form equal attachments to all caregivers simultaneously and that any of these can serve as the primary attachment figure.'",answer:"Bowlby argued for monotropy — one primary attachment that is qualitatively stronger. This forms the internal working model; other attachments are secondary."},
  "MC-EDU-02":{type:"apply",title:"Hidden Curriculum in Practice",instruction:"Read this extract: 'Students line up in silence, are rewarded for punctuality, and are streamed by assessed ability from Year 7.' Link each feature to a specific element of the correspondence principle (Bowles & Gintis). Which social class does each element benefit?"},
  "MC-MET-01":{type:"evaluate",title:"Ethical Matrix",instruction:"Complete this matrix for covert participant observation. Then decide: is it ever justifiable? Apply one BPS ethical guideline.",headers:["Ethical issue","Problem for covert obs","How researcher might respond"],rows:[["Informed consent","",""],["Right to withdraw","",""],["Deception","",""],["Protection from harm",""," "]]},
  "MC-TEC-01":{type:"diagram",title:"Boundary Types",instruction:"Draw cross-sections of a destructive boundary and a constructive boundary. Label plate types, direction of movement, crust destroyed/created, and hazards at each. Explain why oceanic crust subducts rather than continental.",prompt:"Common error: students reverse which plate subducts or omit oceanic vs continental labelling."},
  "MC-TEC-02":{type:"compare",title:"Why did Haiti lose more lives than Christchurch?",instruction:"Complete this comparison table for the two earthquakes, then write a two-sentence conclusion explaining why development level mattered more than magnitude.",headers:["Factor","Haiti 2010","Christchurch 2011"],rows:[["Magnitude","7.0","6.3"],["Deaths","~230,000","185"],["Building quality","",""],["Emergency services","",""],["GDP per capita","",""],["Conclusion: why the difference?","",""]]},
  "MC-TEC-03":{type:"correct",title:"Why do composite volcanoes explode?",instruction:"A student wrote: 'Composite volcanoes erupt explosively because they are very tall and the pressure builds up inside.' Find the two errors in this explanation and write the correct version.",prompt:"Correct explanation must include: silica-rich (acidic) magma from subducted oceanic crust, high viscosity preventing gas escape, pressure builds until explosive release. Tall = shield volcano (basaltic, effusive). Height is a consequence, not a cause.",answer:"Composite volcanoes erupt explosively because silica-rich magma from the subducted plate is highly viscous — it traps gases which build until a violent explosive eruption occurs. The height of the volcano is a result of previous eruptions, not the cause of explosivity."},
  "MC-TEC-04":{type:"classify",title:"Earthquakes — which boundary?",instruction:"Classify each earthquake example as destructive, constructive, or conservative boundary. One is a trap — be ready to justify.",items:["2010 Haiti — conservative plate boundary (Caribbean/North American plates sliding)",  "2004 Indian Ocean — destructive boundary (subduction triggered megathrust)","San Andreas Fault, California — conservative (transform fault)","Mid-Atlantic Ridge — constructive boundary (can produce earthquakes)","2011 Tohoku, Japan — destructive (Pacific plate subducting under Eurasian)"]},
  "MC-TEC-06":{type:"diagram",title:"Focus or epicentre?",instruction:"Draw a cross-section diagram of an earthquake. Label: the focus (hypocentre), the epicentre, seismic waves, and the fault line. Then write one sentence defining each term precisely.",prompt:"Common error: students say the epicentre is where the earthquake originates — it is the point on the SURFACE directly ABOVE the focus. The focus (hypocentre) is the underground origin point. Shallow-focus earthquakes (<70km) cause more surface damage than deep-focus events.",answer:"Focus: the point underground where the earthquake originates and energy is released. Epicentre: the point on the Earth's surface directly above the focus — where shaking is usually most intense."},
  "MC-TEC-07":{type:"explain",title:"Why is Iceland so volcanically active?",instruction:"Iceland sits on the Mid-Atlantic Ridge (constructive boundary). But that alone does not explain its exceptional volcanic activity. Write a two-part explanation: (1) what the constructive boundary contributes, (2) what the hot spot adds — and mark Iceland's position on a blank Atlantic diagram.",prompt:"Constructive boundary: plates diverge → magma rises to fill gap → effusive basaltic eruptions (e.g. Eyjafjallajökull fissure eruptions). Hot spot: a fixed mantle plume of unusually hot material beneath the crust — independently generates extra volcanic activity. Iceland sits above BOTH simultaneously, making it more active than any other constructive boundary location.",answer:"Two factors combine: (1) The Mid-Atlantic Ridge causes plates to diverge, allowing basaltic magma to rise — producing regular effusive eruptions. (2) A mantle hot spot beneath Iceland provides an additional source of heat independent of the boundary, further raising volcanic output. Neither factor alone explains Iceland's exceptional activity."},

  "MC-HIST-04":{type:"chain",title:"Fire to Dictatorship",instruction:"Complete the causal chain. Each link must be a specific event or law.",prompt:"Reichstag Fire (Feb 1933) → [step] → [step] → [step] → Hitler has dictatorial powers (July 1933). Common error: jumping from fire directly to Enabling Act without naming the Decree of the Reich President."},
  "MC-LAW-02":{type:"apply",title:"Intent or Recklessness?",instruction:"Classify each scenario as direct intent, oblique intent (Woollin), or Cunningham recklessness. Cite the defining case.",items:["D shoots V with aim of killing","D blows up plane for insurance — passengers die","D throws stone at window knowing it might break — it does","D drives at high speed in residential area — child killed"]},
  "MC-PHYS-01":{type:"correct",title:"Forces vs Motion",instruction:"A student wrote: 'When an object moves at constant velocity, a net forward force must be acting.' Correct this using Newton's First Law and draw a free body diagram for a car at constant speed.",prompt:"Common error: students assume motion requires ongoing force — confusing Aristotelian with Newtonian mechanics."},
  "MC-CS-01":{type:"trace",title:"Trace the Loop",instruction:"Trace through this loop for i = 1 to 5 and record the output. Then identify the off-by-one error and rewrite to print only values 2, 3, 4.",prompt:"FOR i ← 1 TO 5\n  IF i MOD 2 ≠ 0 THEN OUTPUT i\nENDFOR"},
  "MC-MATH-01":{type:"correct",title:"Chain Rule Check",instruction:"A student differentiated y = sin(3x²) and wrote dy/dx = cos(3x²). Find the error and write the correct derivative showing all steps.",prompt:"Common error: differentiating the outer function only, not multiplying by the derivative of the inner function."},

  "MC-HSC-04":{type:"rewrite",title:"Command Word Upgrade",instruction:"Rewrite this student answer at the 'assess' level. Question: 'Assess the effectiveness of person-centred care for an elderly patient with dementia.'",prompt:"Student: 'Person-centred care means putting the patient at the centre. It involves respecting their wishes and dignity. It is used in care homes across the UK.'"},
  "MC-FR-05":{type:"correct",title:"Si Clause Fix",instruction:"Find and correct the error in each conditional sentence. Write the rule in your own words below each.",items:["Si j'aurais de l'argent, j'achèterais une voiture.","Si tu viendrais, je serais content.","S'il pleuvrait, nous resterons à la maison.","Si j'aurais su, je n'aurais pas dit ça."]},
  "MC-HIST-01":{type:"evaluate",title:"Doomed from the Start?",instruction:"A student claims the Weimar Republic was structurally doomed from 1919. Your job: write one paragraph SUPPORTING this view, then one paragraph CHALLENGING it. Each paragraph must cite at least two specific pieces of evidence.",prompt:"Support: Article 48 emergency powers, proportional representation producing unstable coalitions, stab-in-the-back myth undermining legitimacy from the outset, war guilt clause economic damage. Challenge: Republic survived hyperinflation (1923), Stresemann's golden years (1924–29) with GDP recovery, cultural flourishing, Dawes Plan stability. Common error: students list structural factors only and ignore the contingency of the Depression — Weimar was NOT doomed until 1929."},
  "MC-HIST-02":{type:"chain",title:"Failure to Long-term Gain",instruction:"The Munich Putsch failed. Complete this chain showing how a military failure became a long-term political asset. Each arrow must name a specific consequence or action.",prompt:"16 November 1923: Putsch collapses, Hitler arrested → [step: trial and speech] → [step: Mein Kampf and national platform] → [step: strategic shift] → [outcome by 1933]. Common error: students say Hitler 'learned from his mistakes' without specifying the decision to pursue power through legal means — the key strategic conclusion from the trial."},
  "MC-HIST-03":{type:"correct",title:"Did Germans Vote Hitler into Power?",instruction:"Find and correct the two factual errors in this student sentence. Then add one sentence that explains how Hitler actually became Chancellor.",prompt:"'Hitler became Chancellor in January 1933 because the Nazi Party won over 50% of the vote in the November 1932 election, giving them a democratic mandate.'",answer:"Error 1: Nazi vote share in November 1932 was 33.1% — their vote had FALLEN from 37.4% in July 1932. Error 2: Hitler was not elected Chancellor — he was appointed by President Hindenburg on 30 January 1933 after backroom deals involving von Papen, who believed he could control Hitler. Correct sentence: Hitler became Chancellor through elite miscalculation, not popular mandate."},
  "MC-HIST-05":{type:"compare",title:"Browning vs Goldhagen",instruction:"Complete this table comparing the two historians' arguments. Then write a two-sentence judgement: which interpretation has stronger evidential support and why?",headers:["Feature","Browning (Ordinary Men)","Goldhagen (Hitler's Willing Executioners)"],rows:[["Primary cause of killing","",""],["Evidence used","Battalion 101 testimonies",""],["Nature of perpetrators","Ordinary, pressured",""],["Role of ideology","Secondary",""],["Main criticism","","Monocausal, ignores peer pressure"]]},
  "MC-HIST-06":{type:"chain",title:"Truman Doctrine Transmission",instruction:"The Truman Doctrine (1947) marked a permanent shift in US foreign policy. Complete this chain — each link must be a specific claim, not a vague assertion.",prompt:"Soviet pressure on Greece and Turkey (1946–47) → [step: British withdrawal] → [step: Truman's speech to Congress, March 1947] → [step: the doctrine's key commitment] → [consequence for US foreign policy 1947–1989]. Common error: students describe the Doctrine as 'helping Greece' without stating the universal principle — that the US would support free peoples resisting communist subjugation anywhere in the world. This is what made it a doctrine, not just an aid package."},
  "MC-HIST-07":{type:"evaluate",title:"Berlin Blockade — Who Won?",instruction:"Write two sentences: one arguing the Blockade was a Soviet victory, one arguing it was a Western victory. Then write a third sentence giving your overall judgement with one piece of supporting evidence.",prompt:"Soviet case: forced Allies to concede German partition was permanent; demonstrated Western vulnerability in Berlin. Western case: airlift succeeded (277,000 flights, 2.3m tonnes), Soviet capitulation in May 1949, NATO formed April 1949, FRG founded May 1949. Common error: students say Soviets 'gave up' without noting the political consequences — the crisis accelerated exactly the Western alliance the Soviets sought to prevent."},
  "MC-HIST-08":{type:"correct",title:"Cuban Missile Crisis Resolution",instruction:"A student wrote: 'Kennedy stood firm and forced Khrushchev to back down.' Find three problems with this account and rewrite it accurately in three sentences.",prompt:"Problems: (1) 'Stood firm' ignores the secret deal — removal of Jupiter missiles from Turkey was a real US concession; (2) 'forced Khrushchev' implies Soviet defeat — both sides compromised; (3) ignores the public pledge not to invade Cuba. The crisis is better described as a mutual face-saving compromise than a US victory."},
  "MC-HIST-09":{type:"sort",title:"Détente or Containment?",instruction:"Sort each policy/event as primarily 'détente' (reducing Cold War tensions) or 'containment' (resisting Soviet expansion). Two are genuinely ambiguous — be ready to argue both ways.",items:["SALT I (1972)","Nixon visits China (1972)","Helsinki Accords (1975)","Carter boycotts Moscow Olympics (1980)","US arms mujahideen in Afghanistan","Ford refuses to meet Solzhenitsyn","Jackson-Vanik Amendment (1974)","Reagan 'Evil Empire' speech (1983)"]},
  "MC-HIST-12":{type:"chain",title:"Why did the USSR Collapse?",instruction:"Historians disagree about the relative weight of internal vs external causes. Complete both chains, then write one sentence judging which was more important.",prompt:"Internal chain: Command economy stagnation → [step] → [step] → [outcome: 1991]. External chain: Arms race cost → [step: Afghanistan] → [step] → [outcome: 1991]. Common error: students attribute collapse solely to Gorbachev's reforms or solely to Reagan's arms race pressure — examiners credit multi-causal analysis that identifies the interaction between economic weakness and political reform."},
  "MC-HIST-13":{type:"evaluate",title:"Korea — Limited War or Global Crisis?",instruction:"Write one sentence arguing Korea showed Cold War restraint, and one sentence arguing it nearly became World War Three. Then add a judgement: which interpretation better fits the evidence?",prompt:"Restraint case: both superpowers avoided direct confrontation, MacArthur dismissed for wanting to escalate, armistice restored original boundary — war ended where it started. Escalation risk case: MacArthur pushed to Yalu River triggering Chinese intervention (300,000 troops), nuclear weapons considered, Truman declared national emergency. Key judgement: the war demonstrated that both sides feared escalation — limited war became the Cold War norm precisely because Korea showed the alternative."}

var app = document.getElementById('app');
var dashState = { classId: null, className: null, classSubject: null, classCode: null, responses: [], students: [], wrongResponses: [], drillResponses: [], drillStudents: [], assignments: [] };

// Loads a given class's dashboard data and remembers it in the sidebar's class
// switcher, so switching back later doesn't need the code re-entered. Lives at
// the top level because the home screen and the sidebar both open classes
// without the code-entry form ever having been rendered.
window.loadClassDashboard = function(cls) {
        dashState.classId = cls.id;
        dashState.className = cls.name;
        dashState.classSubject = cls.subject || null;
        dashState.classCode = cls.code || null;
        addJoinedClass(cls);
        Promise.all([
          supaGet('students', 'class_id=eq.' + cls.id),
          supaGet('assignments', 'class_id=eq.' + cls.id + '&order=due_date.asc')
        ]).then(function(results) {
          dashState.students = rowsOrEmpty(results[0]);
          dashState.assignments = rowsOrEmpty(results[1]);
          // Fetch responses by class_id AND by student_id list
          // This catches responses where class_id is null (student played before class was linked)
          var studentIds = dashState.students.map(function(s){ return s.id; });
          var studentNames = dashState.students.map(function(s){ return s.name; });
          var byClass = supaGet('responses', 'class_id=eq.' + cls.id + '&order=created_at.desc');
          var byStudents = studentIds.length > 0
            ? supaGet('responses', 'student_id=in.(' + studentIds.join(',') + ')&order=created_at.desc')
            : Promise.resolve([]);
          // Look up all student rows with same names — catches duplicate rows from re-joining
          // Query each name individually to avoid PostgREST in() quoting issues
          var nameQueries = studentNames.map(function(n) {
            return supaGet('students', 'name=eq.' + encodeURIComponent(n) + '&select=id,name');
          });
          Promise.all([byClass, byStudents].concat(nameQueries)).then(function(rResults) {
            var classResponses = rowsOrEmpty(rResults[0]);
            var studentResponses = rowsOrEmpty(rResults[1]);
            var nameMatches = [];
            rResults.slice(2).forEach(function(rows) {
              (rows || []).forEach(function(s) { nameMatches.push(s); });
            });
            // Collect any student IDs not already in our class list
            var extraIds = [];
            nameMatches.forEach(function(s) {
              if (s && s.id && studentIds.indexOf(s.id) === -1) extraIds.push(s.id);
            });
            var byExtra = extraIds.length > 0
              ? supaGet('responses', 'student_id=in.(' + extraIds.join(',') + ')&order=created_at.desc')
              : Promise.resolve([]);
            byExtra.then(function(extraResponses) {
              var seen = {};
              var merged = [];
              classResponses.concat(studentResponses).concat(rowsOrEmpty(extraResponses)).forEach(function(r) {
                if (r && r.id && !seen[r.id]) { seen[r.id] = true; merged.push(r); }
              });
              // A student can play other subjects independently of this class —
              // don't let their unrelated misconceptions/weakest-topic data leak
              // into this class's dashboard. Keep rows with no subject recorded
              // (older data predating the subject field) rather than dropping them.
              dashState.responses = merged.filter(function(r) {
                // Anvil/Crucible rows carry their own subject ('anvil', 'crucible'),
                // so a strict r.subject match dropped every reforge before it
                // reached the dashboard — completed Anvil work simply vanished.
                // Resolve the real subject from the question instead of waving
                // all reforges through, which leaked other classes' subjects in.
                var rs = subjectForResponse(r);
                return !rs || rs === dashState.classSubject;
              });
              // Self-heal: patch orphaned responses to the class-linked student_id
              if (extraIds.length > 0 && studentIds.length > 0) {
                extraIds.forEach(function(oldId) {
                  // Find which class student this old row belongs to by name
                  var oldRow = nameMatches.find(function(s){ return s.id === oldId; });
                  var newRow = oldRow ? dashState.students.find(function(s){ return s.name === oldRow.name; }) : null;
                  var targetId = newRow ? newRow.id : studentIds[0];
                  fetch(SUPABASE_URL + '/rest/v1/responses?student_id=eq.' + oldId, {
                    method: 'PATCH',
                    headers: Object.assign({}, headers, {'Prefer': 'return=minimal'}),
                    body: JSON.stringify({ student_id: targetId, class_id: cls.id })
                  }).catch(function(e) { console.warn('Patch orphan failed:', e); });
                });
              }
              console.log('Dashboard loaded:', {
                classId: cls.id, classSubject: dashState.classSubject,
                students: dashState.students.length, responses: dashState.responses.length,
                byClass: classResponses.length, byStudents: studentResponses.length,
                extraIds: extraIds, extraResponses: rowsOrEmpty(extraResponses).length
              });
              renderDashboard();
            });
          });
        });
  };

// ── Teacher home ────────────────────────────────────────────────────────────
// Where a signed-in teacher lands: their own classes as cards, click to open.
// Classes come from the server (classes they own) merged with any class they've
// opened by code on this device, so a class shared with them still shows up.
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function subjectLabel(key) {
  var s = SUBJECT_OPTIONS.find(function(o) { return o.key === key; });
  return s ? s.label : (key || 'No subject');
}

function renderTeacherHome() {
  app.innerHTML = ForgeAuthCard.shell({
    wide: true,
    title: 'Your classes',
    sub: 'Loading your classes…'
  }, '');

  var owned = (currentTeacher && currentTeacher.id)
    ? supaGet('classes', 'teacher_user_id=eq.' + encodeURIComponent(currentTeacher.id) + '&order=created_at.desc')
    : Promise.resolve([]);

  owned.catch(function() { return []; }).then(function(rows) {
    var seen = {}, classes = [];
    (Array.isArray(rows) ? rows : []).forEach(function(c) {
      if (c && c.id && !seen[c.id]) { seen[c.id] = true; classes.push(c); }
    });
    // Classes opened by code on this device but not owned by this account.
    getJoinedClasses().forEach(function(c) {
      if (c && c.id && !seen[c.id]) { seen[c.id] = true; classes.push(c); }
    });
    drawTeacherHome(classes);
  });
}

function drawTeacherHome(classes) {
  var h = '';
  if (!classes.length) {
    h += '<div class="empty" style="padding:24px 0"><h3>No classes yet</h3>' +
         '<p style="font-size:13px">Create your first class to start seeing student data.</p></div>';
  } else {
    h += '<div class="home-grid">';
    classes.forEach(function(c) {
      h += '<button type="button" class="class-card" data-class-id="' + esc(c.id) + '">' +
        '<span class="cc-subj">' + esc(subjectLabel(c.subject)) + '</span>' +
        '<span class="cc-name">' + esc(c.name || 'Untitled class') + '</span>' +
        '<span class="cc-meta">Code <span class="cc-code">' + esc(c.code || '—') + '</span></span>' +
      '</button>';
    });
    h += '<button type="button" class="class-card cc-new" id="home-create">+ Create a class</button>';
    h += '</div>';
  }
  h += '<div class="home-actions">';
  if (!classes.length) h += '<button type="button" class="home-link" id="home-create-2">Create a class</button><span>·</span>';
  h += '<button type="button" class="home-link" id="home-code">Open a class by code</button>';
  h += '</div>';

  app.innerHTML = ForgeAuthCard.shell({
    wide: true,
    title: 'Your classes',
    sub: (currentTeacher && currentTeacher.email)
      ? 'Signed in as ' + esc(currentTeacher.email) + ' · <a href="#" id="ta-signout" style="color:var(--ember);text-decoration:none;font-weight:600">Sign out</a>'
      : 'Pick a class to open its dashboard.'
  }, h);

  var signOutLink = document.getElementById('ta-signout');
  if (signOutLink) signOutLink.onclick = function(e) { e.preventDefault(); teacherSignOut(); };
  ['home-create', 'home-create-2'].forEach(function(id) {
    var el = document.getElementById(id);
    if (el) el.onclick = function() { renderLogin('create'); };
  });
  var codeBtn = document.getElementById('home-code');
  if (codeBtn) codeBtn.onclick = function() { renderLogin('view'); };

  Array.prototype.forEach.call(app.querySelectorAll('.class-card[data-class-id]'), function(card) {
    card.onclick = function() {
      var cls = classes.filter(function(c) { return String(c.id) === card.getAttribute('data-class-id'); })[0];
      if (cls) loadClassDashboard(cls);
    };
  });

  if (window.ForgeSidebar) ForgeSidebar.setClassList(getJoinedClasses(), null);
}

// Removing a class from the sidebar switcher forgets it on this device — it
// does not delete the class or its students, which other teachers and the
// school overview still rely on.
window.forgeOnClassRemove = function(cls) {
  var name = cls.name || cls.code || 'this class';
  if (!confirm('Remove ' + name + ' from your class list?\n\nThe class, its students and their data stay intact — it just stops showing here until you open it by code again.')) return false;
  var kept = getJoinedClasses().filter(function(c) { return String(c.id) !== String(cls.id); });
  try { localStorage.setItem(_joinedClassesKey(), JSON.stringify(kept)); } catch(e) {}
  // Dropped the class currently on screen? Fall back to the home list.
  if (String(dashState.classId) === String(cls.id)) {
    dashState.classId = null;
    ForgeSidebar.setClassLabel('No class open');
    renderTeacherHome();
  }
  return true;
};

function renderLogin(activeTab) {

  // Tabs
  h += '<div class="login-tabs">';
  h += '<button type="button" class="login-tab' + (activeTab === 'view' ? ' active' : '') + '" id="lt-view">View class</button>';
  h += '<button type="button" class="login-tab' + (activeTab === 'create' ? ' active' : '') + '" id="lt-create">Create class</button>';

  // View panel

  h += '<button class="auth-btn" id="t-btn" type="submit">View dashboard \u2192</button>';
  h += '<p class="auth-err" id="t-err"></p>';
  h += '</div>';

  h += '<div class="auth-field"><label class="auth-label" for="c-subj">Subject</label>';
  h += '<select id="c-subj" class="subj-select"><option value="">— Loading subjects... —</option></select></div>';
  h += '<button class="auth-btn" id="c-btn" type="button">Create class \u2192</button>';
  h += '<p class="auth-err" id="c-err"></p>';
  h += '<div id="c-result" style="display:none;margin-top:18px"></div>';
  h += '</div>';

  app.innerHTML = ForgeAuthCard.shell({
    wide: true,
    title: 'Teacher Dashboard',
    sub: (currentTeacher && currentTeacher.email)
      ? 'Signed in as ' + currentTeacher.email + ' · <a href="#" id="ta-signout" style="color:var(--ember);text-decoration:none;font-weight:600">Sign out</a>'
      : 'Open a class dashboard, or create a new class.'
  }, h);
  // The view panel's code field is the only Enter-submittable one.
  ForgeAuthCard.onSubmit(function(){
    if (activeTab === 'view') document.getElementById('t-btn').onclick();
  });

  // Tab switching
  document.getElementById('lt-view').onclick = function() { renderLogin('view'); };
  document.getElementById('lt-create').onclick = function() { renderLogin('create'); };
  var signOutLink = document.getElementById('ta-signout');
  if (signOutLink) signOutLink.onclick = function(e) { e.preventDefault(); teacherSignOut(); };

  // Populate subject dropdown — all available by default; grey-out per teacher once entered
  if (activeTab === 'create') {
    var sel = document.getElementById('c-subj');
    if (sel) {
      var opts = '<option value="">— Select subject —</option>';
      SUBJECT_OPTIONS.forEach(function(s) {
        opts += '<option value="' + s.key + '">' + s.label + ' (' + s.spec + ')</option>';
      });
      sel.innerHTML = opts;
    }
    // When school name is blurred, re-filter to grey out subjects THIS teacher already created at that school
    var schoolInput = document.getElementById('c-school');
    if (schoolInput) {
      schoolInput.addEventListener('blur', function() {
        var school = schoolInput.value.trim();
        if (!school || !currentTeacher || !currentTeacher.id) return;
        supaGet('classes', 'school=ilike.' + encodeURIComponent(school) + '&teacher_user_id=eq.' + encodeURIComponent(currentTeacher.id)).then(function(existing) {
          var usedSubjects = {};
          (existing || []).forEach(function(c) { if (c.subject) usedSubjects[c.subject] = true; });
          var sel2 = document.getElementById('c-subj');
          if (!sel2) return;
          var opts2 = '<option value="">— Select subject —</option>';
          SUBJECT_OPTIONS.forEach(function(s) {
            if (!usedSubjects[s.key]) {
              opts2 += '<option value="' + s.key + '">' + s.label + ' (' + s.spec + ')</option>';
            } else {
              opts2 += '<option value="" disabled style="color:#555">' + s.label + ' — you already have a class for this at this school</option>';
            }
          });
          sel2.innerHTML = opts2;
        }).catch(function() {});
      });
    }
  }

  // View dashboard handler
  var viewBtn = document.getElementById('t-btn');
  if (viewBtn) {
    viewBtn.onclick = function() {
      var code = document.getElementById('t-code').value.trim().toUpperCase();
      var err = document.getElementById('t-err');
      if (!code) { err.textContent = 'Enter a class code.'; err.style.display = 'block'; return; }
      viewBtn.disabled = true; viewBtn.textContent = 'Loading...';
      supaGet('classes', 'code=eq.' + encodeURIComponent(code)).then(function(classes) {
        if (!Array.isArray(classes) || classes.length === 0) {
          err.textContent = 'Class not found. Check the code and try again.'; err.style.display = 'block';
          viewBtn.disabled = false; viewBtn.textContent = 'View dashboard \u2192'; return;
        }
        loadClassDashboard(classes[0]);
      });
    };
  }

  // Create class handler
  var createBtn = document.getElementById('c-btn');
  if (createBtn) {
    createBtn.onclick = function() {
      var school = document.getElementById('c-school').value.trim();
      var name = document.getElementById('c-name').value.trim();
      var teacher = document.getElementById('c-teacher').value.trim();
      var subj = document.getElementById('c-subj').value;
      var err = document.getElementById('c-err');
      var result = document.getElementById('c-result');
      err.style.display = 'none';
      result.style.display = 'none';

      if (!school) { err.textContent = 'Enter your school name.'; err.style.display = 'block'; return; }
      if (!name) { err.textContent = 'Enter a class name.'; err.style.display = 'block'; return; }
      if (!teacher) { err.textContent = 'Enter your name.'; err.style.display = 'block'; return; }
      if (!subj) { err.textContent = 'Select a subject.'; err.style.display = 'block'; return; }

      createBtn.disabled = true; createBtn.textContent = 'Creating...';

      // Generate code: subject prefix + 4-char random alphanumeric
      var subjLabel = SUBJECT_OPTIONS.find(function(s) { return s.key === subj; });
      var prefix = (subjLabel ? subjLabel.label.split(' ').filter(function(w){return w.length>3;}).map(function(w){return w[0];}).join('').toUpperCase().slice(0,4) : subj.toUpperCase().slice(0,4));
      var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      var rand = '';
      for (var i = 0; i < 4; i++) rand += chars[Math.floor(Math.random() * chars.length)];
      var code = prefix + '-' + rand;

      // Debug: log exactly what we're sending
      console.log('Inserting:', { name: name, subject: subj, code: code });

      supaInsert('classes', { name: name, subject: subj, code: code, teacher_name: teacher, school: school, teacher_user_id: currentTeacher ? currentTeacher.id : null }).then(function(rows) {
        createBtn.disabled = false; createBtn.textContent = 'Create class \u2192';
        console.log('Supabase response:', JSON.stringify(rows));
        var cls = Array.isArray(rows) ? rows[0] : rows;
        if (!cls || !cls.id) {
          err.textContent = 'Unexpected response — check browser console (F12) for details.';
          err.style.display = 'block'; return;
        }
        var subjInfo = SUBJECT_OPTIONS.find(function(s) { return s.key === subj; });
        var createdClassId = cls.id;
        var createdClassName = name;

        window._openCreatedDash = function() {
          dashState.classId = createdClassId;
          dashState.className = createdClassName;
          dashState.classSubject = subj;
          dashState.classCode = code;
          dashState.students = [];
          dashState.responses = [];
          dashState.assignments = [];
          addJoinedClass({ id: createdClassId, name: createdClassName, subject: subj, code: code });
          Promise.all([
            supaGet('students', 'class_id=eq.' + createdClassId),
            supaGet('assignments', 'class_id=eq.' + createdClassId + '&order=due_date.asc')
          ]).then(function(results) {
            dashState.students = rowsOrEmpty(results[0]);
            dashState.assignments = rowsOrEmpty(results[1]);
            var studentIds = dashState.students.map(function(s){ return s.id; });
            var byClass = supaGet('responses', 'class_id=eq.' + createdClassId + '&order=created_at.desc');
            var byStudents = studentIds.length > 0
              ? supaGet('responses', 'student_id=in.(' + studentIds.join(',') + ')&order=created_at.desc')
              : Promise.resolve([]);
            Promise.all([byClass, byStudents]).then(function(rResults) {
              var classResponses = rowsOrEmpty(rResults[0]);
              var studentResponses = rowsOrEmpty(rResults[1]);
              var seen = {};
              var merged = [];
              classResponses.concat(studentResponses).forEach(function(r) {
                if (r && r.id && !seen[r.id]) { seen[r.id] = true; merged.push(r); }
              });
              // Same subject filter as the "view class" flow — see comment there.
              dashState.responses = merged.filter(function(r) {
                // Anvil/Crucible rows carry their own subject ('anvil', 'crucible'),
                // so a strict r.subject match dropped every reforge before it
                // reached the dashboard — completed Anvil work simply vanished.
                // Resolve the real subject from the question instead of waving
                // all reforges through, which leaked other classes' subjects in.
                var rs = subjectForResponse(r);
                return !rs || rs === dashState.classSubject;
              });
              renderDashboard();
            });
          });
        };

        var subjName = subjInfo ? subjInfo.label : subj;
        var shareText = 'Forge — ' + name + '\n'
          + 'Subject: ' + subjName + '\n'
          + 'Class code: ' + code + '\n\n'
          + 'How to join:\n'
          + '1. Go to https://forgelearning.github.io/edu/forge-quiz.html\n'
          + '2. Enter your name and the class code above\n'
          + '3. You\'ll be taken straight to ' + subjName + '\n\n'
          + 'Forge builds exam technique through targeted questions, misconception feedback, and timed pressure tests. Complete questions regularly — your teacher can see your progress on the dashboard.';

        var r = '<div class="code-display">';
        r += '<span class="code-sub">Class created \u2713</span>';
        r += '<span class="code-val">' + code + '</span>';
        r += '<span class="code-sub">' + name + ' \u00b7 ' + subjName + '</span>';
        r += '</div>';
        r += '<button class="copy-btn" id="copy-code-btn">\u2398 Copy code</button>';
        r += '<button class="copy-btn" id="share-edulink-btn">\uD83D\uDCCB Copy EduLink message</button>';
        r += '<button class="join-btn" onclick="window._openCreatedDash()">Open dashboard \u2192</button>';
        result.innerHTML = r;
        result.style.display = 'block';

        // Remove the newly created subject from the dropdown
        var sel = document.getElementById('c-subj');
        if (sel) {

// Students can sit in several classes, so dashState.responses holds rows from
// every subject they've answered. Every view must narrow to the class's own
// subject first, or e.g. a Computing class shows Economics spec points.
function forClassSubject(rows) {
  if (!dashState.classSubject) return rows;
  return rows.filter(function(r) {
    var cs = dashState.classSubject;
    // Not r.subject: Anvil reforges log 'anvil' there, and blanket-including
    // every reforge row pulled other classes' subjects onto this dashboard.
    var rs = subjectForResponse(r);
    var engMatch = (cs === 'englit' || cs === 'engll') && (rs === 'englit' || rs === 'engll');
    // Rows whose subject can't be established (older data predating the subject
    // field) are kept rather than dropped.
    return rs === cs || engMatch || !rs;
  });
}

function renderDashboard() {

  var allResponses = dashState.responses;

  var wrongResponses = responses.filter(function(r) { return !r.is_correct && r.misconception_tag; });

window.copyClassCode = function(btn) {
  var code = dashState.classCode;
  if (!code) return;
  var done = function() {
    var original = code + ' ⎘';
    btn.textContent = 'Copied ✓';
    setTimeout(function() { btn.textContent = original; }, 1400);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(code).then(done).catch(done);
  } else {
    var ta = document.createElement('textarea');
    ta.value = code; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    done();
  }
};

// Question id → spec point. Correct answers carry no misconception tag, so the
// MC_TO_SPEC lookup alone only ever matched wrong answers — which made every
// spec point read 0%. Resolve the spec from the question itself instead.
var QID_TO_SPEC = (function() {
  var map = {};
  if (typeof BANKS === 'undefined') return map;
  Object.keys(BANKS).forEach(function(bk) {
    (BANKS[bk].questions || []).forEach(function(q) {
      var sp = q.spec || MC_TO_SPEC[q.tag] || null;
      if (sp) map[q.id] = sp;
    });
  });
  return map;
})();

// Anvil/Crucible/reforge rows suffix the original question id, and they stack:
// a reforge of a reforge is logged as GRO-01-RF-ANVIL. Strip every suffix, not
// just the last one, or the id never matches its question.
function baseQuestionId(qid) {
  if (!qid) return '';
  var out = qid, prev;
  do { prev = out; out = out.replace(/-(RF|ANVIL|CRU\d*)$/, ''); } while (out !== prev);
  return out;
}

// Question id → subject key. The Anvil logs subject:'anvil' (the source page,
// not the subject), so an Economics reforge is indistinguishable from a
// Computing one by its subject column alone. The question id still identifies
// the bank it came from, and the bank belongs to exactly one subject.
var QID_TO_SUBJECT = (function() {
  var map = {};
  if (typeof BANKS === 'undefined' || typeof SUBJECTS === 'undefined') return map;
  Object.keys(SUBJECTS).forEach(function(sk) {
    (SUBJECTS[sk].banks || []).forEach(function(bk) {
      if (!BANKS[bk]) return;
      (BANKS[bk].questions || []).forEach(function(q) { map[q.id] = sk; });
    });
  });
  return map;
})();

// Misconception tag → subject, as a second route home: an Anvil row's `bank` is
// the tag it was forged from, so a tag identifies the subject even when the
// question id doesn't resolve.
var MC_TO_SUBJECT = (function() {
  var map = {};
  if (typeof BANKS === 'undefined' || typeof SUBJECTS === 'undefined') return map;
  Object.keys(SUBJECTS).forEach(function(sk) {
    (SUBJECTS[sk].banks || []).forEach(function(bk) {
      if (!BANKS[bk]) return;
      (BANKS[bk].questions || []).forEach(function(q) { if (q.tag) map[q.tag] = sk; });
    });
  });
  return map;
})();

// The real subject a response belongs to, seeing through the 'anvil'/'crucible'
// placeholders. Returns null when it can't be established.
function subjectForResponse(r) {
  var rs = r.subject;
  if (rs && rs !== 'anvil' && rs !== 'crucible' && rs !== 'unknown') return rs;
  return QID_TO_SUBJECT[baseQuestionId(r.question_id)]
      || MC_TO_SUBJECT[r.misconception_tag]
      || MC_TO_SUBJECT[r.bank]
      || null;
}

function specForResponse(r) {
  return r.spec_point || QID_TO_SPEC[baseQuestionId(r.question_id)] || MC_TO_SPEC[r.misconception_tag] || null;
}

function renderSpecBreakdown(responses) {
  var el = document.getElementById('panel-spec');
  if (!el) return;
  if (!responses || responses.length === 0) {
    el.innerHTML = '<div class="empty"><h3>No data yet</h3><p>Students need to answer questions to generate spec point data.</p></div>';
    return;
  }

  // Build spec point data
  var specData = {};
  responses.forEach(function(r) {
    var sp = specForResponse(r);
    if (!sp || sp === 'TECH') return;
    if (!specData[sp]) specData[sp] = { total: 0, correct: 0, students: {} };
    specData[sp].total++;
    if (r.is_correct) specData[sp].correct++;
    if (r.student_id) specData[sp].students[r.student_id] = true;
  });

  var specKeys = Object.keys(specData).sort();
  if (specKeys.length === 0) {
    el.innerHTML = '<div class="empty"><h3>No spec point data yet</h3><p>Spec point tracking requires questions answered after the latest update.</p></div>';
    return;
  }

  // Sort by accuracy ascending (weakest first)
  specKeys.sort(function(a, b) {
    var accA = specData[a].correct / specData[a].total;
    var accB = specData[b].correct / specData[b].total;
    return accA - accB;
  });

  var h = '<div class="card-title" style="margin-bottom:16px">Spec Point Accuracy — weakest first</div>';
  h += '<p style="font-size:13px;color:#8A857E;margin-bottom:20px">Only spec points with logged responses are shown. Questions answered before the latest update will not appear here.</p>';
  h += '<table style="width:100%;border-collapse:collapse;font-size:13px">';
  h += '<thead><tr style="color:#8A857E;text-align:left;border-bottom:1px solid var(--line)">';
  h += '<th style="padding:8px 0">Spec point</th><th>Subject</th><th>Questions</th><th>Students</th><th>Accuracy</th><th style="min-width:120px">Bar</th>';
  h += '</tr></thead><tbody>';

  specKeys.forEach(function(sp) {
    var d = specData[sp];
    var acc = Math.round((d.correct / d.total) * 100);
    var studentCount = Object.keys(d.students).length;
    var col = acc >= 70 ? 'var(--good)' : acc >= 50 ? 'var(--hot)' : 'var(--bad)';
    h += '<tr style="border-top:1px solid var(--line)">';
    h += '<td style="padding:8px 0;font-family:JetBrains Mono,monospace;font-size:12px;color:var(--ember);font-weight:700">' + sp + '</td>';
    h += '<td style="font-size:12px;color:#8A857E">' + (SPEC_TO_SUBJECT[sp] || '—') + '</td>';
    h += '<td style="color:#8A857E">' + d.total + '</td>';
    h += '<td style="color:#8A857E">' + studentCount + '</td>';
    h += '<td style="font-weight:700;color:' + col + '">' + acc + '%</td>';
    h += '<td><div style="background:var(--line);border-radius:var(--radius-xs);height:8px;width:120px"><div style="background:' + col + ';border-radius:var(--radius-xs);height:8px;width:' + acc + '%"></div></div></td>';
    h += '</tr>';
  });
  h += '</tbody></table>';
  el.innerHTML = h;
}

// Bank label lookup — derived from the shared BANKS data (data/forge-data.js).
var BANK_LABELS = {};
Object.keys(BANKS).forEach(function(key) { BANK_LABELS[key] = BANKS[key].label; });
// Subject → banks map — derived from the shared SUBJECTS data (data/forge-data.js).
var SUBJECT_BANKS = {};
Object.keys(SUBJECTS).forEach(function(key) { SUBJECT_BANKS[key] = SUBJECTS[key].banks; });

function dueBadge(dateStr) {
  if (!dateStr) return '';
  var due = new Date(dateStr);
  var now = new Date();
  var diff = Math.ceil((due - now) / (1000 * 60 * 60 * 24));
  if (diff < 0) return '<span class="assign-due overdue">Overdue by ' + Math.abs(diff) + 'd</span>';
  if (diff <= 3) return '<span class="assign-due soon">Due in ' + diff + 'd</span>';
  return '<span class="assign-due ok">Due ' + due.toLocaleDateString('en-GB', {day:'numeric',month:'short'}) + '</span>';
}

function renderAssignCard(asgn, students, responses, isArchived) {
  var banks = Array.isArray(asgn.banks) ? asgn.banks : (asgn.banks ? JSON.parse(asgn.banks) : []);
  var bankLabels = banks.map(function(b) { return BANK_LABELS[b] || b; }).join(', ');
  var asgnCreated = new Date(asgn.created_at);
  var completedStudents = {};
  responses.forEach(function(r) {
    if (new Date(r.created_at) >= asgnCreated && banks.indexOf(r.bank) !== -1) {
      completedStudents[r.student_id] = true;
    }
  });
  var completedCount = Object.keys(completedStudents).length;
  var total = students.length;
  var pct = total > 0 ? Math.round((completedCount / total) * 100) : 0;

  var h = '<div class="assign-card' + (isArchived ? ' archived' : '') + '" data-asgn-id="' + asgn.id + '">';
  h += '<div class="assign-card-title">' + asgn.title + '</div>';
  h += '<div class="assign-meta">' + bankLabels + '</div>';
  if (!isArchived) {
    h += '<div class="assign-progress-row">';
    h += '<div class="assign-progress-bar"><div class="assign-progress-fill" style="width:' + pct + '%"></div></div>';
    h += '<span style="font-family:\'JetBrains Mono\',monospace;font-size:12px;color:var(--slate)">' + completedCount + '/' + total + ' started</span>';
    h += dueBadge(asgn.due_date);
    h += '</div>';
    if (students.length > 0) {
      h += '<div style="margin-top:12px">';
      students.forEach(function(s) {
        var done = completedStudents[s.id];
        h += '<div class="student-assign-row">';
        h += '<span style="color:' + (done ? 'var(--good)' : 'var(--bad)') + ';font-size:14px">' + (done ? '✓' : '○') + '</span>';
        h += '<span style="color:var(--white);flex:1">' + s.name + '</span>';
        h += '<span style="font-family:\'JetBrains Mono\',monospace;font-size:11px;color:#8A857E">' + (done ? 'Started' : 'Not started') + '</span>';
        h += '</div>';
      });
      h += '</div>';
    }
  }
  // Action buttons
  h += '<div class="asgn-actions">';
  if (isArchived) {
    h += '<button class="asgn-action-btn" data-action="unarchive" data-id="' + asgn.id + '">Restore</button>';
  } else {
    h += '<button class="asgn-action-btn" data-action="archive" data-id="' + asgn.id + '">Archive</button>';
  }
  h += '<button class="asgn-action-btn danger" data-action="delete" data-id="' + asgn.id + '">Delete</button>';
  h += '</div>';
  h += '</div>';
  return h;
}

function renderHeatmap(wrongResponses) {
  var el = document.getElementById('panel-heatmap');
  if (wrongResponses.length === 0) {
    renderBrowseStarters();
    return;
  }

  // Count by misconception tag
  var counts = {};
  wrongResponses.forEach(function(r) {
    var tag = r.misconception_tag;
    if (!counts[tag]) counts[tag] = { count: 0, banks: {}, students: {} };
    counts[tag].count++;
    counts[tag].banks[r.bank] = true;
    counts[tag].students[r.student_id] = true;
  });

  // Sort by count descending
  var sorted = Object.keys(counts).sort(function(a, b) { return counts[b].count - counts[a].count; });
  var maxCount = counts[sorted[0]].count;

  var h = '<div class="card"><div class="card-title">Misconceptions ranked by frequency</div>';
  sorted.forEach(function(tag) {
    var c = counts[tag];
    var pct = Math.round((c.count / maxCount) * 100);
    var level = pct > 60 ? 'high' : pct > 30 ? 'med' : '';
    var label = MC_LABELS[tag] || tag;
    var banks = Object.keys(c.banks).join(', ');
    var studentCount = Object.keys(c.students).length;

    h += '<div class="heat-row ' + level + '">';
    h += '<span class="heat-tag">' + tag + '</span>';
    h += '<span class="heat-label">' + label + '</span>';
    h += '<span class="heat-spec">' + banks + '</span>';
    h += '<div class="heat-bar"><div class="heat-fill" style="width:' + pct + '%"></div></div>';
    h += '<span class="heat-count">' + c.count + ' \u00d7 ' + studentCount + 's</span>';
    h += '</div>';
  });
  h += '</div>';

  el.innerHTML = h;
}
