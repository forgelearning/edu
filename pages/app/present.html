<script>
var SUPABASE_URL = ForgeAPI.config.url;
var SUPABASE_KEY = ForgeAPI.config.key;
var TEACHER_SESSION_KEY = 'forge-teacher-session';

function requireTeacherSession(onReady) {
  var app = document.getElementById('app');
  ForgeState.loading(app, { label: 'Checking teacher access', body: 'Confirming your teacher session before opening Class Mode.' });
  var saved = null;
  try { saved = JSON.parse(localStorage.getItem(TEACHER_SESSION_KEY) || 'null'); } catch (e) {}
  if (!saved || !saved.access_token) {
    app.innerHTML = ForgeState.html('empty', { label: 'Teacher sign-in required', body: 'Class Mode is available after you sign in to the Teacher Dashboard.', action: { label: 'Sign in to Teacher Dashboard', href: 'teacher.html' } });
    return;
  }
  ForgeAPI.auth.user(saved.access_token).then(function(user) {
    if (!user || !user.id) throw new Error('Teacher session invalid');
    onReady();
  }).catch(function() {
    app.innerHTML = ForgeState.html('error', { label: 'Your teacher session has expired', body: 'Sign in again to continue using Class Mode.', action: { label: 'Sign in again', href: 'teacher.html' } });
  });
}

var state = { phase:'loading', banks:null, subjects:null, subjectKey:null, bankKey:null, shuffle:true, questions:[], idx:0, revealed:false };
var app = document.getElementById('app');

requireTeacherSession(function() {
  fetch('data/forge-data.js').then(function(r){ return r.text(); }).then(function(dataScript){
    (new Function(dataScript + '\nwindow.__FORGE_DATA__ = {BANKS:BANKS, SUBJECTS:SUBJECTS};'))();
    state.banks = window.__FORGE_DATA__.BANKS;
    state.subjects = window.__FORGE_DATA__.SUBJECTS;
    state.phase = 'subjects';
    var linked = new URLSearchParams(location.search).get('challenge');
    if (linked) openChallenge(linked); else render();
  }).catch(function(e){
    var retry = ForgeState.error(app, { label: 'Question banks are unavailable', body: 'We couldn’t load the teaching material. Check your connection and try again.' });
    if (retry) retry.onclick = function () { location.reload(); };
  });
});

function shuffleArr(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=b[i];b[i]=b[j];b[j]=t;}return b;}

function render(){
  if (state.phase === 'subjects') return renderSubjects();
  if (state.phase === 'banks') return renderBanks();
  if (state.phase === 'present') return renderPresent();
  if (state.phase === 'challenges') return renderChallengeList();
  if (state.phase === 'challenge') return renderChallenge();
}

// ===== Class Challenge results =====
// Students answered on their own; this shows the class's answers question by
// question, so the lesson can teach from them without student devices. Counts
// come from responses the teacher can already read; a question with fewer
// than ForgeChallenge.MIN_SHOWN answers shows no breakdown.
function teacherToken(){ try { return (JSON.parse(localStorage.getItem(TEACHER_SESSION_KEY) || 'null') || {}).access_token || null; } catch (e) { return null; } }
function findQuestion(id){
  for (var key in state.banks) { var qs = state.banks[key].questions || []; for (var i = 0; i < qs.length; i++) if (qs[i].id === id) return qs[i]; }
  return null;
}
function presentEsc(v){ return String(v == null ? '' : v).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function listChallenges(){
  state.phase = 'challenges'; state.challenges = null; render();
  var token = teacherToken();
  Promise.all([
    ForgeAPI.get('assignments', 'select=id,title,class_id,due_date,challenge_question_ids&challenge_question_ids=not.is.null&order=created_at.desc', { token: token }),
    ForgeAPI.get('classes', 'select=id,name', { token: token })
  ]).then(function(r){
    var names = {}; (r[1] || []).forEach(function(c){ names[c.id] = c.name; });
    state.challenges = (r[0] || []).map(function(a){ return Object.assign({}, a, { className: names[a.class_id] || '' }); });
    render();
  }).catch(function(){ state.challenges = []; state.challengeError = true; render(); });
}
function renderChallengeList(){
  var h = '<button type="button" class="back-btn forge-u-3ocpgz" id="challenge-back">← Class Mode</button>';
  h += '<h1 class="forge-u-17llymi">Class Challenge results</h1>';
  if (!state.challenges) { app.innerHTML = h + '<p class="forge-u-1avfpoj">Loading challenges…</p>'; }
  else if (!state.challenges.length) { app.innerHTML = h + '<p class="forge-u-1avfpoj">' + (state.challengeError ? 'We couldn’t load your challenges. Check your connection and try again.' : 'No challenges yet. Set one from Assignments on the Teacher Dashboard by ticking “Make this a Class Challenge”.') + '</p>'; }
  else {
    h += '<div class="subject-list">';
    state.challenges.forEach(function(a){
      h += '<button type="button" class="pick-btn" data-challenge="' + presentEsc(a.id) + '"><h3>' + presentEsc(a.title) + '</h3><div class="sub">' + presentEsc(a.className) + '</div><div class="count">' + a.challenge_question_ids.length + ' questions' + (a.due_date ? ' · due ' + new Date(a.due_date).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) : '') + '</div></button>';
    });
    app.innerHTML = h + '</div>';
    app.querySelectorAll('[data-challenge]').forEach(function(b){ b.onclick = function(){ openChallenge(b.getAttribute('data-challenge')); }; });
  }
  document.getElementById('challenge-back').onclick = function(){ state.phase = 'subjects'; render(); };
}
function openChallenge(id){
  var token = teacherToken();
  state.phase = 'challenge'; state.challenge = null; render();
  Promise.all([
    ForgeAPI.get('assignments', 'select=id,title,class_id,challenge_question_ids&id=eq.' + encodeURIComponent(id), { token: token }),
    ForgeAPI.get('responses', 'select=student_id,question_id,selected_option,is_correct,misconception_tag,reforge_attempted,created_at&assignment_id=eq.' + encodeURIComponent(id), { token: token })
  ]).then(function(r){
    var a = (r[0] || [])[0];
    if (!a || !ForgeChallenge.isChallenge(a)) throw new Error('missing');
    var questions = a.challenge_question_ids.map(findQuestion).filter(Boolean);
    state.challenge = { assignment: a, questions: questions, tally: ForgeChallenge.tally(r[1] || [], questions.map(function(q){ return q.id; })) };
    state.idx = 0; state.revealed = false; render();
  }).catch(function(){ state.challenge = { error: true }; render(); });
}
function renderChallenge(){
  var c = state.challenge;
  if (!c) { app.innerHTML = '<p class="forge-u-1avfpoj">Loading challenge results…</p>'; return; }
  if (c.error) { app.innerHTML = ForgeState.html('error', { label: 'Challenge results are unavailable', body: 'We couldn’t load this challenge. Check your connection and try again.', action: { label: 'Back to challenges', href: 'present.html' } }); return; }
  var q = c.questions[state.idx];
  var h = '<div class="present-header"><button type="button" class="back-btn forge-u-3ocpgz" id="challenge-list">← Challenges</button><span class="bank-name">' + presentEsc(c.assignment.title) + '</span><span>' + (q ? (state.idx + 1) + ' / ' + c.questions.length : 'Summary') + '</span></div>';
  if (!q) {
    // Summary: weakest questions first, with the misconception behind each.
    h += '<div class="stage"><h1 class="forge-u-17llymi">How the class did</h1><ol class="challenge-summary">';
    c.questions.map(function(qq, i){
      var t = c.tally[qq.id], right = (t.options[qq.correct] || 0), pct = t.answered ? Math.round(right / t.answered * 100) : null;
      var top = Object.keys(t.tags).sort(function(x, y){ return t.tags[y] - t.tags[x]; })[0];
      return { i: i, pct: pct, n: t.answered, label: top && window.resolveMCLabel ? resolveMCLabel(top) : '' };
    }).sort(function(a, b){ return (a.pct == null ? 101 : a.pct) - (b.pct == null ? 101 : b.pct); }).forEach(function(row){
      h += '<li><strong>Question ' + (row.i + 1) + '</strong> · ' + (row.n < ForgeChallenge.MIN_SHOWN ? 'fewer than ' + ForgeChallenge.MIN_SHOWN + ' answers' : row.pct + '% correct') + (row.label && row.n >= ForgeChallenge.MIN_SHOWN ? '<br><span>' + row.label + '</span>' : '') + '</li>';
    });
    h += '</ol><p class="hint">Students who chose a wrong answer already have that idea in Repair mistakes.</p></div>';
    h += '<div class="controls"><button type="button" class="ctrl-btn" id="prev-btn">← Previous</button><div></div><div></div></div>';
    app.innerHTML = h;
  } else {
    var t = c.tally[q.id];
    h += '<div class="progress-bar"><div class="progress-fill" style="--progress:' + (state.idx / c.questions.length) + '"></div></div>';
    h += '<div class="stage"><span class="q-id-big">Question ' + (state.idx + 1) + '</span><div class="stem-big">' + q.stem + '</div>';
    var keys = Object.keys(q.options);
    h += '<div class="opts-big">';
    keys.forEach(function(k){ h += '<div class="opt-big' + (state.revealed ? (k === q.correct ? ' reveal-correct' : ' reveal-dim') : '') + '"><span class="letter-big">' + k + '</span><span>' + q.options[k] + '</span></div>'; });
    h += '</div>';
    if (t.answered < ForgeChallenge.MIN_SHOWN) {
      h += '<p class="challenge-few">' + t.answered + ' answered. The class breakdown appears once ' + ForgeChallenge.MIN_SHOWN + ' students have answered.</p>';
    } else {
      h += '<div class="challenge-bars"><p><strong>' + t.answered + ' students answered</strong></p>' + ForgeChallenge.barsHtml(q, t, { reveal: state.revealed }) + '</div>';
    }
    if (state.revealed) {
      var wrong = keys.filter(function(k){ return k !== q.correct; }).sort(function(x, y){ return (t.options[y] || 0) - (t.options[x] || 0); })[0];
      var topTag = Object.keys(t.tags).sort(function(x, y){ return t.tags[y] - t.tags[x]; })[0];
      var label = topTag && window.resolveMCLabel ? resolveMCLabel(topTag) : '';
      var lead = (t.answered >= ForgeChallenge.MIN_SHOWN && wrong && t.options[wrong]) ? '<p class="challenge-lead">' + t.options[wrong] + ' chose ' + wrong + '.' + (label ? ' The idea to fix:' : '') + '</p>' : '';
      h += '<div class="scaffold-big">' + lead + (label ? '<span class="stag">' + label + '</span>' : '') + '<p>' + ForgeQuestion.scaffoldText(q) + '</p></div>';
    }
    h += '</div><div class="controls"><button type="button" class="ctrl-btn" id="prev-btn"' + (state.idx === 0 ? ' disabled' : '') + '>← Previous</button>';
    h += state.revealed ? '<button type="button" class="reveal-btn next-btn-style" id="next-btn">' + (state.idx + 1 < c.questions.length ? 'Next question →' : 'See summary →') + '</button>' : '<button type="button" class="reveal-btn" id="reveal-btn">Reveal answer</button>';
    h += '<div></div></div>';
    app.innerHTML = h;
    var rb = document.getElementById('reveal-btn'); if (rb) rb.onclick = function(){ state.revealed = true; render(); };
    var nb = document.getElementById('next-btn'); if (nb) nb.onclick = function(){ state.idx++; state.revealed = false; render(); };
  }
  document.getElementById('challenge-list').onclick = listChallenges;
  var pb = document.getElementById('prev-btn'); if (pb) pb.onclick = function(){ if (state.idx > 0) { state.idx--; state.revealed = false; render(); } };
}

function howtoStrip(){
  var h = '<div class="howto">';
  h += '<div class="howto-step"><span class="howto-num">1</span><span class="howto-text">Pick your <b>subject</b> and <b>topic</b> below.</span></div>';
  h += '<div class="howto-step"><span class="howto-num">2</span><span class="howto-text">A question appears big on screen — read it out to the class.</span></div>';
  h += '<div class="howto-step"><span class="howto-num">3</span><span class="howto-text">Click <b>Reveal answer</b> when they\'ve had a go, then <b>Next question</b> to continue.</span></div>';
  h += '</div>';
  return h;
}

function startBank(bankKey){
  state.bankKey = bankKey;
  var qs = state.banks[bankKey].questions.filter(function(q){ return !q.type || q.type==='fill_blank'; });
  state.questions = state.shuffle ? shuffleArr(qs) : qs;
  state.idx = 0;
  state.revealed = false;
  state.phase = 'present';
  render();
}

function renderSubjects(){
  var h = '<p class="step-label">Step 1 of 2 — choose a subject</p>';
  h += '<h1 class="forge-u-17llymi">Forge Class Mode</h1>';
  h += '<p class="forge-u-1avfpoj">Run a question bank from the front of the room — no student devices needed.</p>';
  h += howtoStrip();
  h += '<p class="challenge-entry"><button type="button" class="ctrl-btn" id="open-challenges">Class Challenge results →</button> Show how the class answered a challenge they did on their own.</p>';
  h += '<div class="subject-list">';
  Object.keys(state.subjects).forEach(function(key){
    var s = state.subjects[key];
    var qCount = s.banks.reduce(function(sum,bk){ return sum + (state.banks[bk] ? state.banks[bk].questions.length : 0); }, 0);
    h += '<button type="button" class="pick-btn" data-key="'+key+'" style="--accent-color:'+s.color+'"><h3>'+s.label+'</h3><div class="sub">'+s.sub+'</div><div class="count">'+qCount+' questions</div></button>';
  });
  h += '</div>';
  app.innerHTML = h;
  document.getElementById('open-challenges').onclick = listChallenges;
  app.querySelectorAll('.pick-btn').forEach(function(b){
    b.onclick = function(){
      state.subjectKey = b.dataset.key;
      var s = state.subjects[state.subjectKey];
      var validBanks = s.banks.filter(function(bk){ return !!state.banks[bk]; });
      if (validBanks.length === 1){
        startBank(validBanks[0]);
      } else {
        state.phase = 'banks';
        render();
      }
    };
  });
}

function renderBanks(){
  var s = state.subjects[state.subjectKey];
  var h = '<button type="button" class="back-btn" id="back-subj">← Choose a different subject</button>';
  h += '<p class="step-label">Step 2 of 2 — choose a topic</p>';
  h += '<h1 class="forge-u-i98bqy">'+s.label+'</h1>';
  h += '<div class="bank-list">';
  s.banks.forEach(function(bk){
    var b = state.banks[bk];
    if (!b) return;
    var qs = b.questions.filter(function(q){ return !q.type || q.type==='fill_blank'; });
    h += '<button type="button" class="pick-btn" data-key="'+bk+'" style="--accent-color:'+b.color+'"><h3>'+b.label+'</h3><div class="count">'+qs.length+' questions</div></button>';
  });
  h += '</div>';
  h += '<div class="opts-row"><label><input type="checkbox" id="shuffle-cb" '+(state.shuffle?'checked':'')+'> Shuffle question order</label></div>';
  app.innerHTML = h;
  document.getElementById('back-subj').onclick = function(){ state.phase='subjects'; render(); };
  document.getElementById('shuffle-cb').onchange = function(e){ state.shuffle = e.target.checked; };
  app.querySelectorAll('.pick-btn').forEach(function(b){
    b.onclick = function(){ startBank(b.dataset.key); };
  });
}

function renderPresent(){
  var bk = state.banks[state.bankKey];
  var q = state.questions[state.idx];

  if (!q){
    app.innerHTML = '<div class="done-box"><h1 class="forge-u-89sf81">Bank complete</h1><p class="forge-u-1mu62ua">'+state.questions.length+' questions covered.</p><button type="button" class="reveal-btn" id="restart-btn">Run again</button><br><br><button type="button" class="ctrl-btn" id="banks-btn">← Choose a different bank</button></div>';
    document.getElementById('restart-btn').onclick = function(){ state.idx=0; state.revealed=false; if(state.shuffle) state.questions=shuffleArr(state.questions); render(); };
    document.getElementById('banks-btn').onclick = function(){ state.phase='banks'; render(); };
    return;
  }

  var h = '<div class="present-header"><button type="button" class="back-btn forge-u-3ocpgz" id="back-banks">← Banks</button><span class="bank-name" style="color:'+bk.color+'">'+bk.label+'</span><span>'+(state.idx+1)+' / '+state.questions.length+'</span></div>';
  h += '<div class="progress-bar"><div class="progress-fill" style="--progress:'+((state.idx/state.questions.length))+';background:'+bk.color+'"></div></div>';
  h += '<div class="stage">';
  // The board is projected to the class, so it shows the question number,
  // not the internal id (GCSE-HAZ-34) it used to.
  h += '<span class="q-id-big" style="color:'+bk.color+';background:'+bk.color+'1a">Question '+(state.idx+1)+'</span>';
  h += '<div class="stem-big">'+(q.stem||q.template)+'</div>';

  if (q.type === 'fill_blank'){
    var parts = q.template.split('___');
    var sent = '<div class="fb-sentence-big">';
    parts.forEach(function(part,i){
      sent += part;
      if (i < parts.length-1){
        var word = state.revealed ? q.blanks[i] : '';
        sent += '<span class="fb-blank-big'+(state.revealed?' revealed':'')+'">'+word+'</span>';
      }
    });
    sent += '</div>';
    h += sent;
  } else {
    var keys = Object.keys(q.options);
    h += '<div class="opts-big">';
    keys.forEach(function(k){
      var cls = 'opt-big';
      if (state.revealed) cls += (k===q.correct) ? ' reveal-correct' : ' reveal-dim';
      h += '<div class="'+cls+'"><span class="letter-big">'+k+'</span><span>'+q.options[k]+'</span></div>';
    });
    h += '</div>';
  }

  if (state.revealed){
    // Readable misconception label, never the raw tag (MC-...); the shared
    // helper also turns placeholder scaffolds into a usable explanation.
    var tag = Array.isArray(q.tag) ? q.tag[0] : q.tag;
    var label = (tag && window.resolveMCLabel) ? window.resolveMCLabel(tag) : '';
    var explanation = window.ForgeQuestion ? window.ForgeQuestion.scaffoldText(q) : (q.scaffold || '');
    h += '<div class="scaffold-big">'+(label?'<span class="stag">'+label+'</span>':'')+'<p>'+explanation+'</p></div>';
  }

  h += '</div>'; // stage

  h += '<div class="controls">';
  h += '<button type="button" class="ctrl-btn" id="prev-btn" '+(state.idx===0?'disabled':'')+'>← Previous</button>';
  if (!state.revealed){
    h += '<button type="button" class="reveal-btn" id="reveal-btn">Reveal answer</button>';
  } else {
    h += '<button type="button" class="reveal-btn next-btn-style" id="next-btn">Next question →</button>';
  }
  h += '<div></div>';
  h += '</div>';
  h += '<p class="hint">'+(state.revealed ? 'Ready for the next one? Click <b>Next question</b> above.' : 'Give the class a moment, then click <b>Reveal answer</b> above.')+'<br><span class="mono">Shortcuts: Space = reveal/next · ← → = navigate · Esc = change topic</span></p>';

  app.innerHTML = h;

  document.getElementById('back-banks').onclick = function(){ state.phase='banks'; render(); };
  document.getElementById('prev-btn').onclick = function(){ if(state.idx>0){ state.idx--; state.revealed=false; render(); } };
  var revealBtn = document.getElementById('reveal-btn');
  if (revealBtn) revealBtn.onclick = function(){ state.revealed = true; render(); };
  var nextBtn = document.getElementById('next-btn');
  if (nextBtn) nextBtn.onclick = function(){ state.idx++; state.revealed=false; render(); };
}

document.addEventListener('keydown', function(e){
  if (state.phase === 'challenge' && state.challenge && state.challenge.questions) {
    var total = state.challenge.questions.length;
    if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); if (state.idx < total && !state.revealed) state.revealed = true; else if (state.idx < total) { state.idx++; state.revealed = false; } render(); }
    else if (e.code === 'ArrowLeft' && state.idx > 0) { state.idx--; state.revealed = false; render(); }
    else if (e.code === 'Escape') listChallenges();
    return;
  }
  if (state.phase !== 'present') return;
  if (e.code === 'Space' || e.code === 'Enter'){
    e.preventDefault();
    if (!state.revealed){ state.revealed = true; render(); }
    else { state.idx++; state.revealed = false; render(); }
  } else if (e.code === 'ArrowRight'){
    if (state.revealed){ state.idx++; state.revealed = false; render(); }
  } else if (e.code === 'ArrowLeft'){
    if (state.idx > 0){ state.idx--; state.revealed = false; render(); }
  } else if (e.code === 'Escape'){
    state.phase = 'banks'; render();
  }
});
</script>
<script src="scripts/nav.js"></script>
  <script src="scripts/forge-overdrive.js"></script>
  <script src="scripts/forge-page-actions.js"></script>
