<script>
// The dashboard depends on ForgeAPI. If a cached or interrupted first load
// leaves that dependency unavailable, show a recoverable state instead of
// throwing halfway through boot and leaving the page visually empty.
if (!window.ForgeAPI || !window.ForgeAPI.config) {
  var bootApp = document.getElementById('app');
  if (bootApp) {
    bootApp.innerHTML = '<section class="card"><h2>Teacher dashboard could not load</h2><p>Forge is still loading its shared services. Refresh to try again.</p><button class="forge-button forge-button--primary" type="button" data-forge-reload>Retry dashboard</button></section>';
    bootApp.querySelector('[data-forge-reload]').addEventListener('click', function(){ location.reload(); });
  }
  throw new Error('ForgeAPI unavailable during teacher dashboard boot');
}
var SUPABASE_URL = ForgeAPI.config.url;
var SUPABASE_KEY = ForgeAPI.config.key;

var headers = {
  'apikey': SUPABASE_KEY,
  'Authorization': 'Bearer ' + SUPABASE_KEY
};

// ── Teacher auth (separate session from the student-facing forge-auth.js?v=20260808-session-cache2) ──
var TEACHER_SESSION_KEY = 'forge-teacher-session';
var currentTeacher = null; // { id, email } once signed in

function _saveTeacherSession(session) {
  try { localStorage.setItem(TEACHER_SESSION_KEY, JSON.stringify(session)); } catch(e) {}
}
function _loadTeacherSession() {
  try { return JSON.parse(localStorage.getItem(TEACHER_SESSION_KEY) || 'null'); } catch(e) { return null; }
}
function _clearTeacherSession() {
  try { localStorage.removeItem(TEACHER_SESSION_KEY); } catch(e) {}
}

// ── Classes a teacher has opened, so the sidebar switcher can list them
// without re-entering a code each time. Keyed per teacher, since the
// browser/localStorage may be shared across accounts on a school machine.
function _joinedClassesKey() {
  return 'forge-teacher-joined-classes-' + (currentTeacher && currentTeacher.id ? currentTeacher.id : 'anon');
}
function getJoinedClasses() {
  try { return JSON.parse(localStorage.getItem(_joinedClassesKey()) || '[]'); } catch(e) { return []; }
}
function addJoinedClass(cls) {
  var list = getJoinedClasses().filter(function(c) { return c.id !== cls.id; });
  list.unshift({ id: cls.id, name: cls.name, subject: cls.subject, code: cls.code });
  try { localStorage.setItem(_joinedClassesKey(), JSON.stringify(list)); } catch(e) {}
}

var TeacherAuth = {
  signUp: function(email, password) {
    return ForgeAPI.auth.signUp(email, password).then(function(data) {
      if (!data || data.error || !data.access_token) throw new Error((data && (data.error_description || data.msg || data.error)) || 'Sign-up failed');
      _saveTeacherSession({ access_token: data.access_token, refresh_token: data.refresh_token, user: data.user });
      if (window.ForgeRole) ForgeRole.set('teacher');
      return data;
    });
  },
  signIn: function(email, password) {
    return ForgeAPI.auth.signIn(email, password).then(function(data) {
      if (!data || data.error || !data.access_token) throw new Error((data && (data.error_description || data.msg || data.error)) || 'Incorrect email or password');
      _saveTeacherSession({ access_token: data.access_token, refresh_token: data.refresh_token, user: data.user });
      if (window.ForgeRole) ForgeRole.set('teacher');
      return data;
    });
  },
  refreshSession: function(refreshToken) {
    return ForgeAPI.auth.refresh(refreshToken).then(function(data) {
      if (!data || data.error || !data.access_token) {
        _clearTeacherSession();
        throw new Error('Session expired');
      }
      _saveTeacherSession({ access_token: data.access_token, refresh_token: data.refresh_token, user: data.user });
      return data;
    });
  },
  signOut: function() {
    var saved = _loadTeacherSession();
    if (saved && saved.access_token) ForgeAPI.auth.signOut(saved.access_token).catch(function() {});
    _clearTeacherSession();
    if (window.ForgeRole) ForgeRole.clear('teacher');
  },
  getSession: function() {
    var saved = _loadTeacherSession();
    if (!saved || !saved.access_token) return Promise.resolve(null);
    return ForgeAPI.auth.user(saved.access_token).then(function(user) {
      return { access_token: saved.access_token, user: user };
    }).catch(function(error) {
      if (error && error.status === 401 && saved.refresh_token) {
        return TeacherAuth.refreshSession(saved.refresh_token).then(function(data) {
          return { access_token: data.access_token, user: data.user };
        });
      }
      return null;
    });
  }
};

// The teacher app is a single page that swaps views, so the document title has
// to follow the view or it stays on "Teacher Sign In" for the whole session.
function setTeacherTitle(view) {
  document.title = 'Forge — ' + (view || 'Teacher');
}

function renderTeacherAuth(mode) {
  mode = mode || 'signin';
  if (!currentTeacher && window.ForgeSidebar && typeof ForgeSidebar.destroy === 'function') ForgeSidebar.destroy();
  setTeacherTitle('Teacher Sign In');
  var app = document.getElementById('app');
  var h = '';
  h += '<div class="login-tabs">';
  h += '<button type="button" class="login-tab' + (mode === 'signin' ? ' active' : '') + '" id="ta-signin-tab">Sign in</button>';
  h += '<button type="button" class="login-tab' + (mode === 'signup' ? ' active' : '') + '" id="ta-signup-tab">Create account</button>';
  h += '</div>';

  h += ForgeAuthCard.field('ta-email', 'Email address', {type:'email', placeholder:'you@school.sch.uk', autocomplete:'email'});
  h += ForgeAuthCard.field('ta-password', 'Password', {type:'password', placeholder:'Your password', autocomplete:mode === 'signup' ? 'new-password' : 'current-password'});
  if (mode === 'signup') {
    h += ForgeAuthCard.field('ta-invite', 'Invite code', {placeholder:'From your school'});
  }
  h += '<button class="auth-btn" id="ta-btn" type="submit">' + (mode === 'signup' ? 'Create account →' : 'Sign in →') + '</button>';
  h += '<p class="auth-err" id="ta-err"></p>';

  var authShell = ForgeAuthCard.shell({
    title: 'Teacher sign in',
    sub: mode === 'signup'
      ? 'Use the invite code from your school to create an account.'
      : 'Sign in to create classes and view your students’ dashboards.',
    foot: 'Forgot your password? <a href="reset-password.html">Reset it</a>'
  }, h);
  app.innerHTML = '<div class="teacher-entry">' +
    '<div class="teacher-entry-copy">' +
      '<span class="tag">For teachers</span>' +
      '<h1>Know what to teach next.</h1>' +
      '<p>Forge turns class responses into a practical view of what students understand, where misconceptions are forming, and which starter activity will help you address them.</p>' +
      '<ul>' +
        '<li><strong>Class creation and assignments</strong> for focused practice</li>' +
        '<li><strong>Misconception heatmaps</strong> and student drill-downs</li>' +

  document.getElementById('ta-btn').onclick = function() {
    var email = document.getElementById('ta-email').value.trim();
    var password = document.getElementById('ta-password').value;
    var err = document.getElementById('ta-err');
    var btn = document.getElementById('ta-btn');
    err.style.display = 'none';
    if (!email || !password) { err.textContent = 'Enter your email and password.'; err.style.display = 'block'; return; }

    btn.disabled = true; btn.textContent = 'Please wait...';

    function doAuth(invite) {
      var action = mode === 'signup' ? TeacherAuth.signUp(email, password) : TeacherAuth.signIn(email, password);
      action.then(function(data) {
        currentTeacher = data.user;
        headers.Authorization = 'Bearer ' + data.access_token;
        // The invite code is what binds this account to a school, and that
        // binding is made server-side. The check before doAuth() is only fast
        // feedback: anyone can reach /auth/v1/signup directly with the public
        // anon key, so an account that never claims an invite has to be inert
        // rather than merely un-nudged. claim_teacher_invite() is the only way
        // to get a teacher_profiles row, and without one the database refuses
        // to create a class and the school overview reports no_school.
        if (mode !== 'signup') return loadTeacherProfile();
        return ForgeAPI.rpc('claim_teacher_invite', { p_code: invite }, teacherApiOptions())
          .then(function(res) {
            if (!res || res.ok !== true) {
              var problem = new Error(res && res.reason === 'invalid_code'
                ? 'That invite code was not recognised. Check with your school.'
                : 'We couldn’t confirm your school invite. Try again.');
              problem.provisioning = true;
              throw problem;
            }
            teacherSchool = res.school || null;
          });
      }).then(function() {
        mountTeacherSidebar();
        if (window.forgeTrack) forgeTrack(mode === 'signup' ? 'teacher_account_created' : 'teacher_signed_in', { role: 'teacher' });
        if (new URLSearchParams(location.search).get('tab') === 'create') renderLogin('create');
        else renderTeacherHome();
      }).catch(function(e) {
        btn.disabled = false; btn.textContent = mode === 'signup' ? 'Create account →' : 'Sign in →';
        // A sign-up whose invite did not check out leaves an account that can
        // do nothing. Don't leave it signed in looking usable.
        if (e && e.provisioning) { TeacherAuth.signOut(); currentTeacher = null; headers.Authorization = 'Bearer ' + SUPABASE_KEY; }
        err.textContent = (e && e.provisioning && e.message) || 'We couldn’t sign you in. Check your details and try again.';
        err.style.display = 'block';
      });
    }

    if (mode === 'signup') {
      var invite = document.getElementById('ta-invite').value.trim();
      validateInviteCode(invite).then(function(ok) {
        if (!ok) {
          btn.disabled = false; btn.textContent = 'Create account →';
          err.textContent = 'Invite code not recognised. Check with your school.';
          err.style.display = 'block';
          return;
        }
        doAuth(invite);
      });
    } else {
      doAuth();
    }
  };
}

// Loads a given class's dashboard data and remembers it in the sidebar's class
// switcher, so switching back later doesn't need the code re-entered. Lives at
// the top level because the home screen and the sidebar both open classes
// without the code-entry form ever having been rendered.
window.loadClassDashboard = function(cls) {
        // A class can be opened from a previously scrolled classes page or
        // from the sidebar. Always start the dashboard at its header.
        window.scrollTo(0, 0);
        document.documentElement.scrollTop = 0;
        document.body.scrollTop = 0;
        setTeacherTitle(cls.name || 'Class dashboard');
        dashState.classId = cls.id;
        dashState.className = cls.name;
        dashState.classSubject = canonicalSubjectKey(cls.subject);
        dashState.classCode = cls.code || null;
        // The teacher dashboard is a single document with an in-page class
        // view. Give that view its own history entry so browser/native back
        // returns to the class list instead of the public launch screen.
        if (window.history && window.history.pushState) {
          window.history.pushState({ forgeView: 'teacher-class', classId: String(cls.id) }, '', window.location.href);
        }
        addJoinedClass(cls);
        Promise.all([
          supaGet('students', 'class_id=eq.' + cls.id),
          supaGet('assignments', 'class_id=eq.' + cls.id + '&order=due_date.asc')
        ]).then(function(results) {
          dashState.students = rowsOrEmpty(results[0]);
          dashState.assignments = rowsOrEmpty(results[1]);
          // Fetch responses by class_id AND by student_id list
          // This catches responses where class_id is null (student played before class was linked)
          var studentIds = dashState.students.map(function(s){ return s.id; });
          var studentNames = dashState.students.map(function(s){ return s.name; });
          var byClass = supaGet('responses', 'class_id=eq.' + cls.id + '&order=created_at.desc');
          var byStudents = studentIds.length > 0
            ? supaGet('responses', 'student_id=in.(' + studentIds.join(',') + ')&order=created_at.desc')
            : Promise.resolve([]);
          // Only read responses attached to this class or its student rows.
          // Never broaden the query by display name: a student may use the
          // same name in another class, and that class's history is private.
          Promise.all([byClass, byStudents]).then(function(rResults) {
            var classResponses = rowsOrEmpty(rResults[0]);
            var studentResponses = rowsOrEmpty(rResults[1]);
            var seen = {};
            var merged = [];
            classResponses.concat(studentResponses).forEach(function(r) {
              if (r && r.id && !seen[r.id]) { seen[r.id] = true; merged.push(r); }
            });
              // A student can play other subjects independently of this class —
              // don't let their unrelated misconceptions/weakest-topic data leak
              // into this class's dashboard. Keep rows with no subject recorded
              // (older data predating the subject field) rather than dropping them.
              dashState.responses = merged.filter(function(r) {
                // Anvil/Crucible rows carry their own subject ('anvil', 'crucible'),
                // so a strict r.subject match dropped every reforge before it
                // reached the dashboard — completed Anvil work simply vanished.
                // Resolve the real subject from the question instead of waving
                // all reforges through, which leaked other classes' subjects in.
                var rs = subjectForResponse(r);
                return !rs || rs === dashState.classSubject;
              });
              console.log('Dashboard loaded:', {
                classId: cls.id, classSubject: dashState.classSubject,
                students: dashState.students.length, responses: dashState.responses.length,
                byClass: classResponses.length, byStudents: studentResponses.length,
                extraIds: 0, extraResponses: 0
              });
              renderDashboard();
          });
        });
  };

      result.style.display = 'none';

      if (!teacherSchool) {
        err.textContent = 'This account isn’t linked to a school yet. Create it again using your school’s invite code, or ask your school for one.';
        err.style.display = 'block'; return;
      }
      if (!name) { err.textContent = 'Enter a class name.'; err.style.display = 'block'; return; }
      if (!teacher) { err.textContent = 'Enter your name.'; err.style.display = 'block'; return; }
      if (!subj) { err.textContent = 'Select a subject.'; err.style.display = 'block'; return; }

      createBtn.disabled = true; createBtn.textContent = 'Creating...';

      // Generate code: subject prefix + 4-char random alphanumeric
      var subjLabel = SUBJECT_OPTIONS.find(function(s) { return s.key === subj; });
      var prefix = (subjLabel ? subjLabel.label.split(' ').filter(function(w){return w.length>3;}).map(function(w){return w[0];}).join('').toUpperCase().slice(0,4) : subj.toUpperCase().slice(0,4));
      var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      var rand = '';
      for (var i = 0; i < 4; i++) rand += chars[Math.floor(Math.random() * chars.length)];
      var code = prefix + '-' + rand;

      // No school field is sent: a trigger fills school/school_key from the
      // teacher's invited school and rejects the insert if there isn't one, so
      // a class cannot be filed under a school the teacher merely names.
      supaInsert('classes', { name: name, subject: subj, code: code, teacher_name: teacher, teacher_user_id: currentTeacher ? currentTeacher.id : null }).then(function(rows) {
        createBtn.disabled = false; createBtn.textContent = 'Create class \u2192';
        var cls = Array.isArray(rows) ? rows[0] : rows;
        if (window.forgeTrack) forgeTrack('teacher_class_created', { subject: subj });
        if (!cls || !cls.id) {
          err.textContent = 'We couldn’t create the class. Check the details and try again.';
          err.style.display = 'block'; return;
        }
        var subjInfo = SUBJECT_OPTIONS.find(function(s) { return s.key === subj; });
        var createdClassId = cls.id;
        var createdClassName = name;

        window._openCreatedDash = function() {
          dashState.classId = createdClassId;
          dashState.className = createdClassName;
          dashState.classSubject = subj;
          dashState.classCode = code;
          dashState.students = [];
          dashState.responses = [];
          dashState.assignments = [];
          addJoinedClass({ id: createdClassId, name: createdClassName, subject: subj, code: code });
          Promise.all([
            supaGet('students', 'class_id=eq.' + createdClassId),
            supaGet('assignments', 'class_id=eq.' + createdClassId + '&order=due_date.asc')
          ]).then(function(results) {
            dashState.students = rowsOrEmpty(results[0]);
            dashState.assignments = rowsOrEmpty(results[1]);
            var studentIds = dashState.students.map(function(s){ return s.id; });
            var byClass = supaGet('responses', 'class_id=eq.' + createdClassId + '&order=created_at.desc');
            var byStudents = studentIds.length > 0
              ? supaGet('responses', 'student_id=in.(' + studentIds.join(',') + ')&order=created_at.desc')
              : Promise.resolve([]);
            Promise.all([byClass, byStudents]).then(function(rResults) {
              var classResponses = rowsOrEmpty(rResults[0]);
              var studentResponses = rowsOrEmpty(rResults[1]);
              var seen = {};
              var merged = [];
              classResponses.concat(studentResponses).forEach(function(r) {
                if (r && r.id && !seen[r.id]) { seen[r.id] = true; merged.push(r); }
              });
              // Same subject filter as the "view class" flow — see comment there.
              dashState.responses = merged.filter(function(r) {
                // Anvil/Crucible rows carry their own subject ('anvil', 'crucible'),
                // so a strict r.subject match dropped every reforge before it
                // reached the dashboard — completed Anvil work simply vanished.
                // Resolve the real subject from the question instead of waving
                // all reforges through, which leaked other classes' subjects in.
                var rs = subjectForResponse(r);
                return !rs || rs === dashState.classSubject;
              });
              renderDashboard();
            });
          });
        };

        var subjName = subjInfo ? subjInfo.label : subj;
        var shareText = 'Forge — ' + name + '\n'
          + 'Subject: ' + subjName + '\n'
          + 'Class code: ' + code + '\n\n'
          + 'How to join:\n'
          + '1. Go to https://forgelearning.github.io/edu/forge-quiz.html\n'
          + '2. Enter your name and the class code above\n'
          + '3. You\'ll be taken straight to ' + subjName + '\n\n'
          + 'Forge builds exam technique through targeted questions, misconception feedback, and timed pressure tests. Complete questions regularly — your teacher can see your progress on the dashboard.';

        var r = '<div class="code-display">';
        r += '<span class="code-sub">Class created \u2713</span>';
        r += '<span class="code-val">' + code + '</span>';
        r += '<span class="code-sub">' + name + ' \u00b7 ' + subjName + '</span>';
        r += '</div>';
        r += '<button type="button" class="copy-btn" id="copy-code-btn">\u2398 Copy code</button>';
        r += '<button type="button" class="copy-btn" id="share-edulink-btn">\uD83D\uDCCB Copy EduLink message</button>';
        r += '<button type="button" class="join-btn" data-forge-action="created-dashboard">Open dashboard \u2192</button>';
        result.innerHTML = r;
        result.style.display = 'block';
        result.insertAdjacentHTML('afterbegin', ForgeState.html('success', {
          label: 'Class created',
          body: 'Your class code is ready to share with students.'
        }));

        // Remove the newly created subject from the dropdown
        var sel = document.getElementById('c-subj');
        if (sel) {
          var usedOpt = sel.querySelector('option[value="' + subj + '"]');
          if (usedOpt) {
            usedOpt.value = '';
            usedOpt.disabled = true;
            usedOpt.textContent = subjName + ' — already created';
          }
          sel.value = '';
        }

        document.getElementById('copy-code-btn').onclick = function() {
          navigator.clipboard.writeText(code).then(function() {
            document.getElementById('copy-code-btn').textContent = '\u2713 Copied!';
            setTimeout(function() {
              var b = document.getElementById('copy-code-btn');
              if (b) b.textContent = '\u2398 Copy code';
            }, 2000);
          });
        };

        document.getElementById('share-edulink-btn').onclick = function() {
          navigator.clipboard.writeText(shareText).then(function() {
            document.getElementById('share-edulink-btn').textContent = '\u2713 Message copied — paste into EduLink!';
            setTimeout(function() {
              var b = document.getElementById('share-edulink-btn');
              if (b) b.textContent = '\uD83D\uDCCB Copy EduLink message';
            }, 3000);
          });
        };
      }).catch(function(e) {
        createBtn.disabled = false; createBtn.textContent = 'Create class \u2192';
        // The database refuses a class from an account with no school invite.
        // Say so plainly rather than blaming the connection.
        var unprovisioned = e && (e.message === 'teacher_not_provisioned' ||
          (e.body && e.body.message === 'teacher_not_provisioned'));
        err.textContent = unprovisioned
          ? 'This account isn’t linked to a school yet. Ask your school for an invite code and create your account with it.'
          : 'We couldn’t create the class. Check your connection and try again.';
        err.style.display = 'block';
      });
    };
  }
}

// Students can sit in several classes, so dashState.responses holds rows from
// every subject they've answered. Every view must narrow to the class's own
// subject first, or e.g. a Computing class shows Economics spec points.
function forClassSubject(rows) {
  if (!dashState.classSubject) return rows;
  return rows.filter(function(r) {
    var cs = dashState.classSubject;
    // Not r.subject: Anvil reforges log 'anvil' there, and blanket-including
    // every reforge row pulled other classes' subjects onto this dashboard.
    var rs = subjectForResponse(r);
    var engMatch = (cs === 'englit' || cs === 'engll') && (rs === 'englit' || rs === 'engll');
    // Rows whose subject can't be established (older data predating the subject
    // field) are kept rather than dropped.
    return rs === cs || engMatch || !rs;
  });
}

function renderDashboard() {
  // Filter responses to this class's subject only
  var allResponses = dashState.responses;
  var responses = forClassSubject(allResponses);
  var students = dashState.students;
  var studentMap = {};
  students.forEach(function(s) { studentMap[s.id] = s.name; });

  // Stats
  var totalQs = responses.length;
  var correct = responses.filter(function(r) { return r.is_correct; }).length;
  var accuracy = totalQs > 0 ? Math.round((correct / totalQs) * 100) : 0;
  var wrongResponses = responses.filter(function(r) { return !r.is_correct && r.misconception_tag; });
  var uniqueMCs = {};
  wrongResponses.forEach(function(r) { uniqueMCs[r.misconception_tag] = true; });
  var reforgeAttempts = responses.filter(function(r) { return r.reforge_attempted; });
  var reforgeCorrect = reforgeAttempts.filter(function(r) { return r.reforge_correct; });
  forgeSyncTeacherWidgetData({
    classId: String(dashState.classId || ''),
    className: String(dashState.className || ''),
    accuracy: accuracy,
    openSignals: Object.keys(uniqueMCs).length,
    students: students.length,
    responses: totalQs,
    secondary: wrongResponses.length ? 'Open priority signals' : 'No open priority signals'
  });
  var attention={};
  wrongResponses.forEach(function(r){attention[r.student_id]=(attention[r.student_id]||0)+1;});
  var attentionRows=Object.keys(attention).map(function(id){return {id:id,name:(studentMap[id]||'Student'),count:attention[id]};}).sort(function(a,b){return b.count-a.count;}).slice(0,5);

  var h = '<div class="dash-header">';
  h += '<div><p class="tag forge-u-l8gta7">Teacher Dashboard</p>';
  h += '<h1>' + dashState.className;
  if (dashState.classCode) {
    h += ' <button type="button" class="class-code-pill" id="class-code-pill" data-forge-action="copy-class-code" title="Copy class code">' + dashState.classCode + ' ⎘</button>';
  }
  h += '</h1><button type="button" class="forge-button forge-button--secondary" id="generate-student-codes">Generate student codes</button><button type="button" class="forge-button forge-button--secondary" id="migrate-existing-students">Migrate existing students</button><button type="button" class="forge-button forge-button--secondary forge-button--danger" id="delete-class">Delete class</button></div>';
  h += '<div id="student-codes-panel" hidden></div>';
  h += '<div id="delete-class-panel" hidden></div>';
  h += '<div class="dash-header-actions"><a class="dash-primary forge-button forge-button--primary" href="#" id="dash-action">' + (wrongResponses.length ? 'Open misconceptions \u2192' : 'Create assignment \u2192') + '</a><div class="dash-meta"><b>' + students.length + '</b> student' + (students.length !== 1 ? 's' : '') + ' \u00b7 <b>' + totalQs + '</b> response' + (totalQs !== 1 ? 's' : '') + ' \u00b7 <button type="button" class="back-btn forge-u-gr3ipb" data-forge-action="render-teacher-home">\u2190 All classes</button></div></div>';
  h += '</div>';

  // Stats row
  h += '<p class="forge-u-scng4v">Start with the priority below, then use the secondary views when you need detail.</p>';
  h += '<div class="stat-row stat-row--priority">';
  var accuracyClass = totalQs === 0 ? 'stat-n-muted' : accuracy >= 70 ? 'stat-n-good' : accuracy >= 50 ? 'stat-n-hot' : 'stat-n-bad';
  h += '<div class="stat stat--priority" title="Correct answers divided by answered questions"><span class="stat-n ' + accuracyClass + '">' + (totalQs === 0 ? '—' : accuracy + '%') + '</span><span class="stat-l">Class accuracy</span></div>';
  h += '<div class="stat stat--priority"><span class="stat-n stat-n-hot">' + Object.keys(uniqueMCs).length + '</span><span class="stat-l">Open misconception signals</span></div>';
  h += '</div>';
  h += '<div class="stat-support"><span>' + students.length + ' student' + (students.length !== 1 ? 's' : '') + '</span><span>' + totalQs + ' answer' + (totalQs !== 1 ? 's' : '') + '</span><span>' + reforgeCorrect.length + '/' + reforgeAttempts.length + ' reforges passed</span></div>';
  h += '<section class="ui-recommendation" aria-labelledby="teacher-next-action-title">';
  h += '<p class="ui-recommendation__eyebrow">Next best action</p>';
  h += '<h2 class="ui-recommendation__title" id="teacher-next-action-title">' + (wrongResponses.length ? 'Address the strongest misconception signal' : 'Create the first focused assignment') + '</h2>';
  h += '<p class="ui-recommendation__copy">' + (wrongResponses.length ? 'Start with the students and misconception volume shown below, then use the secondary views only when you need supporting detail.' : 'There is not enough response data for a reliable intervention yet. Set a short assignment to establish the first signal.') + '</p>';
  h += '<a class="ui-state-action" href="#panel-' + (wrongResponses.length ? 'heatmap' : 'assignments') + '" data-forge-action="next-action">' + (wrongResponses.length ? 'Open priority signals' : 'Open assignments') + '</a>';
  h += '</section>';
  h += '<div class="forge-card forge-card--focus forge-u-p7nziw"><div class="card-title">Needs attention today <span class="forge-meta">top misconception volume</span></div>';
  if(attentionRows.length){
    h += '<div class="forge-action-row forge-u-11yg588">';
    attentionRows.slice(0,3).forEach(function(row,i){h += '<button type="button" class="forge-button forge-button--'+(i===0?'primary':'secondary')+' forge-u-1l0ycxr" data-forge-action="render-student" data-student-id="'+row.id+'"><span>'+(i===0?'Start with ':'')+teacherEsc(row.name)+'</span><span class="forge-meta">'+row.count+' open</span></button>';});
    h += '</div><p class="forge-u-8g5nnq">The first student is the recommended starting point; open their profile to choose an intervention.</p>';
  } else h += '<p class="ui-meta-muted">No active misconception signals yet. Keep collecting responses.</p>';
  h += '</div>';

  // Tabs
  h += '<div class="tabs" role="tablist" aria-label="Teacher dashboard views">';
  h += '<button type="button" class="tab active" data-view="heatmap" data-forge-action="switch-tab" data-tab="heatmap">Priority signals</button>';
  h += '<button type="button" class="tab" data-view="class" data-forge-action="switch-tab" data-tab="class">Class overview</button>';
  h += '<button type="button" class="tab" data-view="spec" data-forge-action="switch-tab" data-tab="spec">Spec points</button>';
  h += '<button type="button" class="tab" data-view="assignments" data-forge-action="switch-tab" data-tab="assignments">Assignments</button>';
  h += '<button type="button" class="tab" data-view="starters" data-forge-action="switch-tab" data-tab="starters">Corrective starters</button>';
  h += '</div>';

  h += '<div class="panel active" id="panel-heatmap"></div>';
  h += '<div class="panel" id="panel-class"></div>';
  h += '<div class="panel" id="panel-spec"></div>';
  h += '<div class="panel" id="panel-assignments"></div>';
  h += '<div class="panel" id="panel-starters"></div>';
  h += '<div class="forge-u-uydnfn" id="panel-student"></div>';

  app.innerHTML = h;
  /* Generating codes deliberately avoids window.prompt/alert and a
     download-only result, for two reasons.

     First, native dialogs are unreliable in the Capacitor shells this repo
     builds — the same reason delete-class below uses an in-page confirmation.
     window.prompt() throws outright in some embedded webviews ("prompt() is
     not supported"), which took this button out entirely.

     Second, the server returns each code exactly once and stores only its
     SHA-256 hash. If the CSV download is blocked, those codes are gone for
     good and the class has to be re-issued. So the codes are shown on screen,
     copyable, and the CSV is offered as well rather than instead. */
  var generateCodesBtn = document.getElementById('generate-student-codes');
  var codesPanel = document.getElementById('student-codes-panel');

  function closeCodesPanel() {
    if (!codesPanel) return;
    codesPanel.hidden = true;
    codesPanel.innerHTML = '';
  }

  function codesCsv(rows, withNames) {
    var header = withNames ? 'Student Code,Name,Class Code\n' : 'Student Code,Name,Class Code\n';
    return header + rows.map(function (row) {
      return [row.student_code, withNames ? (row.student_name || '') : '', row.class_code]
        .map(function (v) { return '"' + String(v || '').replace(/"/g, '""') + '"'; }).join(',');
    }).join('\n') + '\n';
  }

  function offerCsv(rows, filenamePrefix, withNames) {
    var blob = new Blob([codesCsv(rows, withNames)], { type: 'text/csv;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var link = document.createElement('a');
    link.href = url;
    link.download = filenamePrefix + '-' + dashState.classCode + '.csv';
    link.click();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function renderCodes(rows, opts) {
    opts = opts || {};
    if (!codesPanel) return;
    var withNames = !!opts.withNames;
    var h = '<div class="card codes-card">';
    h += '<h3>' + rows.length + ' student code' + (rows.length !== 1 ? 's' : '') + ' for ' + teacherEsc(dashState.className || 'this class') + '</h3>';
    h += '<p>Each code works once, for one student. <b>They are shown here only now</b> — the server keeps a hash, not the code, so save them before you close this.</p>';
    h += '<ol class="codes-list">';
    rows.forEach(function (row) {
      h += '<li>' + (withNames ? '<span class="codes-name">' + teacherEsc(row.student_name || '') + '</span>' : '') +
           '<code>' + teacherEsc(row.student_code) + '</code></li>';
    });
    h += '</ol>';
    h += '<div class="forge-action-row">';
    h += '<button type="button" class="forge-button forge-button--primary" id="codes-copy">Copy all codes</button>';
    h += '<button type="button" class="forge-button forge-button--secondary" id="codes-csv">Download CSV</button>';
    h += '<button type="button" class="forge-button forge-button--secondary" id="codes-close">Done</button>';
    h += '</div><div id="codes-state"></div></div>';
    codesPanel.hidden = false;
    codesPanel.innerHTML = h;

    document.getElementById('codes-close').onclick = closeCodesPanel;
    document.getElementById('codes-csv').onclick = function () { offerCsv(rows, opts.filenamePrefix || 'forge-student-codes', withNames); };
    document.getElementById('codes-copy').onclick = function () {
      var text = rows.map(function (row) {
        return (withNames && row.student_name ? row.student_name + '\t' : '') + row.student_code + '\t' + row.class_code;
      }).join('\n');
      var button = document.getElementById('codes-copy');
      navigator.clipboard.writeText(text).then(function () {
        button.textContent = '✓ Copied';
        setTimeout(function () { button.textContent = 'Copy all codes'; }, 2000);
      }).catch(function () {
        teacherInlineState(document.getElementById('codes-state'), 'error', {
          label: 'Couldn’t copy',
          body: 'Select the codes above and copy them manually, or download the CSV.'
        });
      });
    };
  }

  if (generateCodesBtn && codesPanel) generateCodesBtn.onclick = function () {
    if (!codesPanel.hidden) { closeCodesPanel(); return; }
    codesPanel.hidden = false;
    codesPanel.innerHTML =
      '<div class="card codes-card">'
      + '<h3>Generate student codes</h3>'
      + '<p>One private code per student. Give each student one code — it is how Forge tells them apart.</p>'
      + '<label class="auth-label" for="codes-qty">How many?</label>'
      + '<input type="number" id="codes-qty" min="1" max="200" step="1" value="25" inputmode="numeric">'
      + '<div class="forge-action-row">'
      + '<button type="button" class="forge-button forge-button--secondary" id="codes-cancel">Cancel</button>'
      + '<button type="button" class="forge-button forge-button--primary" id="codes-go">Generate</button>'
      + '</div><div id="codes-state"></div></div>';

    document.getElementById('codes-cancel').onclick = closeCodesPanel;
    document.getElementById('codes-go').onclick = function () {
      var stateHost = document.getElementById('codes-state');
      var goBtn = document.getElementById('codes-go');
      var quantity = parseInt(document.getElementById('codes-qty').value, 10);
      stateHost.innerHTML = '';
      if (!Number.isInteger(quantity) || quantity < 1 || quantity > 200) {
        teacherInlineState(stateHost, 'error', { label: 'Enter a number from 1 to 200', body: 'One code per student in the class.' });
        return;
      }
      goBtn.disabled = true; goBtn.textContent = 'Generating…';
      ForgeAPI.rpc('generate_student_access_codes', { p_class_id: dashState.classId, p_quantity: quantity }, teacherApiOptions())
        .then(function (rows) {
          if (!Array.isArray(rows) || rows.length !== quantity) throw new Error('The server did not return the requested number of codes.');
          renderCodes(rows, { filenamePrefix: 'forge-student-codes' });
        })
        .catch(function (error) {
          goBtn.disabled = false; goBtn.textContent = 'Generate';
          stateHost.innerHTML = '';
          teacherInlineState(stateHost, 'error', {
            label: 'Codes weren’t generated',
            body: (error && error.message) || 'Check your connection and try again.'
          });
        });
    };
  };
  /* Deleting a class cascades to its students, access codes, assignments and
     every response they hold (see 20260810130000_cascade_class_cleanup.sql), so
     it asks the teacher to type the class code rather than accepting a single
     click. Deliberately not window.confirm: native dialogs are unreliable in
     the Capacitor shells this repo builds. */
  var deleteClassBtn = document.getElementById('delete-class');
  var deletePanel = document.getElementById('delete-class-panel');
  if (deleteClassBtn && deletePanel) deleteClassBtn.onclick = function () {
    if (!deletePanel.hidden) { deletePanel.hidden = true; deletePanel.innerHTML = ''; return; }
    deletePanel.hidden = false;
    deletePanel.innerHTML =
      '<div class="card danger-zone">'
      + '<h3>Delete ' + teacherEsc(dashState.className || 'this class') + '?</h3>'
      + '<p>This removes the class, its <b>' + students.length + '</b> student' + (students.length !== 1 ? 's' : '')
      + '</b>, their access codes, its assignments and all <b>' + totalQs + '</b> recorded answer' + (totalQs !== 1 ? 's' : '')
      + '. It cannot be undone.</p>'
      + '<p>Type <code>' + teacherEsc(dashState.classCode || '') + '</code> to confirm.</p>'
      + '<input type="text" id="delete-class-confirm" autocomplete="off" spellcheck="false" aria-label="Type the class code to confirm deletion">'
      + '<div class="forge-action-row">'
      + '<button type="button" class="forge-button forge-button--secondary" id="delete-class-cancel">Cancel</button>'
      + '<button type="button" class="forge-button forge-button--danger" id="delete-class-confirm-btn" disabled>Delete permanently</button>'
      + '</div><div id="delete-class-state"></div></div>';

    var input = document.getElementById('delete-class-confirm');
    var confirmBtn = document.getElementById('delete-class-confirm-btn');
    var stateHost = document.getElementById('delete-class-state');
    input.oninput = function () {
      confirmBtn.disabled = input.value.trim().toUpperCase() !== String(dashState.classCode || '').toUpperCase();
    };
    document.getElementById('delete-class-cancel').onclick = function () { deletePanel.hidden = true; deletePanel.innerHTML = ''; };
    confirmBtn.onclick = function () {
      confirmBtn.disabled = true; confirmBtn.textContent = 'Deleting…';
      var deletedId = dashState.classId;
      // supaDelete now rejects when the delete matched no rows, so an
      // RLS-filtered no-op can no longer be reported as success.
      supaDelete('classes', deletedId).then(function () {
        var kept = getJoinedClasses().filter(function (c) { return String(c.id) !== String(deletedId); });
        try { localStorage.setItem(_joinedClassesKey(), JSON.stringify(kept)); } catch (e) {}
        dashState.classId = null;
        if (window.ForgeSidebar) { ForgeSidebar.setClassLabel('No class open'); ForgeSidebar.setClassList(kept, null); }
        renderTeacherHome();
      }).catch(function (error) {
        confirmBtn.disabled = false; confirmBtn.textContent = 'Delete permanently';
        stateHost.innerHTML = ''; // teacherInlineState appends; don't stack retries
        teacherInlineState(stateHost, 'error', {
          label: 'Class wasn’t deleted',
          body: error && error.code === 'DELETE_NO_ROWS'
            ? 'You can only delete classes you created. Ask whoever set this class up to remove it.'
            : 'Check your connection and try again.'
        });
      });
    };
  };

  /* Same story as generating codes: no native dialogs, and the codes are put
     on screen rather than only into a download the webview may refuse. This
     one matters more — it is the migration off the legacy name-only join, so
     losing its output means the class cannot move over. */
  var migrateBtn = document.getElementById('migrate-existing-students');
  if (migrateBtn && codesPanel) migrateBtn.onclick = function () {
    if (!codesPanel.hidden) { closeCodesPanel(); return; }
    codesPanel.hidden = false;
    codesPanel.innerHTML =
      '<div class="card codes-card">'
      + '<h3>Give existing students private codes?</h3>'
      + '<p>Every student already in ' + teacherEsc(dashState.className || 'this class') + ' gets one private code. '
      + 'Their student records and answer history are kept exactly as they are — only how they sign in changes.</p>'
      + '<div class="forge-action-row">'

// Question id → spec point. Correct answers carry no misconception tag, so the
// MC_TO_SPEC lookup alone only ever matched wrong answers — which made every
// spec point read 0%. Resolve the spec from the question itself instead.
var QID_TO_SPEC = (function() {
  var map = {};
  if (typeof BANKS === 'undefined') return map;
  Object.keys(BANKS).forEach(function(bk) {
    (BANKS[bk].questions || []).forEach(function(q) {
      var sp = q.spec || MC_TO_SPEC[q.tag] || null;
      if (sp) map[q.id] = sp;
    });
  });
  return map;
})();

// Anvil/Crucible/reforge rows suffix the original question id, and they stack:
// a reforge of a reforge is logged as GRO-01-RF-ANVIL. Strip every suffix, not
// just the last one, or the id never matches its question.
function baseQuestionId(qid) {
  if (!qid) return '';
  var out = qid, prev;
  do { prev = out; out = out.replace(/-(RF|ANVIL|CRU\d*)$/, ''); } while (out !== prev);
  return out;
}

// Question id → subject key. The Anvil logs subject:'anvil' (the source page,
// not the subject), so an Economics reforge is indistinguishable from a
// Computing one by its subject column alone. The question id still identifies
// the bank it came from, and the bank belongs to exactly one subject.
var QID_TO_SUBJECT = (function() {
  var map = {};
  if (typeof BANKS === 'undefined' || typeof SUBJECTS === 'undefined') return map;
  Object.keys(SUBJECTS).forEach(function(sk) {
    (SUBJECTS[sk].banks || []).forEach(function(bk) {
      if (!BANKS[bk]) return;
      (BANKS[bk].questions || []).forEach(function(q) { map[q.id] = sk; });
    });
  });
  return map;
})();

// Misconception tag → subject, as a second route home: an Anvil row's `bank` is
// the tag it was forged from, so a tag identifies the subject even when the
// question id doesn't resolve.
var MC_TO_SUBJECT = (function() {
  var map = {};
  if (typeof BANKS === 'undefined' || typeof SUBJECTS === 'undefined') return map;
  Object.keys(SUBJECTS).forEach(function(sk) {
    (SUBJECTS[sk].banks || []).forEach(function(bk) {
      if (!BANKS[bk]) return;
      // A few questions carry an array of tags; map each element, or the key
      // becomes a stringified array and every real tag on it goes unmapped.
      (BANKS[bk].questions || []).forEach(function(q) {
        if (!q.tag) return;
        var tags = Array.isArray(q.tag) ? q.tag : [q.tag];
        tags.forEach(function(t) { if (t) map[t] = sk; });
      });
    });
  });
  return map;
})();

// The real subject a response belongs to, seeing through the 'anvil'/'crucible'
// placeholders. Returns null when it can't be established.
function subjectForResponse(r) {
  var rs = canonicalSubjectKey(r.subject);
  if (rs) return rs;
  return QID_TO_SUBJECT[baseQuestionId(r.question_id)]
      || MC_TO_SUBJECT[r.misconception_tag]
      || MC_TO_SUBJECT[r.bank]
      || null;
}

// Older response rows used display names or alternate spellings (for example
// "Economics" / "economics") while current rows use canonical keys ("econ").
// Normalising at the boundary keeps the class-subject safety filter from
// hiding valid historical responses.
function canonicalSubjectKey(value) {
  if (!value || value === 'anvil' || value === 'crucible' || value === 'unknown') return null;
  var raw = String(value).trim().toLowerCase();
  if (typeof SUBJECTS !== 'undefined' && SUBJECTS[raw]) return raw;
  if (typeof SUBJECTS !== 'undefined') {
    var keys = Object.keys(SUBJECTS);
    for (var i = 0; i < keys.length; i++) {
      var subject = SUBJECTS[keys[i]] || {};
      var label = String(subject.label || '').trim().toLowerCase();
      if (label && (raw === label || raw === label.replace(/\s+/g, '-'))) return keys[i];
    }
  }
  var aliases = {
    economics: 'econ', economy: 'econ', psychology: 'psych', sociology: 'soc',
    geography: 'geo', business: 'bus', chemistry: 'chem', criminology: 'crim',
    biology: 'bio', history: 'hist', physics: 'phys', politics: 'pol',
    computing: 'cs', 'computer science': 'cs', mathematics: 'maths', spanish: 'spanish'
  };
  return aliases[raw] || raw;
}

function specForResponse(r) {
  return r.spec_point || QID_TO_SPEC[baseQuestionId(r.question_id)] || MC_TO_SPEC[r.misconception_tag] || null;
}

function renderSpecBreakdown(responses) {
  var el = document.getElementById('panel-spec');
  if (!el) return;
  if (!responses || responses.length === 0) {
    el.innerHTML = ForgeState.html('empty', { label: 'No spec point data yet', body: 'Students need to answer questions before this view can show patterns.' });
    return;
  }

  // Build spec point data
  var specData = {};
  responses.forEach(function(r) {
    var sp = specForResponse(r);
    if (!sp || sp === 'TECH') return;
    if (!specData[sp]) specData[sp] = { total: 0, correct: 0, students: {}, subjects: {} };
    specData[sp].total++;
    if (r.is_correct) specData[sp].correct++;
    if (r.student_id) specData[sp].students[r.student_id] = true;
    var responseSubject = subjectForResponse(r);
    if (responseSubject) specData[sp].subjects[responseSubject] = true;
  });

  var specKeys = Object.keys(specData).sort();
  if (specKeys.length === 0) {
    el.innerHTML = ForgeState.html('empty', { label: 'No spec point data yet', body: 'Spec point tracking will appear after questions are answered under the latest update.' });
    return;
  }

  // Sort by accuracy ascending (weakest first)
  specKeys.sort(function(a, b) {
    var accA = specData[a].correct / specData[a].total;
    var accB = specData[b].correct / specData[b].total;
    return accA - accB;
  });

  var h = '<div class="card-title forge-mb-4">Spec Point Accuracy — weakest first</div>';
  h += '<p class="forge-u-12m5q32">Only spec points with logged responses are shown. Questions answered before the latest update will not appear here.</p>';
  h += '<table class="forge-u-k85mqv">';
  h += '<thead><tr class="forge-u-yzojjb">';
  h += '<th class="forge-u-qvnuss">Spec point</th><th>Subject</th><th>Questions</th><th>Students</th><th>Accuracy</th><th class="forge-u-naz5e1">Bar</th>';
  h += '</tr></thead><tbody>';

  specKeys.forEach(function(sp) {
    var d = specData[sp];
    var acc = Math.round((d.correct / d.total) * 100);
    var studentCount = Object.keys(d.students).length;
    var col = acc >= 70 ? 'var(--good)' : acc >= 50 ? 'var(--hot)' : 'var(--bad)';
    h += '<tr class="forge-u-1jhoksp">';
    h += '<td class="forge-u-yj4cup">' + sp + '</td>';
    var subjectKeys = Object.keys(d.subjects || {});
    var subjectLabels = subjectKeys.map(function (key) {
      return SPEC_TO_SUBJECT[key] || (typeof SUBJECTS !== 'undefined' && SUBJECTS[key] ? SUBJECTS[key].label : key);
    });
    var specSubject = subjectLabels.length ? subjectLabels.join(' · ') : (SPEC_TO_SUBJECT[sp] || (/^(ECON|ECON-)/i.test(sp) ? 'A Level Economics' : 'Subject not mapped'));
    h += '<td class="forge-u-16oyzks">' + specSubject + '</td>';
    h += '<td class="forge-u-19j2vc3">' + d.total + '</td>';
    h += '<td class="forge-u-19j2vc3">' + studentCount + '</td>';
    h += '<td style="font-weight:700;color:' + col + '">' + acc + '%</td>';
    h += '<td><div class="forge-u-1lpc5ot"><div style="background:' + col + ';border-radius:var(--radius-xs);height:8px;width:' + acc + '%"></div></div></td>';
    h += '</tr>';
  });
  h += '</tbody></table>';
  el.innerHTML = h;
}

      h += '<option value="' + tag + '">' + tag + (resolveMCLabel(tag) ? ' — ' + resolveMCLabel(tag) : '') + '</option>';
    });

  });

  h += '</select></div>';

// ===== ASSIGNMENTS =====

// Bank label lookup — derived from the shared BANKS data (data/forge-data.js).
var BANK_LABELS = {};
Object.keys(BANKS).forEach(function(key) { BANK_LABELS[key] = BANKS[key].label; });
// Subject → banks map — derived from the shared SUBJECTS data (data/forge-data.js).
var SUBJECT_BANKS = {};
Object.keys(SUBJECTS).forEach(function(key) { SUBJECT_BANKS[key] = SUBJECTS[key].banks; });

function dueBadge(dateStr) {
  if (!dateStr) return '';
  var due = new Date(dateStr);
  var now = new Date();
  var diff = Math.ceil((due - now) / (1000 * 60 * 60 * 24));
  if (diff < 0) return '<span class="assign-due overdue">Overdue by ' + Math.abs(diff) + 'd</span>';
  if (diff <= 3) return '<span class="assign-due soon">Due in ' + diff + 'd</span>';
  return '<span class="assign-due ok">Due ' + due.toLocaleDateString('en-GB', {day:'numeric',month:'short'}) + '</span>';
}

function teacherEsc(value) { return window.ForgeTeacherUI.escape(value); }

function assignmentBanks(asgn) {
  try { return Array.isArray(asgn.banks) ? asgn.banks : (asgn.banks ? JSON.parse(asgn.banks) : []); }
  catch (e) { return []; }
}

function assignmentQuestionTotal(banks) {
  return banks.reduce(function(total, bank) {
    var data = BANKS[bank];
    if (!data || !Array.isArray(data.questions)) return total;
    var available = data.questions.filter(function(q) { return !q.type || q.type === 'fill_blank'; }).length;
    return total + Math.min(8, available);
  }, 0);
}

/* Delegates to ForgeAssignmentProgress so the teacher and the student compute
   attainment from the same rule. This function used to implement its own —
   strict bank match (excluding Anvil/Crucible rows the student's version
   included) and first-seen dedup over rows sorted newest-first (the student's
   arrived in RPC order). Same data, different answers: student 0%, teacher 38%,
   quiz evidence 31%. Only the shape of the returned object is local. */
function assignmentStudentProgress(asgn, studentId, responses) {
  var banks = assignmentBanks(asgn);
  var mine = responses.filter(function(r) { return r && r.student_id === studentId; });
  var shared = ForgeAssignmentProgress.progress(asgn, mine);
  var answered = shared.answered, correct = shared.correct;
  var total = assignmentQuestionTotal(banks);
  var sessionTotal = Math.max(1, Math.ceil(total / 8));
  return {
    total: total,
    sessions: sessionTotal,
    answered: answered,
    correct: correct,
    accuracy: answered ? Math.round((correct / answered) * 100) : null,
    completed: total > 0 && answered >= total,
    started: answered > 0
  };
}

function renderAssignCard(asgn, students, responses, isArchived) {
  var banks = assignmentBanks(asgn);
  var bankLabels = banks.map(function(b) { return BANK_LABELS[b] || b; }).join(', ');
  var progress = {};
  students.forEach(function(s) { progress[s.id] = assignmentStudentProgress(asgn, s.id, responses); });
  var completedCount = students.filter(function(s) { return progress[s.id].completed; }).length;
  var startedCount = students.filter(function(s) { return progress[s.id].started; }).length;
  var inProgressCount = students.filter(function(s) { return progress[s.id].started && !progress[s.id].completed; }).length;
  var notStartedCount = students.length - startedCount;
  var assignmentAnswered = students.reduce(function(n, s) { return n + progress[s.id].answered; }, 0);
  var assignmentCorrect = students.reduce(function(n, s) { return n + progress[s.id].correct; }, 0);
  var assignmentAccuracy = assignmentAnswered ? Math.round((assignmentCorrect / assignmentAnswered) * 100) : null;
  var total = students.length;
  var pct = total > 0 ? Math.round((completedCount / total) * 100) : 0;

  var h = '<div class="assign-card' + (isArchived ? ' archived' : '') + '" data-asgn-id="' + asgn.id + '">';
  h += '<div class="assign-card-title">' + teacherEsc(asgn.title) + '</div>';
  h += '<div class="assign-meta">' + teacherEsc(bankLabels) + '</div>';
  if (!isArchived) {
    h += '<div class="assign-progress-row">';
    h += '<div class="assign-progress forge-progress" role="progressbar" aria-label="Assignment completion" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '"><span style="width:' + pct + '%"></span></div>';
    h += '<span class="forge-u-tb67f">' + completedCount + '/' + total + ' completed</span>';
    h += dueBadge(asgn.due_date);
    h += '</div>';
    h += '<div class="assign-summary" aria-label="Assignment progress">';
    h += '<span>' + startedCount + ' started</span><span>' + inProgressCount + ' in progress</span><span>' + notStartedCount + ' not started</span>';
    h += '<span>' + (assignmentAccuracy == null ? '—' : assignmentAccuracy + '%') + ' accuracy</span><span>' + (assignmentAnswered ? Math.ceil(assignmentAnswered / 8) : 0) + '/' + Math.ceil((students.length * (assignmentQuestionTotal(banks) || 1)) / 8) + ' sessions logged</span></div>';
    if (students.length > 0) {
      h += '<div class="forge-u-jm24uy">';
      students.forEach(function(s) {
        var ps = progress[s.id];
        var status = ps.completed ? 'Completed' : ps.started ? 'In progress' : 'Not started';
        var statusColor = ps.completed ? 'var(--good)' : ps.started ? 'var(--hot)' : '#8A857E';
        h += '<div class="student-assign-row">';
        h += '<span style="color:' + statusColor + ';font-size:14px">' + (ps.completed ? '✓' : ps.started ? '◐' : '○') + '</span>';
        h += '<span class="forge-u-b5x4dy">' + teacherEsc(s.display_name || s.name) + '</span>';
        h += '<span style="font-family:\'JetBrains Mono\',monospace;font-size:11px;color:' + statusColor + '">' + status + (ps.answered ? ' · ' + ps.answered + '/' + ps.total + (ps.accuracy == null ? '' : ' · ' + ps.accuracy + '% score') + ' · ' + Math.ceil(ps.answered / 8) + '/' + ps.sessions + ' sessions' : '') + '</span>';
        h += '</div>';
      });
      h += '</div>';
    }
  }
  // Action buttons
  h += '<div class="asgn-actions">';
  if (isArchived) {
    h += '<button type="button" class="asgn-action-btn" data-action="unarchive" data-id="' + asgn.id + '">Restore</button>';
  } else {
    h += '<button type="button" class="asgn-action-btn" data-action="archive" data-id="' + asgn.id + '">Archive</button>';
  }
  h += '<button type="button" class="asgn-action-btn danger" data-action="delete" data-id="' + asgn.id + '">Delete</button>';
  h += '</div>';
  h += '</div>';
  return h;
}

function renderHeatmap(wrongResponses) {
  var el = document.getElementById('panel-heatmap');
  if (wrongResponses.length === 0) {
    renderBrowseStarters();
    return;
  }

  // Count by misconception tag
  var counts = {};
  wrongResponses.forEach(function(r) {
    var tag = r.misconception_tag;
    if (!counts[tag]) counts[tag] = { count: 0, banks: {}, students: {} };
    counts[tag].count++;
    counts[tag].banks[r.bank] = true;
    counts[tag].students[r.student_id] = true;
  });

  // Sort by count descending
  var sorted = Object.keys(counts).sort(function(a, b) { return counts[b].count - counts[a].count; });
  var maxCount = counts[sorted[0]].count;

  var h = '<div class="card forge-card"><div class="card-title">Misconceptions ranked by frequency</div>';
  sorted.forEach(function(tag) {
    var c = counts[tag];
    var pct = Math.round((c.count / maxCount) * 100);
    var level = pct > 60 ? 'high' : pct > 30 ? 'med' : '';
    // Tags without a human label fall back to showing the code once, not twice.
    var label = resolveMCLabel(tag) || '';
    var banks = Object.keys(c.banks).join(', ');
    var studentCount = Object.keys(c.students).length;

    h += '<div class="heat-row ' + level + '">';
    h += '<span class="heat-tag">' + tag + '</span>';
    if (label) h += '<span class="heat-label">' + label + '</span>';
    h += '<span class="heat-spec">' + banks + '</span>';
    h += '<div class="heat-bar"><div class="heat-fill" style="width:' + pct + '%"></div></div>';
    h += '<span class="heat-count">' + c.count + ' error' + (c.count !== 1 ? 's' : '') + ' \u00b7 ' + studentCount + ' student' + (studentCount !== 1 ? 's' : '') + '</span>';
    h += '<a class="heat-action" href="#" data-starter-tag="' + teacherEsc(tag) + '">Starter \u2192</a>';
    h += '</div>';
  });
  h += '</div>';

  el.innerHTML = h;
}

      var tag = this.value;
      var slot = document.getElementById('browse-starter-slot');
      if (!tag) { slot.innerHTML = ''; return; }
      var out = ''; out = renderStarterCard(tag, out, null); slot.innerHTML = out;
    });
    return;
  }

  // Count misconceptions
  var counts = {};
  wrongResponses.forEach(function(r) {
    var tag = r.misconception_tag;
    if (!counts[tag]) counts[tag] = { count: 0, students: {} };
    counts[tag].count++;
    counts[tag].students[r.student_id] = true;
  });
  var sorted = Object.keys(counts).sort(function(a,b) { return counts[b].count - counts[a].count; });

  var h = '';
  // Top starter
  var topTag = sorted[0];
  h = renderStarterCard(topTag, h, {fires: counts[topTag].count, students: Object.keys(counts[topTag].students).length});

  // Also firing chips
  var others = sorted.slice(1, 5);
  if (others.length > 0) {
    h += '<section class="card misconception-card" aria-labelledby="other-misconceptions-title">';
    h += '<div class="misconception-card__header"><div><div class="card-title">Next interventions</div><h2 id="other-misconceptions-title">Other misconceptions this period</h2></div><span class="misconception-card__hint">Choose one to preview</span></div>';
    h += '<div class="misconception-grid">';
    others.forEach(function(tag) {
      h += '<button type="button" class="misconception-chip" data-forge-action="show-starter" data-tag="' + teacherEsc(tag) + '"><span><strong>' + teacherEsc(tag) + '</strong><small>' + counts[tag].count + ' fires</small></span><span aria-hidden="true">→</span></button>';
    });
    h += '</div></section>';
  }

  el.innerHTML = h;
}

window.showStarterFor = function(tag) {
  var el = document.getElementById('panel-starters');
  if (!el) return;
  var out = ''; out = renderStarterCard(tag, out, null);
  el.innerHTML = out + '<button type="button" class="forge-u-166b9d9" data-forge-action="render-starters">&larr; Back to all starters</button>';
};

function renderClassOverview(responses, students) {
  var el = document.getElementById('panel-class');
  if (students.length === 0) {
    el.innerHTML = ForgeState.html('empty', { label: 'No students yet', body: 'Students can join using the class code shown on the quiz page.' });
    return;
  }

  // Per-student stats
  var perStudent = {};
  students.forEach(function(s) {
    perStudent[s.id] = { name: s.name, total: 0, correct: 0, misconceptions: {}, topMC: null, topMCcount: 0, weakBank: null, weakBankAcc: 101 };
  });

  responses.forEach(function(r) {
    var ps = perStudent[r.student_id];
    if (!ps) return;
    ps.total++;
    if (r.is_correct) ps.correct++;
    if (!r.is_correct && r.misconception_tag) {
      ps.misconceptions[r.misconception_tag] = (ps.misconceptions[r.misconception_tag] || 0) + 1;
    }
  });

  // Calculate per-student bank accuracy
  var bankByStudent = {};
  responses.forEach(function(r) {
    var key = r.student_id + '|' + r.bank;
    if (!bankByStudent[key]) bankByStudent[key] = { total: 0, correct: 0, bank: r.bank, student_id: r.student_id };
    bankByStudent[key].total++;
    if (r.is_correct) bankByStudent[key].correct++;
  });

  // Find weakest bank and top MC per student
  Object.keys(perStudent).forEach(function(sid) {
    var ps = perStudent[sid];
    // Top MC
    var maxMC = 0;
    for (var mc in ps.misconceptions) {
      if (ps.misconceptions[mc] > maxMC) { maxMC = ps.misconceptions[mc]; ps.topMC = mc; ps.topMCcount = maxMC; }
    }
    // Weakest bank (min accuracy, at least 2 answers)
    for (var key in bankByStudent) {
      var bs = bankByStudent[key];
      if (bs.student_id === sid && bs.total >= 2) {
        var bAcc = Math.round((bs.correct / bs.total) * 100);
        if (bAcc < ps.weakBankAcc) { ps.weakBankAcc = bAcc; ps.weakBank = bs.bank; }
      }
    }
  });

  // Sort by accuracy ascending (struggling students first)
  var sorted = Object.keys(perStudent).sort(function(a, b) {
    var accA = perStudent[a].total > 0 ? perStudent[a].correct / perStudent[a].total : 1;
    var accB = perStudent[b].total > 0 ? perStudent[b].correct / perStudent[b].total : 1;
    return accA - accB;
  });

  var h = '<div class="card"><div class="card-title">Students \u2014 sorted by accuracy (lowest first) <span class="forge-u-rsj30h">Click a student to see their full profile</span></div>';
  h += '<div class="class-table-wrap"><table class="class-table"><thead><tr>';
  h += '<th>Student</th><th>Answered</th><th>Accuracy</th><th>Weakest topic</th><th>Top misconception</th><th>Access</th>';
  h += '</tr></thead><tbody>';

  sorted.forEach(function(sid) {
    var ps = perStudent[sid];
    var acc = ps.total > 0 ? Math.round((ps.correct / ps.total) * 100) : 0;
    var accColor = acc >= 75 ? 'var(--good)' : acc >= 50 ? 'var(--hot)' : 'var(--bad)';
    var student = dashState.students.find(function(s) { return s.id === sid; }) || {};
    var extraTime = student.extra_time || 0;
    var displayName = student.display_name || ps.name;

    h += '<tr>';
    h += '<td class="forge-u-1imlfss" data-label="Student" data-forge-action="render-student" data-student-id="' + sid + '">';
    h += '<span class="student-name-display" data-sid="' + sid + '">' + teacherEsc(displayName) + '</span>';
    if (extraTime > 0) h += '<span class="extra-time-badge">+' + extraTime + '%</span>';
    h += '</td>';
    h += '<td class="forge-u-1imlfss" data-label="Answered" data-forge-action="render-student" data-student-id="' + sid + '">' + ps.total + '</td>';
    h += '<td data-label="Accuracy" class="acc" style="color:' + accColor + ';cursor:pointer" data-forge-action="render-student" data-student-id="' + sid + '">' + acc + '%</td>';
    h += '<td data-label="Weakest topic" class="mono forge-u-gsw1zp" data-forge-action="render-student" data-student-id="' + sid + '">' + (ps.weakBank || '\u2014') + '</td>';
    h += '<td data-label="Top misconception" class="mono forge-u-gsw1zp" data-forge-action="render-student" data-student-id="' + sid + '">' + (ps.topMC ? ps.topMC + ' \u00d7' + ps.topMCcount : '\u2014') + '</td>';
    h += '<td class="forge-u-5goeua" data-label="Access">';
    h += '<label class="forge-sr-only" for="extra-time-' + sid + '">Extra time for ' + teacherEsc(displayName) + '</label><select id="extra-time-' + sid + '" class="extra-time-select forge-u-1ljnzm7" data-sid="' + sid + '">';
    h += '<option value="0"' + (extraTime === 0 ? ' selected' : '') + '>Standard</option>';
    h += '<option value="25"' + (extraTime === 25 ? ' selected' : '') + '>+25%</option>';
    h += '<option value="50"' + (extraTime === 50 ? ' selected' : '') + '>+50%</option>';
    h += '</select>';
    h += '</td>';
    h += '</tr>';
  });

  h += '</tbody></table></div></div>';

  // Rename section below table
  h += '<div class="card forge-u-1bzpq1k"><div class="card-title">Rename a student</div>';
  h += '<p class="forge-u-1hzqkjr">If a student has used an inappropriate name, select them and enter a replacement. The original name is preserved in the database.</p>';
  h += '<div class="forge-u-w2i2oa">';
  h += '<label class="forge-sr-only" for="rename-select">Student to rename</label><select class="forge-u-1o9xvhi" id="rename-select">';
  h += '<option value="">Select student…</option>';
  sorted.forEach(function(sid) {
    var student = dashState.students.find(function(s) { return s.id === sid; }) || {};
    var displayName = student.display_name || perStudent[sid].name;
    h += '<option value="' + sid + '">' + teacherEsc(displayName) + '</option>';
  });
  h += '</select>';
  h += '<input type="text" id="rename-input" class="rename-input" placeholder="New display name">';
  h += '<button type="button" id="rename-btn" class="join-btn forge-u-fnqu57">Save</button>';
  h += '<p class="join-err" id="rename-err"></p>';
  h += '</div></div>';

  el.innerHTML = h;

  // The responsive table keeps the click-to-drill-down behaviour usable by
  // keyboard and switch controls as well as pointer users.
  el.querySelectorAll('.class-table td[onclick]').forEach(function(cell) {
    cell.setAttribute('tabindex', '0');
    cell.setAttribute('role', 'button');
    cell.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); cell.click(); }
    });
  });

  // Wire extra time selects
  el.querySelectorAll('.extra-time-select').forEach(function(sel) {
    sel.onchange = function() {
      var sid = sel.getAttribute('data-sid');
      var val = parseInt(sel.value, 10);
      var prevVal = sel.getAttribute('data-prev') || '0';
      sel.setAttribute('data-prev', sel.value);
      sel.disabled = true;
      supaPatch('students', sid, { extra_time: val }).then(function(result) {
        var student = dashState.students.find(function(s) { return s.id === sid; });
        if (student) student.extra_time = val;
        sel.disabled = false;
        // Update badge inline
        var nameCell = el.querySelector('.student-name-display[data-sid="' + sid + '"]');
        if (nameCell) {
          var badge = nameCell.nextElementSibling;
          if (badge && badge.classList.contains('extra-time-badge')) badge.remove();
          if (val > 0) {
            var newBadge = document.createElement('span');
            newBadge.className = 'extra-time-badge';
            newBadge.textContent = '+' + val + '%';
            nameCell.parentNode.insertBefore(newBadge, nameCell.nextSibling);
          }
        }
      }).catch(function(e) {
        sel.disabled = false;
        sel.value = prevVal;
        teacherInlineState(sel.parentNode, 'error', { label: 'Extra time wasn’t saved', body: 'Check your connection and try again.' });
      });
    };
    // Store initial value
    sel.setAttribute('data-prev', sel.value);
  });

  // Wire rename
  var renameBtn = document.getElementById('rename-btn');
  if (renameBtn) {
    renameBtn.onclick = function() {
      var sid = document.getElementById('rename-select').value;
      var newName = document.getElementById('rename-input').value.trim();
      var err = document.getElementById('rename-err');
      err.style.display = 'none';
      if (!sid) { err.textContent = 'Select a student.'; err.style.display = 'block'; return; }
      if (!newName) { err.textContent = 'Enter a name.'; err.style.display = 'block'; return; }
      renameBtn.disabled = true; renameBtn.textContent = 'Saving…';
      supaPatch('students', sid, { display_name: newName }).then(function() {
        var student = dashState.students.find(function(s) { return s.id === sid; });
        if (student) student.display_name = newName;
        renameBtn.disabled = false; renameBtn.textContent = 'Save';
        document.getElementById('rename-input').value = '';
        document.getElementById('rename-select').value = '';
        renderClassOverview(dashState.responses, dashState.students);
      }).catch(function() { renameBtn.disabled = false; renameBtn.textContent = 'Save'; teacherInlineState(renameBtn.parentNode, 'error', { label: 'Name wasn’t saved', body: 'Check your connection and try again.' }); });
    };
  }
}

window.renderStudent = function(studentId) {
  // Hide tabs panels, show student detail
  document.querySelectorAll('.panel').forEach(function(p) { p.classList.remove('active'); });
  var el = document.getElementById('panel-student');
  el.style.display = 'block';

  var studentObj = dashState.students.find(function(s) { return s.id === studentId; }) || {};
  var studentName = studentObj.display_name || studentObj.name || '';
  var extraTime = studentObj.extra_time || 0;

  var allStudentResponses = dashState.responses.filter(function(r) { return r.student_id === studentId; });
  var studentResponses = forClassSubject(allStudentResponses);
  var total = studentResponses.length;
  var correct = studentResponses.filter(function(r) { return r.is_correct; }).length;
  var acc = total > 0 ? Math.round((correct / total) * 100) : 0;

  // Misconception breakdown — mirrors the Anvil's own rule (ANVIL_CLEAR_THRESHOLD
  // consecutive correct reforges clears it), walked in chronological order so a
  // later re-fire resets the streak the same way it does for the student.
  var mcData = {};
  studentResponses.slice().sort(function(a, b) { return new Date(a.created_at) - new Date(b.created_at); })
    .forEach(function(r) {
      var tag = r.misconception_tag;
      if (!tag) return;
      if (!mcData[tag]) mcData[tag] = { fires: 0, reforgeAttempts: 0, reforgeCorrect: 0, streak: 0 };
      var d = mcData[tag];
      if (r.reforge_attempted) {
        d.reforgeAttempts++;
        if (r.reforge_correct) { d.reforgeCorrect++; d.streak++; }
        else { d.streak = 0; }
      } else if (!r.is_correct) {
        d.fires++;
        d.streak = 0;
      }
    });

  var reforgeTotal = studentResponses.filter(function(r) { return r.reforge_attempted; }).length;
  var reforgePass = studentResponses.filter(function(r) { return r.reforge_attempted && r.reforge_correct; }).length;
  // A tag counts if it ever fired OR the student has reforged it — the original
  // wrong answer may sit outside this class's subject filter.
  var knownMCs = Object.keys(mcData).filter(function(mc) { return mcData[mc].fires > 0 || mcData[mc].reforgeAttempts > 0; });
  var activeMCs = knownMCs.filter(function(mc) { return mcData[mc].streak < ANVIL_CLEAR_THRESHOLD; });
  var resolvedMCs = knownMCs.filter(function(mc) { return mcData[mc].streak >= ANVIL_CLEAR_THRESHOLD; });

  var h = '<button type="button" class="back-btn" data-forge-action="student-back">\u2190 Back to class</button>';

  h += '<div class="dash-header student-profile-header forge-mb-4"><div><p class="tag forge-u-l8gta7">Student Profile</p><h1>' + studentName + (extraTime > 0 ? ' <span class="extra-time-badge forge-u-1nzryid">+' + extraTime + '% time</span>' : '') + '</h1></div></div>';

  h += '<div class="stat-row">';
  h += '<div class="stat"><span class="stat-n" style="color:' + (acc >= 70 ? 'var(--good)' : acc >= 50 ? 'var(--hot)' : 'var(--bad)') + '">' + acc + '%</span><span class="stat-l">Accuracy</span></div>';
  h += '<div class="stat"><span class="stat-n forge-text-white">' + total + '</span><span class="stat-l">Questions</span></div>';
  h += '<div class="stat"><span class="stat-n forge-text-hot">' + activeMCs.length + '</span><span class="stat-l">Active misconceptions</span></div>';
  h += '<div class="stat"><span class="stat-n forge-text-good">' + reforgePass + '/' + reforgeTotal + '</span><span class="stat-l">Reforges passed</span></div>';
  h += '</div>';

  // Active misconceptions (Anvil)
  if (activeMCs.length > 0) {
    h += '<div class="card forge-u-1ce7cf7"><div class="card-title forge-text-bad">Anvil \u2014 still active</div>';
    activeMCs.sort(function(a, b) { return mcData[b].fires - mcData[a].fires; });
    activeMCs.forEach(function(mc) {
      var d = mcData[mc];
      var label = resolveMCLabel(mc) || mc;
      h += '<div class="mc-item">';
      h += '<span class="heat-tag">' + mc + '</span>';
      h += '<span class="mc-detail">' + label + '</span>';
      h += '<span class="mc-fires forge-text-bad">Fired ' + d.fires + '\u00d7 \u00b7 Reforged ' + d.reforgeCorrect + '/' + d.reforgeAttempts + '</span>';
      h += '</div>';
    });
    h += '</div>';
  }

  // Resolved
  if (resolvedMCs.length > 0) {
    h += '<div class="card forge-u-5cp4nn"><div class="card-title forge-text-good">Resolved \u2014 reforged successfully</div>';
    resolvedMCs.forEach(function(mc) {
      var d = mcData[mc];
      var label = resolveMCLabel(mc) || mc;
      h += '<div class="mc-item forge-u-w5mfjv">';
      h += '<span class="heat-tag forge-u-6uw790">' + mc + '</span>';
      h += '<span class="mc-detail forge-u-1aezjox">' + label + '</span>';
      h += '<span class="mc-fires forge-text-good">Resolved \u2713</span>';
      h += '</div>';
    });
    h += '</div>';
  }

  if (activeMCs.length === 0 && resolvedMCs.length === 0) {
    h += ForgeState.html('empty', { label: 'No misconception data yet', body: 'This student needs to answer more questions before a focus area can appear.' });
  }

  // Reforge history — every individual reforge attempt, most recent first
  var reforgeHistory = studentResponses.filter(function(r) { return r.reforge_attempted; })
    .sort(function(a, b) { return new Date(b.created_at) - new Date(a.created_at); });
  if (reforgeHistory.length > 0) {
    h += '<div class="card"><div class="card-title">Reforge history — ' + reforgeHistory.length + ' attempt' + (reforgeHistory.length !== 1 ? 's' : '') + '</div>';
    reforgeHistory.forEach(function(r) {
      var mc = r.misconception_tag;
      var label = mc ? (resolveMCLabel(mc) || mc) : (r.bank || 'Unknown topic');
      var when = r.created_at ? new Date(r.created_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) : '';
      h += '<div class="mc-item" style="' + (r.reforge_correct ? 'opacity:.7' : '') + '">';
      h += '<span class="heat-tag" style="background:' + (r.reforge_correct ? 'var(--good)' : 'var(--bad)') + '">' + (mc || r.bank || '—') + '</span>';
      h += '<span class="mc-detail forge-u-1aezjox"' + (r.reforge_correct ? '' : '') + '>' + label + '</span>';
      h += '<span class="mc-fires" style="color:' + (r.reforge_correct ? 'var(--good)' : 'var(--bad)') + '">' + (r.reforge_correct ? '✓ Passed' : '✗ Failed') + (when ? ' · ' + when : '') + '</span>';
      h += '</div>';
    });
    h += '</div>';
  }

  // Crucible sessions — cluster this student's Crucible answers into runs by timestamp,
  // since no explicit session id is logged. A gap of 30+ minutes between answers starts a new session.
  var crucibleAnswers = allStudentResponses.filter(function(r) { return r.question_id && r.question_id.indexOf('-CRU') !== -1; })
    .slice().sort(function(a, b) { return new Date(a.created_at) - new Date(b.created_at); });
  var crucibleSessions = [];
  crucibleAnswers.forEach(function(r) {
    var last = crucibleSessions[crucibleSessions.length - 1];
    var gapMs = last ? (new Date(r.created_at) - new Date(last.answers[last.answers.length - 1].created_at)) : Infinity;
    if (!last || gapMs > 30 * 60 * 1000) {
      crucibleSessions.push({ answers: [r] });
    } else {
      last.answers.push(r);
    }
  });
  crucibleSessions.reverse();
  if (crucibleSessions.length > 0) {
    h += '<div class="card"><div class="card-title">Crucible sessions — ' + crucibleSessions.length + ' run' + (crucibleSessions.length !== 1 ? 's' : '') + '<span class="forge-u-rsj30h">Duration is estimated from answer timestamps</span></div>';
    crucibleSessions.slice(0, 10).forEach(function(sess) {
      var start = new Date(sess.answers[0].created_at);
      var end = new Date(sess.answers[sess.answers.length - 1].created_at);
      var secs = Math.max(0, Math.round((end - start) / 1000));
      var mins = Math.floor(secs / 60), remSecs = secs % 60;
      var durLabel = mins + ':' + (remSecs < 10 ? '0' : '') + remSecs;
      var correct = sess.answers.filter(function(a) { return a.is_correct; }).length;
      var pct = Math.round((correct / sess.answers.length) * 100);
      var col = pct >= 75 ? 'var(--good)' : pct >= 50 ? 'var(--hot)' : 'var(--bad)';
      var dateLabel = start.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) + ' · ' + start.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
      h += '<div class="mc-item">';
      h += '<span class="heat-tag">' + dateLabel + '</span>';
      h += '<span class="mc-detail">' + sess.answers.length + ' questions · ' + correct + '/' + sess.answers.length + ' correct (' + pct + '%)</span>';
      h += '<span class="mc-fires" style="color:' + col + '">⏱ ' + durLabel + '</span>';
      h += '</div>';
    });
    h += '</div>';
  }

  // Spec point breakdown
  var specData = {};
  studentResponses.forEach(function(r) {
    var sp = specForResponse(r);
    if (!sp || sp === 'TECH') return;
    if (!specData[sp]) specData[sp] = { total: 0, correct: 0 };
    specData[sp].total++;
    if (r.is_correct) specData[sp].correct++;
  });
  var specKeys = Object.keys(specData).sort();
  if (specKeys.length > 0) {
    h += '<div class="card"><div class="card-title">Spec Point Breakdown</div>';
    h += '<table class="forge-u-k85mqv">';
    h += '<thead><tr class="forge-u-sd7dny"><th class="forge-u-3ebq6">Spec</th><th>Subject</th><th>Questions</th><th>Accuracy</th><th class="forge-u-urn98g">Bar</th></tr></thead><tbody>';
    specKeys.forEach(function(sp) {
      var d = specData[sp];
      var spAcc = Math.round((d.correct / d.total) * 100);
      var col = spAcc >= 70 ? 'var(--good)' : spAcc >= 50 ? 'var(--hot)' : 'var(--bad)';
      h += '<tr class="forge-u-1jhoksp">';
      h += '<td class="forge-u-5obb8e">' + sp + '</td>';
      h += '<td class="forge-u-16oyzks">' + (SPEC_TO_SUBJECT[sp] || '—') + '</td>';
      h += '<td class="forge-u-19j2vc3">' + d.total + '</td>';
      h += '<td style="font-weight:700;color:' + col + '">' + spAcc + '%</td>';
      h += '<td><div class="forge-u-139b0tm"><div style="background:' + col + ';border-radius:var(--radius-xs);height:6px;width:' + spAcc + '%"></div></div></td>';
      h += '</tr>';
    });
    h += '</tbody></table></div>';
  }

  el.innerHTML = h;
};

document.addEventListener('forge-content-ready', function () {
  if (typeof dashState !== 'undefined' && dashState.classSubject && typeof renderAssignments === 'function') renderAssignments();
});

TeacherAuth.getSession().then(function(sess) {
  if (!sess) { renderTeacherAuth('signin'); return; }
  if (window.ForgeRole) ForgeRole.set('teacher');
  currentTeacher = sess.user;
  headers.Authorization = 'Bearer ' + sess.access_token;
  mountTeacherSidebar();
  if (window.ForgeSidebar) ForgeSidebar.setClassList(getJoinedClasses(), null);
  // The create-class form shows the teacher's school rather than asking for
  // it, so the profile has to be loaded before the first render.
  loadTeacherProfile().then(function() {
    if (new URLSearchParams(location.search).get('tab') === 'create') renderLogin('create');
    else renderTeacherHome();
  });
});
