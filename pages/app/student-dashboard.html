<script>
var SUPABASE_URL = ForgeAPI.config.url;
var SUPABASE_KEY = ForgeAPI.config.key;
var hdrs = {'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY};
function supaGet(t,p){return ForgeAPI.get(t,p);}



// Ranks, thresholds and avatar frames live in scripts/forge-ranks.js so the
// profile, friends list and settings show the same rank as this page.
var RANKS = ForgeRanks.RANKS;
function getRank(xp){ return ForgeRanks.rankFor(xp); }


// Classes are named "<year><letter>/<subject code>" (e.g. "12B/Bs" for a
// Year 12 A-Level class, "10A/Gg" for a Year 10 GCSE class). There's no
// separate level column, so level is derived from the year-group prefix:
// Year 12-13 = A-Level, Year 7-11 = GCSE. See school-overview.html's classLevel.
//
// Nothing on this page renders the level — it's derived and cached onto the
// `forge-student` session because profile.html reads it back as the fallback
// level for responses it can't attribute to a known class. Don't drop it as
// unused.
function classLevel(className) {
  var m = /^(\d+)/.exec(className || '');
  if (!m) return 'alevel';
  var year = parseInt(m[1], 10);
  return year >= 12 ? 'alevel' : 'gcse';
}

function calcXP(responses){
  var xp=0;
  responses.forEach(function(r){
    // Anvil rows are stored as reforge attempts, so they must be matched first
    // or a correct one would also earn the +20 reforge bonus (50 in total).
    if(r.question_id&&r.question_id.endsWith('-ANVIL')){ if(r.is_correct) xp+=30; }
    else if(r.question_id&&r.question_id.endsWith('-CRU')&&r.is_correct) xp+=30;
    else if(r.reforge_attempted&&r.reforge_correct) xp+=20;
    else if(r.is_correct&&!r.reforge_attempted) xp+=r.hint_used?5:10;
  });
  return xp;
}



// Shared with Profile and computed the same way in SQL for friends; includes
// the one-day freeze (scripts/forge-streak.js).
function calcStreak(responses){ return window.ForgeStreak ? ForgeStreak.calc(responses).days : 0; }

var st={studentId:null,classId:null,studentName:null,responses:[],isPaid:false,isTrial:false,trialDaysLeft:0,paidSubjects:[],isGCSE:false,loadError:false};
var rewardsLoadedFor=null;
// Set once match XP has synced (or failed to); see celebrateDashboard().
var rewardsReadyFor=null;
var app=document.getElementById('app');
ForgeApp.loading(app, { label: 'Loading your dashboard', body: 'Getting your progress and focus areas ready.' });

function renderLogin(){
  var f='<div class="dashboard-entry-actions"><a class="auth-btn" href="forge-quiz.html">Start practising free →</a><a href="forge-quiz.html?mode=email">Sign in with email</a></div>'
       +'<details class="dashboard-class-entry"><summary>I have class codes</summary>'
       +'<div id="p-name-wrap" class="forge-first-name">'+ForgeAuthCard.field('p-name','Your name — first time only',{placeholder:'e.g. Alex',autocomplete:'name'})+'</div>'
       +ForgeAuthCard.field('p-student-code','Student code',{placeholder:'e.g. A1B2C3D4E5',upper:true})
       +ForgeAuthCard.field('p-code','Class code',{placeholder:'e.g. ECON-Y12-A',upper:true})
       +'<button class="auth-btn" id="p-btn" type="submit">View my dashboard \u2192</button>'
       +'<p class="auth-err" id="p-err"></p></details>';
  app.innerHTML=ForgeAuthCard.shell({
    title:'Your Forge dashboard',
    sub:'Start practising, return to your saved progress, or join your class.'
  },f);
  ForgeAuthCard.onSubmit(function(){document.getElementById('p-btn').onclick();});

  document.getElementById('p-btn').onclick=function(){
    var name=document.getElementById('p-name').value.trim();
    var studentCode=document.getElementById('p-student-code').value.trim();
    var code=document.getElementById('p-code').value.trim().toUpperCase();
    var err=document.getElementById('p-err');
    var btn=document.getElementById('p-btn');
    if(!code){err.textContent='Enter your class code.';err.style.display='block';return;}
    btn.disabled=true;btn.textContent='Joining class…';
    if (!studentCode) {
      if (!name) { document.getElementById('p-name-wrap').style.display='block'; err.textContent='Enter your student code, or enter your name for an older class.';err.style.display='block';btn.disabled=false;btn.textContent='View my dashboard →';return; }
      ForgeAPI.response(SUPABASE_URL + '/rest/v1/rpc/join_class_as_student', {
        method:'POST', headers:Object.assign({}, hdrs, {'Content-Type':'application/json'}),
        body:JSON.stringify({p_code:code,p_name:name})
      }).then(function(r){return r.json();}).then(function(rows){
        if(!Array.isArray(rows)||!rows[0]) throw new Error('This class requires an individual student code.');
        var legacy=rows[0];
        return legacy;
      }).then(function(match){
        if(!match || !match.student_id) throw new Error('Class or student not found.');
        st.studentId=match.student_id;st.classId=match.class_id;st.classCode=code;st.studentName=name;st.isGCSE=classLevel(match.class_name)==='gcse';
        try { localStorage.setItem('forge-student', JSON.stringify({studentId:st.studentId,classId:st.classId,classCode:code,studentName:st.studentName,classSubject:match.subject||null,isGCSE:st.isGCSE})); } catch(e) {}
        ForgeClasses.add({classId:st.classId,classCode:code,className:match.class_name||null,subject:match.subject||null,studentId:st.studentId,studentName:name});
        ForgeClasses.fetchStudentResponses(SUPABASE_URL,SUPABASE_KEY,{studentId:st.studentId,classId:st.classId,classCode:code,subject:match.subject,studentName:name},function(r){st.responses=r;renderDashboard();});
      }).catch(function(e){err.textContent=e.message||'Class or student not found.';err.style.display='block';btn.disabled=false;btn.textContent='View my dashboard →';});
      return;
    }
    ForgeStudentCode.join(code, studentCode, name).then(function(match){
      name=match.student_name||name;
      st.studentId=match.student_id;st.classId=match.class_id;st.studentName=name;st.isGCSE=classLevel(match.class_name)==='gcse';
      var cleanStudentCode=ForgeStudentCode.clean(studentCode);
      st.classCode=code;st.studentCode=cleanStudentCode;
      try { localStorage.setItem('forge-student', JSON.stringify({studentId: st.studentId, classId: st.classId, classCode: code, studentCode: cleanStudentCode, studentName: st.studentName, classSubject: match.subject || null, isGCSE: st.isGCSE})); } catch(e) {}
      ForgeClasses.add({
        classId: st.classId, classCode: code, className: match.class_name || null,
        subject: match.subject || null, studentId: st.studentId, studentName: name, studentCode: cleanStudentCode
      });
      // The dashboard is scoped to the class code used to sign in. A new
      // class must not inherit another class's history.
      ForgeClasses.syncFromServer(SUPABASE_URL, SUPABASE_KEY,
        {studentId: st.studentId, classId: st.classId, classCode: code,
         subject: match.subject, className: match.class_name, studentName: name, studentCode: cleanStudentCode}, function(){});
      ForgeClasses.fetchStudentResponses(SUPABASE_URL, SUPABASE_KEY,
        {studentId: st.studentId, classId: st.classId, classCode: code,
         subject: match.subject, studentName: name, studentCode: cleanStudentCode}, function(r){
        st.responses = r;
        renderDashboard();
      });
    }).catch(function(e){if(e.needsName){document.getElementById('p-name-wrap').style.display='block';document.getElementById('p-name').focus();}err.textContent=e.message||'Student code or class code not recognised.';err.style.display='block';btn.disabled=false;btn.textContent='View my dashboard \u2192';});
  };
}



var SUBJ_LABELS = {econ:'Economics',psych:'Psychology',soc:'Sociology',geo:'Geography',bus:'Business',chem:'Chemistry',bio:'Biology',phys:'Physics',hist:'History',law:'Law',crim:'Criminology',pol:'Politics',maths:'Maths',german:'German',french:'French',cs:'Computer Science',rs:'Religious Studies',hsc:'Health & Social Care'};

function daysAgo(dateStr){
  if(!dateStr) return null;
  var then=new Date(dateStr.substring(0,10));
  var now=new Date(new Date().toISOString().substring(0,10));
  var diff=Math.round((now-then)/86400000);
  if(diff<=0) return 'Today';
  if(diff===1) return 'Yesterday';
  return diff+' days ago';
}

// Days from today (local) to a due date; negative when overdue, null if undated.
function daysUntil(dateStr){
  if(!dateStr) return null;
  var p=/^(\d{4})-(\d{2})-(\d{2})/.exec(dateStr);
  if(!p) return null;
  var due=new Date(+p[1],+p[2]-1,+p[3]);
  var now=new Date(); now=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  return Math.round((due-now)/86400000);
}

// Teacher-set work outranks self-directed practice: if the class has something
// open that is overdue, due within a week, or undated, it becomes the main
// recommendation. Work due further out stays in the sidebar badge only.
// Other recent topics, shown at the foot of the recommendation card so the
// student can jump straight to a different topic (and the card's spare height
// is used). Most recently practised first, excluding the recommended one.
var dashboardTopicsHtml='';
function topicShortcutsHtml(responses, excludeKey){
  var byBank={};
  (responses||[]).forEach(function(r){
    if(r.reforge_attempted||!r.bank||!BANKS[r.bank]) return;
    var b=byBank[r.bank]||(byBank[r.bank]={key:r.bank,total:0,correct:0,last:''});
    b.total++; if(r.is_correct&&!r.hint_used) b.correct++;
    if((r.created_at||'')>b.last) b.last=r.created_at||'';
  });
  var picks=Object.keys(byBank).map(function(k){return byBank[k];})
    .filter(function(b){return b.key!==excludeKey;})
    .sort(function(a,b){return a.last<b.last?1:a.last>b.last?-1:0;}).slice(0,3);
  if(!picks.length) return '';
  var h='<div class="dashboard-topics"><p class="dashboard-topics__label">Other topics</p><ul>';
  picks.forEach(function(b){
    h+='<li><a href="forge-quiz.html?bank='+encodeURIComponent(b.key)+'"><span>'+_fsEsc(BANKS[b.key].label)+'</span>'+(window.ForgeTopicMastery?ForgeTopicMastery.ringHtml(ForgeTopicMastery.status(responses,b.key)):'')+'</a></li>';
  });
  return h+'<li><a class="dashboard-topics__all" href="forge-quiz.html">All topics →</a></li></ul></div>';
}

var planInput=null;
function renderPlan(){
  var slot=document.querySelector('.dashboard-plan-slot');
  if(slot&&planInput&&window.ForgeDailyPlan) slot.innerHTML=ForgeDailyPlan.html(ForgeDailyPlan.build(planInput))+dashboardTopicsHtml;
}
function showAssignmentNext(open){
  if(!planInput||!open||!open.length) return;
  var ranked=open.map(function(a){return {a:a,d:daysUntil(a.due_date)};}).filter(function(x){return x.d===null||x.d<=7;});
  if(!ranked.length) return;
  ranked.sort(function(x,y){
    if(x.d===null&&y.d===null) return String(y.a.created_at||'').localeCompare(String(x.a.created_at||''));
    if(x.d===null) return 1;
    if(y.d===null) return -1;
    return x.d-y.d;
  });
  var pick=ranked[0], d=pick.d;
  var when=d===null?'No due date':d<0?'Overdue by '+(-d)+' day'+(d===-1?'':'s'):d===0?'Due today':d===1?'Due tomorrow':'Due in '+d+' days';
  var p=pick.a.dashProgress;
  var done=p&&p.total&&p.answered?' · '+p.answered+' of '+p.total+' answered':'';
  var more=open.length>1?' · '+(open.length-1)+' more open':'';
  planInput.assignment={title:pick.a.title||'Assignment',when:when+done+more,cta:d!==null&&d<0?'Catch up now':done?'Continue':'Start'};
  renderPlan();
}

function dashboardClassContext(){
  return {studentId:st.studentId,classId:st.classId,classCode:st.classCode,studentCode:st.studentCode,studentName:st.studentName};
}

// Same rule as the profile's celebrateProfile(): complete data only, for
// every student. Badges use the profile's
// subject and topic list (ForgeAchievements.subjectTopics), so the targets
// match what the profile shows.
function celebrateDashboard(responses,xp,resolved){
  if(!window.ForgeCelebrate||!window.ForgeAchievements||!st.studentId||st.loadError||rewardsReadyFor!==st.studentId)return;
  var badges=ForgeAchievements.compute(responses,{resolved:resolved,topicBanks:ForgeAchievements.subjectTopics(responses,typeof SUBJECTS!=='undefined'?SUBJECTS:null)});
  ForgeCelebrate.check({studentId:st.studentId,name:st.studentName,xp:xp,badges:badges});
}

// Choosing a different daily goal redraws Home with it.
if(window.ForgeGoals) ForgeGoals.bind(function(){return st.studentId;},function(){renderDashboard();});

function responsesForSubject(responses,subject){
  if(!subject||!SUBJECTS[subject])return responses;
  var banks=SUBJECTS[subject].banks||[];
  return responses.filter(function(r){return banks.indexOf(r.bank)!==-1||r.subject===subject||r._subject===subject;});
}
// The classes a code-signed-in student has joined, one button each. Choosing
// one makes it the active class: its plan, readiness, league, friends and
// assignments show here, and new practice is saved against it.
function dashboardClasses(){
  if(!st.classCode||!window.ForgeClasses)return [];
  var seen={};
  return ForgeClasses.list().filter(function(c){
    if(!c.classId||!c.studentId||!c.subject||!SUBJECTS[c.subject]||seen[c.classId])return false;
    return seen[c.classId]=true;
  });
}
function classSwitcherHtml(){
  var classes=dashboardClasses();
  if(classes.length<2)return '';
  return '<nav class="dashboard-classes" aria-label="Your classes"><span>Your classes</span>'+classes.map(function(c){
    var active=String(c.classId)===String(st.classId);
    return '<button type="button" class="dashboard-class-chip'+(active?' is-active':'')+'" data-class-id="'+_fsEsc(c.classId)+'" aria-pressed="'+active+'">'+_fsEsc(SUBJECTS[c.subject].label)+'</button>';
  }).join('')+'</nav>';
}
function switchDashboardClass(classId){
  var entry=window.ForgeClasses&&ForgeClasses.forClass(classId);
  if(!entry||String(entry.classId)===String(st.classId))return;
  var isGCSE=classLevel(entry.className)==='gcse';
  ForgeClasses.activate(entry,{isGCSE:isGCSE});
  st.studentId=entry.studentId;st.classId=entry.classId;st.classCode=entry.classCode||null;st.studentCode=entry.studentCode||null;st.isGCSE=isGCSE;
  // The league and friends panels belong to the old class; let them reload.
  ['dashboard-league','dashboard-friends'].forEach(function(id){var el=document.getElementById(id);if(el)el.innerHTML='';});
  renderDashboard();
}

function renderDashboard(){
  if(window.ForgeRewards&&st.studentId&&rewardsLoadedFor!==st.studentId){
    rewardsLoadedFor=st.studentId;
    var loadingFor=st.studentId;
    var ready=function(){rewardsReadyFor=loadingFor;if(st.studentId===loadingFor)renderDashboard();};
    ForgeRewards.load(dashboardClassContext()).then(ready,ready);
  }
  var responses=st.responses||[];
  var total=responses.filter(function(r){return !r.reforge_attempted;}).length;
  var quizXp=calcXP(responses);
  if(window.ForgeRewards)ForgeRewards.rememberQuizXp(st.studentId,quizXp);
  var xp=quizXp+(window.ForgeRewards?ForgeRewards.matchXpFor(st.studentId):0);
  var rank=getRank(xp);
  var streak=calcStreak(responses);
  var subject=window.ForgeStudentFocus&&ForgeStudentFocus.subject(st,responses);
  // XP, streak, badges and mistakes count every class; the plan and topic
  // suggestions are about the subject in view.
  var subjectResponses=responsesForSubject(responses,subject);
  var subjectName=subject&&SUBJECTS[subject]&&SUBJECTS[subject].label;
  var subjectUrl=subject?'forge-quiz.html?subject='+encodeURIComponent(subject):'forge-quiz.html';
  var due=window.ForgeStudentFocus&&ForgeStudentFocus.due(st,subject)||0;

  // One lifecycle owner keeps Dashboard, Anvil, Profile and Teacher aligned.
  var misconceptionSummary=ForgeMisconceptions.summarize(responses);
  var activeMCs=misconceptionSummary.active;
  celebrateDashboard(responses,xp,(misconceptionSummary.resolved||[]).length);
  if (window.ForgeSidebar) ForgeSidebar.setBadge('anvil', activeMCs.length || null);
  try { localStorage.setItem('forge-anvil-open', String(activeMCs.length)); } catch(e) {}
  if (st.classId) {
    // ForgeLeague.studentRpc resolves this class's own student row and code
    // from the saved class list and sends a signed-in student's own token, so
    // accounts (one student row per class) get their assignments too.
    ForgeLeague.studentRpc('get_student_assignments', dashboardClassContext()).then(function(rows){
      var today=new Date(); today.setHours(0,0,0,0);
      var open=(Array.isArray(rows)?rows:[]).filter(function(a){
        var banks=[]; try { banks=typeof a.banks==='string'?JSON.parse(a.banks):a.banks||[]; } catch(e) {}
        var created=a.created_at?new Date(a.created_at):null;
        // Tally progress across every bank (not .some, which stops early) so
        // the home card can say "3 of 8 answered".
        var answered=0, target=0, unknown=!banks.length;
        banks.forEach(function(bank){
          var bankData=BANKS[bank];
          if (!bankData) { unknown=true; return; }
          var ids={};
          responses.forEach(function(response){
            if (created && (!response.created_at || new Date(response.created_at)<created)) return;
            if (response.bank===bank) ids[String(response.question_id||'').replace(/-RF$/,'')]=true;
          });
          // A focused assignment is capped at the same eight questions as the
          // student assignment view. Include locally completed session IDs so
          // the sidebar does not show a stale badge before server sync.
          try {
            ForgeAssignmentProgress.localSessionRows(a,{studentId:st.studentId,classId:st.classId}).forEach(function(localResponse){
              ids[String(localResponse.question_id||'').replace(/-RF$/,'')]=true;
            });
          } catch(e) {}
          var available=bankData.assignableQuestionCount!=null?bankData.assignableQuestionCount:(bankData.questionCount||0);
          var cap=Math.min(8,available);
          answered+=Math.min(Object.keys(ids).length,cap); target+=cap;
        });
        a.dashProgress=unknown?null:{answered:answered,total:target};
        return unknown || answered<target;
      });
      var count=open.length;
      showAssignmentNext(open);
      if (window.ForgeSidebar) ForgeSidebar.setBadge('assignments', count || null);
      try { localStorage.setItem('forge-assigned-open-current', String(count)); } catch(e) {}
      try { localStorage.setItem('forge-assigned-open:'+String(st.studentId||'anon')+':'+String(st.classId||'none'), String(count)); } catch(e) {}
    }).catch(function(){});
  }
  // Topic-level signal for the recommendation: use recent bank performance,
  // but only surface topics with enough evidence to avoid overreacting to one answer.
  var topicData={};
  var recent=subjectResponses.filter(function(r){return !r.reforge_attempted;}).slice(-20);
  recent.forEach(function(r){
    var key=r.bank||r.subject||'unknown';
    if(!BANKS[key]) return;
    if(!topicData[key]) topicData[key]={total:0,correct:0,label:BANKS[key].label};
    topicData[key].total++; if(r.is_correct&&!r.hint_used) topicData[key].correct++;
  });
  var topicRanked=Object.keys(topicData).filter(function(k){return topicData[k].total>=3;}).map(function(k){
    var d=topicData[k]; return {key:k,label:d.label,acc:Math.round(d.correct/d.total*100),sample:d.total};
  }).sort(function(a,b){return a.acc-b.acc;});
  var focusTopic=topicRanked[0]||null;
  dashboardTopicsHtml=topicShortcutsHtml(subjectResponses, focusTopic&&!activeMCs.length?focusTopic.key:null);

  var h='<header class="dashboard-heading dashboard-heading--ranked">'+(window.ForgeEmblems?ForgeEmblems.ownAvatarHtml(st.studentId,st.studentName,xp,{size:'lg',rank:rank}):ForgeRanks.avatarHtml(st.studentName,xp,{size:'lg',rank:rank}))
    +'<div><h1>Welcome back, '+_fsEsc(st.studentName)+'</h1><p class="dashboard-heading__rank">'+ForgeRanks.chipHtml(xp,rank)+'<span>Pick up where you left off.</span></p></div></header>'+classSwitcherHtml();
  if(st.classId&&!ForgeAuth.hasSession()) h+='<p class="dashboard-save-email"><a href="forge-quiz.html?mode=email">Save this class progress with email →</a></p>';

  h+='<div class="dashboard-layout'+(total>0?' dashboard-layout--split':'')+'"><div class="dashboard-main">';
  if(total===0&&!due){
    if(st.loadError){
      h+=ForgeApp.stateHtml('error',{label:'Your dashboard data is unavailable',body:'We couldn’t retrieve your progress. Refresh and try again.',action:{label:'Retry dashboard',href:location.href}});
      app.innerHTML=h+'</div></div>';
      return;
    }
    h+='<section class="dashboard-next" aria-labelledby="dashboard-next-title">';
    h+='<span class="dashboard-next__label">Today · first step</span>';
    h+='<h2 id="dashboard-next-title">Start your first practice</h2>';
    h+='<p>'+(subjectName?'Start with '+_fsEsc(subjectName)+'. Answer':'Choose a subject, then answer')+' a short set of questions. If you get stuck, we’ll help you try again.</p>';
    h+='<ol class="dashboard-first-loop" aria-label="What happens in practice"><li><span>1</span>Answer</li><li><span>2</span>See the idea</li><li><span>3</span>Try it again</li></ol>';
    h+='<a class="forge-button forge-button--primary" href="'+subjectUrl+'">Start practice →</a></section>';
  } else {
    var fixed=window.ForgeFixed?ForgeFixed.summarize(responses):null;
    planInput={
      responses:subjectResponses, activeMistakes:activeMCs.length,
      fixesDue:fixed?fixed.due.length:0, checkHref:fixed?ForgeFixed.href(fixed,subject):undefined,
      revisionDue:due, reviewedToday:window.ForgeStudentFocus&&ForgeStudentFocus.reviewedToday?ForgeStudentFocus.reviewedToday(st):0,
      revisionHref:'revision.html'+(subject?'?subject='+encodeURIComponent(subject):''),
      practiceSetSize:!st.classId&&!st.isPaid&&!st.isTrial?10:undefined,
      practiceTitle:focusTopic?'Practise '+focusTopic.label:(subjectName?'Practise '+subjectName:'Practise a topic'),
      practiceHref:focusTopic?'forge-quiz.html?bank='+encodeURIComponent(focusTopic.key):subjectUrl
    };
    h+='<div class="dashboard-next dashboard-plan-slot">'+ForgeDailyPlan.html(ForgeDailyPlan.build(planInput))+dashboardTopicsHtml+'</div>';
    // The daily XP goal the student chose (scripts/forge-goals.js), next to
    // the plan so it is in view on a phone too.
    if(window.ForgeGoals) h+=ForgeGoals.cardHtml(st.studentId,responses);
    // One readiness score for the subject (scripts/forge-readiness.js).
    var readinessBanks=subject&&typeof SUBJECTS!=='undefined'&&SUBJECTS[subject]?SUBJECTS[subject].banks:null;
    if(window.ForgeReadiness&&readinessBanks&&readinessBanks.length) h+=ForgeReadiness.cardHtml(ForgeReadiness.subject(responses,readinessBanks),{
      subjectName:subjectName,label:function(b){return BANKS[b]?BANKS[b].label:b;}
    });
  }

  h+='<nav class="dashboard-shortcuts" aria-label="Other learning activities">';
  h+='<a href="forge-quiz.html">Choose a topic</a>';
  h+='<a href="assignments.html">View assignments</a>';
  h+='<a href="revision.html">Revision cards</a>';
  h+='</nav>';
  if(st.classId) h+='<div id="dashboard-friends"></div>';
  else if(window.ForgeIndependentFriends&&window.ForgeAuth&&ForgeAuth.hasSession()) h+='<div id="dashboard-independent-friends"></div>';
  h+='</div>';
  if(total>0){
    var nextRank=RANKS.filter(function(r){return r.min>xp;})[0]||null;
    var rankProgress=nextRank?Math.max(0,Math.min(100,Math.round((xp-rank.min)/(nextRank.min-rank.min)*100))):100;
    h+='<div class="dashboard-side"><section class="dashboard-progress" aria-labelledby="dashboard-progress-title"><div class="dashboard-progress-heading"><h2 id="dashboard-progress-title">Your progress</h2><a href="profile.html">View details</a></div>';
    h+='<div class="dashboard-rank"><div><span class="dashboard-rank-label">Current rank</span><p class="dashboard-rank-name">'+_fsEsc(rank.name)+'</p></div><span class="dashboard-rank-xp">'+xp.toLocaleString()+' XP</span></div>';
    if(nextRank){
      h+='<div class="dashboard-rank-meter" role="progressbar" aria-label="Progress towards '+_fsEsc(nextRank.name)+'" aria-valuemin="'+rank.min+'" aria-valuemax="'+nextRank.min+'" aria-valuenow="'+xp+'"><span style="width:'+rankProgress+'%"></span></div>';
      h+='<p class="dashboard-rank-next">'+(nextRank.min-xp).toLocaleString()+' XP to '+_fsEsc(nextRank.name)+'</p>';
    } else {
      h+='<p class="dashboard-rank-next">Highest rank reached</p>';
    }
    h+='<dl><div><dt>Questions answered</dt><dd>'+total+'</dd></div><div><dt>Practice streak</dt><dd>'+streak+' day'+(streak===1?'':'s')+'</dd></div></dl>'+(streak&&window.ForgeStreak&&ForgeStreak.calc(responses).frozen?'<p class="dashboard-streak-freeze">You missed yesterday, so your streak is frozen. Practise today to keep it going.</p>':'')+'</section>';
    // Home shows only the badges nearest their next tier; Profile has them all.
    if(window.ForgeAchievements) h+=ForgeAchievements.almostHtml(ForgeAchievements.compute(responses,{resolved:(misconceptionSummary.resolved||[]).length,topicBanks:ForgeAchievements.subjectTopics(responses,typeof SUBJECTS!=='undefined'?SUBJECTS:null)}));
    if(st.classId) h+='<div id="dashboard-league"></div>';
    h+='</div>';
  }

  h+='</div>';
  // Home redraws as its data arrives. The league and friends panels load on
  // their own, so a redraw emptied them and they grew back a moment later,
  // moving everything below by hundreds of pixels each time. Keep what they
  // last showed until their own refresh replaces it.
  var keptPanels={};
  ['dashboard-league','dashboard-friends','dashboard-independent-friends'].forEach(function(id){var el=document.getElementById(id);if(el&&el.innerHTML)keptPanels[id]=el.innerHTML;});
  app.innerHTML=(st.loadError?ForgeApp.stateHtml('error',{label:'Some dashboard data is unavailable',body:'We couldn’t retrieve the latest progress. Refresh and try again.',action:{label:'Retry dashboard',href:location.href}}):'')+h;
  Object.keys(keptPanels).forEach(function(id){var el=document.getElementById(id);if(el&&!el.innerHTML)el.innerHTML=keptPanels[id];});
  if(app.querySelectorAll)Array.prototype.forEach.call(app.querySelectorAll('.dashboard-class-chip'),function(chip){chip.onclick=function(){switchDashboardClass(chip.getAttribute('data-class-id'));};});
  var leagueEl=document.getElementById('dashboard-league');
  var socialCtx=dashboardClassContext();
  // A weekly league win is only known once the league has loaded.
  if(leagueEl&&window.ForgeLeague) ForgeLeague.mount(leagueEl,socialCtx).then(function(data){
    if(data&&data.enabled&&window.ForgeCelebrate&&st.studentId) ForgeCelebrate.check({studentId:st.studentId,name:st.studentName,trophies:Number(data.trophies)||0});
  });
  var friendsEl=document.getElementById('dashboard-friends');
  if(friendsEl&&window.ForgeFriends) ForgeFriends.mount(friendsEl,socialCtx);
  var independentFriendsEl=document.getElementById('dashboard-independent-friends');
  if(independentFriendsEl) ForgeIndependentFriends.mountHome(independentFriendsEl);
}


function forgeSignOut(){
  try { localStorage.removeItem('forge-student'); } catch(e) {}
  try { localStorage.removeItem('forge-free-session'); } catch(e) {}
  ForgeAuth.signOut();
  location.reload();
}

function renderAccountLoadError(){
  app.innerHTML=ForgeAuthCard.shell({
    title:'We couldn’t load your account',
    sub:'Your email sign-in was received, but your dashboard is unavailable right now.'
  },'<div class="dashboard-entry-actions"><button class="auth-btn" type="button" id="dashboard-retry">Try again</button></div>');
  document.getElementById('dashboard-retry').onclick=function(){ location.reload(); };
}

function renderEmailLinkError(){
  app.innerHTML=ForgeAuthCard.shell({
    title:'This email sign-in couldn’t be completed',
    sub:'Request a fresh sign-in email and follow its instructions.'
  },'<div class="dashboard-entry-actions"><a class="auth-btn" href="forge-quiz.html?mode=email">Try email sign-in</a></div>');
}

function loadDashboard(){
  if (ForgeAuth.hasSession()) {
    ForgeAuth.getSession().then(function(result) {
      if (result && result.subscriber) {
        var sub    = result.subscriber;
        var access = result.access;
        st.studentName = sub.name;
        st.isPaid      = access === 'pro';
        st.isTrial     = access === 'trial';
        st.trialDaysLeft = result.daysLeft || 0;
        st.paidSubjects  = sub.subjects || [];
        // Check paid student cache first
        try {
          var paidCache = JSON.parse(localStorage.getItem('forge-paid-student') || 'null');
          if (paidCache && paidCache.studentId) st.studentId = paidCache.studentId;
        } catch(e) {}
        // Check for linked student record
        var saved = null;
        try { saved = JSON.parse(localStorage.getItem('forge-student') || 'null'); } catch(e) {}
        if (saved && saved.studentId) {
          if (!st.studentId) st.studentId = saved.studentId;
          st.classId = saved.classId || st.classId || null;
        }

        function loadProfileWithId() {
          var token = ForgeAuth.accessToken();
          var authUser = ForgeAuth.currentUser();
          if (token && authUser) {
            /* An account holds one student row per class it has joined, and
               its responses are spread across them. Read them all, with the
               access token — a token-less read of `responses` returns [] under
               RLS rather than an error, which is how a student with a full
               history was shown zeros. */
            ForgeClasses.fetchAuthResponses(token, authUser.id, function(rows, error, ids) {
              st.responses = rows || [];
              if (error) st.loadError = true;
              /* Cache an id that actually carries history, so the pages that
                 still scope themselves to one row pick the useful one. */
              if (!error && ids && ids.length) {
                var withHistory = {};
                (rows || []).forEach(function(r){ withHistory[r.student_id] = true; });
                var best = ids.filter(function(id){ return withHistory[id]; })[0] || st.studentId || ids[0];
                st.studentId = best;
                try { localStorage.setItem('forge-paid-student', JSON.stringify({ studentId: best, name: st.studentName })); } catch(e) {}
              }
              renderDashboard();
            });
          } else if (st.studentId) {
            supaGet('responses','student_id=eq.'+st.studentId+'&order=created_at.desc').then(function(r){
              st.responses = r || [];
              renderDashboard();
            }).catch(function(){ st.loadError=true; renderDashboard(); });
          } else {
            renderDashboard();
          }
        }

        ForgeAuth.restoreStudentContexts().then(function(classSession) {
          if (classSession) {
            st.classId = classSession.classId;
            st.studentId = classSession.studentId;
          }
          loadProfileWithId();
        }).catch(function() { loadProfileWithId(); });
      } else {
        ForgeAuth.restoreStudentContexts().then(function(classSession) {
          if (classSession) {
            st.studentId = classSession.studentId;
            st.studentName = classSession.studentName;
            st.classId = classSession.classId;
            st.classCode = classSession.classCode;
            return classSession;
          }
          return ForgeAuth.restoreFreeStudent().then(function(freeSession) {
          st.studentId = freeSession.studentId;
          st.studentName = freeSession.name;
          st.classId = null;
          });
        }).then(function() {
          ForgeClasses.fetchAuthResponses(ForgeAuth.accessToken(), ForgeAuth.currentUser().id, function(rows, error) {
            st.responses = rows || [];
            st.loadError = !!error;
            renderDashboard();
          });
        })
          .catch(function() { renderAccountLoadError(); });
      }
    }).catch(function() { renderAccountLoadError(); });
  } else {
    checkLocalSessionProfile();
  }

  function checkLocalSessionProfile() {
    // Check free session
    var freeSession = null;
    try { freeSession = JSON.parse(localStorage.getItem('forge-free-session') || 'null'); } catch(e) {}
    if (freeSession && freeSession.studentId && ForgeStudyMode.isIndependent()) {
      st.studentId   = freeSession.studentId;
      st.studentName = freeSession.name;
      st.classId     = null;
      // anon cannot SELECT responses directly — the read succeeds and returns
      // nothing. Go through the token-gated RPC instead.
      ForgeClasses.fetchFreeResponses(SUPABASE_URL, SUPABASE_KEY, freeSession, function(r){
        if (r === null) { st.responses = []; st.loadError = true; }
        else { st.responses = r.slice().reverse(); }
        renderDashboard();
      });
      return;
    }
    // Check class session
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem('forge-student') || 'null'); } catch(e) {}
    if (saved && saved.studentId) {
      st.studentId   = saved.studentId;
      st.classId     = saved.classId;
      // The assignment lookup authenticates with these; without them it sent
      // an empty class code and the server returned no assignments.
      st.classCode   = saved.classCode || null;
      st.studentCode = saved.studentCode || null;
      st.studentName = saved.studentName;
      var applyLevelAndLoad = function(){
        if (!saved.classCode) { renderLogin(); return; } // older cached session predates classCode caching — needs one re-entry
        ForgeClasses.adopt(saved);
        // studentCode is required: without it the read falls through to the
        // legacy RPC, which is disabled for coded classes and returns [], so a
        // returning student is told "Your first practice session is waiting."
        var anchor = {studentId: st.studentId, classId: st.classId, classCode: saved.classCode, studentCode: saved.studentCode, studentName: st.studentName, subject: saved.classSubject || null};
        // Home shows the student's own progress across every class they have
        // joined; the class switcher picks which class's plan, league and
        // assignments sit alongside it.
        ForgeClasses.fetchStudentResponses(SUPABASE_URL, SUPABASE_KEY, anchor, function(r, error){
          st.responses = r || [];
          if (error) st.loadError = true;
          renderDashboard();
        });
      };
      if (typeof saved.isGCSE === 'boolean') {
        st.isGCSE = saved.isGCSE;
        applyLevelAndLoad();
      } else if (st.classId) {
        // Older saved sessions predate level tracking — resolve and cache it.
        supaGet('classes','id=eq.'+st.classId).then(function(cls){
          st.isGCSE = Array.isArray(cls) && cls.length>0 && classLevel(cls[0].name)==='gcse';
          try { saved.isGCSE = st.isGCSE; localStorage.setItem('forge-student', JSON.stringify(saved)); } catch(e) {}
          applyLevelAndLoad();
        }).catch(function(){ applyLevelAndLoad(); });
      } else {
        applyLevelAndLoad();
      }
    } else {
      renderLogin();
    }
  }
}
if (forgeEmailLinkAdoption) {
  forgeEmailLinkAdoption.then(function(adopted) {
    if (!adopted) renderEmailLinkError();
  });
} else {
  if (forgeEmailLinkError) {
    if (window.history && window.history.replaceState) {
      window.history.replaceState(null, '', window.location.pathname + window.location.search);
    }
    renderEmailLinkError();
  } else {
    loadDashboard();
  }
}
</script>
<script src="scripts/nav.js"></script>
