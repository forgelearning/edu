<script>
// ===== SUPABASE =====
// Replace these with your Supabase project values (Settings > API)
var SUPABASE_URL = ForgeAPI.config.url;
var SUPABASE_KEY = ForgeAPI.config.key;
window.ForgePersistenceErrors = window.ForgePersistenceErrors || [];
function showPersistenceStatus(detail) {
  var target = document.getElementById('feedback') || document.getElementById('rf-feedback');
  if (!target) return;
  var status = document.getElementById('forge-save-status');
  if (!status) {
    status = document.createElement('div');
    status.id = 'forge-save-status';
    status.className = 'forge-status forge-status--error forge-save-status';
    status.setAttribute('role', 'status');
    target.parentNode.insertBefore(status, target.nextSibling);
  }
  status.textContent = 'We couldn’t sync this answer right now. It is saved on this device; try again when you’re back online.';
  return detail;
}
function recordPersistenceError(error, row, source) {
  var detail = {source:source || 'response', status:error && error.status || null, message:error && error.message || String(error || 'Unknown persistence error'), student_id:row && row.student_id, class_id:row && row.class_id, bank:row && row.bank, question_id:row && row.question_id};
  window.ForgePersistenceErrors.push(detail);
  console.error('Forge response persistence failed:', detail);
  showPersistenceStatus(detail);
  return detail;
}

var supa = {
  _configured: function() { return !!ForgeAPI.config.url; },
  insert: function(table, row) {
    return ForgeAPI.insert(table, row, {headers: {'Prefer': 'return=minimal'}})
      .then(function() { return null; })
      .catch(function(e) { console.error('insert into ' + table + ' failed:', e); return null; });
  },
  select: function(table, filters) {
    var query = '';
    if (filters) {
      var parts = [];
      for (var k in filters) parts.push(k + '=eq.' + encodeURIComponent(filters[k]));
      query = parts.join('&');
    }
    return ForgeAPI.get(table, query).catch(function() { return []; });
  },
  ownResponses: function(studentId, code, name) {
    return ForgeAPI.rpc('get_student_own_responses', {p_student_id: studentId, p_code: code, p_name: name})
      .catch(function() { return []; });
  }
};

function getSubjectForBank(bankKey) {
  for (var s in SUBJECTS) {
    if (SUBJECTS[s].banks.indexOf(bankKey) !== -1) return s;
  }
  return 'unknown';
}

// Resolve the exact exam-board point when a subject has been migrated to the
// shared registry. Older banks continue to fall back to their existing label.
function getSpecPoint(question, bankKey) {
  if (typeof SPEC_REGISTRY === 'undefined') return null;
  var raw = question && (question.specPointId || question.spec) || bankKey;
  var pointId = SPEC_REGISTRY.aliases[raw] || raw;
  return SPEC_REGISTRY.points[pointId] || null;
}

function logResponse(q, selectedKey, isCorrect, isReforge, reforgeCorrect) {
  if (!state.studentId) return Promise.resolve(false);
  var row = {
    student_id: state.studentId,
    class_id: state.classId,
    question_id: isReforge ? q.id + '-RF' : q.id,
    bank: state.bank,
    subject: getSubjectForBank(state.bank),
    selected_option: selectedKey,
    is_correct: isCorrect,
    misconception_tag: isCorrect ? null : (q.tag || null),
    // Fall back to the tag map: most banks carry a tag but no explicit spec, and
    // without this correct answers logged no spec point at all.
    spec_point: q.spec || MC_TO_SPEC[q.tag] || null,
    reforge_attempted: isReforge || false,
    reforge_correct: isReforge ? reforgeCorrect : null
  };
  // Use auth token for trial/paid students so RLS policies pass correctly
  var token = (state.isPaid || state.isTrial) ? ForgeAuth.accessToken() : null;
  if (token) {
    return ForgeAPI.response(SUPABASE_URL + '/rest/v1/responses', {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + token,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify(row)
    }).then(function() { return true; }).catch(function(e) { recordPersistenceError(e, row, 'authenticated-response'); return false; });
  } else if (state.classId) {
    // Class-code students are anonymous, but their student/class pair is the
    // ownership boundary for response writes. Keep this path explicit so a
    // class session cannot silently fall through as a local-only quiz.
    return ForgeAPI.insert('responses', row, {
      headers: {'Prefer': 'return=minimal'}
    }).then(function() { return true; }).catch(function(e) {
      recordPersistenceError(e, row, 'class-response');
      return false;
    });
  } else {
    // Free students write through the token-gated RPC. Besides authorising the
    // row, it enforces the daily quota atomically on the server so clearing
    // localStorage cannot mint another ten-question allowance.
    if (state.studentId && state.classId == null) {
      return ForgeAPI.rpc('record_free_response', {
        p_student_id: state.studentId,
        p_free_token: (loadFreeSession() || {}).freeToken || null,
        p_question_id: row.question_id,
        p_bank: row.bank,
        p_subject: row.subject,
        p_selected_option: row.selected_option,
        p_is_correct: row.is_correct,
        p_misconception_tag: row.misconception_tag,
        p_reforge_attempted: row.reforge_attempted,
        p_reforge_correct: row.reforge_correct
      }).then(function(result) {
        // The server is authoritative. If a stale local meter lets one more
        // question render, stop here and show the same limit wall rather than
        // advancing to a question the server refused to save.
        if (result && result.allowed === false) return result;
        return true;
      }).catch(function(e) { recordPersistenceError(e, row, 'free-response-rpc'); return false; });
    }
    return Promise.resolve(false);
  }
}

function shuffle(a){var b=[...a];for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}

var state = {
  subject: null, bank: null, questions: [], idx: 0, score: 0,
  phase: 'join',
  studentId: null,
  classId: null,
  studentName: null,
  classSubject: null,  // locked subject from class code
  isPaid: false,
  isTrial: false,
  trialDaysLeft: 0,
  paidSubjects: [],
  weightMap: {},       // spaced repetition: questionId → priority weight
  bankStats: {},       // latest per-topic accuracy used by the recommendation
  sessionWrongTags: [] // the session's clearest repair signal
};
var FORGE_SESSION_SIZE = (window.ForgeApp && ForgeApp.session.defaultQuestionCount) || 8;
var FORGE_SESSION_PREFIX = 'forge-session:';
function forgeSessionKey(bank) { return FORGE_SESSION_PREFIX + String(state.studentId || 'anon') + ':' + String(state.classId || 'none') + ':' + bank; }
function forgeSessionStorage(bank) { try { return JSON.parse(localStorage.getItem(forgeSessionKey(bank)) || 'null'); } catch(e) { return null; } }
function forgeSaveSession() {
  if (!state.bank || !state.questions.length) return;
  try {
    var saved = forgeSessionStorage(state.bank) || {completedIds: []};
    var currentId = state.questions[state.idx] && state.questions[state.idx].id;
    if (currentId && saved.completedIds.indexOf(currentId) === -1) saved.completedIds.push(currentId);
    saved.questionIds = state.questions.map(function(q){return q.id;}); saved.idx = state.idx; saved.score = state.score; saved.updatedAt = Date.now();
    localStorage.setItem(forgeSessionKey(state.bank), JSON.stringify(saved));
  } catch(e) {}
}
function forgeStartSession(bank, rawQs) {
  var saved = forgeSessionStorage(bank) || {completedIds: []};
  if (saved.questionIds && saved.questionIds.length && saved.idx < saved.questionIds.length) {
    var byId = {}; rawQs.forEach(function(q){byId[q.id] = q;});
    var resumed = saved.questionIds.map(function(id){return byId[id];}).filter(Boolean);
    if (resumed.length) { state.questions = resumed; state.idx = saved.idx || 0; state.score = saved.score || 0; return; }
  }
  var completed = saved.completedIds || [];
  var available = rawQs.filter(function(q){return completed.indexOf(q.id) === -1;});
  if (!available.length) { available = rawQs; completed = []; }
  state.questions = weightedShuffle(available, state.weightMap || {}).slice(0, FORGE_SESSION_SIZE);
  if(window.forgeTrack) forgeTrack('forge_session_started',{bank:bank,question_count:state.questions.length});
  state.idx = 0; state.score = 0;
  state.sessionWrongTags = [];
  try { localStorage.setItem(forgeSessionKey(bank), JSON.stringify({completedIds: completed, questionIds: state.questions.map(function(q){return q.id;}), idx: 0, score: 0, updatedAt: Date.now()})); } catch(e) {}
}
function forgeCompleteSession() {
  try {
    var saved = forgeSessionStorage(state.bank) || {completedIds: []};
    var completed = saved.completedIds || [];
    state.questions.forEach(function(q){if(completed.indexOf(q.id) === -1) completed.push(q.id);});
    localStorage.setItem(forgeSessionKey(state.bank), JSON.stringify({completedIds: completed, updatedAt: Date.now()}));
  } catch(e) {}
}

    var bank = BANKS[state.bank];

}

function settleRequestedSubject() {

// ── JOINING A CLASS ───────────────────────────────────────────
// Each class the student joins gets its own `students` row, so their answers
// in that subject are attributed to that class — and therefore to the teacher
// who handed out the code. Re-entering a code they've already used reuses the
// existing row instead of creating a duplicate.
// cb(err, {cls, studentId}).
function joinClassByCode(name, code, cb) {
  // One call: finds or creates this student's row for the class and returns
  // its id. A direct insert can't do this — anon may write to students but
  // can't read it back, so asking for the row returned fails the whole
  // request and silently creates nothing.
  ForgeAPI.response(SUPABASE_URL + '/rest/v1/rpc/join_class_as_student', {
    method: 'POST',
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ p_code: code, p_name: name })
  }).then(function(r) { return r.json(); }).then(function(rows) {
    if (!Array.isArray(rows) || rows.length === 0 || !rows[0].student_id) {
      cb('Class code not found. Check with your teacher.');
      return;
    }
    var row = rows[0];
    var cls = { id: row.class_id, name: row.class_name, subject: row.subject };

    ForgeClasses.add({
      classId: cls.id, classCode: code, className: cls.name || null,
      subject: cls.subject || null, studentId: row.student_id, studentName: name
    });

    // Keep each class row independent. A new class must start with an empty
    // class-scoped history; never merge it with a row from another class.
    cb(null, { cls: cls, studentId: row.student_id });
  }).catch(function() { cb('We couldn’t join this class right now. Check your connection and try again.'); });
}

// Point state at a given class — used when the student picks a subject, so
// their answers land against that class's student row.
function activateClass(entry) {
  if (!entry) return;
  state.classId      = entry.classId;
  state.studentId    = entry.studentId;
  state.classSubject = entry.subject || null;
  if (entry.studentName) state.studentName = entry.studentName;
  try {
    localStorage.setItem('forge-student', JSON.stringify({
      studentId: entry.studentId, classId: entry.classId, classCode: entry.classCode,
      studentName: state.studentName, classSubject: entry.subject || null
    }));
  } catch(e) {}
}

// Another teacher hands out another code — students add it here rather than
// signing out and back in. Rendered on both the subject picker and the bank
// list, because a student with a single class is taken straight past the
// picker and would otherwise have no way to reach this.
function joinMoreHtml() {
  if (!state.classId && ForgeClasses.subjects(SUBJECTS).length === 0) return '';
  var h = '<div class="forge-u-1kt0xuh" id="join-more">';
  h += '<div class="forge-u-8hgxgk">';
  h += '<span class="ui-meta-muted">Got a code for another class?</span>';
  h += '<button class="forge-u-8q3i1z" id="jm-toggle">Join another class ↓</button>';
  h += '</div>';
  h += '<div class="forge-u-1karbkd" id="jm-form">';
  h += '<input id="jm-code" class="join-input forge-u-dtise6" type="text" placeholder="e.g. LH-RVN9">';
  h += '<button id="jm-btn" class="join-btn btn-glass btn-ember forge-u-1og9mh9">Join class →</button>';
  h += '<p class="join-err" id="jm-err"></p>';
  h += '</div></div>';
  return h;
}

function wireJoinMore() {
  var toggle = document.getElementById('jm-toggle');
  if (!toggle) return;
  toggle.onclick = function() {
    var f = document.getElementById('jm-form');
    f.style.display = f.style.display === 'none' ? 'block' : 'none';
    if (f.style.display === 'block') document.getElementById('jm-code').focus();
  };
  document.getElementById('jm-btn').onclick = function() {
    var code = document.getElementById('jm-code').value.trim().toUpperCase();
    var err  = document.getElementById('jm-err');
    var btn  = document.getElementById('jm-btn');
    err.style.display = 'none';
    if (!code) { err.textContent = 'Enter your class code.'; err.style.display = 'block'; return; }
    btn.disabled = true; btn.textContent = 'Joining…';
    joinClassByCode(state.studentName, code, function(joinErr, res) {
      btn.disabled = false; btn.textContent = 'Join class →';
      if (joinErr) { err.textContent = joinErr; err.style.display = 'block'; return; }
      if (!res.cls.subject || !SUBJECTS[res.cls.subject]) {
        err.textContent = 'Joined ' + (res.cls.name || code) + ', but that subject has no questions yet.';
        err.style.display = 'block';
        return;
      }
      // Land on the picker so the newly added subject is visible.
      settleRequestedSubject();
      render();
    });
  };
}

// ── FREE TIER DAILY LIMIT ─────────────────────────────────────
var FREE_DAILY_LIMIT = 10;
var DAILY_KEY = 'forge-daily-' + new Date().toISOString().slice(0,10); // resets at midnight

function getDailyCount() {
  try { return parseInt(localStorage.getItem(DAILY_KEY) || '0', 10); } catch(e) { return 0; }
}

function incrementDailyCount() {
  try { localStorage.setItem(DAILY_KEY, getDailyCount() + 1); } catch(e) {}
  refreshFreeQuotaDisplay();
}

// The quota meter sits in the question header, which is not re-rendered when an
// answer is marked — patch it in place so the count never lags behind the
// questions the student has actually used.
function refreshFreeQuotaDisplay() {
  var label = document.getElementById('free-quota-label');
  var fill  = document.getElementById('free-quota-fill');
  if (!label && !fill) return;
  var used = getDailyCount();
  var remaining = Math.max(0, FREE_DAILY_LIMIT - used);
  var col = remaining <= 2 ? 'var(--bad)' : remaining <= 5 ? 'var(--hot)' : 'var(--good)';
  if (label) {
    label.textContent = remaining + ' free question' + (remaining !== 1 ? 's' : '') + ' left today';
    label.style.color = col;
  }
  if (fill) {
    fill.style.width = Math.min(100, (used / FREE_DAILY_LIMIT) * 100) + '%';
    fill.style.background = col;
  }
}

function isFreeTier() {
  // Paid, trial, and class-joined students all get unlimited questions
  return !state.isPaid && !state.isTrial && !state.classId;
}

function isAtDailyLimit() {
  return isFreeTier() && getDailyCount() >= FREE_DAILY_LIMIT;
}

function secondsUntilMidnight() {
  var now = new Date();
  var midnight = new Date(now);
  midnight.setHours(24, 0, 0, 0);
  return Math.floor((midnight - now) / 1000);
}

function formatCountdown(secs) {
  var h = Math.floor(secs / 3600);
  var m = Math.floor((secs % 3600) / 60);
  var s = secs % 60;
  return (h > 0 ? h + 'h ' : '') + (m > 0 ? m + 'm ' : '') + s + 's';
}

// ── FREE STUDENT PERSISTENCE ──────────────────────────────────
// ── PAID/TRIAL STUDENT ID ─────────────────────────────────────
// Trial/paid students need a students table row to log responses.
// We create one on first quiz start and cache it in localStorage.

function ensurePaidStudentId() {
  if (state.studentId) return Promise.resolve(state.studentId);
  if (!state.isPaid && !state.isTrial) return Promise.resolve(null);

  // Check localStorage cache first
  var cached = null;
  try { cached = JSON.parse(localStorage.getItem('forge-paid-student') || 'null'); } catch(e) {}
  if (cached && cached.studentId && cached.name === state.studentName && state.classId) {
    state.studentId = cached.studentId;
    return Promise.resolve(state.studentId);
  }

  var authUser = ForgeAuth.currentUser();
  var token = ForgeAuth.accessToken();
  if (!authUser || !token) return Promise.resolve(null);

  // Use the user's own auth token — anon key won't pass RLS policies
  var authHdrs = {
    'apikey': SUPABASE_KEY,
    'Authorization': 'Bearer ' + token,
    'Content-Type': 'application/json'
  };

  // Look up existing student row
  return ForgeAPI.response(SUPABASE_URL + '/rest/v1/students?select=*&auth_user_id=eq.' + authUser.id + '&order=created_at.asc&limit=1', {
    headers: authHdrs
  }).then(function(r) { return r.json(); }).then(function(rows) {
    if (rows && rows.length > 0) {
      var id = rows[0].id;
      state.studentId = id;
      // Direct assignment links do not carry class context. Restore it from
      // the authenticated student's row so response writes are attributable
      // to the class that owns the assignment.
      if (!state.classId && rows[0].class_id) state.classId = rows[0].class_id;
      try { localStorage.setItem('forge-paid-student', JSON.stringify({ studentId: id, name: state.studentName })); } catch(e) {}
      return id;
    }
    // No existing row — create one
    return ForgeAPI.response(SUPABASE_URL + '/rest/v1/students', {
      method: 'POST',
      headers: Object.assign({}, authHdrs, { 'Prefer': 'return=representation' }),
      body: JSON.stringify({ name: state.studentName || 'Student', class_id: null, auth_user_id: authUser.id })
    }).then(function(r) {
      if (!r.ok) { return r.text().then(function(t){ console.error('student insert failed:', r.status, t); return null; }); }
      return r.json();
    }).then(function(inserted) {
      var id = (Array.isArray(inserted) && inserted[0]) ? inserted[0].id : null;
      if (id) {
        state.studentId = id;
        try { localStorage.setItem('forge-paid-student', JSON.stringify({ studentId: id, name: state.studentName })); } catch(e) {}
      }
      return id;
    });
  }).catch(function(e) { console.error('ensurePaidStudentId error:', e); return null; });
}
var FREE_SESSION_KEY = 'forge-free-session';

function loadFreeSession() {
  try { return JSON.parse(localStorage.getItem(FREE_SESSION_KEY) || 'null'); } catch(e) { return null; }
}

// The free token is this device's credential for reading its own responses
// back (get_free_student_responses). Without it the Anvil cannot see anything
// the student has answered, so it has to survive in the session.
function saveFreeSession(name, studentId, freeToken) {
  try { localStorage.setItem(FREE_SESSION_KEY, JSON.stringify({ name: name, studentId: studentId, freeToken: freeToken || null })); } catch(e) {}
}

function generateFreeId() {
  // Random 12-char alphanumeric token
  var chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
  var id = 'free-';
  for (var i = 0; i < 12; i++) id += chars[Math.floor(Math.random() * chars.length)];
  return id;
}

// Register a free student in Supabase (or reuse existing record)
// Uses a deterministic lookup: students table has a 'free_token' column
// Falls back gracefully if column doesn't exist yet
function registerFreeStudent(name, token) {
  // Goes through an RPC for the same reason as joining a class: anon can
  // insert into students but not read it back, so a direct insert asking for
  // the new row fails outright. Reuses the row matching this device's token.
  return ForgeAPI.response(SUPABASE_URL + '/rest/v1/rpc/create_free_student', {
    method: 'POST',
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ p_name: name, p_free_token: token })
  }).then(function(r) { return r.json(); }).then(function(rows) {
    return (Array.isArray(rows) && rows[0]) ? rows[0].student_id : null;
  }).catch(function() { return null; });
}

var app = document.getElementById('app');

function render() {
  document.body.classList.toggle('forge-login-screen', state.phase === 'join');
  if (requestedBank && BANKS[requestedBank] && (state.studentName || state.classId) && state.phase !== 'quiz') {
    // Assignment links are bank-specific. Establish both the bank and its
    // subject before starting so restoration cannot fall back to the full
    // subject bank list.
    state.subject = getSubjectForBank(requestedBank);
    if (requestedClassId) state.classId = requestedClassId;
    var requestedClass = ForgeClasses.forSubject(state.subject);
    if (requestedClass) activateClass(requestedClass);
    var launchRequestedBank = function() {
      // The authenticated route can arrive before the paid/trial student row
      // has been restored. Do not render a session that cannot log responses.
      state.bank = requestedBank;
      forgeStartSession(requestedBank, BANKS[requestedBank].questions.filter(function(q){return !q.type||q.type==='fill_blank';}));
      state.phase = 'quiz';
      requestedBankStarted = true;
      requestedBank = null;
      render();
    };
    if (!state.studentId && (state.isPaid || state.isTrial)) {
      ensurePaidStudentId().then(launchRequestedBank).catch(launchRequestedBank);
      return;
    }
    launchRequestedBank();
  }
  if (state.phase === 'join') renderJoin();
  else if (state.phase === 'trial-expired') renderTrialExpiredWall();
  else if (state.phase === 'subjects') renderSubjects();
  else if (state.phase === 'banks') renderBanks();
  else if (state.phase === 'quiz') renderQuiz();
  else if (state.phase === 'results') renderResults();
  else if (state.phase === 'mandarin-reader') renderMandarinReader();
}

function renderJoin() {
  var h = '';

  // Three-tab switcher — free / class code / Pro login
  h += '<div class="login-tabs">';
  h += '<button type="button" class="login-tab active" id="tab-free">Free</button>';
  h += '<button type="button" class="login-tab" id="tab-class">Join class</button>';
  h += '<button type="button" class="login-tab" id="tab-solo">Log in</button>';
  h += '</div>';

  // Panel: Free tier
  h += '<div id="panel-free">';
  h += '<p class="forge-u-1xgpbl">10 free questions per day · no account needed</p>';
  h += '<div class="forge-u-eelu4s">';
  h += '<div class="forge-u-1ce89bl"><span>✓ All subjects &amp; question banks</span><span class="forge-text-dim">free</span></div>';
  h += '<div class="forge-u-1ce89bl"><span>✓ Scaffolds &amp; re-forge feedback</span><span class="forge-text-dim">free</span></div>';
  h += '<div class="forge-u-1ce89bl"><span class="forge-text-dim">✕ Crucible · full Anvil · XP ranks</span><span class="forge-text-dim">Pro</span></div>';
  h += '<div class="forge-u-h6lji0"><span class="forge-text-dim">✕ Unlimited questions</span><span class="forge-text-dim">Pro</span></div>';
  h += '</div>';
  h += ForgeAuthCard.field('free-name', 'Your first name', {placeholder:'e.g. Alex', autocomplete:'given-name'});
  h += '<button class="auth-btn" id="free-btn" type="submit">Start for free →</button>';
  h += '<p class="auth-err" id="free-err"></p>';
  h += '</div>';

  // Panel: Join class
  h += '<div class="forge-u-uydnfn" id="panel-class">';
  h += '<p class="forge-u-152cbjr">Enter your name and the code your teacher gave you</p>';
  h += ForgeAuthCard.field('join-name', 'Your name', {placeholder:'First name and surname — e.g. James Morgan'});
  h += ForgeAuthCard.field('join-code', 'Class code', {placeholder:'e.g. ECON-Y12-A', upper:true});
  h += '<button class="auth-btn" id="join-btn" type="submit">Join class →</button>';
  h += '<p class="auth-err" id="join-err"></p>';
  h += '</div>';

  // Panel: Pro login
  h += '<div class="forge-u-uydnfn" id="panel-solo">';
  h += '<p class="forge-u-152cbjr">Log in with your Forge email and password</p>';
  h += ForgeAuthCard.field('solo-email', 'Email address', {type:'email', placeholder:'e.g. alex@gmail.com', autocomplete:'email'});
  h += ForgeAuthCard.field('solo-pass', 'Password', {type:'password', placeholder:'Your Forge password', autocomplete:'current-password'});
  h += '<button class="auth-btn" id="solo-btn" type="submit">Log in →</button>';
  h += '<p class="auth-err" id="solo-err"></p>';
  h += '<p class="forge-u-gtw5fv"><a class="forge-u-elt0p9" href="reset-password.html">Forgot your password?</a></p>';
  h += '</div>';

  app.innerHTML = ForgeAuthCard.shell({
    title: 'Welcome to Forge',
    sub: 'Start free, join your class, or log in to Pro.',
    foot: 'Want unlimited? <a href="forge-signup.html">Subscribe — £2.99/mo</a>'
  }, h);

  // Tab switching
  var tabs = [
    {btn: 'tab-free',  panel: 'panel-free'},
    {btn: 'tab-class', panel: 'panel-class'},
    {btn: 'tab-solo',  panel: 'panel-solo'},
  ];
  var activeTab = openClassJoin ? 'tab-class' : openSoloLogin ? 'tab-solo' : 'tab-free';
  function activateTab(which) {
    activeTab = which;
    tabs.forEach(function(t) {
      var isActive = t.btn === which;
      document.getElementById(t.btn).classList.toggle('active', isActive);
      document.getElementById(t.panel).style.display = isActive ? 'block' : 'none';
    });
  }
  tabs.forEach(function(t) {
    document.getElementById(t.btn).onclick = function() { activateTab(t.btn); };
  });
  activateTab(activeTab);

  // Enter submits whichever panel is showing.
  ForgeAuthCard.onSubmit(function() {
    var btn = activeTab === 'tab-class' ? 'join-btn' : activeTab === 'tab-solo' ? 'solo-btn' : 'free-btn';
    document.getElementById(btn).onclick();
  });

  // Free tier handler
  document.getElementById('free-btn').onclick = function() {
    var name = document.getElementById('free-name').value.trim();
    var err  = document.getElementById('free-err');
    var btn  = document.getElementById('free-btn');
    if (!name) { err.textContent = 'Enter your first name.'; err.style.display = 'block'; return; }

    btn.disabled = true; btn.textContent = 'Starting\u2026';

    ForgeClasses.use(name);

    // Check for existing free session on this device
    var existingSession = loadFreeSession();
    if (existingSession && existingSession.studentId) {
      // Returning free student on same device — restore their ID, update name
      state.studentName = name;
      state.studentId   = existingSession.studentId;
      state.classId     = null;
      state.isPaid      = false;
      saveFreeSession(name, existingSession.studentId, existingSession.freeToken);

      // Load their weight map for spaced repetition. This has to go through the
      // token-gated RPC: a direct read as anon returns an empty list, which
      // silently gave every returning free student a blank weight map and so
      // no spaced repetition at all.
      ForgeClasses.fetchFreeResponses(SUPABASE_URL, SUPABASE_KEY, existingSession, function(responses) {
        state.weightMap = buildWeightMap(responses || []);
        state.bankStats = buildBankStats(responses || []);
        if (state.phase === 'banks') render();
      });

      settleRequestedSubject();
      render();
      return;
    }

    // New free student — generate token and register
    var token = generateFreeId();
    registerFreeStudent(name, token).then(function(studentId) {
      state.studentName = name;
      state.studentId   = studentId;
      state.classId     = null;
      state.isPaid      = false;
      saveFreeSession(name, studentId || token, token);
      settleRequestedSubject();
      render();
    }).catch(function() {
      // Supabase failed — proceed without ID, progress won't persist server-side
      state.studentName = name;
      state.studentId   = null;
      state.classId     = null;
      state.isPaid      = false;
      saveFreeSession(name, token, token);
      settleRequestedSubject();
      render();
    });
  };

  // Join class handler
  document.getElementById('join-btn').onclick = function() {
    var rawName = document.getElementById('join-name').value.trim();
    var code = document.getElementById('join-code').value.trim().toUpperCase();
    var err  = document.getElementById('join-err');
    var btn  = document.getElementById('join-btn');

    err.style.display = 'none';
    if (!rawName) { err.textContent = 'Enter your name.'; err.style.display = 'block'; return; }
    if (!code) { err.textContent = 'Enter your class code.'; err.style.display = 'block'; return; }

    // Require at least a first name and surname, but preserve the entered
    // display name so teachers can distinguish students with similar initials.
    var parts = rawName.trim().split(/\s+/);
    var name;
    if (parts.length < 2) {
      err.textContent = 'Enter your first name and surname — e.g. James Morgan';
      err.style.display = 'block'; return;
    }
    // Keep the full entered name (with collapsed whitespace) rather than
    // reducing it to "First I", which makes two students look identical.
    name = rawName.trim().replace(/\s+/g, ' ');

    if (!supa._configured()) {
      state.studentName = name;
      settleRequestedSubject();
      render();
      return;
    }

    btn.disabled = true; btn.textContent = 'Joining...';
    err.style.display = 'none';

    state.studentName = name;
    joinClassByCode(name, code, function(joinErr, res) {
      if (joinErr) {
        err.textContent = joinErr;
        err.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Join class \u2192';
        return;
      }
      // Signing in anywhere recovers every class they're linked to, so a
      // student on a new device doesn't re-enter each code.
      ForgeClasses.syncFromServer(SUPABASE_URL, SUPABASE_KEY,
        { studentId: res.studentId, classId: res.cls.id, classCode: code,
          className: res.cls.name, subject: res.cls.subject, studentName: name }, function() {
          activateClass(ForgeClasses.forSubject(res.cls.subject) || {
            classId: res.cls.id, classCode: code, subject: res.cls.subject,
            studentId: res.studentId, studentName: name
          });
          // A successful student sign-in is an account/session entry point,
          // so land on the dashboard first. Students can open Forge from the
          // dashboard navigation when they are ready to practise.
          ForgeAuth.goToLanding();
        });
    });
  };

  // Pro login handler
  document.getElementById('solo-btn').onclick = function() {
    var email = document.getElementById('solo-email').value.trim();
    var pass  = document.getElementById('solo-pass').value;
    var err   = document.getElementById('solo-err');
    var btn   = document.getElementById('solo-btn');

    err.style.display = 'none';
    if (!email || !email.includes('@')) { err.textContent = 'Enter your email address.'; err.style.display = 'block'; return; }
    if (!pass) { err.textContent = 'Enter your password.'; err.style.display = 'block'; return; }

    btn.disabled = true; btn.textContent = 'Logging in\u2026';

    ForgeAuth.signIn(email, pass).then(function() {
      return ForgeAuth.getSession();
    }).then(function(result) {
      btn.disabled = false; btn.textContent = 'Log in \u2192';
      if (!result || !result.subscriber) {
        err.textContent = 'No active subscription found for this account.';
        err.style.display = 'block';
        ForgeAuth.signOut();
        return;
      }
      var sub = result.subscriber;
      state.studentName  = sub.name;
      ForgeClasses.use(sub.name);
      state.isPaid       = true;
      state.paidSubjects = sub.subjects || [];
      if (state.paidSubjects.length === 1 && SUBJECTS[state.paidSubjects[0]]) {
        state.subject      = state.paidSubjects[0];
        state.classSubject = state.paidSubjects[0];
        state.phase        = 'banks';
      } else {
        state.phase = 'subjects';
      }
      try { localStorage.setItem('forge-student', JSON.stringify({ studentName: sub.name, isPaid: true, paidSubjects: sub.subjects || [], classSubject: state.classSubject || null })); } catch(e) {}
      // Signed in — send the student to their dashboard, not into the quiz.
      ForgeAuth.goToLanding();
    }).catch(function(e) {
      btn.disabled = false; btn.textContent = 'Log in \u2192';
      err.textContent = 'We couldn’t sign you in. Check your details and try again.';
      err.style.display = 'block';
    });
  };
}


function renderSubjects(){
  var h = '';
  if (state.studentName) {
    var statusLabel = state.classId ? ' · class' : state.isPaid ? ' · Pro' : state.isTrial ? ' · trial' : ' · free';
    h += '<div class="join-badge"><span class="dot"></span> ' + state.studentName + statusLabel + '</div>';
  }

  // Class link prompt for trial/paid students not yet in a class
  if ((state.isPaid || state.isTrial) && !state.classId) {
    h += '<div class="forge-u-1rz1eg2" id="class-link-banner">';
    h += '<div class="forge-between-row">';
    h += '<span class="forge-u-1qo1pg">Optional</span>';
    h += '<button class="forge-u-1f5fxqy" data-forge-action="toggle-class-link">Link to class ↓</button>';
    h += '</div>';
    h += '<p class="forge-u-1tg6uy0">Is your teacher using Forge? <b class="forge-text-white">Enter their class code</b> to share your progress.</p>';
    h += '<div class="forge-u-1karbkd" id="class-link-form">';
    h += '<input id="ql-code" class="join-input forge-u-dtise6" type="text" placeholder="e.g. ECON-Y12-A">';
    h += '<button id="ql-btn" class="join-btn btn-glass btn-ember forge-u-1og9mh9">Link to class →</button>';
    h += '<p class="join-err" id="ql-err"></p>';
    h += '</div></div>';
  }

  // Trial days remaining nudge
  if (state.isTrial && state.trialDaysLeft <= 3 && state.trialDaysLeft > 0) {
    h += '<div class="forge-u-10v1r9j">';
    h += '⏰ ' + state.trialDaysLeft + ' day' + (state.trialDaysLeft !== 1 ? 's' : '') + ' left on your trial · <a class="forge-u-1ojcao3" href="forge-signup.html">Subscribe to keep access →</a>';
    h += '</div>';
  }

  h += '<div class="center"><p class="tag forge-u-bhmr11">FORGE</p>';
  h += '<h1 class="forge-u-z7clmb">Pick a subject</h1>';
  h += '<p class="forge-u-1vn3cqv">Choose what to practise</p></div>';
  h += '<div class="subject-list">';

  // Students see the subjects of every class they've joined. Paid/trial
  // students without classes see the subjects in their plan.
  var joinedSubjects = ForgeClasses.subjects(SUBJECTS);
  var subjectKeys = Object.keys(SUBJECTS);
  if (joinedSubjects.length > 0) {
    subjectKeys = joinedSubjects;
  } else if ((state.isPaid || state.isTrial) && state.paidSubjects && state.paidSubjects.length > 0) {
    subjectKeys = state.paidSubjects.filter(function(k) { return SUBJECTS[k]; });
  }

  subjectKeys.forEach(function(k){
    var s=SUBJECTS[k];
    var countLabel;
    if (s.readerMode) {
      countLabel = MANDARIN_PASSAGES.length + ' reading passage' + (MANDARIN_PASSAGES.length === 1 ? '' : 's');
    } else {
      var n=s.banks.reduce(function(t,b){return t+BANKS[b].questions.length},0);
      countLabel = s.banks.length+' banks \u00b7 '+n+' questions';
    }
    var entry = ForgeClasses.forSubject(k);
    if (entry && entry.className) countLabel += ' \u00b7 ' + entry.className;
    h+='<button class="subject-btn" data-key="'+k+'" style="border-color:'+s.color+'25">';
    h+='<h3 style="color:'+s.color+'">'+s.label+'</h3>';
    h+='<div class="sub">'+s.sub+'</div>';
    h+='<div class="count">'+countLabel+'</div>';
    h+='</button>';
  });
  h+='</div>';

  h += joinMoreHtml();

  app.innerHTML=h + sessionBar();
  app.querySelectorAll('.subject-btn').forEach(function(b){
    b.onclick=function(){
      state.subject=b.dataset.key;
      // Answers must land against the student row for the class that owns
      // this subject, so the right teacher sees them.
      activateClass(ForgeClasses.forSubject(b.dataset.key));
      var s = SUBJECTS[b.dataset.key];
      if (s && s.readerMode) {
        state.phase = 'mandarin-reader';
        state.mrState = { submitted: {}, tfSel: {}, mcqSel: {}, correct: 0, total: MANDARIN_PASSAGES[0].questions.length, passageIdx: 0 };
      } else {
        state.phase='banks';
      }
      render();
    };
  });

  wireJoinMore();

  // Wire up class link form if visible
  var qlBtn = document.getElementById('ql-btn');
  if (qlBtn) {
    qlBtn.onclick = function() {
      var code = document.getElementById('ql-code').value.trim().toUpperCase();
      var err  = document.getElementById('ql-err');
      var btn  = qlBtn;
      err.style.display = 'none';
      if (!code) { err.textContent = 'Enter your class code.'; err.style.display = 'block'; return; }

      btn.disabled = true; btn.textContent = 'Linking…';

      ForgeAPI.response(SUPABASE_URL + '/rest/v1/rpc/get_class_by_code', {
        method: 'POST',
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ p_code: code })
      }).then(function(r) { return r.json(); }).then(function(classes) {
        if (!Array.isArray(classes) || classes.length === 0) {
          err.textContent = 'Class code not found. Check with your teacher.';
          err.style.display = 'block';
          btn.disabled = false; btn.textContent = 'Link to class →';
          return;
        }
        var cls = classes[0];
        var token = ForgeAuth.accessToken();
        var authHdrs = { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + (token || SUPABASE_KEY), 'Content-Type': 'application/json', 'Prefer': 'return=representation' };

        function finishLink(studentId) {
          state.classId      = cls.id;
          state.studentId    = studentId;
          state.classSubject = cls.subject || null;
          try { localStorage.setItem('forge-student', JSON.stringify({ studentId: studentId, classId: cls.id, classCode: code, studentName: state.studentName, classSubject: cls.subject || null })); } catch(e) {}
          try { localStorage.setItem('forge-paid-student', JSON.stringify({ studentId: studentId, name: state.studentName })); } catch(e) {}
          ForgeClasses.add({
            classId: cls.id, classCode: code, className: cls.name || null,
            subject: cls.subject || null, studentId: studentId, studentName: state.studentName
          });

          // Backfill responses — update student_id to the new class row AND set class_id
          // This ensures teacher dashboard shows the student's history correctly
          if (authUser && token) {
            var subjectFilter = cls.subject ? '&subject=eq.' + encodeURIComponent(cls.subject) : '';
            var userAuthHdrs = { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' };
            // Find ALL student rows for this auth user
            ForgeAPI.response(SUPABASE_URL + '/rest/v1/students?select=id&auth_user_id=eq.' + authUser.id, {
              headers: userAuthHdrs
            }).then(function(r) { return r.json(); }).then(function(studentRows) {
              if (!Array.isArray(studentRows) || studentRows.length === 0) return;
              // For each existing student row, move matching subject responses to the new class row
              studentRows.forEach(function(sr) {
                if (sr.id === studentId) return; // skip the new row itself
                ForgeAPI.response(SUPABASE_URL + '/rest/v1/responses?student_id=eq.' + sr.id + subjectFilter, {
                  method: 'PATCH',
                  headers: userAuthHdrs,
                  body: JSON.stringify({ student_id: studentId, class_id: cls.id })
                }).catch(function(e) { console.error('Backfill failed:', sr.id, e); });
              });
            }).catch(function(e) { console.error('Backfill lookup failed:', e); });
          }
          var banner = document.getElementById('class-link-banner');
          if (banner) {
            banner.innerHTML = '<p class="forge-u-iyagyp">✓ Linked to <b>' + (cls.name || code) + '</b> — your teacher can now see your progress and your quiz history has carried over.</p>';
          }
          setTimeout(function() { render(); }, 1500);
        }

        // Insert as the signed-in user, not anon: the new row carries their
        // auth_user_id, which is what lets them read it back. Under the anon
        // key there's no SELECT policy, so asking for the row returned fails
        // the whole insert and no row is created.
        var anonHdrs = authHdrs;

        // Always look up existing student row first by auth_user_id to find canonical row
        var authUser = ForgeAuth.currentUser();
        var lookupHdrs = { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + (token || SUPABASE_KEY) };

        function lookupAndLink() {
          if (!authUser) {
            insertNewStudent();
            return;
          }
          // Look for an existing row already linked to THIS specific class
          ForgeAPI.response(SUPABASE_URL + '/rest/v1/students?select=*&auth_user_id=eq.' + authUser.id + '&class_id=eq.' + cls.id, {
            headers: lookupHdrs
          }).then(function(r) { return r.json(); }).then(function(rows) {
            if (Array.isArray(rows) && rows.length > 0) {
              // Already linked to this class — just finish
              finishLink(rows[0].id);
              return;
            }
            // No row for this class yet — create one
            insertNewStudent();
          }).catch(function() { insertNewStudent(); });
        }

        function insertNewStudent() {
          ForgeAPI.response(SUPABASE_URL + '/rest/v1/students', {
            method: 'POST',
            headers: anonHdrs,
            body: JSON.stringify({ name: state.studentName, class_id: cls.id, auth_user_id: authUser ? authUser.id : null })
          }).then(function(r) { return r.json(); }).then(function(rows) {
            var studentId = (Array.isArray(rows) && rows[0]) ? rows[0].id : null;
            finishLink(studentId);
          }).catch(function(e) {
            console.error('INSERT error:', e);
            err.textContent = 'We couldn’t link you to this class. Check your connection and try again.';
            err.style.display = 'block';
            btn.disabled = false; btn.textContent = 'Link to class →';
          });
        }

        lookupAndLink();
      }).catch(function() {
        err.textContent = 'We couldn’t link you to this class. Check your connection and try again.';
        err.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Link to class →';
      });
    };
  }
}

function renderBanks(){
  var subj=SUBJECTS[state.subject];
  // Students in more than one class always need a way back to their other
  // subjects, so only lock when this really is their only one.
  var choices = ForgeClasses.subjects(SUBJECTS).length
             || ((state.isPaid || state.isTrial) ? (state.paidSubjects || []).length : 0);
  var locked = state.classSubject && state.classSubject === state.subject && choices <= 1;
  var h='';
  // Only show back button if not locked to a subject
  if (!locked) h+='<button class="back-btn" id="back-subj">\u2190 Subjects</button>';
  h+='<div class="center"><p class="tag" style="color:'+subj.color+';margin-bottom:4px">FORGE</p>';
  h+='<h2 class="forge-u-1oh0w3h">'+subj.label+'</h2>';
  h+='<p class="forge-u-10yda30">'+subj.sub+'</p></div>';
  var recommendedBank = recommendedBankForSubject(subj);
  var recommended = BANKS[recommendedBank];
  var confidence = window.ForgeContentConfidence && window.ForgeContentConfidence.statusFor ? window.ForgeContentConfidence.statusFor(state.subject) : {tier:'full'};
  var recommendedQuestions = recommended ? recommended.questions.filter(function(q){return !q.type||q.type==='fill_blank';}) : [];
  h += '<section class="forge-recommendation" aria-labelledby="recommended-session-title">';
  h += '<p class="forge-recommendation__eyebrow">Recommended next</p>';
  h += '<h2 id="recommended-session-title" class="forge-recommendation__title">An eight-question session in '+subj.label+'</h2>';
  h += '<p class="forge-recommendation__copy">We picked '+(recommended ? recommended.label : 'the next available topic')+' because it is the clearest place to build momentum. You can change the session below.</p>';
  if (window.ForgeContentConfidence && window.ForgeContentConfidence.badge) {
    // The student reads this directly, so use the second-person wording.
    var cc = window.ForgeContentConfidence;
    var learnerNote = (cc.learnerExperiences || cc.experiences)[confidence.tier];
    h += '<div class="forge-content-selection-status">'+cc.badge(confidence.tier)+' '+cc.explanations[confidence.tier]+' '+learnerNote+'</div>';
  }
  var recommendedCount = (window.ForgeApp && ForgeApp.session) ? ForgeApp.session.questionsFor(recommendedQuestions.length) : Math.min(FORGE_SESSION_SIZE, recommendedQuestions.length || FORGE_SESSION_SIZE);
  var recommendedMinutes = (window.ForgeApp && ForgeApp.session) ? ForgeApp.session.estimatedMinutesFor(recommendedCount) : Math.max(4, Math.round(recommendedCount * 0.75));
  h += '<dl class="forge-session-detail"><div><dt>Topic</dt><dd>'+(recommended ? recommended.label : 'Current topic')+'</dd></div><div><dt>Questions</dt><dd>'+recommendedCount+'</dd></div><div><dt>Estimated time</dt><dd>~'+recommendedMinutes+' min</dd></div></dl>';
  h += '<button class="forge-button forge-button--primary" id="start-recommended">Start recommended session →</button>';
  h += '<p class="forge-session-change"><button class="forge-link-button" id="change-session" type="button">Change session</button> to choose a different bank.</p></section>';
  h+='<div class="bank-list" id="all-session-options" hidden>';
  subj.banks.forEach(function(key){
    var b=BANKS[key];
    var point = getSpecPoint({}, key);
    h+='<button class="bank-btn" data-key="'+key+'">';
    h+='<div class="code" style="color:'+b.color+'">'+key+'</div>';
    h+='<div class="name">'+(point ? point.title : b.label)+'</div>';
    if (point) h+='<div class="qcount">'+point.code+' · '+point.paper+'</div>';
    h+='<div class="qcount">'+b.questions.length+' questions</div>';
    h+='</button>';
  });
  h+='</div>';
  // Locked students never see the subject picker, so this is their only
  // route to adding a second class.
  if (locked) h += joinMoreHtml();
  app.innerHTML=h + sessionBar();
  var recommendedBtn=document.getElementById('start-recommended');
  if(recommendedBtn) recommendedBtn.onclick=function(){
    if(!recommended || !recommendedQuestions.length) return;
    state.bank=recommendedBank; forgeStartSession(recommendedBank,recommendedQuestions);
    ensurePaidStudentId().then(function(){state.phase='quiz';render();});
  };
  var changeBtn=document.getElementById('change-session');

function renderFillBlankQuiz(q,bk,headerHtml){
  var parts=q.template.split('___');
  var sentHtml='<div class="fb-sentence">';
  parts.forEach(function(part,i){
    sentHtml+=part.replace(/\n/g,'<br>');
    if(i<parts.length-1) sentHtml+='<span class="fb-blank" data-idx="'+i+'" data-word=""></span>';
  });
  sentHtml+='</div>';

  var bankWords=q.bank.slice();
  for(var i=bankWords.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var tmp=bankWords[i];bankWords[i]=bankWords[j];bankWords[j]=tmp;
  }

  var h=window.ForgeQuestion.renderFillBlank(q,bankWords,sentHtml);
  h=headerHtml+h;

  app.innerHTML=h;
  document.getElementById('back-banks').onclick=function(){state.phase='banks';render();};

  var blanks=app.querySelectorAll('.fb-blank');
  var words=app.querySelectorAll('.fb-word');
  var checkBtn=document.getElementById('fb-check');
  var answered=false;

  function nextEmptyBlank(){
    for(var k=0;k<blanks.length;k++){ if(!blanks[k].dataset.word) return blanks[k]; }
    return null;
  }
  function updateCheckState(){
    var allFilled=nextEmptyBlank()===null;
    checkBtn.classList.toggle('ready',allFilled&&!answered);
  }

  words.forEach(function(w){
    w.onclick=function(){
      if(answered||w.classList.contains('used'))return;
      var target=nextEmptyBlank();
      if(!target)return;
      target.textContent=w.dataset.word;
      target.dataset.word=w.dataset.word;
      target.dataset.wi=w.dataset.wi;
      target.classList.add('filled');
      w.classList.add('used');
      updateCheckState();
    };
  });

  blanks.forEach(function(b){
    b.onclick=function(){
      if(answered||!b.dataset.word)return;
      var wi=b.dataset.wi;
      var w=app.querySelector('.fb-word[data-wi="'+wi+'"]');
      if(w) w.classList.remove('used');
      b.textContent='';
      b.dataset.word='';
      b.dataset.wi='';
      b.classList.remove('filled');
      updateCheckState();
    };
  });

  checkBtn.onclick=function(){
    if(answered||!checkBtn.classList.contains('ready'))return;
    answered=true;
    var allCorrect=true;
    var given=[];
    blanks.forEach(function(b){
      var idx=parseInt(b.dataset.idx,10);
      var correctWord=q.blanks[idx];
      given.push(b.dataset.word);
      b.classList.add('locked');
      if(b.dataset.word===correctWord){
        b.classList.add('correct');
      }else{
        b.classList.add('wrong');
        allCorrect=false;
      }
    });
    if(allCorrect) state.score++;
    if(isFreeTier()) incrementDailyCount();
    if(state.weightMap){
      if(allCorrect){ state.weightMap[q.id]=Math.max(0.2,(state.weightMap[q.id]||1)*0.5); }
      else{ state.weightMap[q.id]=3; }
    }
    var responseSaved = logResponse(q,given.join('|'),allCorrect,false,null);
    forgeSyncStudentWidgetProgress();

    checkBtn.style.display='none';

    var fb=document.getElementById('feedback');
    fb.innerHTML=window.ForgeQuestion.renderFeedback(q,allCorrect);
    if(!allCorrect){
      if(q.reforge){
        document.getElementById('rf-btn').onclick=function(){
          document.getElementById('rf-btn').classList.add('hidden');
          renderReforge(q,document.getElementById('rf-area'),bk.color);
        };
      }
    }
    forgeSaveSession();
    document.getElementById('next-btn').onclick=function(){
      var next = function(){ state.idx++;render(); };
      if (responseSaved && typeof responseSaved.then === 'function') responseSaved.then(function(result){
        if (result && result.allowed === false) { renderLimitWall(); return; }
        if (result === false) {
          showPersistenceStatus();
          var continueBtn = document.getElementById('next-btn');
          if (continueBtn) {
            continueBtn.textContent = 'Continue anyway';
            continueBtn.onclick = next;
            continueBtn.focus();
          }
          return;
        }
        next();
      }).catch(function(){
        showPersistenceStatus();
        var continueBtn = document.getElementById('next-btn');
        if (continueBtn) {
          continueBtn.textContent = 'Continue anyway';
          continueBtn.onclick = next;
          continueBtn.focus();
        }
      });
      else next();
    };
    revealQuizNext();
  };
}

function calcXPFromResponses(responses){
  var xp=0;
  responses.forEach(function(r){
    if(r.question_id&&r.question_id.endsWith('-CRU')&&r.is_correct) xp+=30;
    else if(r.reforge_attempted&&r.reforge_correct) xp+=20;
    else if(r.is_correct&&!r.reforge_attempted) xp+=10;
  });
  return xp;
}
function calcStreakFromResponses(responses){
  if(!responses.length) return 0;
  var dates=[...new Set(responses.map(function(r){return r.created_at?r.created_at.substring(0,10):'';}))].filter(Boolean).sort().reverse();
  if(!dates.length) return 0;
  var today=new Date().toISOString().substring(0,10);
  var yesterday=new Date(Date.now()-86400000).toISOString().substring(0,10);
  if(dates[0]!==today&&dates[0]!==yesterday) return 0;
  var streak=1;
  for(var i=1;i<dates.length;i++){
    var prev=new Date(dates[i-1]);prev.setDate(prev.getDate()-1);
    if(dates[i]===prev.toISOString().substring(0,10)) streak++;
    else break;
  }
  return streak;
}

// ===== SPACED REPETITION ENGINE =====
function buildWeightMap(responses) {
  var now = Date.now();
  var DAY = 86400000;
  var qData = {};
  responses.forEach(function(r) {
    if (!r.question_id || r.reforge_attempted) return;
    var id = r.question_id;
    if (!qData[id]) qData[id] = {correct:0, wrong:0, lastWrong:0};
    if (r.is_correct) qData[id].correct++;
    else {
      qData[id].wrong++;
      var ts = r.created_at ? new Date(r.created_at).getTime() : 0;
      if (ts > qData[id].lastWrong) qData[id].lastWrong = ts;
    }
  });
  var weights = {};
  Object.keys(qData).forEach(function(id) {
    var d = qData[id];
    var daysSinceWrong = d.lastWrong ? (now - d.lastWrong) / DAY : 999;
    if (d.correct >= 3 && d.wrong === 0) weights[id] = 0.2;
    else if (d.wrong > 0 && daysSinceWrong <= 7) weights[id] = 3;
    else if (d.wrong > 0) weights[id] = 2;
  });
  return weights;
}

function buildBankStats(responses) {
  var latest = {};
  (responses || []).forEach(function(r) {
    if (!r || !r.bank || !r.question_id || r.reforge_attempted) return;
    var marker = String(r.bank) + '|' + String(r.question_id).replace(/-RF$/, '');
    var timestamp = r.created_at ? new Date(r.created_at).getTime() : 0;
    if (!latest[marker] || timestamp >= latest[marker].timestamp) {
      latest[marker] = {bank: String(r.bank), correct: !!r.is_correct, timestamp: timestamp};
    }
  });
  var stats = {};
  Object.keys(latest).forEach(function(marker) {
    var item = latest[marker];
    if (!stats[item.bank]) stats[item.bank] = {answered: 0, correct: 0};
    stats[item.bank].answered++;
    if (item.correct) stats[item.bank].correct++;
  });
  return stats;
}

function recommendedBankForSubject(subject) {
  var banks = subject && subject.banks || [];
  if (!banks.length) return null;
  var best = banks[0];
  var bestWeakness = -1;
  banks.forEach(function(bank) {
    var stats = state.bankStats && state.bankStats[bank];
    // Unattempted topics are treated as 0% complete, while attempted topics
    // are ranked by their latest per-question accuracy. This moves the
    // recommendation away from a topic once it has been mastered.
    var weakness = stats && stats.answered ? 1 - (stats.correct / stats.answered) : 1;
    if (weakness > bestWeakness) {
      best = bank;
      bestWeakness = weakness;
    }
  });
  return best;
}

function weightedShuffle(questions, weightMap) {
  var scored = questions.map(function(q) {
    var w = (weightMap && weightMap[q.id] !== undefined) ? weightMap[q.id] : 1;
    return {q: q, score: w * (0.5 + Math.random())};
  });
  scored.sort(function(a, b) { return b.score - a.score; });
  return scored.map(function(s) { return s.q; });
}

      state.studentName  = savedSession.studentName;
      state.classSubject = savedSession.classSubject || null;
      state.isPaid       = false;
      state.isTrial      = false;

      // Sessions from before multi-class support only know about one class —
      // fold it into the list so it sits alongside any joined since.
      ForgeClasses.adopt(savedSession);

      function settlePhase() {
        // Class sync can finish after the requested bank has already opened.
        // Preserve that assignment route instead of returning to the picker.
        if (requestedBankStarted && state.bank && BANKS[state.bank]) {
          state.subject = getSubjectForBank(state.bank);
          state.phase = 'quiz';
          return;
        }
        if (requestedSubject && SUBJECTS[requestedSubject]) {
          state.subject = requestedSubject;
          state.phase = 'banks';
          requestedSubject = null;
          return;
        }
        var joined = ForgeClasses.subjects(SUBJECTS);
        if (joined.length === 1) {
          state.subject      = joined[0];
          state.classSubject = joined[0];
          state.phase        = 'banks';
        } else if (joined.length > 1) {
          state.phase = 'subjects';
        } else if (state.classSubject && SUBJECTS[state.classSubject]) {
          state.subject = state.classSubject;
          state.phase   = 'banks';
        } else {
          state.phase = 'subjects';

          ForgeClasses.backfillSubjects(SUPABASE_URL, SUPABASE_KEY, function() {

              state.subject = subs[0]; state.classSubject = subs[0]; state.phase = 'banks';
            }
            if (subs.length) render();
          });
        }
      }

      settlePhase();

      ForgeClasses.syncFromServer(SUPABASE_URL, SUPABASE_KEY, {
        studentId: state.studentId, classCode: savedSession.classCode, studentName: state.studentName
      }, function() { settlePhase(); render(); });

        }).catch(function() { state.weightMap = {}; });

  });

      h += '</div>';
      h += '<button data-forge-action="mr-submit" data-question-id="'+q.id+'" id="mr-sbtn-'+q.id+'" '+(isSubmitted||!tfVal?'disabled':'')+' style="width:100%;padding:10px;border-radius:var(--radius-sm);border:none;background:#e8472a;color:#fff;font-family:\'Poppins\',sans-serif;font-size:13px;font-weight:600;cursor:pointer;margin-top:12px;opacity:'+(isSubmitted||!tfVal?'.4':'1')+'">Check answer</button>';
    } else if (q.type === 'find') {
      h += '<div class="forge-u-paoxfs">📌 '+q.lineRef+'</div>';
      h += '<input class="forge-u-1ldj335" id="mr-find-'+q.id+'" data-forge-action="mr-find-input" data-question-id="'+q.id+'" placeholder="Type the character(s) here…">';
      h += '<button class="forge-u-9r1sf3" data-forge-action="mr-submit" data-question-id="'+q.id+'" id="mr-sbtn-'+q.id+'" disabled>Check answer</button>';
    } else {
      var selK = mrs.mcqSel[q.id] || '';
      q.opts.forEach(function(o){
        var sel = selK === o.k;
        var corr = isSubmitted && o.k === q.answer;
        var wrong = isSubmitted && sel && !corr;
        var borderC = corr ? 'var(--good)' : wrong ? 'var(--bad)' : sel ? '#c9a84c' : 'var(--line)';
        var bgC = corr ? 'rgba(127,217,138,.08)' : wrong ? 'rgba(255,90,90,.07)' : sel ? 'rgba(201,168,76,.06)' : 'var(--panel-2)';
        var letterC = corr ? 'var(--good)' : wrong ? 'var(--bad)' : sel ? '#c9a84c' : '#8A857E';
        var textStyle = o.zh ? 'font-family:\'Noto Sans SC\',STHeiti,SimHei,sans-serif;font-size:14px' : '';
        h += '<button data-forge-action="mr-select-mcq" data-question-id="'+q.id+'" data-letter="'+o.k+'" style="display:flex;align-items:flex-start;gap:10px;padding:11px 13px;border-radius:var(--radius-sm);border:1px solid '+borderC+';background:'+bgC+';cursor:pointer;text-align:left;width:100%;margin-bottom:7px;font-family:\'Poppins\',sans-serif">';
        h += '<span style="width:20px;height:20px;border-radius:50%;border:1px solid '+letterC+';display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;color:'+letterC+'">'+o.k+'</span>';
        h += '<span style="font-size:13px;line-height:1.5;color:var(--white);padding-top:1px;'+textStyle+'">'+o.t+'</span>';
        h += '</button>';
      });
      h += '<button data-forge-action="mr-submit" data-question-id="'+q.id+'" id="mr-sbtn-'+q.id+'" '+(isSubmitted||!selK?'disabled':'')+' style="width:100%;padding:10px;border-radius:var(--radius-sm);border:none;background:#e8472a;color:#fff;font-family:\'Poppins\',sans-serif;font-size:13px;font-weight:600;cursor:pointer;margin-top:4px;opacity:'+(isSubmitted||!selK?'.4':'1')+'">Check answer</button>';
    }

    // Feedback
    if (isSubmitted) {
      h += '<div style="margin-top:12px;padding:12px 14px;border-radius:var(--radius-sm);'+(isCorrect?'background:rgba(127,217,138,.1);border:1px solid rgba(127,217,138,.25)':'background:rgba(255,90,90,.08);border:1px solid rgba(255,90,90,.2)')+'">';
      h += '<div style="font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;margin-bottom:5px;color:'+(isCorrect?'var(--good)':'var(--bad)')+'">'+(isCorrect?'✓ Correct':'✗ Review')+'</div>';
      h += '<div class="forge-u-rpxuuv">'+q.fb[isCorrect?'correct':'incorrect']+'</div>';
      h += '</div>';
    }

    h += '</div>';
  });

  h += '</div></div>'; // close questions panel + layout

  app.innerHTML = h;
}

function mrSelectTF(qid, val) {
  if (state.mrState.submitted[qid]) return;
  state.mrState.tfSel[qid] = val;
  render();
}

function mrFindInput(qid) {
  var el = document.getElementById('mr-find-'+qid);
  var btn = document.getElementById('mr-sbtn-'+qid);
  if (!el || !btn) return;
  var hasVal = el.value.trim().length > 0;
  btn.disabled = !hasVal;
  btn.style.opacity = hasVal ? '1' : '.4';
}

function mrSelectMCQ(qid, letter) {
  if (state.mrState.submitted[qid]) return;
  state.mrState.mcqSel[qid] = letter;
  render();
}

function mrSubmit(qid) {
  if (state.mrState.submitted[qid]) return;
  var p = MANDARIN_PASSAGES[state.mrState.passageIdx || 0];
  var q = p.questions.find(function(x){ return x.id === qid; });
  var isCorrect = false;

  if (q.type === 'tf') {
    var tfOk = state.mrState.tfSel[qid] === q.tfAnswer;
    var just = (document.getElementById('mr-just-'+qid)||{}).value || '';
    var justOk = just.trim().length > 0 && q.justKeys.some(function(kw){ return just.includes(kw); });
    isCorrect = tfOk && justOk;
  } else if (q.type === 'find') {
    var val = ((document.getElementById('mr-find-'+qid)||{}).value||'').trim();
    isCorrect = val.includes(q.answer);
  } else {
    isCorrect = state.mrState.mcqSel[qid] === q.answer;
  }

  state.mrState.submitted[qid] = isCorrect;
  if (isCorrect) state.mrState.correct++;

  // Log to Supabase
  if (state.studentId) {
    var row = { student_id: state.studentId, class_id: state.classId, question_id: qid, bank: 'MAN-EXP-1', subject: 'mandarin', selected_option: isCorrect ? q.answer : '?', is_correct: isCorrect, misconception_tag: isCorrect ? null : 'MC-MAN-01', reforge_attempted: false, reforge_correct: null };
    supa.insert('responses', row);
  }

  render();
}
</script>
