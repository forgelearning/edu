<!doctype html>
<html lang="en-GB">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forge — Assigned</title><link rel="stylesheet" href="css/tokens.css"><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/sidebar.css"><style>body{font-family:Inter,sans-serif;color:var(--slate)}h1,h2{font-family:Sora,sans-serif;color:var(--white)}.wrap{max-width:760px;margin:0 auto;padding:48px 24px}.card{margin-top:14px;padding:18px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-md)}.meta{font-size:13px;color:#8A857E}.topic{display:inline-block;margin:12px 6px 0 0;padding:5px 10px;color:var(--ember);background:rgba(255,107,44,.1);border-radius:var(--radius-sm);font-size:12px}.status{display:inline-block;margin:10px 8px 0 0;padding:4px 8px;border-radius:999px;font:11px 'JetBrains Mono',monospace}.status-not-started{color:var(--slate);background:var(--panel-2)}.status-progress{color:var(--hot);background:rgba(255,201,60,.12)}.status-complete{color:var(--good);background:rgba(127,217,138,.12)}.status-overdue{color:var(--bad);background:rgba(255,90,90,.1)}.assignment-progress{margin-top:14px}.assignment-progress-label{display:flex;justify-content:space-between;gap:12px;font:11px 'JetBrains Mono',monospace;color:#8A857E;margin-bottom:6px}.assignment-progress-track{height:6px;background:var(--line);border-radius:999px;overflow:hidden}.assignment-progress-fill{height:100%;background:var(--ember);border-radius:999px;transition:width .2s}</style></head>
<body>
<script src="scripts/forge-logo.js"></script><script src="forge-auth.js"></script><script src="scripts/forge-sidebar.js"></script><script src="data/forge-data.js"></script>
<script>function forgeSignOut(){try{localStorage.removeItem('forge-student');localStorage.removeItem('forge-anvil-open')}catch(e){}if(window.ForgeAuth)ForgeAuth.signOut();location.href='forge-quiz.html'}ForgeSidebar.mount({active:'assignments',items:[{key:'dashboard',href:'student-dashboard.html',label:'Dashboard'},{key:'forge',href:'forge-quiz.html',label:'Forge'},{key:'assignments',href:'assignments.html',label:'Assigned'},{key:'anvil',href:'anvil.html',label:'Anvil'},{key:'crucible',href:'crucible.html',label:'Crucible'}],footerItems:[{key:'profile',href:'profile.html',label:'Profile'}],signOut:forgeSignOut});</script>
<script src="scripts/forge-student-badges.js"></script>
<main class="wrap"><div style="font:11px 'JetBrains Mono',monospace;color:var(--ember);text-transform:uppercase">Student work</div><h1>Assigned</h1><p>Your teacher’s current assignments appear here. The full course remains available in <a href="forge-quiz.html">Forge</a>.</p><div id="list" class="card">Loading assignments…</div></main>
<script>
var API='https://crysulmbaadjkymcjrew.supabase.co',KEY=window.SUPABASE_KEY,el=document.getElementById('list'),saved=null;
try{saved=JSON.parse(localStorage.getItem('forge-student')||'null')}catch(e){}
function headers(){return{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'}}
function jsonFetch(url,options){return Promise.race([fetch(url,options).then(function(r){if(!r.ok)throw Error('Request failed: '+r.status);return r.json()}),new Promise(function(_,reject){setTimeout(function(){reject(Error('Request timed out'))},8000)})])}
function banks(v){try{return typeof v==='string'?JSON.parse(v):v||[]}catch(e){return[]}}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function progress(a,responses){var bs=banks(a.banks),done={},created=a.created_at?new Date(a.created_at):null,answered=0;responses.forEach(function(r){if(created&&(!r.created_at||new Date(r.created_at)<created))return;done[r.bank]=done[r.bank]||{};var id=String(r.question_id||'').replace(/-RF$/,'');if(!done[r.bank][id]){done[r.bank][id]=true;answered++}});var total=bs.reduce(function(n,b){var d=BANKS[b];return n+(d&&d.questions?d.questions.filter(function(q){return !q.type||q.type==='fill_blank'}).length:0)},0);return{answered:answered,total:total,complete:total>0&&answered>=total}}
function status(a,responses){var p=progress(a,responses);if(p.complete)return['Completed','complete',p];var due=a.due_date&&new Date(a.due_date)<new Date(new Date().setHours(0,0,0,0));if(due)return['Overdue','overdue',p];if(p.answered)return['In progress','progress',p];return['Not started','not-started',p]}
function render(rows,responses){var cacheKey='forge-assigned-open:'+String(saved&&saved.studentId||'anon')+':'+String(saved&&saved.classId||'none');if(!rows.length){el.textContent='No assignments yet. Your teacher’s assignments will appear here.';try{localStorage.setItem(cacheKey,'0')}catch(e){}if(window.ForgeSidebar)ForgeSidebar.setBadge('assignments',null);return}var outstanding=0;el.className='';el.innerHTML=rows.map(function(a){var s=status(a,responses);if(s[1]!=='complete')outstanding++;var p=s[2],bs=banks(a.banks),pct=p.total?Math.min(100,Math.round(p.answered/p.total*100)):0;return'<section class="card"><h2>'+esc(a.title)+'</h2><div class="meta">'+(a.due_date?'Due '+new Date(a.due_date).toLocaleDateString('en-GB',{day:'numeric',month:'short'}):'No due date')+'</div><span class="status status-'+s[1]+'">'+s[0]+'</span><div class="assignment-progress" aria-label="Assignment progress"><div class="assignment-progress-label"><span>'+p.answered+' of '+p.total+' questions answered</span><span>'+pct+'%</span></div><div class="assignment-progress-track"><div class="assignment-progress-fill" style="width:'+pct+'%"></div></div></div><div>'+bs.map(function(b){return'<a class="topic" href="forge-quiz.html?bank='+encodeURIComponent(b)+'">'+esc(BANKS[b]?BANKS[b].label:b)+' →</a>'}).join('')+'</div></section>'}).join('');try{localStorage.setItem(cacheKey,String(outstanding))}catch(e){}if(window.ForgeSidebar)ForgeSidebar.setBadge('assignments',outstanding||null)}
function load(s){if(!s||!s.classId){el.textContent='Join a class to see your assignments.';return}var responsePromise=s.studentId&&s.classCode?jsonFetch(API+'/rest/v1/rpc/get_student_own_responses',{method:'POST',headers:headers(),body:JSON.stringify({p_student_id:s.studentId,p_code:s.classCode,p_name:s.studentName})}):Promise.resolve([]);Promise.all([jsonFetch(API+'/rest/v1/assignments?select=*&class_id=eq.'+encodeURIComponent(s.classId)+'&order=due_date.asc',{headers:headers()}),responsePromise]).then(function(d){render(Array.isArray(d[0])?d[0]:[],Array.isArray(d[1])?d[1]:[])}).catch(function(e){el.textContent='Assignments could not be loaded. '+(e&&e.message?e.message:'Please try again.')})}
if(saved&&saved.classId)load(saved);else if(ForgeAuth.hasSession())ForgeAuth.getSession().then(function(){var token=ForgeAuth.accessToken(),user=ForgeAuth.currentUser();return fetch(API+'/rest/v1/students?select=id,class_id&auth_user_id=eq.'+user.id,{headers:{apikey:KEY,Authorization:'Bearer '+token}})}).then(function(r){return r.json()}).then(function(rows){if(!rows[0])throw Error('No class');saved={studentId:rows[0].id,classId:rows[0].class_id,studentName:(ForgeAuth.currentUser()||{}).user_metadata?.name||''};try{localStorage.setItem('forge-student',JSON.stringify(saved))}catch(e){}load(saved)}).catch(function(){el.textContent='Join a class to see your assignments.'});else el.textContent='Join a class to see your assignments.';
</script></body></html>
