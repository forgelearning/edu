name: Deploy static site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deployment
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate question bank
        run: node scripts/check-question-bank.js

      - name: Validate subject-page counts
        run: node scripts/check-subject-counts.js

      - name: Validate specification coverage
        run: node scripts/check-spec-coverage.js

      - name: Validate stem diversity
        run: node scripts/check-stem-diversity.js

      - name: Validate stem language
        run: node scripts/check-stem-language.js

      - name: Audit distractor balance and structure
        run: node dev/audit-banks.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
