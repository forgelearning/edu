<script>
// ===== SUPABASE =====
// Replace these with your Supabase project values (Settings > API)
var SUPABASE_URL = ForgeAPI.config.url;
var SUPABASE_KEY = ForgeAPI.config.key;
window.ForgePersistenceErrors = window.ForgePersistenceErrors || [];
function showPersistenceStatus(detail) {
  var target = document.getElementById('feedback') || document.getElementById('rf-feedback');
  if (!target) return;
  var status = document.getElementById('forge-save-status');
  if (!status) {
    status = document.createElement('div');
    status.id = 'forge-save-status';
    status.className = 'forge-status forge-status--error forge-save-status';
    status.setAttribute('role', 'status');
    target.parentNode.insertBefore(status, target.nextSibling);
  }
  status.textContent = 'We couldn’t sync this answer right now. It is saved on this device; try again when you’re back online.';
  return detail;
}
function recordPersistenceError(error, row, source) {
  var detail = {source:source || 'response', status:error && error.status || null, message:error && error.message || String(error || 'Unknown persistence error'), student_id:row && row.student_id, class_id:row && row.class_id, bank:row && row.bank, question_id:row && row.question_id};
  window.ForgePersistenceErrors.push(detail);
  console.error('Forge response persistence failed:', detail);
  showPersistenceStatus(detail);
  return detail;
}

var supa = {
  _configured: function() { return !!ForgeAPI.config.url; },
  insert: function(table, row) {
    return ForgeAPI.insert(table, row, {headers: {'Prefer': 'return=minimal'}})
      .then(function() { return null; })
      .catch(function(e) { console.error('insert into ' + table + ' failed:', e); return null; });
  },
  select: function(table, filters) {
    var query = '';
    if (filters) {
      var parts = [];
      for (var k in filters) parts.push(k + '=eq.' + encodeURIComponent(filters[k]));
      query = parts.join('&');
    }
    return ForgeAPI.get(table, query).catch(function() { return []; });
  }
};

function getSubjectForBank(bankKey) {
  for (var s in SUBJECTS) {
    if (SUBJECTS[s].banks.indexOf(bankKey) !== -1) return s;
  }
  return 'unknown';
}

// Resolve the exact exam-board point when a subject has been migrated to the
// shared registry. Older banks continue to fall back to their existing label.
function getSpecPoint(question, bankKey) {
  if (typeof SPEC_REGISTRY === 'undefined') return null;
  var raw = question && (question.specPointId || question.spec) || bankKey;
  var pointId = SPEC_REGISTRY.aliases[raw] || raw;
  return SPEC_REGISTRY.points[pointId] || null;
}

function logResponse(q, selectedKey, isCorrect, isReforge, reforgeCorrect, hintUsed) {
  if (!state.studentId) return Promise.resolve(false);
  var questionBank = state.questionBanks && state.questionBanks[q.id] || state.bank;
  var row = {
    student_id: state.studentId,
    class_id: state.classId,
    // A "Did it stick?" check (scripts/forge-fixed.js) is saved as -CHK with
    // its tag, right or wrong, so the check can be read back without banks.
    question_id: isReforge ? q.id + '-RF' : state.check ? q.id + '-CHK' : q.id,
    bank: questionBank,
    subject: getSubjectForBank(questionBank),
    selected_option: selectedKey,
    is_correct: isCorrect,
    // A successful Re-forge still belongs to the misconception it repairs.
    // Older builds dropped the tag on correct twins, so the Anvil — which skips
    // untagged rows — never advanced the streak and the signal could not be
    // cleared from the quiz, while a failed twin still counted and reset it.
    misconception_tag: isReforge || state.check ? (q.tag || null) : (isCorrect ? null : (q.tag || null)),
    // Fall back to the tag map: most banks carry a tag but no explicit spec, and
    // without this correct answers logged no spec point at all.
    spec_point: q.spec || MC_TO_SPEC[q.tag] || null,
    reforge_attempted: isReforge || false,
    reforge_correct: isReforge ? reforgeCorrect : null,
    assignment_id: state.assignmentId || null
  };
  if (hintUsed) row.hint_used = true;
  if (requestedAssignmentId) row.assignment_id = requestedAssignmentId;
  state.responseHistory.push(Object.assign({created_at:new Date().toISOString()},row));
  // Use auth token for trial/paid students so RLS policies pass correctly
  var token = (state.isPaid || state.isTrial) ? ForgeAuth.accessToken() : null;
  if (token) {
    return ForgeAPI.response(SUPABASE_URL + '/rest/v1/responses', {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + token,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify(row)
    }).then(function() { return true; }).catch(function(e) { recordPersistenceError(e, row, 'authenticated-response'); return false; });
  } else if (state.classId && state.studentCode) {
    // Class-code students are anonymous, but their student/class pair is the
    // ownership boundary for response writes. Keep this path explicit so a
    // class session cannot silently fall through as a local-only quiz.
    return ForgeStudentCode.recordResponse(state.studentId,state.classCode,state.studentCode,row).then(function() { return true; }).catch(function(e) {
      recordPersistenceError(e, row, 'class-response');
      return false;
    });
  } else if (state.classId) {
    return ForgeAPI.insert('responses', row, {
      headers: {'Prefer': 'return=minimal'}
    }).then(function() { return true; }).catch(function(e) {
      recordPersistenceError(e, row, 'legacy-class-response');
      return false;
    });
  } else {
    // Free students write through the token-gated RPC. Besides authorising the
    // row, it enforces the daily allowance on the server.
    if (state.studentId && state.classId == null) {
      var freePayload = {
        p_student_id: state.studentId,
        p_free_token: (loadFreeSession() || {}).freeToken || null,
        p_question_id: row.question_id,
        p_bank: row.bank,
        p_subject: row.subject,
        p_selected_option: row.selected_option,
        p_is_correct: row.is_correct,
        p_misconception_tag: row.misconception_tag,
        p_reforge_attempted: row.reforge_attempted,
        p_reforge_correct: row.reforge_correct,
        p_assignment_id: row.assignment_id || null
      };
      if (row.hint_used) freePayload.p_hint_used = true;
      return ForgeAPI.rpc('record_free_response', freePayload).then(function(result) {
        // The server is authoritative. If a stale local meter lets one more
        // question render, stop here and show the same limit wall rather than
        // advancing to a question the server refused to save.
        if (result && result.allowed === false) return result;
        if (!freePayload.p_reforge_attempted) syncFreeRoundFromServer(result);
        return true;
      }).catch(function(e) { recordPersistenceError(e, row, 'free-response-rpc'); return false; });
    }
    return Promise.resolve(false);
  }
}


// ── MC tag → spec point lookup (for backfilling historic responses) ──
var MC_TO_SPEC = {
  "MC-AD-01":"2.2.1",
  "MC-AD-02":"2.2.1",
  "MC-AD-03":"2.2.1",
  "MC-AD-04":"2.2.1",
  "MC-AD-05":"2.2.1",

  bankStats: {},       // latest per-topic accuracy used by the recommendation
  topicSpec: null,      // Chemistry topic chosen for this quiz session

  responseHistory: [],  // answered questions behind the topic marks
  sessionWrongTags: [], // misconceptions that fired in this session
  sessionReforgedTags: [], // fired misconceptions repaired by their twin
  baseXP: null,        // lifetime XP from history loaded at page start; null until known
  pageXP: 0,           // XP earned on this page load, across sessions
  sessionXP: 0         // XP earned in the current session
};
var FORGE_SESSION_SIZE = (window.ForgeApp && ForgeApp.session.defaultQuestionCount) || 8;
function forgeQuestionCount() { return isFreeTier() ? 10 : FORGE_SESSION_SIZE; }
var FORGE_SESSION_PREFIX = 'forge-session:';
function forgeSessionKey(bank) { return FORGE_SESSION_PREFIX + String(state.studentId || 'anon') + ':' + String(state.classId || 'none') + ':' + bank + (state.topicSpec ? ':' + state.topicSpec : '') + (state.challenge ? ':challenge:' + state.challenge.id : ''); }
function forgeSessionStorage(bank) { try { return JSON.parse(localStorage.getItem(forgeSessionKey(bank)) || 'null'); } catch(e) { return null; } }
function forgeSaveSession(resumeAt) {
  if (!state.bank || !state.questions.length || state.check) return;
  try {
    var saved = forgeSessionStorage(state.bank) || {completedIds: []};
    var currentId = state.questions[state.idx] && state.questions[state.idx].id;
    if (currentId && saved.completedIds.indexOf(currentId) === -1) saved.completedIds.push(currentId);
    saved.questionIds = state.questions.map(function(q){return q.id;}); saved.idx = typeof resumeAt === 'number' ? resumeAt : typeof state.cardReturnResumeAt === 'number' ? state.cardReturnResumeAt : state.idx; saved.score = state.score; saved.xp = state.sessionXP; saved.updatedAt = Date.now();
    localStorage.setItem(forgeSessionKey(state.bank), JSON.stringify(saved));
  } catch(e) {}
}
function forgeStartSession(bank, rawQs) {
  // Any ordinary set ends a "Did it stick?" set: its answers are not checks.
  state.check = null;
  var saved = forgeSessionStorage(bank) || {completedIds: []};
  if (saved.questionIds && saved.questionIds.length && saved.idx <= saved.questionIds.length) {
    var byId = {}; rawQs.forEach(function(q){byId[q.id] = q;});
    var resumed = saved.questionIds.map(function(id){return byId[id];}).filter(Boolean);
    if (resumed.length) { state.questions = resumed; state.idx = saved.idx || 0; state.score = saved.score || 0; state.sessionXP = saved.xp || 0; return; }
  }
  var completed = saved.completedIds || [];
  var available = rawQs.filter(function(q){return completed.indexOf(q.id) === -1;});
  if (!available.length) { available = rawQs; completed = []; }
  state.questions = state.challenge ? rawQs.slice() : weightedShuffle(available, state.weightMap || {}).slice(0, forgeQuestionCount());
  if(window.forgeTrack) forgeTrack('forge_session_started',{bank:bank,question_count:state.questions.length});
  state.idx = 0; state.score = 0; state.sessionXP = 0;
  state.sessionWrongTags = [];
  state.sessionReforgedTags = [];
  try { localStorage.setItem(forgeSessionKey(bank), JSON.stringify({completedIds: completed, questionIds: state.questions.map(function(q){return q.id;}), idx: 0, score: 0, updatedAt: Date.now()})); } catch(e) {}
}
// One question per set is answered from memory first: the student types
// what they remember, then picks from the options. It is still scored as the
// multiple-choice answer; writing first means the answer has to be recalled
// rather than recognised. Chosen by rule, not stored, so a resumed set picks
// the same question.
var RECALL_ANSWER_MAX = 60;
function forgeRecallIndex(questions) {
  for (var i = 2; i < (questions || []).length; i++) {
    var q = questions[i];
    if (q && !q.type && q.options && String(q.options[q.correct] || '').length <= RECALL_ANSWER_MAX) return i;
  }
  return -1;
}
function forgeCompleteSession() {
  if (state.check) return;
  try {
    var saved = forgeSessionStorage(state.bank) || {completedIds: []};
    var completed = saved.completedIds || [];
    state.questions.forEach(function(q){if(completed.indexOf(q.id) === -1) completed.push(q.id);});
    localStorage.setItem(forgeSessionKey(state.bank), JSON.stringify({completedIds: completed, updatedAt: Date.now()}));
  } catch(e) {}
}
// ── XP feedback ──
// The amounts mirror calcXPFromResponses (and the dashboard's calcXP): a
// correct first answer is 10, a correct similar question after a wrong one is
// 20. Keep them in step, or the number a student sees here will not match the
// total on their dashboard. Free-tier students do not see XP during a quiz:
// pricing lists full XP tracking as part of Pro. Ranks are not Pro-only; free
// students see theirs on Home and Profile, which also celebrate a new one.
var XP_CORRECT = 10, XP_REFORGE = 20, XP_HINTED = 5;
function xpEnabled() { return !isFreeTier(); }
function setXPHistory(responses) {
  // Every history loader ends here. responseHistory starts as [], so this is
  // what tells "not loaded yet" apart from "no answers".
  state.historyLoaded = true;
  var quizXp=calcXPFromResponses(responses || []);
  if(typeof ForgeRewards!=='undefined')ForgeRewards.rememberQuizXp(state.studentId,quizXp);
  state.baseXP=quizXp+(typeof ForgeRewards!=='undefined'?ForgeRewards.read(state.studentId).matchXp:0);
  if(typeof ForgeRewards!=='undefined'&&state.studentId&&state.rewardLoadedFor!==state.studentId){
    state.rewardLoadedFor=state.studentId;
    ForgeRewards.load({studentId:state.studentId,classCode:state.classCode,studentCode:state.studentCode,studentName:state.studentName}).then(function(){state.baseXP=quizXp+ForgeRewards.read(state.studentId).matchXp;}).catch(function(){});
  }
}
function awardXP(amount, host) {
  if (!xpEnabled() || !amount) return;
  state.sessionXP += amount;
  state.pageXP += amount;
  if (host) {
    var repair = amount === XP_REFORGE;
    var anvil = repair ? '<svg class="xp-gain__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 13h16l-1.5-3.5a2 2 0 0 0-1.84-1.22L14 8.2V6h1a1 1 0 0 0 0-2H9a1 1 0 0 0 0 2h1v2.2l-2.66.08A2 2 0 0 0 5.5 9.5L4 13Z"></path><path d="M9 13v2a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2v-2M10 17v3m4-3v3m-6 0h8"></path></svg>' : '';
    host.insertAdjacentHTML('beforeend', '<span class="xp-gain'+(repair?' xp-gain--repair':'')+'" role="status">'+anvil+'<span>+' + amount + ' XP</span></span>');
  }
  var counter = document.getElementById('session-xp');
  if (counter) counter.textContent = state.sessionXP + ' XP';
  updateGoalChip();
}
// The daily XP goal (scripts/forge-goals.js), from the loaded history, which
// logResponse also appends each new answer to.
function goalProgress() {
  if (!xpEnabled() || !window.ForgeGoals || !state.historyLoaded) return null;
  return ForgeGoals.progress(state.responseHistory, ForgeGoals.get(state.studentId).xp, new Date());
}
function goalChipHtml() {
  var p = goalProgress();
  return p ? '<div class="forge-goal-row">' + ForgeGoals.chipHtml(p) + '</div>' : '';
}
function updateGoalChip() {
  var p = goalProgress(), chip = document.getElementById('forge-goal-chip');
  if (!p || !chip) return;
  var wasMet = chip.classList.contains('is-met');
  chip.outerHTML = ForgeGoals.chipHtml(p);
  // Once a day, the moment the goal is reached.
  if (p.met && !wasMet && ForgeGoals.claimCelebration(state.studentId)) {
    var row = document.querySelector('.forge-goal-row');
    if (row) row.insertAdjacentHTML('beforeend', '<span class="forge-goal-reached" role="status">Daily goal reached · ' + p.today + ' XP today</span>');
  }
}
function xpResultsHtml() {
  if (!xpEnabled()) return '';
  var h = '<section class="xp-result" aria-label="XP earned">';
  h += '<p class="xp-result__gain"><strong>+' + state.sessionXP + ' XP</strong> this session</p>';
  if (state.baseXP != null) {
    var after = state.baseXP + state.pageXP, before = after - state.sessionXP;
    var rank = getLBRank(after), prevRank = getLBRank(before);
    var next = LB_RANKS.filter(function(r){ return r.min > after; })[0] || null;
    if (rank.name !== prevRank.name) h += '<p class="xp-result__rankup">New rank: ' + rank.name + '</p>';
    h += '<div class="xp-result__rank"><span>' + rank.name + '</span><span>' + after.toLocaleString() + ' XP</span></div>';
    if (next) {
      var pct = Math.max(0, Math.min(100, Math.round((after - rank.min) / (next.min - rank.min) * 100)));
      h += '<div class="xp-result__meter" role="progressbar" aria-label="Progress towards ' + next.name + '" aria-valuemin="' + rank.min + '" aria-valuemax="' + next.min + '" aria-valuenow="' + after + '"><span style="width:' + pct + '%"></span></div>';
      h += '<p class="xp-result__next">' + (next.min - after).toLocaleString() + ' XP to ' + next.name + '</p>';
    } else {
      h += '<p class="xp-result__next">Highest rank reached</p>';
    }
  }
  return h + '</section>';
}

// ── JOINING A CLASS ───────────────────────────────────────────
// Each class the student joins gets its own `students` row, so their answers
// in that subject are attributed to that class — and therefore to the teacher
// who handed out the code. Re-entering a code they've already used reuses the
// existing row instead of creating a duplicate.
// cb(err, {cls, studentId}).
function joinClassByCode(name, code, cb) {
  // One call: finds or creates this student's row for the class and returns
  // its id. A direct insert can't do this — anon may write to students but
  // can't read it back, so asking for the row returned fails the whole
  // request and silently creates nothing.
  ForgeAPI.response(SUPABASE_URL + '/rest/v1/rpc/join_class_as_student', {
    method: 'POST',
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ p_code: code, p_name: name })
  }).then(function(r) { return r.json(); }).then(function(rows) {
    if (!Array.isArray(rows) || rows.length === 0 || !rows[0].student_id) {
      cb('Class code not found. Check with your teacher.');
      return;
    }
    var row = rows[0];
    var cls = { id: row.class_id, name: row.class_name, subject: row.subject };

    ForgeClasses.add({
      classId: cls.id, classCode: code, className: cls.name || null,
      subject: cls.subject || null, studentId: row.student_id, studentName: name
    });

    // Keep each class row independent. A new class must start with an empty
    // class-scoped history; never merge it with a row from another class.
    cb(null, { cls: cls, studentId: row.student_id });
  }).catch(function() { cb('We couldn’t join this class right now. Check your connection and try again.'); });
}

// Point state at a given class — used when the student picks a subject, so
// their answers land against that class's student row.
function activateClass(entry) {
  if (!entry) return;
  state.classId      = entry.classId;
  state.classCode    = entry.classCode || null;
  state.studentCode  = entry.studentCode || null;
  state.studentId    = entry.studentId;
  state.classSubject = entry.subject || null;
  if (entry.studentName) state.studentName = entry.studentName;
  try {
    localStorage.setItem('forge-student', JSON.stringify({
      studentId: entry.studentId, classId: entry.classId, classCode: entry.classCode, studentCode: entry.studentCode,
      studentName: state.studentName, classSubject: entry.subject || null
    }));
  } catch(e) {}
  if (window.ForgeStudyMode) ForgeStudyMode.set('class');
}

// Another teacher hands out another code — students add it here rather than

function studyContextHtml() {

// ── FREE TIER ROUNDS ──────────────────────────────────────────
// Free students can continue immediately after each ten-question set. The
// server enforces 40 new questions per UK day; this local meter is only UX.
var FREE_DAILY_CAP = 40;
var FREE_ROUND_KEY = 'forge-free-round';

function loadFreeRound() {
  var r = null;
  try { r = JSON.parse(localStorage.getItem(FREE_ROUND_KEY) || 'null'); } catch(e) {}
  if (!r || typeof r !== 'object') r = { cooldownUntil: 0 };
  if (r.day !== freeToday()) { r.day = freeToday(); r.today = 0; }
  return r;
}

function saveFreeRound(r) {
  try { localStorage.setItem(FREE_ROUND_KEY, JSON.stringify(r)); } catch(e) {}
}

function freeToday() {
  return new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/London', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
}

function nextMidnightMs() {
  var low = Date.now(), high = low + 48 * 3600000, today = freeToday();
  while (high - low > 1) {
    var mid = Math.floor((low + high) / 2);
    if (freeTodayAt(mid) === today) low = mid; else high = mid;
  }
  return high;
}

function freeTodayAt(time) {
  return new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/London', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date(time));
}

function getTodayCount() {
  return loadFreeRound().today || 0;
}

function cooldownRemainingMs() {
  var round = loadFreeRound();
  return round.dailyCap ? Math.max(0, (round.cooldownUntil || 0) - Date.now()) : 0;
}

function startFreeCooldown(untilMs, dailyCap) {
  var r = loadFreeRound();
  r.cooldownUntil = dailyCap ? (untilMs || nextMidnightMs()) : 0;
  r.dailyCap = !!dailyCap;
  saveFreeRound(r);
}

function isAtDailyCap() {
  var r = loadFreeRound();
  return !!r.dailyCap && (r.cooldownUntil || 0) > Date.now();
}

function incrementRoundCount() {
  var r = loadFreeRound();
  r.today = (r.today || 0) + 1;
  saveFreeRound(r);
  if (r.today >= FREE_DAILY_CAP) startFreeCooldown(nextMidnightMs(), true);
  refreshFreeQuotaDisplay();
}

// The server's answer wins over the local meter: it is what actually decides
// whether the next answer is saved.
function syncFreeRoundFromServer(result) {
  if (!result || typeof result !== 'object') return;
  if (typeof result.today === 'number') {
    var r = loadFreeRound();
    r.today = result.today;
    saveFreeRound(r);
  }
  var until = Date.parse(result.retry_at || result.cooldown_until || '');
  if (until > Date.now() && result.daily_cap === true) startFreeCooldown(until, true);
}

// The free allowance refreshes at UK midnight.
function freeRemaining() {
  if (cooldownRemainingMs() > 0) return { remaining: 0 };
  var day = FREE_DAILY_CAP - getTodayCount();
  return { remaining: Math.max(0, day) };
}

function freeRemainingLabel(left) {
  return left.remaining + ' free question' + (left.remaining !== 1 ? 's' : '') +
    ' left today';
}

// The quota meter sits in the question header, which is not re-rendered when an
// answer is marked — patch it in place so the count never lags behind the
// questions the student has actually used.
function refreshFreeQuotaDisplay() {
  var label = document.getElementById('free-quota-label');
  var fill  = document.getElementById('free-quota-fill');
  if (!label && !fill) return;
  var left = freeRemaining();
  var remaining = left.remaining;
  var used = FREE_DAILY_CAP - Math.min(FREE_DAILY_CAP, remaining);
  var col = remaining <= 2 ? 'var(--bad)' : remaining <= 5 ? 'var(--hot)' : 'var(--good)';
  if (label) {
    label.textContent = freeRemainingLabel(left);
    label.style.color = col;
  }
  if (fill) {
    fill.style.width = Math.min(100, (used / FREE_DAILY_CAP) * 100) + '%';
    fill.style.background = col;
  }
}

function isFreeTier() {
  // Paid, trial, and class-joined students all get unlimited questions
  return !state.isPaid && !state.isTrial && !state.classId;
}

function isInFreeCooldown() {
  return isFreeTier() && cooldownRemainingMs() > 0;
}

function formatCountdown(secs) {
  var h = Math.floor(secs / 3600);
  var m = Math.floor((secs % 3600) / 60);
  var s = secs % 60;
  if (h > 0) return h + 'h ' + m + 'm';
  return m + ':' + (s < 10 ? '0' : '') + s;
}

// ── FREE STUDENT PERSISTENCE ──────────────────────────────────
// ── PAID/TRIAL STUDENT ID ─────────────────────────────────────
// Trial/paid students need a students table row to log responses.
// We create one on first quiz start and cache it in localStorage.

function ensurePaidStudentId() {
  if (state.studentId) return Promise.resolve(state.studentId);
  if (!state.isPaid && !state.isTrial) return Promise.resolve(null);

  // Check localStorage cache first
  var cached = null;
  try { cached = JSON.parse(localStorage.getItem('forge-paid-student') || 'null'); } catch(e) {}
  if (cached && cached.studentId && cached.name === state.studentName && state.classId) {
    state.studentId = cached.studentId;
    return Promise.resolve(state.studentId);
  }

  var authUser = ForgeAuth.currentUser();
  var token = ForgeAuth.accessToken();
  if (!authUser || !token) return Promise.resolve(null);

  // Use the user's own auth token — anon key won't pass RLS policies
  var authHdrs = {
    'apikey': SUPABASE_KEY,
    'Authorization': 'Bearer ' + token,
    'Content-Type': 'application/json'
  };

  // Look up existing student row
  return ForgeAPI.response(SUPABASE_URL + '/rest/v1/students?select=*&auth_user_id=eq.' + authUser.id + '&order=created_at.asc&limit=1', {
    headers: authHdrs
  }).then(function(r) { return r.json(); }).then(function(rows) {
    if (rows && rows.length > 0) {
      var id = rows[0].id;
      state.studentId = id;
      // Direct assignment links do not carry class context. Restore it from
      // the authenticated student's row so response writes are attributable
      // to the class that owns the assignment.
      if (!state.classId && rows[0].class_id) state.classId = rows[0].class_id;
      try { localStorage.setItem('forge-paid-student', JSON.stringify({ studentId: id, name: state.studentName })); } catch(e) {}
      return id;
    }
    // No existing row — create one
    return ForgeAPI.response(SUPABASE_URL + '/rest/v1/students', {
      method: 'POST',
      headers: Object.assign({}, authHdrs, { 'Prefer': 'return=representation' }),
      body: JSON.stringify({ name: state.studentName || 'Student', class_id: null, auth_user_id: authUser.id })
    }).then(function(r) {
      if (!r.ok) { return r.text().then(function(t){ console.error('student insert failed:', r.status, t); return null; }); }
      return r.json();
    }).then(function(inserted) {
      var id = (Array.isArray(inserted) && inserted[0]) ? inserted[0].id : null;
      if (id) {
        state.studentId = id;
        try { localStorage.setItem('forge-paid-student', JSON.stringify({ studentId: id, name: state.studentName })); } catch(e) {}
      }
      return id;
    });
  }).catch(function(e) { console.error('ensurePaidStudentId error:', e); return null; });
}
var FREE_SESSION_KEY = 'forge-free-session';

function loadFreeSession() {
  try { return JSON.parse(localStorage.getItem(FREE_SESSION_KEY) || 'null'); } catch(e) { return null; }
}

// The free token is this device's credential for reading its own responses
// back (get_free_student_responses). Without it the Anvil cannot see anything
// the student has answered, so it has to survive in the session.
function saveFreeSession(name, studentId, freeToken) {
  try { localStorage.setItem(FREE_SESSION_KEY, JSON.stringify({ name: name, studentId: studentId, freeToken: freeToken || null })); } catch(e) {}
}

function generateFreeId() {
  var bytes = new Uint8Array(24);
  window.crypto.getRandomValues(bytes);
  return 'free-' + Array.from(bytes, function(b) { return b.toString(16).padStart(2, '0'); }).join('');
}

// Register a free student in Supabase (or reuse existing record)
// Uses a deterministic lookup: students table has a 'free_token' column
// Falls back gracefully if column doesn't exist yet
function registerFreeStudent(name, token) {
  // Goes through an RPC for the same reason as joining a class: anon can
  // insert into students but not read it back, so a direct insert asking for
  // the new row fails outright. Reuses the row matching this device's token.
  return ForgeAPI.response(SUPABASE_URL + '/rest/v1/rpc/create_free_student', {
    method: 'POST',
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ p_name: name, p_free_token: token })
  }).then(function(r) { return r.json(); }).then(function(rows) {
    if (!Array.isArray(rows) || !rows[0] || !rows[0].student_id) throw new Error('Could not start your session.');
    return rows[0].student_id;
  });
}

var app = document.getElementById('app');
var hasRenderedForgeSurface = false;

function render(skipMotion) {
  if (skipMotion !== true && hasRenderedForgeSurface && window.ForgeMotion && typeof window.ForgeMotion.update === 'function') {
    return window.ForgeMotion.update(app, function () { return render(true); });
  }
  hasRenderedForgeSurface = true;
  // A new question starts at the top. Otherwise the page kept the scroll
  // position from the previous question's feedback, so a long question opened
  // with its header out of view, or jumped as the shorter one clamped it.
  // Inside the transition's update, so the new snapshot is taken at the top.
  if (state.scrollToQuestion) {
    state.scrollToQuestion = false;
    if (window.scrollY > 0) window.scrollTo({ top: 0, behavior: 'instant' });
  }
  document.body.classList.toggle('forge-login-screen', state.phase === 'join');
  if (requestedCheck && (state.studentName || state.classId) && state.phase !== 'quiz' && startFixedCheck() === 'wait') return;
  if (requestedBank && BANKS[requestedBank] && (state.studentName || state.classId) && state.phase !== 'quiz') {
    // Assignment links are bank-specific. Establish both the bank and its
    // subject before starting so restoration cannot fall back to the full
    // subject bank list.
    state.subject = getSubjectForBank(requestedBank);
    if(!ForgeData.isLoaded(state.subject)){
      app.innerHTML='<div class="forge-status forge-status--loading" role="status" aria-live="polite">Loading assigned questions…</div>'+sessionBar();
      ForgeData.loadSubject(state.subject).then(render).catch(function(){
        app.innerHTML='<div class="forge-status forge-status--error" role="alert">We couldn’t load this assignment. Check your connection and try again.</div>'+sessionBar();
      });
      return;
    }
    if (requestedClassId) state.classId = requestedClassId;
    if (requestedAssignmentId) state.assignmentId = requestedAssignmentId;
    var requestedClass = ForgeClasses.forSubject(state.subject);
    if (requestedClass) activateClass(requestedClass);
    var launchRequestedBank = function() {
      // The authenticated route can arrive before the paid/trial student row
      // has been restored. Do not render a session that cannot log responses.
      state.bank = requestedBank;
      var topicItems=requestedTopic&&window.ForgeChemistryTopics?ForgeChemistryTopics.questions(requestedTopic).filter(function(item){return !item.question.type||item.question.type==='fill_blank';}):[];
      if(topicItems.length&&topicItems[0].bank===requestedBank){
        state.topicSpec=requestedTopic;state.questionBanks={};
        topicItems.forEach(function(item){state.questionBanks[item.question.id]=item.bank;});
        forgeStartSession(requestedBank,topicItems.map(function(item){return item.question;}));
      }else if(!(requestedChallenge.length&&state.assignmentId&&startChallenge(requestedBank,state.assignmentId,requestedChallenge))){
        state.challenge=null;state.topicSpec=null;state.questionBanks=null;
        forgeStartSession(requestedBank, BANKS[requestedBank].questions.filter(function(q){return !q.type||q.type==='fill_blank';}));
      }
      state.phase = 'quiz';
      requestedBankStarted = true;
      requestedBank = null;
      render();
    };
    if (!state.studentId && (state.isPaid || state.isTrial)) {
      ensurePaidStudentId().then(launchRequestedBank).catch(launchRequestedBank);
      return;
    }
    launchRequestedBank();
  }
  if (state.phase === 'join') renderJoin();
  else if (state.phase === 'trial-expired') renderTrialExpiredWall();
  else if (state.phase === 'subjects') renderSubjects();
  else if (state.phase === 'banks') renderBanks();
  else if (state.phase === 'quiz') renderQuiz();
  else if (state.phase === 'results') renderResults();
  else if (state.phase === 'mandarin-reader') renderMandarinReader();
}

// One fresh question for each idea whose check is due. 'wait' while the
// answers or questions are still loading; false when nothing is due.
function startFixedCheck() {
  var subject = requestedSubject || state.subject || state.classSubject;
  if (!subject || !SUBJECTS[subject] || !window.ForgeFixed) { requestedCheck = false; return false; }
  if (!state.historyLoaded) {
    app.innerHTML = '<div class="forge-status forge-status--loading" role="status" aria-live="polite">Finding last week’s fixes…</div>' + sessionBar();
    return 'wait';
  }
  if (!ForgeData.isLoaded(subject)) {
    app.innerHTML = '<div class="forge-status forge-status--loading" role="status" aria-live="polite">Loading questions…</div>' + sessionBar();
    ForgeData.loadSubject(subject).then(render).catch(function () { requestedCheck = false; render(); });
    return 'wait';
  }
  requestedCheck = false;
  var banks = {};
  SUBJECTS[subject].banks.forEach(function (b) { if (BANKS[b]) banks[b] = BANKS[b]; });
  var summary = ForgeFixed.summarize(state.responseHistory);
  var picks = ForgeFixed.pickQuestions(summary.due, banks, state.responseHistory);
  if (!picks.length) return false;
  state.subject = subject;
  state.check = { total: picks.length };
  state.assignmentId = null; state.challenge = null; state.topicSpec = null;
  state.questionBanks = {};
  picks.forEach(function (p) { state.questionBanks[p.question.id] = p.bank; });
  state.bank = picks[0].bank;
  state.questions = picks.map(function (p) { return p.question; });
  state.idx = 0; state.score = 0; state.sessionXP = 0;
  state.sessionWrongTags = []; state.sessionReforgedTags = [];
  state.phase = 'quiz';
  return true;
}

    {btn: 'tab-free',  panel: 'panel-free'},
    {btn: 'tab-class', panel: 'panel-class'},
    {btn: 'tab-solo',  panel: 'panel-solo'},
    {btn: 'tab-email', panel: 'panel-email'},
  ];
  var activeTab = openClassJoin ? 'tab-class' : openSoloLogin ? 'tab-solo' : openEmailLogin ? 'tab-email' : 'tab-free';
  function activateTab(which) {
    activeTab = which;
    tabs.forEach(function(t) {
      var isActive = t.btn === which;
      document.getElementById(t.btn).classList.toggle('active', isActive);
      document.getElementById(t.panel).style.display = isActive ? 'block' : 'none';
    });
  }
  tabs.forEach(function(t) {
    document.getElementById(t.btn).onclick = function() { activateTab(t.btn); };
  });
  activateTab(activeTab);

  // These panels share one form. A hidden submit button can become the browser's
  // implicit Enter target, so route Enter to the visible panel explicitly.
  function submitActiveTab() {
    var btn = activeTab === 'tab-class' ? 'join-btn' : activeTab === 'tab-solo' ? 'solo-btn' : activeTab === 'tab-email' ? 'email-btn' : 'free-btn';
    document.getElementById(btn).click();
  }
  ForgeAuthCard.onSubmit(submitActiveTab);
  document.getElementById('auth-form').addEventListener('keydown', function(event) {
    if (event.key !== 'Enter' || event.target.tagName !== 'INPUT' || event.target.id === 'email-code') return;
    event.preventDefault();
    submitActiveTab();
  });

  // Free tier handler
  document.getElementById('free-btn').onclick = function() {
    var name = 'Student';
    var err  = document.getElementById('free-err');
    var btn  = document.getElementById('free-btn');

    btn.disabled = true; btn.textContent = 'Starting\u2026';

    // Check for existing free session on this device
    var existingSession = loadFreeSession();
    if (existingSession && existingSession.studentId) {
      name = existingSession.name || name;
      ForgeClasses.use(name);
      // Returning free student on same device — restore their ID, update name
      state.studentName = name;
      state.studentId   = existingSession.studentId;
      state.classId     = null;
      state.isPaid      = false;
      saveFreeSession(name, existingSession.studentId, existingSession.freeToken);
      if(window.ForgeStudyMode)ForgeStudyMode.set('independent');

      // Load their weight map for spaced repetition. This has to go through the
      // token-gated RPC: a direct read as anon returns an empty list, which
      // silently gave every returning free student a blank weight map and so
      // no spaced repetition at all.
      ForgeClasses.fetchFreeResponses(SUPABASE_URL, SUPABASE_KEY, existingSession, function(responses) {
        state.responseHistory = responses || [];
        state.weightMap = buildWeightMap(responses || []);
        state.bankStats = buildBankStats(responses || []);
        setXPHistory(responses);
        if (state.phase === 'banks' || requestedCheck) render();
      });

      settleRequestedSubject();
      render();
      return;
    }

    // New free student — generate token and register
    ForgeClasses.use(name);
    var token = generateFreeId();
    registerFreeStudent(name, token).then(function(studentId) {
      state.studentName = name;
      state.studentId   = studentId;
      state.classId     = null;
      state.isPaid      = false;
      saveFreeSession(name, studentId || token, token);
      if(window.ForgeStudyMode)ForgeStudyMode.set('independent');
      settleRequestedSubject();
      render();
    }).catch(function() {
      err.textContent = 'We couldn’t start your practice session. Check your connection and try again.';
      err.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Start studying →';
    });
  };

  document.getElementById('email-btn').onclick = function() {
    var email = document.getElementById('email-address').value.trim();
    var err = document.getElementById('email-err');
    err.dataset.state = 'error';
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
      err.textContent = 'Enter a valid email address.'; err.style.display = 'block'; return;
    }
    var btn = this;
    btn.disabled = true;
    ForgeAuth.sendEmailLink(email, !!loadFreeSession()).then(function() {
      err.textContent = 'Check your email for an eight-digit code, then enter it below. Your progress will be saved after you sign in.';
      err.dataset.state = 'success';
      err.style.display = 'block';
    }).catch(function(e) {
      err.textContent = e.status === 429 || /\b429\b/.test(e.message || '')
        ? 'Too many sign-in emails requested. Wait a little, then use the latest email we sent.'
        : e.message || 'Could not send email. Please try again.';
      err.style.display = 'block';
    })
      .finally(function() { btn.disabled = false; });
  };
  document.getElementById('code-btn').onclick = function() {
    var email = document.getElementById('email-address').value.trim();
    var code = document.getElementById('email-code').value.trim();
    var err = document.getElementById('email-err');
    err.dataset.state = 'error';
    if (!email || !/^\d{8}$/.test(code)) { err.textContent = 'Enter your email and eight-digit code.'; err.style.display = 'block'; return; }
    err.style.display = 'none';
    var btn = this; btn.disabled = true;
    var name = (document.getElementById('email-name').value || '').trim();
    ForgeAuth.verifyEmailCode(email, code).then(function() {
      // Optional, and never blocks sign-in: a name that fails to save can be
      // set again from Settings.
      if (!name) return;
      return ForgeAuth.restoreFreeStudent().then(function() { return ForgeAuth.setFreeStudentName(name); }).catch(function() {});
    }).then(function() { location.href = 'student-dashboard.html'; })
      .catch(function(e) { err.textContent = e.message || 'Could not sign in.'; err.style.display = 'block'; btn.disabled = false; });
  };
  document.getElementById('email-code').onkeydown = function(event) {
    if (event.key === 'Enter') { event.preventDefault(); document.getElementById('code-btn').click(); }
  };

  // Join class handler
  document.getElementById('join-btn').onclick = function() {
    var rawName = document.getElementById('join-name').value.trim();
    var studentCode = document.getElementById('join-student-code').value.trim();
    var code = document.getElementById('join-code').value.trim().toUpperCase();
    var err  = document.getElementById('join-err');
    var btn  = document.getElementById('join-btn');

    err.style.display = 'none';
    if (!rawName) { err.textContent = 'Enter your name.'; err.style.display = 'block'; return; }
    if (!code) { err.textContent = 'Enter your class code.'; err.style.display = 'block'; return; }

    // Require at least a first name and surname, but preserve the entered
    // display name so teachers can distinguish students with similar initials.
    var parts = rawName.trim().split(/\s+/);
    var name;
    if (parts.length < 2) {
      err.textContent = 'Enter your first name and surname — e.g. James Morgan';
      err.style.display = 'block'; return;
    }
    // Keep the full entered name (with collapsed whitespace) rather than
    // reducing it to "First I", which makes two students look identical.
    name = rawName.trim().replace(/\s+/g, ' ');

    if (!supa._configured()) {
      state.studentName = name;
      settleRequestedSubject();
      render();
      return;
    }

    btn.disabled = true; btn.textContent = 'Joining...';
    err.style.display = 'none';

    state.studentName = name;
    if (!studentCode) {
      // Compatibility for classes created before private student codes were
      // introduced. The database refuses this route once a class has active
      // student codes, so it cannot bypass the protected flow.
      joinClassByCode(name, code, function(joinErr, res) {
        if (joinErr) { err.textContent = joinErr; err.style.display = 'block'; btn.disabled = false; btn.textContent = 'Join class →'; return; }
        ForgeClasses.syncFromServer(SUPABASE_URL, SUPABASE_KEY,
          { studentId: res.studentId, classId: res.cls.id, classCode: code,
            className: res.cls.name, subject: res.cls.subject, studentName: name }, function() {
            activateClass(ForgeClasses.forSubject(res.cls.subject) || {
              classId: res.cls.id, classCode: code, subject: res.cls.subject,
              studentId: res.studentId, studentName: name
            });
            ForgeAuth.goToLanding();
          });
      });
      return;
    }
    ForgeStudentCode.join(code, studentCode, name).then(function(row) {
      var res = { studentId: row.student_id, cls: { id: row.class_id, name: row.class_name, subject: row.subject } };
      var cleanStudentCode = ForgeStudentCode.clean(studentCode);
      // Start the session clock, and remember whether this device is shared.
      var sharedBox = document.getElementById('join-shared');
      if (window.ForgeStudentSession) ForgeStudentSession.begin(!!(sharedBox && sharedBox.checked));
      ForgeClasses.add({ classId: res.cls.id, classCode: code, className: res.cls.name || null, subject: res.cls.subject || null, studentId: res.studentId, studentName: name, studentCode: cleanStudentCode });
      try { localStorage.setItem('forge-student', JSON.stringify({ studentId: res.studentId, classId: res.cls.id, classCode: code, studentCode: cleanStudentCode, studentName: name, classSubject: res.cls.subject || null })); } catch (e) {}
      ForgeClasses.syncFromServer(SUPABASE_URL, SUPABASE_KEY, { studentId: res.studentId, classId: res.cls.id, classCode: code, className: res.cls.name, subject: res.cls.subject, studentName: name, studentCode: cleanStudentCode }, function() {
        activateClass(ForgeClasses.forSubject(res.cls.subject) || { classId: res.cls.id, classCode: code, subject: res.cls.subject, studentId: res.studentId, studentName: name, studentCode: cleanStudentCode });
        ForgeAuth.goToLanding();
      });
    }).catch(function(joinErr) {
      err.textContent = joinErr.message || 'Student code or class code not recognised.';
      err.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Join class →';
    });
  };

  // Pro login handler
  document.getElementById('solo-btn').onclick = function() {
    var email = document.getElementById('solo-email').value.trim();
    var pass  = document.getElementById('solo-pass').value;
    var err   = document.getElementById('solo-err');
    var btn   = document.getElementById('solo-btn');

    err.style.display = 'none';
    if (!email || !email.includes('@')) { err.textContent = 'Enter your email address.'; err.style.display = 'block'; return; }
    if (!pass) { err.textContent = 'Enter your password.'; err.style.display = 'block'; return; }

    btn.disabled = true; btn.textContent = 'Logging in\u2026';

    ForgeAuth.signIn(email, pass).then(function() {
      return ForgeAuth.getSession();
    }).then(function(result) {
      btn.disabled = false; btn.textContent = 'Log in \u2192';
      if (!result || !result.subscriber || (result.access !== 'pro' && result.access !== 'trial')) {
        err.textContent = result && result.access === 'expired'
          ? 'Your free trial has ended. Subscribe to keep Pro access.'
          : 'No active Forge access found for this account.';
        err.style.display = 'block';
        ForgeAuth.signOut();
        return;
      }
      var sub = result.subscriber;
      state.studentName  = sub.name;
      ForgeClasses.use(sub.name);
      state.isPaid       = result.access === 'pro';
      state.isTrial      = result.access === 'trial';
      state.trialDaysLeft = result.daysLeft || 0;
      state.paidSubjects = sub.subjects || [];
      if (state.paidSubjects.length === 1 && SUBJECTS[state.paidSubjects[0]]) {
        state.subject      = state.paidSubjects[0];
        state.classSubject = state.paidSubjects[0];
        state.phase        = 'banks';
      } else {
        state.phase = 'subjects';
      }
      try { localStorage.setItem('forge-student', JSON.stringify({ studentName: sub.name, isPaid: state.isPaid, isTrial: state.isTrial, trialDaysLeft: state.trialDaysLeft, paidSubjects: sub.subjects || [], classSubject: state.classSubject || null })); } catch(e) {}
      // Signed in — send the student to their dashboard, not into the quiz.
      ForgeAuth.goToLanding();
    }).catch(function(e) {
      btn.disabled = false; btn.textContent = 'Log in \u2192';
      err.textContent = 'We couldn’t sign you in. Check your details and try again.';
      err.style.display = 'block';
    });
  };
}


function renderSubjects(){
  var h = '';
  h += studyContextHtml();
  if (state.studentName) {
    var statusLabel = state.classId ? ' · class' : state.isPaid ? ' · Pro' : state.isTrial ? ' · trial' : ' · independent';
    h += '<div class="join-badge"><span class="dot"></span> ' + state.studentName + statusLabel + '</div>';
  }

  // Class link prompt for trial/paid students not yet in a class
  if ((state.isPaid || state.isTrial) && !state.classId) {
    h += '<div class="forge-u-1rz1eg2" id="class-link-banner">';
    h += '<div class="forge-between-row">';
    h += '<span class="forge-u-1qo1pg">Optional</span>';
    h += '<button type="button" class="forge-u-1f5fxqy" data-forge-action="toggle-class-link">Link to class ↓</button>';
    h += '</div>';
    h += '<p class="forge-u-1tg6uy0">Is your teacher using Forge? <b class="forge-text-white">Enter their class code</b> to share your progress.</p>';
    h += '<div class="forge-u-1karbkd" id="class-link-form">';
    h += '<input id="ql-code" class="join-input forge-u-dtise6" type="text" placeholder="e.g. ECON-Y12-A">';
    h += '<button type="button" id="ql-btn" class="join-btn btn-glass btn-ember forge-u-1og9mh9">Link to class →</button>';
    h += '<p class="join-err" id="ql-err"></p>';
    h += '</div></div>';
  }

  // Trial days remaining nudge
  if (state.isTrial && state.trialDaysLeft <= 3 && state.trialDaysLeft > 0) {
    h += '<div class="forge-u-10v1r9j">';
    h += '⏰ ' + state.trialDaysLeft + ' day' + (state.trialDaysLeft !== 1 ? 's' : '') + ' left on your trial · <a class="forge-u-1ojcao3" href="forge-signup.html">Subscribe to keep access →</a>';
    h += '</div>';
  }

  h += '<div class="center"><p class="tag forge-u-bhmr11">FORGE</p>';
  h += '<h1 class="forge-u-z7clmb">Pick a subject</h1>';
  h += '<p class="forge-u-1vn3cqv">Choose what to practise</p></div>';
  if(!state.classId&&ForgeStudyMode.isIndependent())h+=joinMoreHtml();
  h += '<div class="subject-list">';

  // Students see the subjects of every class they've joined. Paid/trial
  // students without classes see the subjects in their plan.
  var joinedSubjects = state.classId ? ForgeClasses.subjects(SUBJECTS) : [];
  var subjectKeys = Object.keys(SUBJECTS);
  if (joinedSubjects.length > 0) {
    subjectKeys = joinedSubjects;
  } else if ((state.isPaid || state.isTrial) && state.paidSubjects && state.paidSubjects.length > 0) {
    subjectKeys = state.paidSubjects.filter(function(k) { return SUBJECTS[k]; });
  }

  subjectKeys.forEach(function(k){
    var s=SUBJECTS[k];
    var countLabel;
    if (s.readerMode) {
      countLabel = MANDARIN_PASSAGES.length + ' reading passage' + (MANDARIN_PASSAGES.length === 1 ? '' : 's');
    } else {
      var n=s.banks.reduce(function(t,b){return t+(BANKS[b].questionCount||BANKS[b].questions.length)},0);
      countLabel = s.banks.length+' topics \u00b7 '+n+' questions';
    }
    var entry = state.classId ? ForgeClasses.forSubject(k) : null;
    if (entry && entry.className) countLabel += ' \u00b7 ' + entry.className;
    h+='<button type="button" class="subject-btn" data-key="'+k+'" style="border-color:'+s.color+'25">';
    h+='<h3 style="color:'+s.color+'">'+s.label+'</h3>';
    h+='<div class="sub">'+s.sub+'</div>';
    h+='<div class="count">'+countLabel+'</div>';
    h+='</button>';
  });
  h+='</div>';

  if(state.classId)h += joinMoreHtml();

  app.innerHTML=h + sessionBar();
  wireStudyContext();
  app.querySelectorAll('.subject-btn').forEach(function(b){
    b.onclick=function(){
      state.subject=b.dataset.key;
      // Answers must land against the student row for the class that owns
      // this subject, so the right teacher sees them.
      if(state.classId)activateClass(ForgeClasses.forSubject(b.dataset.key));
      if(window.ForgeStudentFocus)ForgeStudentFocus.remember(state.studentId,state.subject);
      var s = SUBJECTS[b.dataset.key];
      if (s && s.readerMode) {
        state.phase = 'mandarin-reader';
        state.mrState = { submitted: {}, tfSel: {}, mcqSel: {}, correct: 0, total: MANDARIN_PASSAGES[0].questions.length, passageIdx: 0 };
      } else {
        state.phase='banks';
      }
      render();
    };
  });

  wireJoinMore();

  // Wire up class link form if visible
  var qlBtn = document.getElementById('ql-btn');
  if (qlBtn) {
    qlBtn.onclick = function() {
      var code = document.getElementById('ql-code').value.trim().toUpperCase();
      var err  = document.getElementById('ql-err');
      var btn  = qlBtn;
      err.style.display = 'none';
      if (!code) { err.textContent = 'Enter your class code.'; err.style.display = 'block'; return; }

      btn.disabled = true; btn.textContent = 'Linking…';

      ForgeAPI.response(SUPABASE_URL + '/rest/v1/rpc/get_class_by_code', {
        method: 'POST',
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ p_code: code })
      }).then(function(r) { return r.json(); }).then(function(classes) {
        if (!Array.isArray(classes) || classes.length === 0) {
          err.textContent = 'Class code not found. Check with your teacher.';
          err.style.display = 'block';
          btn.disabled = false; btn.textContent = 'Link to class →';
          return;
        }
        var cls = classes[0];
        var token = ForgeAuth.accessToken();
        var authHdrs = { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + (token || SUPABASE_KEY), 'Content-Type': 'application/json', 'Prefer': 'return=representation' };

        function finishLink(studentId) {
          state.classId      = cls.id;
          state.studentId    = studentId;
          state.classSubject = cls.subject || null;
          try { localStorage.setItem('forge-student', JSON.stringify({ studentId: studentId, classId: cls.id, classCode: code, studentName: state.studentName, classSubject: cls.subject || null })); } catch(e) {}
          try { localStorage.setItem('forge-paid-student', JSON.stringify({ studentId: studentId, name: state.studentName })); } catch(e) {}
          ForgeClasses.add({
            classId: cls.id, classCode: code, className: cls.name || null,
            subject: cls.subject || null, studentId: studentId, studentName: state.studentName
          });

          // Backfill responses — update student_id to the new class row AND set class_id
          // This ensures teacher dashboard shows the student's history correctly
          if (authUser && token) {
            var subjectFilter = cls.subject ? '&subject=eq.' + encodeURIComponent(cls.subject) : '';
            var userAuthHdrs = { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' };
            // Find ALL student rows for this auth user
            ForgeAPI.response(SUPABASE_URL + '/rest/v1/students?select=id&auth_user_id=eq.' + authUser.id, {
              headers: userAuthHdrs
            }).then(function(r) { return r.json(); }).then(function(studentRows) {
              if (!Array.isArray(studentRows) || studentRows.length === 0) return;
              // For each existing student row, move matching subject responses to the new class row
              studentRows.forEach(function(sr) {
                if (sr.id === studentId) return; // skip the new row itself
                ForgeAPI.response(SUPABASE_URL + '/rest/v1/responses?student_id=eq.' + sr.id + subjectFilter, {
                  method: 'PATCH',
                  headers: userAuthHdrs,
                  body: JSON.stringify({ student_id: studentId, class_id: cls.id })
                }).catch(function(e) { console.error('Backfill failed:', sr.id, e); });
              });
            }).catch(function(e) { console.error('Backfill lookup failed:', e); });
          }
          var banner = document.getElementById('class-link-banner');
          if (banner) {
            banner.innerHTML = '<p class="forge-u-iyagyp">✓ Linked to <b>' + (cls.name || code) + '</b> — your teacher can now see your progress and your quiz history has carried over.</p>';
          }
          setTimeout(function() { render(); }, 1500);
        }

        // Insert as the signed-in user, not anon: the new row carries their
        // auth_user_id, which is what lets them read it back. Under the anon
        // key there's no SELECT policy, so asking for the row returned fails
        // the whole insert and no row is created.
        var anonHdrs = authHdrs;

        // Always look up existing student row first by auth_user_id to find canonical row
        var authUser = ForgeAuth.currentUser();
        var lookupHdrs = { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + (token || SUPABASE_KEY) };

        function lookupAndLink() {
          if (!authUser) {
            insertNewStudent();
            return;
          }
          // Look for an existing row already linked to THIS specific class
          ForgeAPI.response(SUPABASE_URL + '/rest/v1/students?select=*&auth_user_id=eq.' + authUser.id + '&class_id=eq.' + cls.id, {
            headers: lookupHdrs
          }).then(function(r) { return r.json(); }).then(function(rows) {
            if (Array.isArray(rows) && rows.length > 0) {
              // Already linked to this class — just finish
              finishLink(rows[0].id);
              return;
            }
            // No row for this class yet — create one
            insertNewStudent();
          }).catch(function() { insertNewStudent(); });
        }

        function insertNewStudent() {
          ForgeAPI.response(SUPABASE_URL + '/rest/v1/students', {
            method: 'POST',
            headers: anonHdrs,
            body: JSON.stringify({ name: state.studentName, class_id: cls.id, auth_user_id: authUser ? authUser.id : null })
          }).then(function(r) { return r.json(); }).then(function(rows) {
            var studentId = (Array.isArray(rows) && rows[0]) ? rows[0].id : null;
            finishLink(studentId);
          }).catch(function(e) {
            console.error('INSERT error:', e);
            err.textContent = 'We couldn’t link you to this class. Check your connection and try again.';
            err.style.display = 'block';
            btn.disabled = false; btn.textContent = 'Link to class →';
          });
        }

        lookupAndLink();
      }).catch(function() {
        err.textContent = 'We couldn’t link you to this class. Check your connection and try again.';
        err.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Link to class →';
      });
    };
  }
}

function forgeEscape(value){return String(value==null?'':value).replace(/[&<>"']/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];});}
// Same readiness ring as Profile and Home (scripts/forge-topic-mastery.js).
function topicMarksHtml(bank, openTags){
  var m=ForgeTopicMastery.status(state.responseHistory,bank,openTags);
  return '<div class="forge-topic-mastery">'+ForgeTopicMastery.ringHtml(m,true)+'<small>'+forgeEscape(ForgeTopicMastery.detail(m))+'</small></div>';
}
function renderBanks(){
  var subj=SUBJECTS[state.subject];
  if(!ForgeData.isLoaded(state.subject)){
    app.innerHTML='<div class="forge-status forge-status--loading" role="status" aria-live="polite">Loading '+subj.label+' questions…</div>'+sessionBar();
    ForgeData.loadSubject(state.subject).then(render).catch(function(){
      app.innerHTML='<div class="forge-status forge-status--error" role="alert">We couldn’t load these questions. <button type="button" class="forge-button forge-button--secondary" id="retry-question-data">Try again</button></div>'+sessionBar();
      var retry=document.getElementById('retry-question-data');if(retry)retry.onclick=render;
    });
    return;
  }
  // Students in more than one class always need a way back to their other
  // subjects, so only lock when this really is their only one.
  var choices = ForgeClasses.subjects(SUBJECTS).length
             || ((state.isPaid || state.isTrial) ? (state.paidSubjects || []).length : 0);
  var locked = state.classSubject && state.classSubject === state.subject && choices <= 1;
  var h='';
  h+=studyContextHtml();
  // Only show back button if not locked to a subject
  if (!locked) h+='<button type="button" class="back-btn" id="back-subj">\u2190 Subjects</button>';
  h+='<div class="center forge-subject-intro">';
  h+='<h2 class="forge-u-1oh0w3h">'+subj.label+'</h2>';
  h+='<details class="forge-subject-spec"><summary>Exam board and papers</summary><p>'+subj.sub+'</p></details>'+ForgeStudentDelight.motif(state.subject)+'</div>';
  if(!state.classId&&ForgeStudyMode.isIndependent())h+=joinMoreHtml();
  if(state.subject==='chem')h+='<p class="forge-recommendation__copy">Choose a topic you have covered. Each practice set stays within that AQA Chemistry topic.</p>';

// Bring the feedback and its Continue button into view after an answer.
// Scrolling only when the feedback itself started off screen left the button
// just below the fold on a laptop, where the feedback's first line was
// visible but Continue was not. Scroll far enough to show the button, but
// never so far that the start of the feedback leaves the top of the screen:
// a long explanation is read first, and Continue follows it.
function revealQuizNext(){
  var feedback = document.getElementById('feedback');
  if (!feedback) return;
  window.requestAnimationFrame(function(){
    var first=feedback.firstElementChild||feedback;
    var next=document.getElementById('next-btn');
    // Anything fixed along the bottom (the phone tab bar) covers the page.
    var bar=document.getElementById('forge-tabbar');
    var barTop=bar&&getComputedStyle(bar).display!=='none'?bar.getBoundingClientRect().top:window.innerHeight;
    var bottom=Math.min(window.innerHeight,barTop)-20;
    var want=next?next.getBoundingClientRect().bottom-bottom:first.getBoundingClientRect().top-(bottom-76);
    var room=first.getBoundingClientRect().top-88;
    var by=Math.min(want,room);
    if(by>0)window.scrollBy({top:by,behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
  });
}

// In a "Did it stick?" set, say what the answer means for the idea.
function markFixedCheck(feedback, correct){
  var box=feedback.querySelector(correct?'.praise-box':'.scaffold-box');
  if(!box)return;
  var note=document.createElement('p');
  note.className='forge-fixed-result'+(correct?' is-fixed':'');
  note.textContent=correct?'Fixed for good. You still had it a week after repairing it.':'This one slipped since you repaired it. It’s back in Repair mistakes, or try the similar question now.';
  box.appendChild(note);
}

// After a wrong answer, a video that explains this question's idea, when the
// library has one that clearly matches (scripts/forge-video-match.js). The
// A-level Chemistry help above already offers its own reviewed video.
function offerVideo(feedback, question){
  if(!window.ForgeVideoMatch||!feedback||!question)return;
  if(feedback.querySelector('.forge-chemistry-help a[href*="youtube.com"]'))return;
  // The same subject logResponse records for this question.
  var bank=state.questionBanks&&state.questionBanks[question.id]||state.bank;
  var subject=state.subject&&SUBJECTS[state.subject]&&SUBJECTS[state.subject].banks.indexOf(bank)!==-1?state.subject:getSubjectForBank(bank);
  ForgeVideoMatch.appendTo(feedback,question,subject,BANKS[bank]&&BANKS[bank].label||'').then(function(found){if(found)revealQuizNext();}).catch(function(){});
}

function offerRevisionCard(feedback, question){
  if(!feedback||!question||!question.options||!question.options[question.correct])return;
  var button=document.createElement('button');
  button.type='button';button.className='forge-save-card';button.textContent='Make a flashcard from this';
  button.onclick=function(){
    var saved=null;try{saved=JSON.parse(localStorage.getItem('forge-student')||'null');}catch(e){}
    var studentId=state.studentId||(saved&&saved.studentId);
    if(!studentId){button.textContent='Join your class to save cards';return;}
    try{
      var params=new URLSearchParams(location.search);
      params.set('bank',state.bank);params.set('subject',state.subject);
      if(state.topicSpec)params.set('topic',state.topicSpec);else params.delete('topic');
      if(state.classId)params.set('class_id',state.classId);
      if(state.assignmentId)params.set('assignment_id',state.assignmentId);
      params.delete('mode');
      localStorage.setItem('forge-revision-draft:'+studentId,JSON.stringify({front:question.stem,back:question.options[question.correct],bank:state.questionBanks&&state.questionBanks[question.id]||state.bank,source:'Forge question '+question.id,returnTo:'forge-quiz.html?'+params.toString()}));
      state.cardReturnResumeAt=state.idx+1;
      forgeSaveSession();
      location.href='revision.html';
    }catch(e){button.textContent='Could not save a draft on this device';}
  };
  ((feedback.querySelector&&feedback.querySelector('.forge-feedback-actions'))||feedback).appendChild(button);
}

  var h='<div class="quiz-header">';

  h+='<div class="stem">'+q.stem+'</div>';

  if(q.type==='fill_blank'){
    renderFillBlankQuiz(q,bk,h);

  }

  var recall = state.idx === forgeRecallIndex(state.questions);
  if(recall) h += '<div class="forge-recall" id="forge-recall"><label for="forge-recall-answer">Answer from memory first</label><textarea id="forge-recall-answer" rows="2" placeholder="Type what you remember…"></textarea><button type="button" class="forge-button forge-button--secondary" id="forge-recall-show">Show the options</button></div><div id="forge-recall-options" hidden>';

    }).catch(function(){var current=document.getElementById('forge-answer-save');if(current&&current===saveLabel){current.textContent='Saved on this device. Sync is pending.';current.dataset.state='pending';}});

function renderFillBlankQuiz(q,bk,headerHtml){
  var parts=q.template.split('___');
  var sentHtml='<div class="fb-sentence">';
  parts.forEach(function(part,i){
    sentHtml+=part.replace(/\n/g,'<br>');
    if(i<parts.length-1) sentHtml+='<span class="fb-blank" data-idx="'+i+'" data-word=""></span>';
  });
  sentHtml+='</div>';

  var bankWords=q.bank.slice();
  for(var i=bankWords.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var tmp=bankWords[i];bankWords[i]=bankWords[j];bankWords[j]=tmp;
  }

  var h=window.ForgeQuestion.renderFillBlank(q,bankWords,sentHtml);
  h=headerHtml+h;

  app.innerHTML=h;
  document.getElementById('back-banks').onclick=function(){state.phase='banks';render();};

  var blanks=app.querySelectorAll('.fb-blank');
  var words=app.querySelectorAll('.fb-word');
  var checkBtn=document.getElementById('fb-check');
  var answered=false;

  function nextEmptyBlank(){
    for(var k=0;k<blanks.length;k++){ if(!blanks[k].dataset.word) return blanks[k]; }
    return null;
  }
  function updateCheckState(){
    var allFilled=nextEmptyBlank()===null;
    checkBtn.classList.toggle('ready',allFilled&&!answered);
  }

  words.forEach(function(w){
    w.onclick=function(){
      if(answered||w.classList.contains('used'))return;
      var target=nextEmptyBlank();
      if(!target)return;
      target.textContent=w.dataset.word;
      target.dataset.word=w.dataset.word;
      target.dataset.wi=w.dataset.wi;
      target.classList.add('filled');
      w.classList.add('used');
      updateCheckState();
    };
  });

  blanks.forEach(function(b){
    b.onclick=function(){
      if(answered||!b.dataset.word)return;
      var wi=b.dataset.wi;
      var w=app.querySelector('.fb-word[data-wi="'+wi+'"]');
      if(w) w.classList.remove('used');
      b.textContent='';
      b.dataset.word='';
      b.dataset.wi='';
      b.classList.remove('filled');
      updateCheckState();
    };
  });

  checkBtn.onclick=function(){
    if(answered||!checkBtn.classList.contains('ready'))return;
    answered=true;
    var allCorrect=true;
    var given=[];
    blanks.forEach(function(b){
      var idx=parseInt(b.dataset.idx,10);
      var correctWord=q.blanks[idx];
      given.push(b.dataset.word);
      b.classList.add('locked');
      if(b.dataset.word===correctWord){
        b.classList.add('correct');
      }else{
        b.classList.add('wrong');
        allCorrect=false;
      }
    });
    if(allCorrect) state.score++;
    if(isFreeTier()) incrementRoundCount();
    if(state.weightMap){
      if(allCorrect){ state.weightMap[q.id]=Math.max(0.2,(state.weightMap[q.id]||1)*0.5); }
      else{ state.weightMap[q.id]=3; }
    }
    var responseSaved = logResponse(q,given.join('|'),allCorrect,false,null);
    forgeSyncStudentWidgetProgress();

    checkBtn.style.display='none';

    var fb=document.getElementById('feedback');
    fb.innerHTML=window.ForgeQuestion.renderFeedback(q,allCorrect);
    if(!allCorrect&&window.ForgeChemistryResources)ForgeChemistryResources.appendTo(fb,q);
    if(!allCorrect)offerVideo(fb,q);
    if(allCorrect) awardXP(XP_CORRECT, fb.querySelector('.praise-box'));
    if(!allCorrect){
      if(q.reforge){
        document.getElementById('rf-btn').onclick=function(){
          document.getElementById('rf-btn').classList.add('hidden');
          renderReforge(q,document.getElementById('rf-area'),bk.color);
        };
      }
    }
    forgeSaveSession();
    document.getElementById('next-btn').onclick=function(){
      this.disabled=true;
      this.textContent='Saving answer…';
      var next = function(){ state.idx++;state.scrollToQuestion=true;render(); };
      if (responseSaved && typeof responseSaved.then === 'function') responseSaved.then(function(result){
        if (result && result.allowed === false) { renderLimitWall(); return; }
        if (result === false) {
          showPersistenceStatus();
          var continueBtn = document.getElementById('next-btn');
          if (continueBtn) {
            continueBtn.disabled=false;
            continueBtn.textContent = 'Continue anyway';
            continueBtn.onclick = next;
            continueBtn.focus();
          }
          return;
        }
        next();
      }).catch(function(){
        showPersistenceStatus();
        var continueBtn = document.getElementById('next-btn');
        if (continueBtn) {
          continueBtn.disabled=false;
          continueBtn.textContent = 'Continue anyway';
          continueBtn.onclick = next;
          continueBtn.focus();
        }
      });
      else next();
    };

  };

  });

function calcXPFromResponses(responses){
  var xp=0;
  responses.forEach(function(r){
    // Anvil rows are stored as reforge attempts, so they must be matched first
    // or a correct one would also earn the +20 reforge bonus (50 in total).
    if(r.question_id&&r.question_id.endsWith('-ANVIL')){ if(r.is_correct) xp+=30; }
    else if(r.question_id&&r.question_id.endsWith('-CRU')&&r.is_correct) xp+=30;
    else if(r.reforge_attempted&&r.reforge_correct) xp+=20;
    else if(r.is_correct&&!r.reforge_attempted) xp+=r.hint_used?5:10;
  });
  return xp;
}

// ===== SPACED REPETITION ENGINE =====
function buildWeightMap(responses) {
  var now = Date.now();
  var DAY = 86400000;
  var qData = {};
  responses.forEach(function(r) {
    if (!r.question_id || r.reforge_attempted) return;
    var id = r.question_id;
    if (!qData[id]) qData[id] = {correct:0, wrong:0, lastWrong:0};
    if (r.is_correct&&!r.hint_used) qData[id].correct++;
    else {
      qData[id].wrong++;
      var ts = r.created_at ? new Date(r.created_at).getTime() : 0;
      if (ts > qData[id].lastWrong) qData[id].lastWrong = ts;
    }
  });
  var weights = {};
  Object.keys(qData).forEach(function(id) {
    var d = qData[id];
    var daysSinceWrong = d.lastWrong ? (now - d.lastWrong) / DAY : 999;
    if (d.correct >= 3 && d.wrong === 0) weights[id] = 0.2;
    else if (d.wrong > 0 && daysSinceWrong <= 7) weights[id] = 3;
    else if (d.wrong > 0) weights[id] = 2;
  });
  return weights;
}

function buildBankStats(responses) {
  var latest = {};
  (responses || []).forEach(function(r) {
    if (!r || !r.bank || !r.question_id || r.reforge_attempted) return;
    var marker = String(r.bank) + '|' + String(r.question_id).replace(/-RF$/, '');
    var timestamp = r.created_at ? new Date(r.created_at).getTime() : 0;
    if (!latest[marker] || timestamp >= latest[marker].timestamp) {
      latest[marker] = {bank: String(r.bank), correct: !!(r.is_correct&&!r.hint_used), timestamp: timestamp};
    }
  });
  var stats = {};
  Object.keys(latest).forEach(function(marker) {
    var item = latest[marker];
    if (!stats[item.bank]) stats[item.bank] = {answered: 0, correct: 0};
    stats[item.bank].answered++;
    if (item.correct) stats[item.bank].correct++;
  });
  return stats;
}

function recommendedBankForSubject(subject) {
  var banks = subject && subject.banks || [];
  if (!banks.length) return null;
  var best = banks[0];
  var bestWeakness = -1;
  banks.forEach(function(bank) {
    var stats = state.bankStats && state.bankStats[bank];
    // Unattempted topics are treated as 0% complete, while attempted topics
    // are ranked by their latest per-question accuracy. This moves the
    // recommendation away from a topic once it has been mastered.
    var weakness = stats && stats.answered ? 1 - (stats.correct / stats.answered) : 1;
    if (weakness > bestWeakness) {
      best = bank;
      bestWeakness = weakness;
    }
  });
  return best;
}

function weightedShuffle(questions, weightMap) {
  var scored = questions.map(function(q) {
    var w = (weightMap && weightMap[q.id] !== undefined) ? weightMap[q.id] : 1;
    return {q: q, score: w * (0.5 + Math.random())};
  });
  scored.sort(function(a, b) { return b.score - a.score; });
  return scored.map(function(s) { return s.q; });
}
