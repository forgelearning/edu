<!doctype html>
<html lang="en-GB">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forge — Assigned</title><link rel="stylesheet" href="css/tokens.css"><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/sidebar.css"><style>body{font-family:Inter,sans-serif;color:var(--slate)}.wrap{max-width:720px;margin:0 auto;padding:48px 24px}.card{margin-top:14px;padding:18px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-md)}.meta{font-size:13px;color:#8A857E}.topic{display:inline-block;margin:12px 6px 0 0;padding:5px 10px;color:var(--ember);background:rgba(255,107,44,.1);border-radius:var(--radius-sm);font-size:12px}</style></head>
<body>
<script src="scripts/forge-logo.js"></script><script src="scripts/forge-auth.js"></script><script src="scripts/forge-sidebar.js"></script>
<script>function forgeSignOut(){try{localStorage.removeItem('forge-student');localStorage.removeItem('forge-anvil-open')}catch(e){}if(window.ForgeAuth)ForgeAuth.signOut();location.href='forge-quiz.html'}ForgeSidebar.mount({active:'assignments',items:[{key:'dashboard',href:'student-dashboard.html',label:'Dashboard'},{key:'forge',href:'forge-quiz.html',label:'Forge'},{key:'assignments',href:'assignments.html',label:'Assigned'},{key:'anvil',href:'anvil.html',label:'Anvil'},{key:'crucible',href:'crucible.html',label:'Crucible'}],footerItems:[{key:'profile',href:'profile.html',label:'Profile'}],signOut:forgeSignOut});</script><script src="scripts/forge-student-badges.js"></script>
<main class="wrap"><div style="font:11px 'JetBrains Mono',monospace;color:var(--ember);text-transform:uppercase">Student work</div><h1>Assigned</h1><p>Your teacher’s current assignments appear here. The full course remains available in <a href="forge-quiz.html">Forge</a>.</p><div id="list" class="card">Loading assignments…</div></main>
<script>var u='https://crysulmbaadjkymcjrew.supabase.co',k='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFub24iLCJpYXQiOjE3ODQyNDUzMzAsImV4cCI6MjA5OTgyMTMzMH0.Q69MKJRJ6_iEYkqJYXjn8RBhKhstAZShtmf0NiYM-8Vk',el=document.getElementById('list');fetch(u+'/rest/v1/assignments?select=*&order=due_date.asc',{headers:{apikey:k,Authorization:'Bearer '+k}}).then(function(r){return r.json()}).then(function(rows){var d=new Date();d.setHours(0,0,0,0);var a=(Array.isArray(rows)?rows:[]).filter(function(x){return !x.archived&&(!x.due_date||new Date(x.due_date)>=d)});if(!a.length){el.textContent='No active assignments. You can work ahead in the full course.';return}el.innerHTML=a.map(function(x){var b=[];try{b=typeof x.banks==='string'?JSON.parse(x.banks):x.banks||[]}catch(e){}return '<div class="card"><h2>'+x.title+'</h2><div class="meta">'+(x.due_date?'Due '+new Date(x.due_date).toLocaleDateString('en-GB',{day:'numeric',month:'short'}):'No deadline')+'</div>'+b.map(function(y){return '<a class="topic" href="forge-quiz.html">'+y+'</a>'}).join('')+'</div>'}).join('')}).catch(function(){el.textContent='Assignments could not be loaded.'})</script>
