<script>if(window.ForgeAuth)ForgeAuth.adoptHashSession();</script>
<script>
var MAX_SUBJECTS = 4;

// level: 'gcse' | 'alevel' — drives the grouped headings in the picker.
// Only GCSE subjects with live question banks in data/forge-data.js belong
// here; the rest have teaser pages but nothing to practise yet.
var SUBJECTS_LIST = [
  {key:'gcse-geo',  label:'Geography',  spec:'Edexcel B 1GB0', level:'gcse'},
  {key:'gcse-econ', label:'Economics',  spec:'OCR J205',       level:'gcse'},

  {key:'econ',   label:'Economics',            spec:'Edexcel 9EC0'},
  {key:'psych',  label:'Psychology',           spec:'AQA 7182'},
  {key:'soc',    label:'Sociology',            spec:'AQA 7192'},
  {key:'geo',    label:'Geography',            spec:'Edexcel 9GE0'},
  {key:'bus',    label:'Business',             spec:'Edexcel 9BS0'},
  {key:'chem',   label:'Chemistry',            spec:'AQA 7405'},
  {key:'bio',    label:'Biology',              spec:'OCR A H420'},
  {key:'phys',   label:'Physics',              spec:'AQA 7408'},
  {key:'hist',   label:'History',              spec:'AQA 7042'},
  {key:'law',    label:'Law',                  spec:'AQA 7162'},
  {key:'crim',   label:'Criminology',          spec:'WJEC'},
  {key:'pol',    label:'Politics',             spec:'Edexcel 9PL0'},
  {key:'maths',  label:'Maths',               spec:'Edexcel 9MA0'},
  {key:'german', label:'German',               spec:'Edexcel 9GN0'},
  {key:'french', label:'French',               spec:'Edexcel 9FR0'},
  {key:'span',   label:'Spanish',              spec:'Edexcel 9SP0'},
  {key:'mand',   label:'Mandarin',             spec:'IB Language B SL'},
  {key:'englit', label:'English Literature',    spec:'AQA 7712'},
  {key:'engll',  label:'English Language & Lit',spec:'AQA 7707'},
  {key:'cs',     label:'Computer Science',     spec:'Eduqas A500QS'},
  {key:'rs',     label:'Religious Studies',    spec:'Eduqas A120QS'},
  {key:'hsc',    label:'Health & Social Care', spec:'OCR H125'},
  {key:'media',  label:'Media Studies',        spec:'Eduqas A680QS'},
  {key:'pe',     label:'Physical Education',   spec:'AQA 7582'},
];

var app = document.getElementById('app');
var formState = { name: '', email: '', password: '', subjects: [] };

function getParam(k) { return new URLSearchParams(window.location.search).get(k); }

// Every step swaps the whole card, so send the page back to the top —
// otherwise arriving at a short step leaves you scrolled past its title.
function mount(opts, inner) {
  app.innerHTML = ForgeAuthCard.shell(opts, inner);
  window.scrollTo(0, 0);
}

// Glass buttons wrap their label in a <span> so it sits above the highlight
// overlay — swap the span's text, not the button's, when showing progress.
function setBtnLabel(btn, text) {
  var span = btn.querySelector('span');
  if (span) span.textContent = text; else btn.textContent = text;
}
function subjLabel(k) {
  var s = SUBJECTS_LIST.find(function(x){return x.key===k;});
  if (!s) return k;
  // GCSE and A Level share subject names (Geography, Economics), so the
  // level has to stay in the label wherever a chosen subject is echoed back.
  return (s.level === 'gcse' ? 'GCSE ' : '') + s.label;
}

// ── ROUTING ──────────────────────────────────────────────────
// Returning from the trial signup confirmation step.
if (getParam('trial') === '1') {
  renderSuccess();
} else if (ForgeAuth.hasSession()) {
  // Already have a session — check if it's still valid
  mount({ title: 'Checking your account…' }, '');
  ForgeAuth.getSession().then(function(result) {
    if (result && result.subscriber && result.subscriber.active) {
      renderAlreadySubscribed(result.subscriber);
    } else {
      ForgeAuth.signOut();
      renderStep1();
    }
  });
} else {
  renderStep1();
}

// ── STEP 1: Name + Subject picker ────────────────────────────
function renderStep1() {
  var h = '<div class="price-card">';
  h += '<div><span class="price-main">£2.99</span><span class="price-period">/month</span></div>';
  h += '<div class="price-desc">7 days free · then £2.99/month · cancel anytime · log in on any device</div>';
  h += '<div class="price-features">';
  h += '<div class="price-feat">Up to 4 subjects — GCSE, A Level, or a mix of both</div>';
  h += '<div class="price-feat">Practice · Repair mistakes · Timed practice</div>';
  h += '<div class="price-feat">Personal misconception profile · XP &amp; ranks</div>';
  h += '<div class="price-feat">Log in from any device with email &amp; password</div>';
  h += '<div class="price-feat">No card details needed for the trial</div>';
  h += '<div class="price-feat">Cancel anytime — no contract</div>';
  h += '</div></div>';

  h += '<div class="field"><label>Your first name</label>';
  h += '<input id="s-name" type="text" placeholder="e.g. Alex" value="' + formState.name + '"></div>';

  h += '<p class="err" id="s1-err"></p>';
  h += '<button type="button" class="btn-primary btn-glass btn-ember" id="s1-next"><span>Start free trial →</span></button>';
  h += '<button type="button" class="btn-ghost btn-glass forge-u-et2xu7" data-forge-action="go-quiz"><span>Already subscribed? Log in</span></button>';

  mount({
    title: 'Start your 7-day free trial',
    sub:   'Full Pro access free for 7 days · no card needed · then £2.99/month',
    tag:   'Step 1 of 3'
  }, h);

  ForgeAuthCard.onSubmit(function(){ document.getElementById('s1-next').onclick(); });

  document.getElementById('s1-next').onclick = function() {
    var name = document.getElementById('s-name').value.trim();
    var err = document.getElementById('s1-err');
    if (!name) { err.textContent = 'Enter your first name.'; err.style.display = 'block'; return; }
    formState.name = name;
    renderStep2();
  };
}

// ── STEP 2: Subject picker ────────────────────────────────────
function renderStep2() {
  var h = '<div class="forge-u-g7adms" id="subj-counter">';
  h += '<span class="ui-meta-muted">Subjects selected</span>';
  h += '<span class="forge-u-1c6uf7w" id="counter-val">' + formState.subjects.length + ' / ' + MAX_SUBJECTS + '</span>';
  h += '</div>';

  h += '<div class="subj-scroll" id="subj-grid">';
  [
    {level:'gcse',   heading:'GCSE'},
    {level:undefined, heading:'A Level'}
  ].forEach(function(group) {
    var subjects = SUBJECTS_LIST.filter(function(s){ return s.level === group.level; });
    if (!subjects.length) return;
    h += '<div class="subj-level">' + group.heading + '</div>';
    h += '<div class="subj-grid">';
    subjects.forEach(function(s) {
      var sel = formState.subjects.indexOf(s.key) !== -1;
      var atMax = formState.subjects.length >= MAX_SUBJECTS && !sel;
      h += '<button type="button" class="subj-chip' + (sel ? ' selected' : '') + (atMax ? ' subj-chip-disabled' : '') + '" data-key="' + s.key + '"' + (atMax ? ' disabled' : '') + '>';
      h += s.label + '<span class="spec">' + s.spec + '</span></button>';
    });
    h += '</div>';
  });
  h += '</div>';

  h += '<p class="err" id="s2-err"></p>';
  h += '<button type="button" class="btn-primary btn-glass btn-ember" id="s2-next"><span>Create account →</span></button>';
  h += '<button type="button" class="btn-ghost btn-glass forge-u-et2xu7" data-forge-action="signup-step-1"><span>← Back</span></button>';

  mount({
    title: 'Pick your subjects',
    sub:   'Choose up to <b class="forge-text-white">' + MAX_SUBJECTS + ' subjects</b> — GCSE, A Level, or a mix of both.',
    tag:   'Step 2 of 3',
    wide:  true
  }, h);

  ForgeAuthCard.onSubmit(function(){ document.getElementById('s2-next').onclick(); });

  function refreshGrid() {
    var count = formState.subjects.length;
    var cv = document.getElementById('counter-val');
    if (cv) { cv.textContent = count + ' / ' + MAX_SUBJECTS; cv.style.color = count >= MAX_SUBJECTS ? 'var(--ember)' : 'var(--white)'; }
    document.querySelectorAll('.subj-chip').forEach(function(b) {
      var isSel = formState.subjects.indexOf(b.getAttribute('data-key')) !== -1;
      var dis = !isSel && count >= MAX_SUBJECTS;
      b.disabled = dis;
      b.classList.toggle('subj-chip-disabled', dis);
    });
  }

  document.getElementById('subj-grid').querySelectorAll('.subj-chip').forEach(function(btn) {
    btn.onclick = function() {
      if (btn.disabled) return;
      var key = btn.getAttribute('data-key');
      var idx = formState.subjects.indexOf(key);
      if (idx === -1) { if (formState.subjects.length >= MAX_SUBJECTS) return; formState.subjects.push(key); btn.classList.add('selected'); }
      else { formState.subjects.splice(idx, 1); btn.classList.remove('selected'); }
      refreshGrid();
    };
  });

  document.getElementById('s2-next').onclick = function() {
    var err = document.getElementById('s2-err');
    if (formState.subjects.length === 0) { err.textContent = 'Select at least one subject.'; err.style.display = 'block'; return; }
    renderStep3();
  };
}

// ── STEP 3: Create account + pay ─────────────────────────────
function renderStep3() {
  var subjLabels = formState.subjects.map(subjLabel);

  var h = '<div class="already-box forge-mb-4">';
  h += '<div class="forge-u-iq0ofc"><b>' + formState.name + '</b></div>';
  h += '<div class="forge-u-1hm6ozo">';
  subjLabels.forEach(function(l) {
    h += '<span class="forge-u-1aofqt9">' + l + '</span>';
  });
  h += '</div></div>';

  h += '<div class="field"><label>Email address</label>';
  h += '<input id="s-email" type="email" placeholder="e.g. alex@gmail.com" value="' + formState.email + '"></div>';
  h += '<div class="field"><label>Password</label>';
  h += '<input id="s-pass" type="password" placeholder="At least 8 characters"></div>';
  h += '<div class="field"><label>Confirm password</label>';
  h += '<input id="s-pass2" type="password" placeholder="Repeat your password"></div>';

  h += '<p class="err" id="s3-err"></p>';
  h += '<button type="button" class="btn-primary btn-glass btn-ember" id="s3-pay"><span>Create account &amp; start trial →</span></button>';
  h += '<button type="button" class="btn-ghost btn-glass forge-u-et2xu7" data-forge-action="signup-step-2"><span>← Change subjects</span></button>';
  h += '<p class="note">No payment needed now · your trial starts immediately · subscribe after 7 days to keep access</p>';

  mount({
    title: 'Create your account',
    sub:   'Choose an email and password — this is how you\'ll log in on any device.',
    tag:   'Step 3 of 3'
  }, h);

  ForgeAuthCard.onSubmit(function(){ document.getElementById('s3-pay').onclick(); });

  document.getElementById('s3-pay').onclick = function() {
    var email    = document.getElementById('s-email').value.trim();
    var pass     = document.getElementById('s-pass').value;
    var pass2    = document.getElementById('s-pass2').value;
    var err      = document.getElementById('s3-err');
    var btn      = document.getElementById('s3-pay');

    err.style.display = 'none';
    if (!email || !email.includes('@')) { err.textContent = 'Enter a valid email address.'; err.style.display = 'block'; return; }
    if (pass.length < 8) { err.textContent = 'Password must be at least 8 characters.'; err.style.display = 'block'; return; }
    if (pass !== pass2) { err.textContent = 'Passwords don\'t match.'; err.style.display = 'block'; return; }

    formState.email    = email;
    formState.password = pass;

    btn.disabled = true; setBtnLabel(btn, 'Creating account…');

    // Create Supabase account first
    ForgeAuth.signUp(email, pass, formState.name, formState.subjects).then(function() {
      // Save pending state so success page knows subjects
      try { localStorage.setItem('forge-pending', JSON.stringify({ name: formState.name, subjects: formState.subjects })); } catch(e) {}
      // Show the trial confirmation. Billing is a separate, explicit action.
      window.location.href = 'forge-signup.html?trial=1';
    }).catch(function(e) {
      btn.disabled = false; setBtnLabel(btn, 'Create account & start trial →');
      err.textContent = 'We couldn’t create the account. Check your details and try again.';
      err.style.display = 'block';
    });
  };
}

// ── SUCCESS: Trial started ───────────────────────────────────
function renderSuccess() {
  var pending = null;
  try { pending = JSON.parse(localStorage.getItem('forge-pending') || 'null'); localStorage.removeItem('forge-pending'); } catch(e) {}
  var name = (pending && pending.name) || '';
  var subjects = (pending && pending.subjects) || [];
  var h = '';
  if (subjects.length) {
    h += '<div class="success-card"><b>Subjects unlocked:</b><br><div class="forge-u-1m78g7r">';
    subjects.map(subjLabel).forEach(function(label) {
      h += '<span class="forge-u-kcpvsf">' + label + '</span>';
    });
    h += '</div></div>';
  }
  h += '<div class="already-box"><b class="forge-text-white">Is your teacher using Forge?</b>';
  h += '<p>Use your class code and individual student code to join. Your independent answers stay in your account.</p>';
  h += '<a class="btn-primary btn-glass btn-ember" href="forge-quiz.html?mode=class">Join my class →</a>';
  h += '<button type="button" data-forge-action="signup-dashboard" class="btn-ghost btn-glass"><span>Go to my dashboard</span></button></div>';
  mount({
    title: (name ? name + ', you\'re in.' : 'You\'re in.'),
    sub: 'Your 7-day Pro trial has started. Log in from any device with your email and password.',
    tag: 'Welcome to Forge'
  }, h);
}

function skipToDashboard() {
  ForgeAuth.goToLanding();
}

// ── ALREADY SUBSCRIBED ────────────────────────────────────────
function renderAlreadySubscribed(sub) {
  var labels = (sub.subjects || []).map(subjLabel);

  var h = '';

  if (labels.length > 0) {
    h += '<div class="already-box">';
    h += '<div class="forge-u-iujvg5">Your subjects:</div>';
    h += '<div class="forge-u-1hm6ozo">';
    labels.forEach(function(l) {
      h += '<span class="forge-u-1aofqt9">' + l + '</span>';
    });
    h += '</div></div>';
  }

  h += '<button type="button" class="btn-primary btn-glass btn-ember" data-forge-action="go-landing"><span>Go to my dashboard →</span></button>';
  h += '<button type="button" class="btn-ghost btn-glass forge-u-et2xu7" data-forge-action="signup-step-1"><span>Sign out / use a different account</span></button>';

  mount({
    title: 'You\'re already on Forge' + (sub.name ? ', ' + sub.name : '') + '.',
    sub:   'Your subscription is active — log in from any device.',
    tag:   'Already subscribed'
  }, h);
}
</script>
