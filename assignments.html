<!doctype html><html lang="en-GB"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forge — Assigned</title><link rel="stylesheet" href="css/tokens.css"><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/sidebar.css"><style>body{font-family:Inter,sans-serif;color:var(--slate)}h1,h2{font-family:Sora,sans-serif;color:var(--white)}.wrap{max-width:760px;margin:0 auto;padding:48px 24px}.card{margin-top:14px;padding:18px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-md)}.meta{font-size:13px;color:#8A857E}.topic{display:inline-block;margin:12px 6px 0 0;padding:5px 10px;color:var(--ember);background:rgba(255,107,44,.1);border-radius:var(--radius-sm);font-size:12px}.status{display:inline-block;margin:10px 8px 0 0;padding:4px 8px;border-radius:999px;font:11px 'JetBrains Mono',monospace}.status-not-started{color:var(--slate);background:var(--panel-2)}.status-progress{color:var(--hot);background:rgba(255,201,60,.12)}.status-complete{color:var(--good);background:rgba(127,217,138,.12)}.status-overdue{color:var(--bad);background:rgba(255,90,90,.1)}</style></head><body><script src="scripts/forge-logo.js"></script><script src="scripts/forge-auth.js"></script><script src="scripts/forge-sidebar.js"></script><script src="data/forge-data.js"></script><script>function forgeSignOut(){try{localStorage.removeItem('forge-student');localStorage.removeItem('forge-anvil-open')}catch(e){}if(window.ForgeAuth)ForgeAuth.signOut();location.href='forge-quiz.html'}ForgeSidebar.mount({active:'assignments',items:[{key:'dashboard',href:'student-dashboard.html',label:'Dashboard'},{key:'forge',href:'forge-quiz.html',label:'Forge'},{key:'assignments',href:'assignments.html',label:'Assigned'},{key:'anvil',href:'anvil.html',label:'Anvil'},{key:'crucible',href:'crucible.html',label:'Crucible'}],footerItems:[{key:'profile',href:'profile.html',label:'Profile'}],signOut:forgeSignOut});</script><main class="wrap"><div style="font:11px 'JetBrains Mono',monospace;color:var(--ember);text-transform:uppercase">Student work</div><h1>Assigned</h1><p>Your teacher’s current assignments appear here. The full course remains available in <a href="forge-quiz.html">Forge</a>.</p><div id="list" class="card">Loading assignments…</div></main><script>
var API='https://crysulmbaadjkymcjrew.supabase.co',key='sb_publishable_cPt3HxjC8-1lN8hk30BKKA_0DNow21g',el=document.getElementById('list'),saved=null;
try{saved=JSON.parse(localStorage.getItem('forge-student')||'null')}catch(e){}
function headers(){return{apikey:key,Authorization:'Bearer '+key,'Content-Type':'application/json'}}
function parseBanks(a){try{return typeof a==='string'?JSON.parse(a):a||[]}catch(e){return[]}}
function cleanId(id){return String(id||'').replace(/-RF$/,'')}
function statusFor(asgn,responses){var banks=parseBanks(asgn.banks),today=new Date();today.setHours(0,0,0,0),due=asgn.due_date?new Date(asgn.due_date):null,answered={};responses.forEach(function(r){answered[r.bank]=answered[r.bank]||{};answered[r.bank][cleanId(r.question_id)]=true});var done=banks.length>0&&banks.every(function(bank){var data=BANKS[bank],ids=answered[bank]||{};return data&&Object.keys(ids).length>=data.questions.filter(function(q){return !q.type||q.type==='fill_blank'}).length});if(done){try{var completionKey='forge-completed-banks:'+String(saved.studentId||'anon')+':'+String(saved.classId||'none'),complete=JSON.parse(localStorage.getItem(completionKey)||'{}');banks.forEach(function(bank){complete[bank]=true});localStorage.setItem(completionKey,JSON.stringify(complete))}catch(e){}return['Completed','complete']}if(due&&due<today)return['Overdue','overdue'];if(banks.some(function(bank){return answered[bank]&&Object.keys(answered[bank]).length}))return['In progress','progress'];return['Not started','not-started']}
function escapeHtml(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function render(rows,responses){if(!rows.length){el.textContent='No assignments yet. Your teacher’s assignments will appear here.';return}el.className='';el.innerHTML=rows.map(function(a){var banks=parseBanks(a.banks),status=statusFor(a,responses),due=a.due_date?'Due '+new Date(a.due_date).toLocaleDateString('en-GB',{day:'numeric',month:'short'}):'No due date';return '<section class="card"><h2>'+escapeHtml(a.title)+'</h2><div class="meta">'+due+'</div><span class="status status-'+status[1]+'">'+status[0]+'</span><div>'+banks.map(function(bank){var data=BANKS[bank];return '<a class="topic" href="forge-quiz.html?bank='+encodeURIComponent(bank)+'">'+escapeHtml(data?data.label:bank)+' →</a>'}).join('')+'</div></section>'}).join('')}
var classId=saved&&saved.classId;if(!classId){el.textContent='Join a class to see your assignments.'}else{Promise.all([fetch(API+'/rest/v1/assignments?select=*&class_id=eq.'+encodeURIComponent(classId)+'&order=due_date.asc',{headers:headers()}).then(function(r){return r.json()}),saved.studentId&&saved.classCode?fetch(API+'/rest/v1/rpc/get_student_own_responses',{method:'POST',headers:headers(),body:JSON.stringify({p_student_id:saved.studentId,p_code:saved.classCode,p_name:saved.studentName})}).then(function(r){return r.json()}):Promise.resolve([])]).then(function(data){render(Array.isArray(data[0])?data[0]:[],Array.isArray(data[1])?data[1]:[])}).catch(function(){el.textContent='Assignments could not be loaded. Please try again.'})}
