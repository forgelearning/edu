<title>Forge — Dashboard</title>
<meta name="description" content="Your exam readiness profile — accuracy, focus areas, and strengths, updated after every Forge session.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/auth.css">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--coal);color:var(--slate);font-family:'Inter',sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh}
h1,h2,h3{font-family:'Sora',sans-serif;color:var(--white);line-height:1.1;letter-spacing:-.015em}
.mono{font-family:'JetBrains Mono',monospace}
.wrap{max-width:860px;margin:0 auto;padding:28px 20px;min-height:100vh;display:flex;flex-direction:column;justify-content:center}
.tag{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ember)}
.logo{font-family:'Sora',sans-serif;font-weight:800;font-size:20px;color:var(--white);text-decoration:none;display:inline-flex;align-items:center;gap:8px;margin-bottom:0}
.logo .spark{width:9px;height:9px;background:var(--ember);border-radius:var(--radius-xs);transform:rotate(45deg);box-shadow:0 0 10px rgba(255,107,44,.7)}
.theme-toggle{background:var(--panel);border:1px solid var(--line);color:var(--slate);font-family:'JetBrains Mono',monospace;font-size:12px;padding:6px 12px;border-radius:var(--radius-sm);cursor:pointer;z-index:99}
.join-input{width:100%;padding:12px 14px;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--panel);color:var(--white);font-family:'Inter',sans-serif;font-size:15px;margin-bottom:14px;text-transform:uppercase}
.join-input:focus{outline:none;border-color:var(--ember)}
.join-input::placeholder{color:#7A756E;text-transform:none}
.join-btn{width:100%;padding:13px;border-radius:var(--radius-sm);background:var(--ember);color:#fff;border:none;font-family:'Inter',sans-serif;font-weight:600;font-size:15px;cursor:pointer}
.join-btn:hover{background:var(--hot)}
.join-btn:disabled{opacity:.5;cursor:wait}
.join-err{color:var(--bad);font-size:13px;margin-top:10px;display:none}
/* ── Profile tabs ── */
.prof-tabs{display:flex;gap:0;margin-bottom:24px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-md);padding:4px;width:fit-content}
.prof-tab{font-size:13px;font-weight:600;font-family:'Inter',sans-serif;padding:8px 16px;border-radius:var(--radius-sm);border:none;background:none;color:var(--slate);cursor:pointer;transition:all .15s}
.prof-tab.active{background:var(--ember);color:#fff}
.prof-tab:hover:not(.active){color:var(--white)}
/* ── Profile header card ── */
.prof-header{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);padding:24px 28px;margin-bottom:20px}
.prof-header-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px}
.prof-name{font-family:'Sora',sans-serif;font-size:22px;font-weight:700;color:var(--white)}
.prof-subject{font-size:13px;color:var(--slate);margin-top:2px}
.always-updating{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ember)}
/* ── Stat row ── */
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{text-align:center;padding:4px 0}
.stat-n{font-family:'Sora',sans-serif;font-size:32px;font-weight:800;display:block;line-height:1}
.stat-l{font-size:10px;color:#8A857E;margin-top:6px;display:block;font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.05em}
/* ── Two-column overview ── */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);padding:20px;margin-bottom:16px}
.card-title{font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
/* ── Focus items ── */
.focus-item{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius-md);padding:13px 14px;margin-bottom:8px}
.focus-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.focus-pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-family:'JetBrains Mono',monospace;font-weight:700;padding:3px 10px;border-radius:var(--radius-xs)}
.focus-acc{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700}
.focus-detail{font-size:13px;color:var(--slate);line-height:1.5}
.focus-tag{font-size:11px;color:var(--coal);background:var(--hot);padding:2px 8px;border-radius:var(--radius-xs);font-weight:600;font-family:'JetBrains Mono',monospace}
/* ── Strengths ── */
.strength-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.strength-item:last-child{border-bottom:none}
.strength-label{color:var(--white)}
.strength-acc{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13px;color:var(--good)}
/* ── Grade + rank ── */
.grade-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);padding:22px 24px;margin-bottom:16px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.grade-letter{font-family:'Sora',sans-serif;font-size:52px;font-weight:800;line-height:1;min-width:80px;text-align:center}
.grade-info{flex:1;min-width:180px}
.grade-acc{min-width:80px;text-align:center}
.grade-eyebrow{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#8A857E;margin-bottom:4px}
.grade-tracking{font-size:15px;font-weight:600;color:var(--white);margin-bottom:6px}
.grade-desc{font-size:13px;color:var(--slate)}
.grade-caveat{font-size:11px;font-family:'JetBrains Mono',monospace;color:#8A857E;margin-top:6px}
.rank-display{text-align:center;padding:22px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);margin-bottom:16px}
.rank-title{font-family:'Sora',sans-serif;font-size:28px;font-weight:800}
.rank-xp{font-family:'JetBrains Mono',monospace;font-size:13px;color:#8A857E;margin-top:4px}
.xp-bar-wrap{height:5px;background:var(--line);border-radius:var(--radius-xs);margin:12px 0 4px}
.xp-bar-fill{height:5px;border-radius:var(--radius-xs);background:var(--ember)}
.xp-bar-label{display:flex;justify-content:space-between;font-size:11px;font-family:'JetBrains Mono',monospace;color:#8A857E}
/* ── Anvil list ── */
.mc-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--radius-md);background:var(--panel-2);border:1px solid var(--line);margin-bottom:6px;font-size:13px}
.mc-detail{flex:1;color:var(--slate)}
.mc-fires{font-family:'JetBrains Mono',monospace;font-size:12px}
.empty{text-align:center;padding:28px 20px;color:var(--slate)}
.empty h3{color:var(--white);margin-bottom:8px}
.prof-footer{font-size:13px;color:var(--slate);margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.nav-links{display:none} /* replaced by tabs */
.nav-link{}
[data-theme="light"] .focus-tag{color:#fff}
[data-theme="light"] .join-btn{color:#fff}
[data-theme="light"] .prof-tab.active{color:#fff}
@media(max-width:600px){.stat-row{grid-template-columns:1fr 1fr}.two-col{grid-template-columns:1fr}.prof-tabs{width:100%;flex-wrap:wrap}}
/* ── mobile / tablet-portrait ──
   The desktop layout vertically centres a short page; on a phone that fights
   the fixed top bar, so the content flows from the top instead. */
@media(max-width:820px){
  .wrap{padding:18px 14px 8px;min-height:0;justify-content:flex-start}
  #app h1{font-size:26px;margin-bottom:20px}
  .two-col{grid-template-columns:1fr;gap:12px}
  .card{padding:16px 14px;margin-bottom:12px;border-radius:var(--radius-md)}
  .prof-header{padding:18px 16px;margin-bottom:14px}
  .prof-header-top{margin-bottom:16px}
  .prof-name{font-size:19px}
  .stat-n{font-size:26px}

  /* the stat strip is a horizontal rail on desktop — stack it into a 2-up
     grid so nothing wraps into an orphan */
  .stat-strip{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;padding:14px 16px;margin-bottom:16px}
  .stat-sep{display:none}
  .stat-strip-link{grid-column:1/-1;margin-left:0;padding-top:10px;border-top:1px solid var(--line)}

  .mod-row{padding:14px 14px;gap:12px}
  .mod-name{font-size:15px}
  .grade-card{padding:18px 16px;gap:14px}
  .grade-letter{font-size:42px;min-width:60px}
  .rank-display{padding:18px 14px}
  .rank-title{font-size:23px}
  .proto-note{padding:14px 16px}
}
[data-theme="light"] .forge-logo-dark{display:none!important}[data-theme="light"] .forge-logo-light{display:inline!important}
/* ── dashboard-specific ── */
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ember);margin-bottom:8px;text-align:center}
#app h1{text-align:center;margin-bottom:28px}
.stat-strip{display:flex;align-items:center;gap:22px;flex-wrap:wrap;padding:16px 20px;border:1px solid var(--line);border-radius:var(--radius-lg);margin:0 auto 20px;max-width:620px;background:var(--glass-panel);backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur));box-shadow:0 8px 24px rgba(0,0,0,.12);transition:transform .2s ease,box-shadow .2s ease}
.stat-strip:hover{transform:translateY(-3px);box-shadow:0 14px 32px rgba(0,0,0,.18)}
.stat{display:flex;flex-direction:column;gap:2px}
.stat-label{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.stat-value{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;color:var(--white)}
.stat-value-sub{font-size:12px;font-weight:600;color:var(--good);margin-left:5px}
.stat-sep{width:1px;align-self:stretch;background:var(--line)}
.stat-strip-link{margin-left:auto;font-size:12px;font-weight:600;color:var(--ember);text-decoration:none;white-space:nowrap}
.stat-strip-link:hover{text-decoration:underline}
.proto-note{border:1px solid var(--line);border-radius:var(--radius-lg);padding:16px 20px;max-width:58ch;margin:0 auto;background:var(--glass-panel);backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur))}
.proto-note p{font-size:14px;line-height:1.6;color:var(--slate)}
.mod-list{display:flex;flex-direction:column;gap:10px;max-width:620px;margin:0 auto}
.mod-row{display:flex;align-items:center;gap:14px;padding:16px 18px;background:var(--glass-panel);backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur));border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:0 8px 24px rgba(0,0,0,.1);transition:border-color .15s ease,background .15s ease;text-decoration:none;color:inherit}
.mod-row:hover{background:var(--panel-2);border-color:var(--ember)}
.mod-row:focus-visible{border-color:var(--hot);box-shadow:0 0 0 3px rgba(255,201,60,.18)}
.mod-icon{width:34px;height:34px;border-radius:var(--radius-sm);background:var(--panel-2);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--slate)}
.mod-icon svg{width:17px;height:17px}
.mod-body{flex:1;min-width:0}
.mod-name{font-size:14px;font-weight:600;color:var(--white)}
.mod-status{font-size:12px;color:var(--dim);margin-top:1px}
.mod-stat{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;color:var(--ember);white-space:nowrap;flex-shrink:0}
.mod-stat.mod-stat-muted{color:var(--dim);font-weight:500}
.mod-action{font-size:12px;font-weight:600;color:var(--ember);white-space:nowrap;opacity:.85}
.mod-row:hover .mod-action{opacity:1;color:var(--hot)}
</style>

var RANKS = [
  {name:'Apprentice',min:0,max:300,color:'var(--slate)',bg:'var(--panel-2)'},
  {name:'Journeyman',min:300,max:1500,color:'var(--hot)',bg:'rgba(255,201,60,.12)'},

function getRank(xp){
  for(var i=RANKS.length-1;i>=0;i--){if(xp>=RANKS[i].min)return RANKS[i];}
  return RANKS[0];
}

// Classes are named "<year><letter>/<subject code>" (e.g. "12B/Bs" for a
// Year 12 A-Level class, "10A/Gg" for a Year 10 GCSE class). There's no
// separate level column, so level is derived from the year-group prefix:
// Year 12-13 = A-Level, Year 7-11 = GCSE. See school-overview.html's classLevel.
//
// Nothing on this page renders the level — it's derived and cached onto the
// `forge-student` session because profile.html reads it back as the fallback
// level for responses it can't attribute to a known class. Don't drop it as
// unused.
function classLevel(className) {
  var m = /^(\d+)/.exec(className || '');
  if (!m) return 'alevel';
  var year = parseInt(m[1], 10);
  return year >= 12 ? 'alevel' : 'gcse';
}

function calcXP(responses){
  var xp=0;
  responses.forEach(function(r){
    if(r.question_id&&r.question_id.endsWith('-CRU')&&r.is_correct) xp+=30;
    else if(r.reforge_attempted&&r.reforge_correct) xp+=20;
    else if(r.is_correct&&!r.reforge_attempted) xp+=10;
    if(r.question_id&&r.question_id.endsWith('-ANVIL')&&r.is_correct) xp+=30; // treat anvil correct as 30
  });
  return xp;
}



function calcStreak(responses){
  if(!responses.length) return 0;
  var dates=new Set(responses.map(function(r){return r.created_at?r.created_at.substring(0,10):''}));
  var today=new Date().toISOString().substring(0,10);
  var streak=0;
  var d=new Date();
  while(true){
    var key=d.toISOString().substring(0,10);
    if(dates.has(key)){streak++;d.setDate(d.getDate()-1);}
    else break;
  }
  return streak;
}

var st={studentId:null,classId:null,studentName:null,responses:[],isPaid:false,isTrial:false,trialDaysLeft:0,paidSubjects:[],isGCSE:false};

function renderLogin(){
  var f=ForgeAuthCard.field('p-name','Your first name',{placeholder:'e.g. Alex',autocomplete:'given-name'})

       +'<p class="auth-err" id="p-err"></p>';
  app.innerHTML=ForgeAuthCard.shell({
    title:'Your Forge dashboard',
    sub:'Enter your name and class code to see your progress',
    foot:'No progress yet? <a href="forge-quiz.html">Start with a quiz</a>'
  },f);
  ForgeAuthCard.onSubmit(function(){document.getElementById('p-btn').onclick();});

  document.getElementById('p-btn').onclick=function(){
    var name=document.getElementById('p-name').value.trim();
    var code=document.getElementById('p-code').value.trim().toUpperCase();
    var err=document.getElementById('p-err');
    var btn=document.getElementById('p-btn');
    if(!name||!code){err.textContent='Enter your name and class code.';err.style.display='block';return;}
    btn.disabled=true;btn.textContent='Loading...';
    // Look up via RPC \u2014 classes/students tables are no longer directly
    // readable by an anonymous (no login) name+code session.
    fetch(SUPABASE_URL + '/rest/v1/rpc/get_student_by_name_and_code', {
      method: 'POST', headers: Object.assign({}, hdrs, {'Content-Type':'application/json'}),
      body: JSON.stringify({ p_code: code, p_name: name })
    }).then(function(r){ return r.json(); }).then(function(rows){
      if(!Array.isArray(rows)||rows.length===0){err.textContent='Class or name not found. Make sure you\'ve done the quiz first.';err.style.display='block';btn.disabled=false;btn.textContent='View my dashboard \u2192';return;}
      var match = rows[0];

      try { localStorage.setItem('forge-student', JSON.stringify({studentId: st.studentId, classId: st.classId, classCode: code, studentName: st.studentName, classSubject: match.subject || null, isGCSE: st.isGCSE})); } catch(e) {}
      ForgeClasses.add({
        classId: st.classId, classCode: code, className: match.class_name || null,
        subject: match.subject || null, studentId: st.studentId, studentName: name

      // class they've joined rather than just the code they signed in with.
      ForgeClasses.syncFromServer(SUPABASE_URL, SUPABASE_KEY,
        {studentId: st.studentId, classCode: code, studentName: name}, function(){});
      ForgeClasses.fetchLinkedResponses(SUPABASE_URL, SUPABASE_KEY,
        {studentId: st.studentId, classCode: code, studentName: name}, function(r){
        st.responses = r;
        renderDashboard();
      });
    });
  };
}



var SUBJ_LABELS = {econ:'Economics',psych:'Psychology',soc:'Sociology',geo:'Geography',bus:'Business',chem:'Chemistry',bio:'Biology',phys:'Physics',hist:'History',law:'Law',crim:'Criminology',pol:'Politics',maths:'Maths',german:'German',french:'French',cs:'Computer Science',rs:'Religious Studies',hsc:'Health & Social Care'};

function daysAgo(dateStr){
  if(!dateStr) return null;
  var then=new Date(dateStr.substring(0,10));
  var now=new Date(new Date().toISOString().substring(0,10));
  var diff=Math.round((now-then)/86400000);
  if(diff<=0) return 'Today';
  if(diff===1) return 'Yesterday';
  return diff+' days ago';
}

function renderDashboard(){
  var responses=st.responses||[];
  var total=responses.filter(function(r){return !r.reforge_attempted;}).length;
  var correct=responses.filter(function(r){return !r.reforge_attempted&&r.is_correct;}).length;
  var acc=total>0?Math.round((correct/total)*100):0;
  var xp=calcXP(responses);
  var rank=getRank(xp);
  var streak=calcStreak(responses);

  // Misconceptions — same chronological derivation as the full profile view
  var mcData={};
  var chronological=responses.slice().sort(function(a,b){return (a.created_at||'')<(b.created_at||'')?-1:1;});
  chronological.forEach(function(r){
    if(!r.misconception_tag)return;
    var tag=r.misconception_tag;
    if(!mcData[tag])mcData[tag]={fires:0,streak:0};
    if(r.reforge_attempted){
      if(r.reforge_correct)mcData[tag].streak++; else mcData[tag].streak=0;
    } else if(!r.is_correct){
      mcData[tag].fires++;mcData[tag].streak=0;
    }
  });
  var activeMCs=Object.keys(mcData).filter(function(t){return mcData[t].fires>0&&mcData[t].streak<3;});
  if (window.ForgeSidebar) ForgeSidebar.setBadge('anvil', activeMCs.length || null);
  try { localStorage.setItem('forge-anvil-open', String(activeMCs.length)); } catch(e) {}
  if (st.classId) {
    fetch(SUPABASE_URL+'/rest/v1/assignments?select=id,due_date,created_at,banks&class_id=eq.'+st.classId, {
      headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY}
    }).then(function(r){return r.json();}).then(function(rows){
      var today=new Date(); today.setHours(0,0,0,0);
      var count=(Array.isArray(rows)?rows:[]).filter(function(a){
        var banks=[]; try { banks=typeof a.banks==='string'?JSON.parse(a.banks):a.banks||[]; } catch(e) {}
        var created=a.created_at?new Date(a.created_at):null;
        var incomplete=!banks.length || banks.some(function(bank){
          var bankData=BANKS[bank];
          if (!bankData) return true;
          var ids={};
          responses.forEach(function(response){
            if (created && (!response.created_at || new Date(response.created_at)<created)) return;
            if (response.bank===bank) ids[String(response.question_id||'').replace(/-RF$/,'')]=true;
          });
          return Object.keys(ids).length < bankData.questions.filter(function(q){return !q.type||q.type==='fill_blank';}).length;
        });
        return incomplete;
      }).length;
      if (window.ForgeSidebar) ForgeSidebar.setBadge('assignments', count || null);
      try { localStorage.setItem('forge-assigned-open:'+String(st.studentId||'anon')+':'+String(st.classId||'none'), String(count)); } catch(e) {}
    }).catch(function(){});
  }
  // Strongest subject — highest accuracy among subjects with a real sample size
  var subjectData={};
  responses.forEach(function(r){
    var subj=r.subject||'unknown';
    if(subj==='unknown')return;
    if(!subjectData[subj])subjectData[subj]={total:0,correct:0};
    subjectData[subj].total++;
    if(r.is_correct)subjectData[subj].correct++;
  });
  var subjectRanked=Object.keys(subjectData).filter(function(s){return subjectData[s].total>=3;}).map(function(s){
    return {key:s,label:SUBJ_LABELS[s]||s,acc:Math.round((subjectData[s].correct/subjectData[s].total)*100)};
  }).sort(function(a,b){return b.acc-a.acc;});
  var strongest=subjectRanked[0]||null;

  // Crucible sessions
  var crucibleResponses=responses.filter(function(r){return r.question_id&&r.question_id.indexOf('-CRU')!==-1;});
  var lastCrucible=crucibleResponses.length?crucibleResponses.reduce(function(latest,r){return (!latest||(r.created_at||'')>(latest.created_at||''))?r:latest;},null):null;

  var lastActivity=responses.length?responses.reduce(function(latest,r){return (!latest||(r.created_at||'')>(latest.created_at||''))?r:latest;},null):null;

  var h='';
  h+='<div class="eyebrow">Dashboard</div>';
  h+='<h1>Welcome back, '+st.studentName+'</h1>';

  if(total===0){
    h+='<div class="ui-state">';
    h+='<div class="ui-state-title">Your first practice session is waiting.</div>';
    h+='<p class="ui-state-copy">Answer a few questions in Forge to start building your accuracy, strengths, and misconception profile.</p>';
    h+='<a class="ui-state-action" href="forge-quiz.html">Start practicing →</a>';
    h+='</div>';
    app.innerHTML=h;
    return;
  }

  h+='<div class="stat-strip">';
  h+='<div class="stat"><span class="stat-label">Rank</span><span class="stat-value">'+rank.name+'</span></div>';
  h+='<div class="stat-sep"></div>';
  h+='<div class="stat"><span class="stat-label">Streak</span><span class="stat-value">'+streak+' day'+(streak!==1?'s':'')+'</span></div>';
  h+='<div class="stat-sep"></div>';
  if(strongest){
    h+='<div class="stat"><span class="stat-label">Strongest subject</span><span class="stat-value">'+strongest.label+' <span class="stat-value-sub">'+strongest.acc+'%</span></span></div>';
  } else {
    h+='<div class="stat"><span class="stat-label">Strongest subject</span><span class="stat-value stat-value-muted">Not enough data yet</span></div>';
  }
  h+='<a class="stat-strip-link" href="profile.html">View profile →</a>';
  h+='</div>';

  h+='<div class="ui-recommendation">';
  if(activeMCs.length>0){
    h+='<div class="ui-state-title">Recommended next: repair '+activeMCs.length+' misconception'+(activeMCs.length===1?'':'s')+'</div>';
    h+='<p class="ui-state-copy">Anvil has the exact errors that need another pass. Clear one now, then return to Forge to test the improvement.</p>';
    h+='<a class="ui-state-action" href="anvil.html">Open Anvil →</a>';
  } else {
    h+='<div class="ui-state-title">Recommended next: keep the heat on.</div>';
    h+='<p class="ui-state-copy">No open misconceptions right now. A short Forge session will keep your recall fresh and surface the next useful focus area.</p>';
    h+='<a class="ui-state-action" href="forge-quiz.html">Continue practice →</a>';
  }
  h+='</div>';

  h+='<div class="mod-list">';

  // Forge row
  h+='<a class="mod-row" href="forge-quiz.html">';
  h+='<span class="mod-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c1.2 2 .6 3.2-.3 4.3C10.8 8.5 9.5 9.8 9.5 12a2.5 2.5 0 0 0 5 0c0-.8-.3-1.3-.7-1.8"></path><path d="M8 13.5c-1 1.5-1.3 3-1.3 4.3A5.3 5.3 0 0 0 12 23a5.3 5.3 0 0 0 5.3-5.2c0-1.4-.4-2.9-1.3-4.3"></path></svg></span>';
  h+='<div class="mod-body"><div class="mod-name">Forge</div><div class="mod-status">'+acc+'% accuracy overall'+(lastActivity?' · last active '+(daysAgo(lastActivity.created_at)||'').toLowerCase():'')+'</div></div>';
  h+='<span class="mod-stat">'+total+' answered</span>';
  h+='<span class="mod-action">Practice →</span></a>';

  // Anvil row
  h+='<a class="mod-row" href="anvil.html">';
  h+='<span class="mod-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13h16l-1.5-3.5a2 2 0 0 0-1.84-1.22L14 8.2V6h1a1 1 0 0 0 0-2h-6a1 1 0 0 0 0 2h1v2.2l-2.66.08a2 2 0 0 0-1.84 1.22L4 13Z"></path><path d="M9 13v2a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2v-2"></path><path d="M10 17v3M14 17v3M8 20h8"></path></svg></span>';
  h+='<div class="mod-body"><div class="mod-name">Anvil</div><div class="mod-status">'+(activeMCs.length>0?'Needs review — head over to clear these':'All misconceptions cleared')+'</div></div>';
  h+='<span class="mod-stat'+(activeMCs.length===0?' mod-stat-muted':'')+'">'+activeMCs.length+' open</span>';
  h+='<span class="mod-action">Review →</span></a>';

  // Crucible row
  h+='<a class="mod-row" href="crucible.html">';
  h+='<span class="mod-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M9 3v3.5a5 5 0 0 1-.7 2.55L5.9 12.9A5 5 0 0 0 5.2 15.45V19a2 2 0 0 0 2 2h9.6a2 2 0 0 0 2-2v-3.55a5 5 0 0 0-.7-2.55l-2.4-3.85A5 5 0 0 1 15 6.5V3"></path><path d="M7 16h10"></path></svg></span>';
  h+='<div class="mod-body"><div class="mod-name">Crucible</div><div class="mod-status">'+(lastCrucible?'Last session '+daysAgo(lastCrucible.created_at):'No timed sessions yet')+'</div></div>';
  h+='<span class="mod-stat'+(crucibleResponses.length===0?' mod-stat-muted':'')+'">'+crucibleResponses.length+' Qs</span>';
  h+='<span class="mod-action">Start →</span></a>';

  h+='</div>';

  app.innerHTML=h;
}


function forgeSignOut(){
  try { localStorage.removeItem('forge-student'); } catch(e) {}
  try { localStorage.removeItem('forge-free-session'); } catch(e) {}
  ForgeAuth.signOut();
  location.reload();
}

(function(){
  if (ForgeAuth.hasSession()) {
    ForgeAuth.getSession().then(function(result) {
      if (result && result.subscriber) {
        var sub    = result.subscriber;
        var access = result.access;
        st.studentName = sub.name;
        st.isPaid      = access === 'pro';
        st.isTrial     = access === 'trial';
        st.trialDaysLeft = result.daysLeft || 0;
        st.paidSubjects  = sub.subjects || [];
        // Check paid student cache first
        try {
          var paidCache = JSON.parse(localStorage.getItem('forge-paid-student') || 'null');
          if (paidCache && paidCache.studentId) st.studentId = paidCache.studentId;
        } catch(e) {}
        // Check for linked student record
        var saved = null;
        try { saved = JSON.parse(localStorage.getItem('forge-student') || 'null'); } catch(e) {}
        if (saved && saved.studentId) {
          if (!st.studentId) st.studentId = saved.studentId;
          st.classId = saved.classId || st.classId || null;
        }

        function loadProfileWithId() {
          var token = ForgeAuth.accessToken();
          var authUser = ForgeAuth.currentUser();
          if (token && authUser) {
            // Load responses from ALL student rows for this auth user
            fetch(SUPABASE_URL + '/rest/v1/students?select=id,class_id&auth_user_id=eq.' + authUser.id, {
              headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + token }
            }).then(function(r) { return r.json(); }).then(function(studentRows) {
              if (!Array.isArray(studentRows) || studentRows.length === 0) {
                renderDashboard(); return;
              }
              var ids = studentRows.map(function(r) { return r.id; });
              if (!st.classId && studentRows[0].class_id) {
                st.classId = studentRows[0].class_id;
                try {
                  var cached = JSON.parse(localStorage.getItem('forge-student') || 'null') || {};
                  cached.studentId = st.studentId || studentRows[0].id;
                  cached.classId = st.classId;
                  cached.studentName = st.studentName;
                  localStorage.setItem('forge-student', JSON.stringify(cached));
                } catch(e) {}
              }
              var filter = ids.length === 1
                ? 'student_id=eq.' + ids[0]
                : 'student_id=in.(' + ids.join(',') + ')';
              supaGet('responses', filter + '&order=created_at.desc').then(function(r) {
                st.responses = r || [];
                renderDashboard();
              }).catch(function() { renderDashboard(); });
            }).catch(function() { renderDashboard(); });
          } else if (st.studentId) {
            supaGet('responses','student_id=eq.'+st.studentId+'&order=created_at.desc').then(function(r){
              st.responses = r || [];
              renderDashboard();
            }).catch(function(){ renderDashboard(); });
          } else {
            renderDashboard();
          }
        }

        // If still no studentId, look up by auth_user_id
        if (!st.studentId && ForgeAuth.currentUser()) {
          (function() {
            var _token = ForgeAuth.accessToken();
            var _uid = ForgeAuth.currentUser() ? ForgeAuth.currentUser().id : null;
            if (!_token || !_uid) return Promise.resolve([]);
            return fetch(SUPABASE_URL + '/rest/v1/students?select=*&auth_user_id=eq.' + _uid + '&order=created_at.asc&limit=1', {
              headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + _token }
            }).then(function(r) { return r.json(); });
          })().then(function(rows) {
            if (rows && rows.length > 0) {
              st.studentId = rows[0].id;
              try { localStorage.setItem('forge-paid-student', JSON.stringify({ studentId: rows[0].id, name: sub.name })); } catch(e) {}
            }
            loadProfileWithId();
          }).catch(function() { loadProfileWithId(); });
        } else {
          loadProfileWithId();
        }
      } else {
        checkLocalSessionProfile();
      }
    }).catch(function() { checkLocalSessionProfile(); });
  } else {
    checkLocalSessionProfile();
  }

  function checkLocalSessionProfile() {
    // Check free session
    var freeSession = null;
    try { freeSession = JSON.parse(localStorage.getItem('forge-free-session') || 'null'); } catch(e) {}
    if (freeSession && freeSession.studentId) {
      st.studentId   = freeSession.studentId;
      st.studentName = freeSession.name;
      st.classId     = null;
      supaGet('responses','student_id=eq.'+freeSession.studentId+'&order=created_at.desc').then(function(r){
        st.responses = r || [];
        renderDashboard();
      }).catch(function(){ renderDashboard(); });
      return;
    }
    // Check class session
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem('forge-student') || 'null'); } catch(e) {}
    if (saved && saved.studentId) {
      st.studentId   = saved.studentId;
      st.classId     = saved.classId;
      st.studentName = saved.studentName;
      var applyLevelAndLoad = function(){
        if (!saved.classCode) { renderLogin(); return; } // older cached session predates classCode caching — needs one re-entry
        ForgeClasses.adopt(saved);
        var anchor = {studentId: st.studentId, classCode: saved.classCode, studentName: st.studentName};
        ForgeClasses.syncFromServer(SUPABASE_URL, SUPABASE_KEY, anchor, function(){});
        ForgeClasses.fetchLinkedResponses(SUPABASE_URL, SUPABASE_KEY, anchor, function(r){
          st.responses = r;
          renderDashboard();
        });
      };
      if (typeof saved.isGCSE === 'boolean') {
        st.isGCSE = saved.isGCSE;
        applyLevelAndLoad();
      } else if (st.classId) {
        // Older saved sessions predate level tracking — resolve and cache it.
        supaGet('classes','id=eq.'+st.classId).then(function(cls){
          st.isGCSE = Array.isArray(cls) && cls.length>0 && classLevel(cls[0].name)==='gcse';
          try { saved.isGCSE = st.isGCSE; localStorage.setItem('forge-student', JSON.stringify(saved)); } catch(e) {}
          applyLevelAndLoad();
        }).catch(function(){ applyLevelAndLoad(); });
      } else {
        applyLevelAndLoad();
      }
    } else {
      renderLogin();
    }
  }
})();
</script>
<script src="scripts/nav.js"></script>
</body>
