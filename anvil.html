*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--coal);color:var(--slate);font-family:'Inter',sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh}
h1,h2,h3{font-family:'Sora',sans-serif;color:var(--white);line-height:1.1;letter-spacing:-.015em}
.mono{font-family:'JetBrains Mono',monospace}
.wrap{max-width:680px;margin:0 auto;padding:28px 20px}
.tag{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ember)}
.logo{font-family:'Sora',sans-serif;font-weight:800;font-size:20px;color:var(--white);text-decoration:none;display:inline-flex;align-items:center;gap:8px;margin-bottom:0}
.logo .spark{width:9px;height:9px;background:linear-gradient(135deg,var(--hot),var(--ember));border-radius:var(--radius-xs);transform:rotate(45deg);box-shadow:0 0 10px rgba(255,107,44,.7)}
.theme-toggle{background:var(--panel);border:1px solid var(--line);color:var(--slate);font-family:'JetBrains Mono',monospace;font-size:12px;padding:6px 12px;border-radius:var(--radius-sm);cursor:pointer;z-index:99}
.theme-toggle:hover{color:var(--white);border-color:var(--ember)}

.join-input{width:100%;padding:12px 14px;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--panel);color:var(--white);font-family:'Inter',sans-serif;font-size:15px;margin-bottom:14px;text-transform:uppercase}
.join-input:focus{outline:none;border-color:var(--ember)}
.join-input::placeholder{color:#7A756E;text-transform:none}
.join-btn{width:100%;padding:13px;border-radius:var(--radius-sm);background:var(--ember);color:#fff;border:none;font-family:'Inter',sans-serif;font-weight:600;font-size:15px;cursor:pointer}
.join-btn:hover{background:var(--hot)}
.join-btn:disabled{opacity:.5;cursor:wait}
.join-err{color:var(--bad);font-size:13px;margin-top:10px;display:none}
.center{text-align:center}
.hidden{display:none}

.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-md);padding:16px;text-align:center}
.stat-n{font-family:'Sora',sans-serif;font-size:28px;font-weight:800;display:block}
.stat-l{font-size:11px;color:#8A857E;margin-top:4px;display:block;font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.04em}

.anvil-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);padding:20px;margin-bottom:12px;cursor:pointer;transition:border-color .15s}
.anvil-card:hover{border-color:var(--ember)}
.anvil-card.active-mc{border-left:3px solid var(--bad)}
.anvil-card.resolved-mc{border-left:3px solid var(--good);opacity:.6}
.anvil-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.anvil-tag{font-size:11px;color:var(--coal);background:var(--hot);padding:2px 8px;border-radius:var(--radius-xs);font-weight:600;font-family:'JetBrains Mono',monospace}
.anvil-label{color:var(--white);font-size:14px;font-weight:600;margin-top:6px}
.anvil-meta{font-size:12px;color:#8A857E;margin-top:6px;display:flex;gap:16px;flex-wrap:wrap}
.anvil-streak{font-family:'JetBrains Mono',monospace;font-size:12px;margin-top:8px}
.streak-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:3px}

/* quiz mode */
.stem{font-size:16px;line-height:1.55;color:var(--white);margin-bottom:20px}
.options{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:var(--radius-md);border:1.5px solid var(--line);background:var(--panel-2);color:var(--white);cursor:pointer;text-align:left;font-family:'Inter',sans-serif;font-size:15px;line-height:1.45;transition:border-color .15s,background .15s,opacity .15s;width:100%}
.opt:hover:not(.answered){border-color:var(--ember)}
.opt .letter{font-weight:700;min-width:20px;color:#8A857E}
.opt.answered{cursor:default}
.opt.correct{border-color:var(--good);background:rgba(127,217,138,.08);opacity:1}
.opt.correct .letter{color:var(--good)}
.opt.wrong{border-color:var(--bad);background:rgba(255,90,90,.07);opacity:1}
.opt.wrong .letter{color:var(--bad)}
.opt.dimmed{opacity:.5}
.scaffold-box{margin-top:16px;padding:14px 16px;border-radius:var(--radius-md);border:1px solid rgba(255,201,60,.4);background:linear-gradient(180deg,rgba(255,107,44,.10),rgba(255,201,60,.05));animation:heat .5s ease}
@keyframes heat{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.scaffold-box .stag{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--coal);background:var(--hot);padding:2px 8px;border-radius:var(--radius-xs);font-weight:600;margin-bottom:8px}
.scaffold-box p{font-size:14px;color:var(--white);line-height:1.5}
.praise-box{margin-top:16px;padding:14px 16px;border-radius:var(--radius-md);border:1px solid var(--good);background:rgba(127,217,138,.08);color:var(--good);font-weight:600;font-size:14px}
.next-btn{margin-top:18px;padding:10px 24px;border-radius:var(--radius-sm);background:var(--white);color:var(--coal);border:none;cursor:pointer;font-weight:600;font-size:14px;font-family:'Inter',sans-serif;float:right}
.back-btn{background:none;border:none;cursor:pointer;font-size:13px;color:#8A857E;font-family:'Inter',sans-serif;margin-bottom:16px;padding:0}
.back-btn:hover{color:var(--white)}
.clear{clear:both}
.empty{text-align:center;padding:48px 20px}
.empty h3{color:var(--white);margin-bottom:8px}
.cleared-banner{text-align:center;padding:40px 20px;background:var(--panel);border:1px solid rgba(127,217,138,.4);border-radius:var(--radius-lg);margin-top:20px}
.cleared-banner h2{color:var(--good);margin-bottom:8px}

[data-theme="light"] .anvil-tag,[data-theme="light"] .stag{color:#fff}
[data-theme="light"] .join-btn{color:#fff}
@media(max-width:600px){.stat-row{grid-template-columns:1fr}}
[data-theme="light"] .forge-logo-dark{display:none!important}[data-theme="light"] .forge-logo-light{display:inline!important}</style>

// Build a lookup: misconception tag -> array of questions that test it
var MC_QUESTIONS = {};
for(var bk in BANKS){
  BANKS[bk].questions.forEach(function(q){
    if(q.type || !q.options || !q.reforge) return; // skip non-MCQ
    var tag = q.tag;
    if(typeof tag === 'string'){
      if(!MC_QUESTIONS[tag]) MC_QUESTIONS[tag] = [];
      MC_QUESTIONS[tag].push(q);
    } else if(Array.isArray(tag)){
      tag.forEach(function(t){
        if(!MC_QUESTIONS[t]) MC_QUESTIONS[t] = [];
        MC_QUESTIONS[t].push(q);
      });
    }
  });
}

var CLEAR_THRESHOLD = 3; // consecutive correct to resolve
var app = document.getElementById('app');
var anvilState = { studentId:null, classId:null, studentName:null, classSubject:null, responses:[], misconceptions:{} };

function renderLogin(){
  var f=ForgeAuthCard.field('a-name','Your first name',{placeholder:'e.g. Alex',autocomplete:'given-name'})
       +ForgeAuthCard.field('a-code','Class code',{placeholder:'e.g. ECON-Y12',upper:true})
       +'<button class="auth-btn" id="a-btn" type="submit">Open my Anvil \u2192</button>'
       +'<p class="auth-err" id="a-err"></p>';
  app.innerHTML=ForgeAuthCard.shell({
    title:'Rework your weaknesses',
    sub:'Misconceptions that survived the re-forge land here \u2014 sign in to work them off.',
    foot:'No progress yet? <a href="forge-quiz.html">Start with a quiz</a>'
  },f);
  ForgeAuthCard.onSubmit(function(){document.getElementById('a-btn').onclick();});

  document.getElementById('a-btn').onclick=function(){
    var name=document.getElementById('a-name').value.trim();
    var code=document.getElementById('a-code').value.trim().toUpperCase();
    var err=document.getElementById('a-err');
    var btn=document.getElementById('a-btn');
    if(!name||!code){err.textContent='Enter your name and class code.';err.style.display='block';return;}
    btn.disabled=true;btn.textContent='Loading...';

    // Look up via RPC \u2014 classes/students tables are no longer directly
    // readable by an anonymous (no login) name+code session.
    fetch(SUPABASE_URL + '/rest/v1/rpc/get_student_by_name_and_code', {
      method: 'POST', headers: Object.assign({}, headers, {'Content-Type':'application/json'}),
      body: JSON.stringify({ p_code: code, p_name: name })
    }).then(function(r){ return r.json(); }).then(function(rows){
      if(!Array.isArray(rows)||rows.length===0){
        err.textContent='Class or student not found. Make sure you\u2019ve done the quiz first.';err.style.display='block';
        btn.disabled=false;btn.textContent='Open my Anvil \u2192';return;
      }
      var match=rows[0];
      anvilState.studentId=match.student_id;
      anvilState.classId=match.class_id;
      anvilState.studentName=name;
      anvilState.classSubject=match.subject||null;
      try { localStorage.setItem('forge-student', JSON.stringify({studentId: anvilState.studentId, classId: anvilState.classId, classCode: code, studentName: anvilState.studentName, classSubject: anvilState.classSubject})); } catch(e) {}
      ForgeClasses.add({
        classId: anvilState.classId, classCode: code, className: match.class_name || null,
        subject: anvilState.classSubject, studentId: anvilState.studentId, studentName: name
      });
      // The Anvil covers every class the student is in, not just this one —
      // misconceptions don't stop mattering because they signed in via a
      // different code.
      ForgeClasses.fetchAllResponses(SUPABASE_URL, SUPABASE_KEY, name, function(responses){
        anvilState.responses = responses;
        buildMisconceptions();
        renderAnvilHome();
      });
    });
  };
}

function buildMisconceptions(){
  var mc={};
  anvilState.responses.forEach(function(r){
    if(!r.misconception_tag) return;
    var tag=r.misconception_tag;
    if(!mc[tag]) mc[tag]={tag:tag,fires:0,reforgeAttempts:0,reforgeCorrect:0,streak:0,history:[],studentId:null,classId:null};

    // Remember which class this misconception came from so re-forging it
    // writes back against that class's student row, not whichever class
    // happened to be active.
    if(r._studentId){ mc[tag].studentId=r._studentId; mc[tag].classId=r._classId; }

    if(r.reforge_attempted){
      mc[tag].reforgeAttempts++;
      if(r.reforge_correct){
        mc[tag].reforgeCorrect++;
        mc[tag].streak++;
        mc[tag].history.push(true);
      } else {
        mc[tag].streak=0;
        mc[tag].history.push(false);
      }
    } else if(!r.is_correct){
      mc[tag].fires++;
      mc[tag].streak=0;
      mc[tag].history.push(false);
    }
  });
  anvilState.misconceptions=mc;
}

function getActiveMCs(){
  var active=[];
  for(var tag in anvilState.misconceptions){
    var m=anvilState.misconceptions[tag];
    if(m.fires>0 && m.streak<CLEAR_THRESHOLD){
      active.push(m);
    }
  }
  active.sort(function(a,b){return b.fires-a.fires;});
  return active;
}

function getResolvedMCs(){
  var resolved=[];
  for(var tag in anvilState.misconceptions){
    var m=anvilState.misconceptions[tag];
    if(m.fires>0 && m.streak>=CLEAR_THRESHOLD){
      resolved.push(m);
    }
  }
  return resolved;
}

function renderAnvilHome(){
  var active=getActiveMCs();
  var resolved=getResolvedMCs();
  var total=active.length+resolved.length;

  var h='<button class="back-btn" onclick="'+(anvilState.classId ? 'renderLogin()' : 'window.location.href=\'forge-quiz.html\'')+'">\u2190 '+(anvilState.classId ? 'Log out' : 'Back to quiz')+'</button>';
  h+='<div class="center" style="margin-bottom:24px">';
  h+='<p class="tag" style="margin-bottom:4px">THE ANVIL</p>';
  h+='<h1 style="font-size:24px;margin-bottom:4px">'+anvilState.studentName+'</h1>';
  h+='<p style="color:#8A857E;font-size:14px">'+CLEAR_THRESHOLD+' correct in a row to clear a misconception</p>';
  h+='</div>';

  // Stats
  h+='<div class="stat-row">';
  h+='<div class="stat"><span class="stat-n" style="color:var(--bad)">'+active.length+'</span><span class="stat-l">Active</span></div>';
  h+='<div class="stat"><span class="stat-n" style="color:var(--good)">'+resolved.length+'</span><span class="stat-l">Resolved</span></div>';
  h+='<div class="stat"><span class="stat-n" style="color:var(--white)">'+total+'</span><span class="stat-l">Total tracked</span></div>';
  h+='</div>';

  if(active.length===0 && resolved.length===0){
    h+='<div class="empty"><h3>No misconceptions yet</h3><p>Do some quizzes first \u2014 any wrong answers will appear here for reworking.</p>';
    h+='<a class="btn-glass btn-ember" href="forge-quiz.html" style="display:inline-block;margin-top:16px;padding:10px 20px;border-radius:var(--radius-sm);text-decoration:none;font-weight:600;font-size:14px">Go to the quiz \u2192</a>';
    h+='</div>';
    app.innerHTML=h + sessionBar();return;
  }

  if(active.length===0){
    h+='<div class="cleared-banner"><h2>\u2713 Anvil clear</h2><p style="color:var(--slate)">Every misconception has been resolved. Keep doing quizzes \u2014 new ones will land here if they fire.</p></div>';
  }

  // Active misconceptions
  if(active.length>0){
    h+='<p style="font-size:12px;color:var(--bad);font-family:JetBrains Mono,monospace;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">\u26a0 Active \u2014 tap to rework</p>';
    active.forEach(function(m){
      var label=MC_LABELS[m.tag]||m.tag;
      var hasQs=MC_QUESTIONS[m.tag]&&MC_QUESTIONS[m.tag].length>0;
      h+='<div class="anvil-card active-mc" '+(hasQs?'onclick="startRework(\''+m.tag+'\')"':'')+' style="'+(hasQs?'':'opacity:.5;cursor:default')+'">';
      h+='<div class="anvil-top"><span class="anvil-tag">'+m.tag+'</span><span class="mono" style="font-size:12px;color:var(--bad)">'+m.fires+' fires</span></div>';
      h+='<div class="anvil-label">'+label+'</div>';
      h+='<div class="anvil-meta"><span>Reforged '+m.reforgeCorrect+'/'+m.reforgeAttempts+'</span><span>Streak: '+m.streak+'/'+CLEAR_THRESHOLD+'</span></div>';
      // Streak dots
      h+='<div class="anvil-streak">';
      var recent=m.history.slice(-6);
      recent.forEach(function(ok){
        h+='<span class="streak-dot" style="background:'+(ok?'var(--good)':'var(--bad)')+'"></span>';
      });
      if(recent.length===0) h+='<span style="font-size:11px;color:#8A857E">No attempts yet</span>';
      h+='</div>';
      h+='</div>';
    });
  }

  // Resolved
  if(resolved.length>0){
    h+='<p style="font-size:12px;color:var(--good);font-family:JetBrains Mono,monospace;text-transform:uppercase;letter-spacing:.06em;margin:24px 0 10px">\u2713 Resolved</p>';
    resolved.forEach(function(m){
      var label=MC_LABELS[m.tag]||m.tag;
      h+='<div class="anvil-card resolved-mc">';
      h+='<div class="anvil-top"><span class="anvil-tag" style="background:var(--good)">'+m.tag+'</span><span class="mono" style="font-size:12px;color:var(--good)">\u2713 Cleared</span></div>';
      h+='<div class="anvil-label" style="text-decoration:line-through;color:var(--slate)">'+label+'</div>';
      h+='</div>';
    });
  }

  app.innerHTML=h;
}

function shuffleArr(arr){
  var a=arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var tmp=a[i];a[i]=a[j];a[j]=tmp;
  }
  return a;
}

function variantKey(v){ return v.q.id+(v.useReforge?'-RF':''); }

// Build one "lap" of variants (original + reforge for each question, since
// MC_QUESTIONS only ever contains questions that have a reforge), shuffled.
// avoidKey, if given, keeps the first item of the new lap from being the
// exact same rendered question (id + variant) as the last one shown, so
// laps never visibly repeat the same question back-to-back.
function buildReworkLap(questions,avoidKey){
  var variants=[];
  questions.forEach(function(q){
    variants.push({q:q,useReforge:false});
    variants.push({q:q,useReforge:true});
  });
  var shuffled=shuffleArr(variants);
  if(avoidKey && shuffled.length>1){
    var tries=0;
    while(variantKey(shuffled[0])===avoidKey && tries<10){
      shuffled=shuffleArr(variants);
      tries++;
    }
    // Still colliding after retries (only possible with a single-question
    // pool, where a swap is guaranteed to fix it): swap the clashing first
    // item with a later one that doesn't match.
    if(variantKey(shuffled[0])===avoidKey){
      for(var i=1;i<shuffled.length;i++){
        if(variantKey(shuffled[i])!==avoidKey){
          var tmp=shuffled[0];shuffled[0]=shuffled[i];shuffled[i]=tmp;
          break;
        }
      }
    }
  }
  return shuffled;
}

window.startRework=function(tag){
  var questions=MC_QUESTIONS[tag];
  if(!questions||questions.length===0) return;
  renderReworkQuestion(tag,questions,buildReworkLap(questions,null),0);
};

function renderReworkQuestion(tag,questions,lap,qIdx){
  // Once a lap (every question, as both original and reforge) is used up,
  // shuffle a fresh one rather than replaying the same fixed cycle.
  if(qIdx>=lap.length){
    lap=buildReworkLap(questions,variantKey(lap[lap.length-1]));
    qIdx=0;
  }
  var variant=lap[qIdx];
  var baseQ=variant.q;
  var useReforge=variant.useReforge && baseQ.reforge;
  var q = useReforge
    ? { id: baseQ.id+'-RF', stem: baseQ.reforge.stem, options: baseQ.reforge.options, correct: baseQ.reforge.correct, scaffold: baseQ.scaffold, tag: baseQ.tag }
    : baseQ;
  var label=MC_LABELS[tag]||tag;
  var m=anvilState.misconceptions[tag];
  var keys=Object.keys(q.options);

  var h='<button class="back-btn" onclick="renderAnvilHome()">\u2190 Back to Anvil</button>';
  h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px">';
  h+='<div><span class="anvil-tag">'+tag+'</span><span style="color:var(--white);font-size:14px;font-weight:600;margin-left:10px">'+label+'</span></div>';
  h+='<span class="mono" style="font-size:12px;color:var(--slate)">Streak: '+m.streak+'/'+CLEAR_THRESHOLD+'</span>';
  h+='</div>';

  h+='<div class="stem">'+q.stem+'</div>';
  h+='<div class="options" id="rw-opts">';
  keys.forEach(function(k){
    h+='<button class="opt" data-k="'+k+'"><span class="letter">'+k+'</span><span>'+q.options[k]+'</span></button>';
  });
  h+='</div>';
  h+='<div id="rw-feedback"></div>';
  h+='<div class="clear"></div>';

  app.innerHTML=h;

  var opts=document.querySelectorAll('#rw-opts .opt');
  var answered=false;

  opts.forEach(function(o){
    o.onclick=function(){
      if(answered)return;
      answered=true;
      var k=o.dataset.k;
      var isCorrect=k===q.correct;

      // Log to Supabase
      supaInsert('responses',{
        student_id:m.studentId||anvilState.studentId,
        class_id:m.classId||anvilState.classId,
        question_id:q.id+'-ANVIL',
        bank:tag,
        subject:'anvil',
        selected_option:k,
        is_correct:isCorrect,
        misconception_tag:tag,
        reforge_attempted:true,
        reforge_correct:isCorrect
      });

      // Update local state
      if(isCorrect){
        m.streak++;
        m.reforgeCorrect++;
        m.reforgeAttempts++;
        m.history.push(true);
      } else {
        m.streak=0;
        m.reforgeAttempts++;
        m.history.push(false);
      }

      opts.forEach(function(x){
        x.classList.add('answered');
        if(x.dataset.k===q.correct) x.classList.add('correct');
        else if(x===o&&!isCorrect) x.classList.add('wrong');
        else x.classList.add('dimmed');
      });

      var fb=document.getElementById('rw-feedback');
      var fh='';

      if(isCorrect && m.streak>=CLEAR_THRESHOLD){
        fh='<div class="cleared-banner" style="margin-top:20px"><h2>\u2713 Misconception cleared!</h2><p style="color:var(--slate)">'+tag+' \u2014 '+label+'<br>'+CLEAR_THRESHOLD+' correct in a row. This one is off your Anvil.</p></div>';
        fh+='<button class="next-btn btn-glass btn-ember" id="rw-next">Back to Anvil \u2192</button><div class="clear"></div>';
        fb.innerHTML=fh;
        document.getElementById('rw-next').onclick=function(){ renderAnvilHome(); };
      } else if(isCorrect){
        fh='<div class="praise-box">\u2713 Correct. Streak: '+m.streak+'/'+CLEAR_THRESHOLD+'</div>';
        fh+='<button class="next-btn btn-glass btn-ember" id="rw-next">Next question \u2192</button><div class="clear"></div>';
        fb.innerHTML=fh;
        document.getElementById('rw-next').onclick=function(){
          renderReworkQuestion(tag,questions,lap,qIdx+1);
        };
      } else {
        fh='<div class="scaffold-box"><span class="stag">'+tag+'</span><p>'+q.scaffold+'</p></div>';
        fh+='<div style="margin-top:12px;font-size:14px;color:var(--bad);font-weight:600">Streak reset to 0/'+CLEAR_THRESHOLD+'</div>';
        fh+='<button class="next-btn btn-glass btn-ember" id="rw-next">Try again \u2192</button><div class="clear"></div>';
        fb.innerHTML=fh;
        document.getElementById('rw-next').onclick=function(){
          renderReworkQuestion(tag,questions,lap,qIdx+1);
        };
      }
    };
  });
}

function forgeLogout(){
  try { localStorage.removeItem('forge-student'); } catch(e) {}
  ForgeClasses.clear();
  try { localStorage.removeItem('forge-free-session'); } catch(e) {}
  ForgeAuth.signOut();
  location.reload();
}
function sessionBar(){
  if (!anvilState.studentId || !anvilState.studentName) return '';
  return '<div style="text-align:center;margin-top:26px;padding-top:14px;border-top:1px solid var(--line)"><span style="font-size:12px;color:#8A857E">Signed in as <b style="color:var(--slate)">' + anvilState.studentName + '</b> \u00b7 <a href="#" onclick="forgeLogout();return false" style="color:var(--ember);text-decoration:none">Not you? Switch student</a></span></div>';
}

// ===== SHARED SESSION RESTORE =====
function startAnvil(){
  if (ForgeAuth.hasSession()) {
    ForgeAuth.getSession().then(function(result) {
      if (result && result.subscriber) {
        var sub = result.subscriber;
        anvilState.studentName = sub.name;
        anvilState.studentId   = null;
        anvilState.classId     = null;
        anvilState.classSubject = null;
        // Check paid student cache first
        try {
          var paidCache = JSON.parse(localStorage.getItem('forge-paid-student') || 'null');
          if (paidCache && paidCache.studentId) anvilState.studentId = paidCache.studentId;
        } catch(e) {}
        // Then check for linked class student record
        var saved = null;
        try { saved = JSON.parse(localStorage.getItem('forge-student') || 'null'); } catch(e) {}
        if (saved && saved.studentId && !anvilState.studentId) {
          anvilState.studentId  = saved.studentId;
          anvilState.classId    = saved.classId || null;
        }

        function loadAnvilWithId() {
          var token = ForgeAuth.accessToken();
          var authUser = ForgeAuth.currentUser();
          if (token && authUser) {
            fetch(SUPABASE_URL + '/rest/v1/students?select=id&auth_user_id=eq.' + authUser.id, {
              headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + token }
            }).then(function(r) { return r.json(); }).then(function(studentRows) {
              if (!Array.isArray(studentRows) || studentRows.length === 0) {
                buildMisconceptions(); renderAnvilHome(); return;
              }
              var ids = studentRows.map(function(r) { return r.id; });
              var filter = ids.length === 1
                ? 'student_id=eq.' + ids[0]
                : 'student_id=in.(' + ids.join(',') + ')';
              supaGet('responses', filter + '&order=created_at.asc').then(function(responses) {
                anvilState.responses = responses || [];
                buildMisconceptions();
                renderAnvilHome();
              }).catch(function() { buildMisconceptions(); renderAnvilHome(); });
            }).catch(function() { buildMisconceptions(); renderAnvilHome(); });
          } else if (anvilState.studentId) {
            supaGet('responses','student_id=eq.'+anvilState.studentId+'&order=created_at.asc').then(function(responses){
              anvilState.responses = responses || [];
              buildMisconceptions();
              renderAnvilHome();
            }).catch(function(){ buildMisconceptions(); renderAnvilHome(); });
          } else {
            buildMisconceptions();
            renderAnvilHome();
          }
        }

        // If still no studentId, look up by auth_user_id
        if (!anvilState.studentId && ForgeAuth.currentUser()) {
          (function() {
            var _token = ForgeAuth.accessToken();
            var _uid = ForgeAuth.currentUser() ? ForgeAuth.currentUser().id : null;
            if (!_token || !_uid) return Promise.resolve([]);
            return fetch(SUPABASE_URL + '/rest/v1/students?select=*&auth_user_id=eq.' + _uid + '&order=created_at.asc&limit=1', {
              headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + _token }
            }).then(function(r) { return r.json(); });
          })().then(function(rows) {
            if (rows && rows.length > 0) {
              anvilState.studentId = rows[0].id;
              try { localStorage.setItem('forge-paid-student', JSON.stringify({ studentId: rows[0].id, name: sub.name })); } catch(e) {}
            }
            loadAnvilWithId();
          }).catch(function() { loadAnvilWithId(); });
        } else {
          loadAnvilWithId();
        }
      } else {
        checkLocalSession();
      }
    }).catch(function() { checkLocalSession(); });
  } else {
    checkLocalSession();
  }
}

function checkLocalSession(){
  // Check free session
  var freeSession = null;
  try { freeSession = JSON.parse(localStorage.getItem('forge-free-session') || 'null'); } catch(e) {}
  if (freeSession && freeSession.studentId) {
    anvilState.studentId   = freeSession.studentId;
    anvilState.studentName = freeSession.name;
    anvilState.classId     = null;
    supaGet('responses','student_id=eq.'+anvilState.studentId+'&order=created_at.asc').then(function(responses){
      anvilState.responses = responses || [];
      buildMisconceptions();
      renderAnvilHome();
    }).catch(function(){ buildMisconceptions(); renderAnvilHome(); });
    return;
  }
  // Check class session
  var saved = null;
  try { saved = JSON.parse(localStorage.getItem('forge-student') || 'null'); } catch(e) {}
  if (saved && saved.studentId) {
    anvilState.studentId   = saved.studentId;
    anvilState.classId     = saved.classId;
    anvilState.studentName = saved.studentName;
    anvilState.classSubject = saved.classSubject || null;
    if (!saved.classCode) { renderLogin(); return; } // older cached session predates classCode caching — needs one re-entry
    ForgeClasses.adopt(saved);
    // Pull in every class they've joined, so the Anvil shows all their
    // misconceptions rather than only the last class they signed in through.
    ForgeClasses.fetchAllResponses(SUPABASE_URL, SUPABASE_KEY, anvilState.studentName, function(responses){
      anvilState.responses = responses;
      buildMisconceptions();
      renderAnvilHome();
    });
  } else {
    renderLogin();
  }
}
startAnvil();
