name: Deploy static site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deployment
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate question bank
        run: node scripts/check-question-bank.js

      - name: Validate subject-page counts
        run: node scripts/check-subject-counts.js

      - name: Validate specification coverage
        run: node scripts/check-spec-coverage.js

      - name: Validate stem diversity
        run: node scripts/check-stem-diversity.js

      - name: Validate stem language
        run: node scripts/check-stem-language.js

      - name: Audit distractor balance and structure
        run: node dev/audit-banks.js

      # check-routes.js is an HTTP smoke test, not a static check — it needs the
      # site actually being served before it can request anything.
      - name: Serve site for route smoke test
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/dev/null 2>&1 &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          echo "Static server did not come up on 127.0.0.1:4173" >&2
          exit 1

      - name: Validate routes and local links
        run: node scripts/check-routes.js

      - name: Stop static server
        if: always()
        run: kill "$SERVER_PID" 2>/dev/null || true

      - name: Validate UI system
        run: node scripts/check-ui-system.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Publish only the static site. Uploading the repo root shipped 554
      # .claude/ tooling files — 76% of the artifact — to a public website and
      # made every deployment slower than it needed to be. Nothing excluded
      # here is referenced by any page; check-routes.js still runs against the
      # full checkout above.
      - name: Stage site
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.claude/' \
            --exclude='.impeccable/' \
            --exclude='_site/' \
            --exclude='dev/' \
            --exclude='docs/' \
            --exclude='supabase/' \
            --exclude='templates/' \
            --exclude='CLAUDE.md' \
            --exclude='scripts/check-*.js' \
            --exclude='scripts/build-*.js' \
            --exclude='scripts/migrate-*.js' \
            --exclude='scripts/extract-*.js' \
            --exclude='scripts/clean-*.js' \
            --exclude='scripts/merge-*.js' \
            ./ _site/
          test -f _site/index.html
          echo "Staged $(find _site -type f | wc -l) files (repo has $(git ls-files | wc -l))"

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site

      # The Pages backend has been taking longer than deploy-pages' 10 minute
      # default to finish a deployment that it accepts within seconds, so every
      # run since 2026-08-06 12:30 aborted mid-deploy rather than failing on
      # anything in this repo. Give it room instead of failing the site build.
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          timeout: 1800000
