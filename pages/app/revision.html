<script>
function forgeSignOut(){
  try{localStorage.removeItem('forge-student');localStorage.removeItem('forge-anvil-open');}catch(e){}
  if(window.ForgeAuth)ForgeAuth.signOut();
  location.href='forge-quiz.html';
}
ForgeSidebar.mount({
  active:'revision',
  items:[
    {key:'dashboard',href:'student-dashboard.html',label:'Dashboard'},
    {key:'forge',href:'forge-quiz.html',label:'Forge'},
    {key:'assignments',href:'assignments.html',label:'Assigned'},
    {key:'anvil',href:'anvil.html',label:'Repair mistakes'},
    {key:'crucible',href:'crucible.html',label:'Timed practice'}
  ],
  footerItems:[{key:'profile',href:'profile.html',label:'Profile'}],
  signOut:forgeSignOut
});

<script src="scripts/forge-revision.js?v=20261004-mixed"></script>
<script>
(function(){
  var app=document.getElementById('revision-app'),saved=null;
  ForgeState.loading(app,{label:'Preparing revision',body:'Choosing the right knowledge to bring back.'});
  try{
    saved=ForgeStudyMode.isIndependent()?null:JSON.parse(localStorage.getItem('forge-student')||'null');
    if(!saved||!saved.studentId){
      var free=JSON.parse(localStorage.getItem('forge-free-session')||'null');
      var paid=JSON.parse(localStorage.getItem('forge-paid-student')||'null');
      if(free&&free.studentId)saved={studentId:free.studentId,freeToken:free.freeToken||null,studentName:free.name||'',subject:'personal'};
      else if(paid&&paid.studentId)saved=Object.assign({},saved||{},{studentId:paid.studentId,studentName:paid.name||'',subject:'personal'});
    }
  }catch(e){}
  if(!saved&&location.hostname==='127.0.0.1'&&new URLSearchParams(location.search).get('preview')==='1'){
    saved={studentId:'revision-preview',classId:'revision-preview',studentName:'Alex',classSubject:'gcse-geo',subject:'gcse-geo'};
  }

  function noStudent(){
    app.innerHTML=ForgeState.html('empty',{label:'Sign in to start revision',body:'Open Forge with your student account or class details to keep your cards together across devices.',action:{label:'Open Forge',href:'forge-quiz.html'}});
  }
  function contextFromSaved(value){
    var registry=(window.ForgeClasses&&ForgeClasses.list().find(function(item){return item.classId===value.classId;}))||{};
    return Object.assign({},registry,value);
  }
  function mount(context){
    var catalog=window.SUBJECTS||{},requested=new URLSearchParams(location.search).get('subject');
    var remembered=ForgeStudentFocus.subject(context,[]);
    var subject=catalog[requested]?requested:catalog[context.classSubject]?context.classSubject:catalog[remembered]?remembered:catalog[context.subject]?context.subject:Object.keys(catalog)[0];
    if(requested&&catalog[requested])ForgeStudentFocus.remember(context.studentId,requested);
    ForgeData.loadSubject(subject).then(function(){
      return ForgeRevision.loadStudentData(context).catch(function(){return {context:context,assignments:[]};});
    }).then(function(data){
      return ForgeData.loadBanks((data.assignments||[]).reduce(function(all,item){return all.concat(ForgeRevision.banks(item).reduce(function(found,bank){return found.concat(ForgeChemistryTopics.sourceBanks(bank));},[]));},[])).then(function(){return data;});
    }).then(function(data){
      var local=ForgeRevision.readState(data.context);
      function changeSubject(next){ForgeStudentFocus.remember(data.context.studentId,next);var url=new URL(location.href);url.searchParams.set('subject',next);location.href=url.href;}
      return Promise.allSettled([
        ForgePersonalCards.load(data.context,local.personalCards,local.reviews),
        ForgeRevisionProgress.load(data.context,local,(data.assignments||[]).map(function(item){return String(item.id);}))
      ]).then(function(results){
        ForgeRevision.mountStudent({
          root:app,context:data.context,subject:subject,changeSubject:changeSubject,startMatch:new URLSearchParams(location.search).get('match'),
          assignments:data.assignments,reload:boot,
          remoteCards:results[0].status==='fulfilled'?results[0].value:null,
          remoteProgress:results[1].status==='fulfilled'?results[1].value:null,
          syncError:results.some(function(result){return result.status==='rejected';})
        });
      });
    }).catch(function(){
      app.innerHTML=ForgeState.html('error',{label:'Revision is unavailable',body:'We couldn’t load the curated cards. Check your connection and refresh.'});
    });
  }
  function boot(){
    if(saved&&saved.studentId){mount(contextFromSaved(saved));return;}
    if(!ForgeAuth.hasSession()){noStudent();return;}
    ForgeAuth.getSession().then(function(){
      var user=ForgeAuth.currentUser(),token=ForgeAuth.accessToken();
      if(!user||!token)throw new Error('No student session');
      return ForgeAPI.get('students','select=id,class_id&auth_user_id=eq.'+encodeURIComponent(user.id),{token:token});
    }).then(function(rows){
      if(!rows||!rows[0])throw new Error('No class');
      saved={studentId:rows[0].id,classId:rows[0].class_id,studentName:((ForgeAuth.currentUser()||{}).user_metadata||{}).name||''};
      try{localStorage.setItem('forge-student',JSON.stringify(saved));}catch(e){}
      mount(saved);
    }).catch(noStudent);
  }
  boot();
}());
</script>
