<script>
var SUPABASE_URL = ForgeAPI.config.url;
var SUPABASE_KEY = ForgeAPI.config.key;
var headers = {'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY};

function supaGet(table,params){ return ForgeAPI.get(table, params); }
// Write-only. anon may insert into responses but has no SELECT policy on it,
// so asking for the inserted row back fails the whole request (42501) and
// silently writes nothing.
function supaInsert(table,row){
  return ForgeAPI.insert(table,row,{headers:{'Prefer':'return=minimal'}}).then(function(){return null;}).catch(function(e){console.error('insert into '+table+' failed:',e);return null;});
}

<script>

// ===== END DATA =====

// Whether a misconception can actually be reworked. Answer with the same
// lookup startRework() uses so a card cannot invite a tap and then land on
// "Repair questions unavailable".
// Retired banks (LAW-1, HIST-1, …) leave tags in `responses` that no live
// question carries any more, so this is false more often than it looks.
var REPAIRABLE = {};
function canRepair(tag){
  if(!(tag in REPAIRABLE)) REPAIRABLE[tag] = repairQuestionsFor(tag).length > 0;
  return REPAIRABLE[tag];
}

// Misconception labels are written as the corrected idea ("about 32 times
// more energy, not one extra unit"), so showing one before or during a repair
// question hands the student the answer. Name an idea by its topic and by the
// student's own earlier wrong answer instead; the label is revealed only once
// they have answered.
var REPAIR_TOPIC = {};
function repairTopicFor(tag){
  if(!(tag in REPAIR_TOPIC)) repairQuestionsFor(tag);
  if(!(tag in REPAIR_TOPIC)) REPAIR_TOPIC[tag]='';
  return REPAIR_TOPIC[tag];
}

var CLEAR_THRESHOLD = 3; // consecutive correct to resolve
var app = document.getElementById('app');
// classCode/studentCode are the read *and* write credential for a coded class
// student. Every path that restores this state must carry them: without them
// reads fall through to the legacy RPC (disabled for coded classes, answers [])
// and writes are rejected by RLS.
var anvilState = { studentId:null, classId:null, studentName:null, classCode:null, studentCode:null, freeToken:null, classSubject:null, responses:[], misconceptions:{}, loadError:false, freeTokenMissing:false };
ForgeApp.loading(app, { label: 'Loading your mistakes', body: 'Finding the concepts that need another look.' });
function prepareAnvilHome(){
  ForgeData.loadForResponses(anvilState.responses).then(function(){
    REPAIRABLE={};
    REPAIR_TOPIC={};
    buildMisconceptions();
    renderAnvilHome();
  }).catch(function(){
    anvilState.loadError=true;
    buildMisconceptions();
    renderAnvilHome();
  });
}

function renderLogin(){
  var f='<div id="a-name-wrap" class="forge-first-name">'+ForgeAuthCard.field('a-name','Your name — first time only',{placeholder:'e.g. Alex',autocomplete:'name'})+'</div>'
       +ForgeAuthCard.field('a-student-code','Student code',{placeholder:'e.g. A1B2C3D4E5',upper:true})
       +ForgeAuthCard.field('a-code','Class code',{placeholder:'e.g. ECON-Y12',upper:true})
       +'<button class="auth-btn" id="a-btn" type="submit">Open Repair mistakes \u2192</button>'
       +'<p class="auth-err" id="a-err"></p>';
  app.innerHTML=ForgeAuthCard.shell({
    title:'Rework your weaknesses',
    sub:'Your mistakes land here so you can fix them \u2014 sign in to work through them.',
    foot:'No progress yet? <a href="forge-quiz.html">Start with a quiz</a>'
  },f);
  ForgeAuthCard.onSubmit(function(){document.getElementById('a-btn').onclick();});

  document.getElementById('a-btn').onclick=function(){
    var name=document.getElementById('a-name').value.trim();
    var studentCode=document.getElementById('a-student-code').value.trim();
    var code=document.getElementById('a-code').value.trim().toUpperCase();
    var err=document.getElementById('a-err');
    var btn=document.getElementById('a-btn');
    if(!studentCode||!code){err.textContent='Enter your student code and class code.';err.style.display='block';return;}
    btn.disabled=true;btn.textContent='Checking details…';

    // Look up via RPC \u2014 classes/students tables are no longer directly
    // readable by an anonymous (no login) name+code session.
    ForgeStudentCode.join(code, studentCode, name).then(function(match){
      name=match.student_name||name;
      anvilState.studentId=match.student_id;
      anvilState.classId=match.class_id;
      anvilState.studentName=name;
      anvilState.classSubject=match.subject||null;
      var cleanStudentCode=ForgeStudentCode.clean(studentCode);
      anvilState.classCode=code;anvilState.studentCode=cleanStudentCode;
      try { localStorage.setItem('forge-student', JSON.stringify({studentId: anvilState.studentId, classId: anvilState.classId, classCode: code, studentCode: cleanStudentCode, studentName: anvilState.studentName, classSubject: anvilState.classSubject})); } catch(e) {}
      ForgeClasses.add({
        classId: anvilState.classId, classCode: code, className: match.class_name || null,
        subject: anvilState.classSubject, studentId: anvilState.studentId, studentName: name, studentCode: cleanStudentCode
      });
      // The Anvil covers every class the student is in, not just this one —
      // misconceptions don't stop mattering because they signed in via a
      // different code.
      ForgeClasses.syncFromServer(SUPABASE_URL, SUPABASE_KEY,
        {studentId: anvilState.studentId, classCode: code, studentName: name, studentCode: cleanStudentCode}, function(){});
      ForgeClasses.fetchStudentResponses(SUPABASE_URL, SUPABASE_KEY,
        {studentId: anvilState.studentId, classCode: code, studentName: name, studentCode: cleanStudentCode}, function(responses){
        anvilState.responses = responses;
        prepareAnvilHome();
      });
    }).catch(function(e){if(e.needsName){document.getElementById('a-name-wrap').style.display='block';document.getElementById('a-name').focus();}err.textContent=e.message||'Student code or class code not recognised.';err.style.display='block';btn.disabled=false;btn.textContent='Open Repair mistakes \u2192';});
  };
}

function buildMisconceptions(){
  var summary=ForgeMisconceptions.summarize(anvilState.responses,{threshold:CLEAR_THRESHOLD});
  var mc=summary.data;
  anvilState.responses.forEach(function(r){
    var tag=ForgeMisconceptions.tagForRow(r);
    if(!tag||!mc[tag]) return;
    if(mc[tag].studentId===undefined){mc[tag].studentId=null;mc[tag].classId=null;mc[tag].subject=null;}

    // Remember which class this misconception came from so re-forging it
    // writes back against that class's student row, not whichever class
    // happened to be active.
    if(r._studentId){ mc[tag].studentId=r._studentId; mc[tag].classId=r._classId; }
    // Repair is an activity type, not a curriculum subject. Preserve the
    // subject that raised the misconception so Anvil evidence strengthens the
    // right subject instead of creating a synthetic "anvil" subject/grade.
    if(r.subject && r.subject!=='anvil' && r.subject!=='crucible') mc[tag].subject=r.subject;
  });
  anvilState.misconceptions=mc;
}

function getActiveMCs(){
  var active=[];
  for(var tag in anvilState.misconceptions){
    var m=anvilState.misconceptions[tag];
    if(m.fires>0 && m.streak<CLEAR_THRESHOLD){
      active.push(m);
    }
  }
  active.sort(function(a,b){return b.fires-a.fires;});
  return active;
}

function getResolvedMCs(){
  var resolved=[];
  for(var tag in anvilState.misconceptions){
    var m=anvilState.misconceptions[tag];
    if(m.fires>0 && m.streak>=CLEAR_THRESHOLD){
      resolved.push(m);
    }
  }
  return resolved;
}

function anvilEscape(value){return String(value==null?'':value).replace(/[&<>"']/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];});}
// The student's most recent scored wrong answer for this idea, with the
// question it came from, or null.
function earlierMistake(tag){
  var questions=repairQuestionsFor(tag),byId={};
  questions.forEach(function(q){byId[q.id]=q;});
  var earlier=(anvilState.responses||[]).filter(function(row){return row&&!row.is_correct&&!row.reforge_attempted&&ForgeMisconceptions.tagForRow(row)===tag&&byId[row.question_id]&&byId[row.question_id].options&&byId[row.question_id].options[row.selected_option];}).sort(function(a,b){return Date.parse(b.created_at||'')-Date.parse(a.created_at||'');})[0];
  if(!earlier)return null;
  var question=byId[earlier.question_id];
  return {question:question,answer:question.options[earlier.selected_option]};
}
// How a not-yet-cleared idea is named before the student answers: its topic,
// plus what they chose last time, so two ideas from one topic stay distinct.
function repairTitle(tag){
  var topic=repairTopicFor(tag);
  return topic?'An idea from '+anvilEscape(topic):'An idea from your practice';
}
function repairMistakeHtml(tag){
  var mistake=earlierMistake(tag);
  return mistake?'<span class="anvil-mistake">You answered: “'+anvilEscape(mistake.answer)+'”</span>':'';
}
function repairInsightHtml(tag){
  var mistake=earlierMistake(tag);
  if(!mistake)return '';
  var question=mistake.question,oldAnswer=mistake.answer,newAnswer=question.options[question.correct];
  if(!newAnswer)return '';
  return '<div class="anvil-insight"><div><span>Earlier answer</span><p>'+anvilEscape(oldAnswer)+'</p></div><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 14h19m-7-7 7 7-7 7"/></svg><div><span>Secure answer</span><p>'+anvilEscape(newAnswer)+'</p></div></div>';
}

function renderAnvilHome(){
  var active=getActiveMCs();
  var resolved=getResolvedMCs();
  var total=active.length+resolved.length;

  var h='<a class="back-btn" href="forge-quiz.html">← Back to practice</a>';
  h+='<div class="center forge-u-1y8kt2f">';
  h+='<h1 class="forge-u-1oh0w3h">Repair mistakes</h1>';
  h+='<p class="forge-u-10yda30">Practise an idea '+CLEAR_THRESHOLD+' times correctly in a row to clear it.</p>';
  h+='</div>';
  if(total) h+='<p class="anvil-summary">'+active.length+' to revisit · '+resolved.length+' cleared</p>';
  // Last week's repairs, ready for their "Did it stick?" check.
  if(window.ForgeFixed){var fixed=ForgeFixed.summarize(anvilState.responses||[]);h+=ForgeFixed.cardHtml(fixed,ForgeFixed.href(fixed,anvilState.classSubject));}

  var repairable=active.filter(function(m){return canRepair(m.tag);});
  if(repairable.length>0){
    var priority=repairable[0];
    h+='<section class="forge-recommendation" aria-labelledby="anvil-next-title"><h2 id="anvil-next-title" class="forge-recommendation__title">'+repairTitle(priority.tag)+'</h2><p class="forge-recommendation__copy">'+repairMistakeHtml(priority.tag)+'You’ve answered correctly '+priority.streak+' of '+CLEAR_THRESHOLD+' times in a row. Get '+CLEAR_THRESHOLD+' in a row to clear it.</p><button type="button" class="forge-button forge-button--primary" data-forge-action="anvil-rework" data-tag="'+priority.tag+'">Practise this idea →</button></section>';
  }

  if(active.length===0 && resolved.length===0){
    if(anvilState.freeTokenMissing){
      // Never claim the student has answered nothing when we simply cannot
      // prove this device owns the record. Starting a fresh free session
      // mints a new token and restores the Anvil from then on.
      h+=ForgeState.html('empty',{label:'We can’t load this device’s history',body:'This free session was started before Forge could save your progress key, so earlier answers can’t be shown here. Start a new practice session and your misconceptions will be tracked from now on.',action:{label:'Go to the quiz',href:'forge-quiz.html'}});
    } else {
      h+=ForgeState.html('empty',{label:'No misconceptions yet',body:'Complete a Forge quiz first. Any wrong answers will appear here for reworking.',action:{label:'Go to the quiz',href:'forge-quiz.html'}});
    }
    app.innerHTML=h + sessionBar();return;
  }

  if(active.length===0){
    h+='<div class="cleared-banner"><h2>\u2713 Nothing to repair</h2><p class="forge-u-1ybl9nb">Every mistake has been cleared. Keep practising \u2014 any new ones will appear here.</p></div>';
  }

  // The recommendation already covers the first repairable idea.
  var otherIdeas=active.filter(function(m){return !repairable.length || m.tag!==repairable[0].tag;});
  if(otherIdeas.length){
    h+='<h2 class="anvil-other-title">Other ideas to revisit</h2>';
    otherIdeas.forEach(function(m){
      var hasQs=canRepair(m.tag);
      h+='<'+(hasQs?'button type="button"':'div')+' class="anvil-card active-mc'+(hasQs?'':' no-repair')+'" '+(hasQs?'data-forge-action="anvil-rework" data-tag="'+m.tag+'"':'')+'>';
      h+='<span class="anvil-label">'+repairTitle(m.tag)+'</span>';
      h+=repairMistakeHtml(m.tag);
      h+='<span class="anvil-meta">'+m.streak+' of '+CLEAR_THRESHOLD+' correct in a row</span>';
      if(!hasQs) h+='<span class="anvil-norepair">No practice question is available for this idea yet.</span>';
      h+='</'+(hasQs?'button':'div')+'>';
    });
  }

  // Resolved
  if(resolved.length>0){
    h+='<details class="anvil-resolved"><summary>Cleared ideas ('+resolved.length+')</summary>';
    resolved.forEach(function(m){
      var label=resolveMCLabel(m.tag)||'';
      h+='<div class="anvil-card resolved-mc">';
      h+='<div class="anvil-top">Cleared</div>';
      if(label) h+='<div class="anvil-label forge-u-bed994">'+label+'</div>';
      var insight=repairInsightHtml(m.tag);
      if(insight)h+='<details class="anvil-insight-details"><summary>See what changed</summary>'+insight+'</details>';
      h+='</div>';
    });
    h+='</details>';
  }

  app.innerHTML=(anvilState.loadError?ForgeApp.stateHtml('error',{label:'Your mistakes couldn’t load',body:'We couldn’t retrieve your misconceptions. Refresh and try again.',action:{label:'Try again',href:location.href}}):'')+h;
  // Keep the primary repair action reliable even if delegated page actions
  // are unavailable during a partial page load.
  app.querySelectorAll('[data-forge-action="anvil-rework"]').forEach(function(button){
    button.addEventListener('click',function(event){
      event.preventDefault();
      event.stopPropagation();
      window.startRework(this.getAttribute('data-tag'));
    });
  });
}

function shuffleArr(arr){
  var a=arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var tmp=a[i];a[i]=a[j];a[j]=tmp;
  }
  return a;
}

function variantKey(v){ return v.q.id+(v.useReforge?'-RF':''); }

// Build one "lap" of variants (original + reforge for each repair question),
// shuffled.
// avoidKey, if given, keeps the first item of the new lap from being the
// exact same rendered question (id + variant) as the last one shown, so
// laps never visibly repeat the same question back-to-back.
function buildReworkLap(questions,avoidKey){
  var variants=[];
  questions.forEach(function(q){
    variants.push({q:q,useReforge:false});
    variants.push({q:q,useReforge:true});
  });
  var shuffled=shuffleArr(variants);
  if(avoidKey && shuffled.length>1){
    var tries=0;
    while(variantKey(shuffled[0])===avoidKey && tries<10){
      shuffled=shuffleArr(variants);
      tries++;
    }
    // Still colliding after retries (only possible with a single-question
    // pool, where a swap is guaranteed to fix it): swap the clashing first
    // item with a later one that doesn't match.
    if(variantKey(shuffled[0])===avoidKey){
      for(var i=1;i<shuffled.length;i++){
        if(variantKey(shuffled[i])!==avoidKey){
          var tmp=shuffled[0];shuffled[0]=shuffled[i];shuffled[i]=tmp;
          break;
        }
      }
    }
  }
  return shuffled;
}

function repairQuestionsFor(tag){
  var wanted=String(tag||'').toLowerCase();
  var found=[];
  // Retired banks too: a misconception recorded against HIST-1 or LAW-1 is
  // still the student's to fix, and those questions are the only ones that
  // carry its tag. Repair is the one place a superseded bank still earns its
  // keep — nothing else serves them.
  var sources=[BANKS];
  if(typeof RETIRED_BANKS!=='undefined') sources.push(RETIRED_BANKS);
  sources.forEach(function(source){
    for(var bankKey in source){
      var bank=source[bankKey];
      (bank.questions||[]).forEach(function(q){
        if(!q.reforge||!q.options)return;
        var tags=Array.isArray(q.tag)?q.tag:[q.tag];
        if(q.misconceptionGroup)tags=tags.concat(Array.isArray(q.misconceptionGroup)?q.misconceptionGroup:[q.misconceptionGroup]);
        if(tags.some(function(value){return String(value||'').toLowerCase()===wanted;})){
          found.push(q);
          if(!(tag in REPAIR_TOPIC)&&bank.label) REPAIR_TOPIC[tag]=bank.label;
        }
      });
    }
  });
  return found;
}

window.startRework=function(tag){
  var questions=repairQuestionsFor(tag);
  if(!questions||questions.length===0){
    app.innerHTML=ForgeApp.stateHtml('error',{label:'Repair questions unavailable',body:'This misconception has no repair question loaded yet. Go back and choose another idea.',action:{label:'Back to Repair mistakes',href:'anvil.html'}});
    return;
  }
  renderReworkQuestion(tag,questions,buildReworkLap(questions,null),0);
};

function renderReworkQuestion(tag,questions,lap,qIdx){
  // Once a lap (every question, as both original and reforge) is used up,
  // shuffle a fresh one rather than replaying the same fixed cycle.
  if(qIdx>=lap.length){
    lap=buildReworkLap(questions,variantKey(lap[lap.length-1]));
    qIdx=0;
  }
  var variant=lap[qIdx];
  var baseQ=variant.q;
  var useReforge=variant.useReforge && baseQ.reforge;
  var q = useReforge
    ? { id: baseQ.id+'-RF', stem: baseQ.reforge.stem, options: baseQ.reforge.options, correct: baseQ.reforge.correct, scaffold: baseQ.scaffold, tag: baseQ.tag }
    : baseQ;
  var label=resolveMCLabel(tag)||'';
  var m=anvilState.misconceptions[tag];

  // Same chrome as a Forge quiz question \u2014 header, progress, q-meta, stem,
  // then the shared option markup \u2014 so a repair reads as the quiz the
  // student already knows. The progress bar tracks the clearing streak
  // rather than a question count, which is what "done" means here.
  var h='<div class="quiz-header">';
  h+='<button type="button" class="back-btn" data-forge-action="anvil-home">\u2190 Repair mistakes</button>';
  h+='<span class="bank-name">'+(anvilEscape(repairTopicFor(tag))||'Repair this idea')+'</span>';
  h+='<span class="mono" id="rw-streak">'+m.streak+' / '+CLEAR_THRESHOLD+' \u2713</span>';
  h+='</div>';
  h+='<p class="rw-sub">Repair session \u00b7 '+CLEAR_THRESHOLD+' correct in a row clears this misconception</p>';
  h+='<div class="anvil-streak-track" id="rw-progress" role="progressbar" aria-label="Repair streak" aria-valuemin="0" aria-valuemax="'+CLEAR_THRESHOLD+'" aria-valuenow="'+m.streak+'">';
  for(var step=1;step<=CLEAR_THRESHOLD;step++)h+='<span class="anvil-streak-step'+(step<=m.streak?' is-filled':'')+'" aria-hidden="true">'+step+'</span>';
  h+='</div>';
  h+='<div class="stem">'+q.stem+'</div>';
  h+=window.ForgeQuestion.hintButtonHtml();
  h+=window.ForgeQuestion.renderOptions(q);

  app.innerHTML=h;

  var opts=document.querySelectorAll('#opts .opt');
  var answered=false;
  // A hinted attempt is practice only: it is not saved, so it neither counts
  // towards clearing the idea nor resets the streak. The streak is rebuilt
  // from saved responses, so this is the only way to keep it honest without
  // a column recording hint use.
  var hinted=false;
  var hintBtn=document.getElementById('hint-btn');
  hintBtn.onclick=function(){
    if(answered||!window.ForgeQuestion.ruleOutOption(q,document.getElementById('opts')))return;
    hinted=true;
    hintBtn.disabled=true;
    hintBtn.textContent='One option ruled out · this answer won’t count towards clearing';
  };

  opts.forEach(function(o){
    o.onclick=function(){
      if(answered||o.classList.contains('ruled-out'))return;
      answered=true;
      hintBtn.disabled=true;
      var k=o.dataset.k;
      var isCorrect=k===q.correct;

      if(!hinted){
        // Log to Supabase. This was a direct `responses` insert, which RLS
        // rejects for coded students — so a full repair session cleared a
        // misconception on screen and recorded nothing. The write is routed
        // through the shared writer and a failure is surfaced, not swallowed.
        // The mistake may come from another of the student's classes; a coded
        // class only accepts the write with that class's own codes.
        var mClass=m.classId&&window.ForgeClasses?ForgeClasses.forClass(m.classId):null;
        ForgeResponseWriter.save({
          studentId: m.studentId||anvilState.studentId,
          classId: m.classId||anvilState.classId,
          classCode: mClass?mClass.classCode:anvilState.classCode,
          studentCode: mClass?mClass.studentCode:anvilState.studentCode,
          freeToken: anvilState.freeToken
        },{
          student_id:m.studentId||anvilState.studentId,
          class_id:m.classId||anvilState.classId,
          question_id:q.id+'-ANVIL',
          bank:tag,
          subject:m.subject||anvilState.classSubject||null,
          selected_option:k,
          is_correct:isCorrect,
          misconception_tag:tag,
          reforge_attempted:true,
          reforge_correct:isCorrect
        }).then(function(outcome){
          if(outcome.ok) return;
          var host=document.getElementById('rw-feedback')||document.getElementById('app');
          if(!host||document.getElementById('anvil-save-error')) return;
          var warn=document.createElement('div');
          warn.id='anvil-save-error';
          warn.className='forge-status forge-status--error';
          warn.setAttribute('role','status');
          warn.textContent='We couldn’t save this repair. Your progress here won’t reach your teacher until you reconnect.';
          host.appendChild(warn);
        });

        // Update local state
        if(isCorrect){
          m.streak++;
          m.reforgeCorrect++;
          m.reforgeAttempts++;
          m.history.push(true);
        } else {
          m.streak=0;
          m.reforgeAttempts++;
          m.history.push(false);
        }
      }

      opts.forEach(function(x){
        x.classList.add('answered');
        x.setAttribute('aria-disabled','true');
        if(x.dataset.k===q.correct) x.classList.add('correct');
        else if(x===o&&!isCorrect) x.classList.add('wrong');
        else x.classList.add('dimmed');
      });

      // The streak counter and progress bar live in the question header, which
      // is not re-rendered when an answer is marked — keep them in step with
      // the feedback below.
      var streakEl=document.getElementById('rw-streak');
      if(streakEl) streakEl.textContent=m.streak+' / '+CLEAR_THRESHOLD+' ✓';
      var barEl=document.getElementById('rw-progress');
      if(barEl){
        barEl.setAttribute('aria-valuenow',String(m.streak));
        barEl.querySelectorAll('.anvil-streak-step').forEach(function(stepEl,index){
          stepEl.classList.toggle('is-filled',index<m.streak);
          stepEl.classList.toggle('is-new',isCorrect&&index===m.streak-1);
        });
      }

      var fb=document.getElementById('feedback');
      var fh='';
      // Now the student has committed to an answer, name the idea.
      var ideaHtml=label?'<p class="anvil-idea"><span>The idea</span>'+label+'</p>':'';

      if(hinted){
        fh='<div class="'+(isCorrect?'praise-box':'scaffold-box')+'"><strong class="forge-answer-status" role="status">'+(isCorrect?'Correct, with a hint.':'Not quite.')+'</strong> Hinted answers don’t change your streak — you’re still '+m.streak+' of '+CLEAR_THRESHOLD+'.'+ideaHtml+(isCorrect?'':'<p>'+window.ForgeQuestion.scaffoldText(q)+'</p>')+'</div>';
        fh+='<button type="button" class="next-btn btn-glass btn-ember" id="rw-next">Next question \u2192</button><div class="clear"></div>';
        fb.innerHTML=fh;
        document.getElementById('rw-next').onclick=function(){
          renderReworkQuestion(tag,questions,lap,qIdx+1);
        };
      } else if(isCorrect && m.streak>=CLEAR_THRESHOLD){
        fh='<div class="cleared-banner forge-u-f4v9hz"><h2>\u2713 Misconception cleared!</h2><p class="forge-u-1ybl9nb">'+(label?label+'<br>':'')+CLEAR_THRESHOLD+' correct in a row. This one is off your list.</p></div>';
        fh+=repairInsightHtml(tag);
        fh+='<button type="button" class="next-btn btn-glass btn-ember" id="rw-next">Back to Repair mistakes \u2192</button><div class="clear"></div>';
        fb.innerHTML=fh;
        document.getElementById('rw-next').onclick=function(){ renderAnvilHome(); };
      } else if(isCorrect){
        fh='<div class="praise-box"><strong class="forge-answer-status" role="status">Correct.</strong> You’re '+m.streak+' of '+CLEAR_THRESHOLD+' answers towards clearing this idea.'+ideaHtml+'</div>';
        fh+='<button type="button" class="next-btn btn-glass btn-ember" id="rw-next">Next question \u2192</button><div class="clear"></div>';
        fb.innerHTML=fh;
        document.getElementById('rw-next').onclick=function(){
          renderReworkQuestion(tag,questions,lap,qIdx+1);
        };
      } else {
        // scaffoldText() rather than q.scaffold: it rewrites the authoring
        // placeholder some banks still carry, exactly as the quiz does.
        fh='<div class="scaffold-box"><strong class="forge-answer-status" role="status">Not quite. Start a fresh streak.</strong>'+ideaHtml+'<p>'+window.ForgeQuestion.scaffoldText(q)+'</p></div>';
        fh+='<div class="forge-u-1pk26m3">0 of '+CLEAR_THRESHOLD+' correct in a row</div>';
        fh+='<button type="button" class="next-btn btn-glass btn-ember" id="rw-next">Try again \u2192</button><div class="clear"></div>';
        fb.innerHTML=fh;
        document.getElementById('rw-next').onclick=function(){
          renderReworkQuestion(tag,questions,lap,qIdx+1);
        };
        // A video that explains this idea, when one clearly matches.
        if(window.ForgeVideoMatch)ForgeVideoMatch.appendTo(fb,q,m.subject||anvilState.classSubject).catch(function(){});
      }
      // "Report a problem with this question" (scripts/forge-report.js).
      if(window.ForgeReport&&anvilState.studentId) ForgeReport.attach(fb,{studentId:anvilState.studentId,classCode:anvilState.classCode,studentCode:anvilState.studentCode,
        studentName:anvilState.studentName,freeToken:anvilState.classId?null:anvilState.freeToken,question:q,bank:null,selected:k});
    };
  });
}

// Native edge-swipe back: a repair question is an in-page Anvil state, so it
// needs to return to the Anvil list before browser history is consulted.
window.forgeHandleNativeBack = function(){
  if(document.querySelector('.quiz-header') && typeof renderAnvilHome === 'function'){
    renderAnvilHome();
    return true;
  }
  return false;
};

function forgeLogout(){
  try { localStorage.removeItem('forge-student'); } catch(e) {}
  try { localStorage.removeItem('forge-free-session'); } catch(e) {}
  ForgeAuth.signOut();
  location.reload();
}
function sessionBar(){
  if (!anvilState.studentId || !anvilState.studentName) return '';
  return '<div class="forge-u-44gkcw"><span class="forge-u-16oyzks">Signed in as <b class="forge-u-1ybl9nb">' + anvilState.studentName + '</b> \u00b7 <a class="forge-u-1u5pwzm" href="#" data-forge-action="logout">Not you? Switch student</a></span></div>';
}

// ===== SHARED SESSION RESTORE =====
function startAnvil(){
  if (ForgeAuth.hasSession()) {
    ForgeAuth.getSession().then(function(result) {
      if (result && result.subscriber) {
        var sub = result.subscriber;
        anvilState.studentName = sub.name;
        anvilState.studentId   = null;
        anvilState.classId     = null;
        anvilState.classSubject = null;
        // Check paid student cache first
        try {
          var paidCache = JSON.parse(localStorage.getItem('forge-paid-student') || 'null');
          if (paidCache && paidCache.studentId) anvilState.studentId = paidCache.studentId;
        } catch(e) {}
        // Then check for linked class student record
        var saved = null;
        try { saved = JSON.parse(localStorage.getItem('forge-student') || 'null'); } catch(e) {}
        if (saved && saved.studentId && !anvilState.studentId) {
          anvilState.studentId  = saved.studentId;
          anvilState.classId    = saved.classId || null;
        }

        function loadAnvilWithId() {
          var token = ForgeAuth.accessToken();
          var authUser = ForgeAuth.currentUser();
          if (token && authUser) {
            ForgeAPI.response(SUPABASE_URL + '/rest/v1/students?select=id&auth_user_id=eq.' + authUser.id, {
              headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + token }
            }).then(function(r) { return r.json(); }).then(function(studentRows) {
              if (!Array.isArray(studentRows) || studentRows.length === 0) {
                prepareAnvilHome(); return;
              }
              var ids = studentRows.map(function(r) { return r.id; });
              var filter = ids.length === 1
                ? 'student_id=eq.' + ids[0]
                : 'student_id=in.(' + ids.join(',') + ')';
              supaGet('responses', filter + '&order=created_at.asc').then(function(responses) {
                anvilState.responses = responses || [];
                prepareAnvilHome();
              }).catch(prepareAnvilHome);
            }).catch(prepareAnvilHome);
          } else if (anvilState.studentId) {
            supaGet('responses','student_id=eq.'+anvilState.studentId+'&order=created_at.asc').then(function(responses){
              anvilState.responses = responses || [];
              prepareAnvilHome();
            }).catch(function(){ anvilState.loadError=true; prepareAnvilHome(); });
          } else {
            prepareAnvilHome();
          }
        }

        // If still no studentId, look up by auth_user_id
        if (!anvilState.studentId && ForgeAuth.currentUser()) {
          (function() {
            var _token = ForgeAuth.accessToken();
            var _uid = ForgeAuth.currentUser() ? ForgeAuth.currentUser().id : null;
            if (!_token || !_uid) return Promise.resolve([]);
            return ForgeAPI.response(SUPABASE_URL + '/rest/v1/students?select=*&auth_user_id=eq.' + _uid + '&order=created_at.asc&limit=1', {
              headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + _token }
            }).then(function(r) { return r.json(); });
          })().then(function(rows) {
            if (rows && rows.length > 0) {
              anvilState.studentId = rows[0].id;
              try { localStorage.setItem('forge-paid-student', JSON.stringify({ studentId: rows[0].id, name: sub.name })); } catch(e) {}
            }
            loadAnvilWithId();
          }).catch(function() { loadAnvilWithId(); });
        } else {
          loadAnvilWithId();
        }
      } else if (result) {
        ForgeAuth.restoreStudentContexts().then(checkLocalSession).catch(checkLocalSession);
      } else {
        checkLocalSession();
      }
    }).catch(function() { checkLocalSession(); });
  } else {
    checkLocalSession();
  }
}

function checkLocalSession(){
  // Check free session
  var freeSession = null;
  try { freeSession = JSON.parse(localStorage.getItem('forge-free-session') || 'null'); } catch(e) {}
  if (freeSession && freeSession.studentId && ForgeStudyMode.isIndependent()) {
    anvilState.studentId   = freeSession.studentId;
    anvilState.studentName = freeSession.name;
    anvilState.classId     = null;
    anvilState.freeToken   = freeSession.freeToken || null;
    // Read through the RPC, not the table. anon has no SELECT policy on
    // responses, so a direct query returns 200 with [] — indistinguishable
    // from "answered nothing" — and the Anvil silently stays empty forever.
    // The device's free token is what authorises reading these rows back.
    ForgeClasses.fetchFreeResponses(SUPABASE_URL, SUPABASE_KEY, freeSession, function(responses){
      if (responses === null) {
        // Either the session predates token storage or the read failed — in
        // both cases we cannot show history and must not imply there is none.
        anvilState.responses = [];
        anvilState.freeTokenMissing = true;
      } else {
        anvilState.responses = responses;
      }
      prepareAnvilHome();
    });
    return;
  }
  // Check class session
  var saved = null;
  try { saved = JSON.parse(localStorage.getItem('forge-student') || 'null'); } catch(e) {}
  if (saved && saved.studentId) {
    anvilState.studentId   = saved.studentId;
    anvilState.classId     = saved.classId;
    anvilState.studentName = saved.studentName;
    anvilState.classCode   = saved.classCode || null;
    anvilState.studentCode = saved.studentCode || null;
    anvilState.classSubject = saved.classSubject || null;
    if (!saved.classCode) { renderLogin(); return; } // older cached session predates classCode caching — needs one re-entry
    ForgeClasses.adopt(saved);
    // Pull in every class they've joined — on this device or any other — so
    // the Anvil shows all their misconceptions, not just the class they
    // signed in through.
    // studentCode MUST be carried here. Omitting it sends the read down the
    // legacy get_student_own_responses path, which is disabled for coded
    // classes and returns [] — indistinguishable from "no misconceptions yet".
    var anchor = {studentId: anvilState.studentId, classCode: saved.classCode, studentCode: saved.studentCode, studentName: anvilState.studentName};
    ForgeClasses.syncFromServer(SUPABASE_URL, SUPABASE_KEY, anchor, function(){});
    ForgeClasses.fetchStudentResponses(SUPABASE_URL, SUPABASE_KEY, anchor, function(responses, error){
      // A failed read must not render as "no misconceptions yet".
      if (error) anvilState.loadError = true;
      anvilState.responses = responses;
      prepareAnvilHome();
    });
  } else {
    renderLogin();
  }
}
startAnvil();
