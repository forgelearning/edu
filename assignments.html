<!doctype html>
<html lang="en-GB">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forge — Assigned</title>
<link rel="stylesheet" href="css/tokens.css"><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/sidebar.css">
<style>body{color:var(--slate);font-family:Inter,sans-serif}.wrap{max-width:720px;margin:0 auto;padding:48px 24px}.eyebrow{font:11px 'JetBrains Mono',monospace;color:var(--ember);text-transform:uppercase;letter-spacing:.08em}.assignment,.empty{padding:18px;margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-md)}.assignment h2{font-size:18px;margin-bottom:6px}.meta{font-size:13px;color:#8A857E}.topics{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}.topic{padding:5px 10px;border-radius:var(--radius-sm);background:rgba(255,107,44,.1);color:var(--ember);font-size:12px;font-weight:600}a{color:var(--ember)}</style>
</head>
<body>
<script src="scripts/forge-logo.js"></script><script src="scripts/forge-sidebar.js"></script>
<script>ForgeSidebar.mount({active:'assignments',items:[{key:'dashboard',href:'student-dashboard.html',label:'Dashboard'},{key:'forge',href:'forge-quiz.html',label:'Forge'},{key:'assignments',href:'assignments.html',label:'Assigned'},{key:'anvil',href:'anvil.html',label:'Anvil'},{key:'crucible',href:'crucible.html',label:'Crucible'}],footerItems:[{key:'profile',href:'profile.html',label:'Profile'}]});</script>
<script src="scripts/forge-student-badges.js"></script>
<main class="wrap"><div class="eyebrow">Student work</div><h1>Assigned</h1><p style="margin-top:8px">Your teacher’s current assignments appear here. The full course remains available in <a href="forge-quiz.html">Forge</a>.</p><div id="assignments"><div class="empty">Loading assignments…</div></div></main>
<script>
var SUPABASE_URL='https://crysulmbaadjkymcjrew.supabase.co';var SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFub24iLCJpYXQiOjE3ODQyNDUzMzAsImV4cCI6MjA5OTgyMTMzMH0.Q69MKJRJ6_iEYkqJYXjn8RBhKhstAZShtmf0NiYM-8Vk';var el=document.getElementById('assignments');var saved=null;try{saved=JSON.parse(localStorage.getItem('forge-student')||'null')}catch(e){}
if(!saved||!saved.classId){el.innerHTML='<div class="empty">Join a class to see assignments.</div>';}else{fetch(SUPABASE_URL+'/rest/v1/assignments?select=*&class_id=eq.'+saved.classId+'&order=due_date.asc',{headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY}}).then(function(r){return r.json()}).then(function(rows){var today=new Date();today.setHours(0,0,0,0);var active=(Array.isArray(rows)?rows:[]).filter(function(a){return !a.archived&&(!a.due_date||new Date(a.due_date)>=today)});if(!active.length){el.innerHTML='<div class="empty">No active assignments. You can work ahead in the full course.</div>';return}el.innerHTML=active.map(function(a){var banks=[];try{banks=typeof a.banks==='string'?JSON.parse(a.banks):a.banks||[]}catch(e){}return '<article class="assignment"><h2>'+a.title+'</h2><div class="meta">'+(a.due_date?'Due '+new Date(a.due_date).toLocaleDateString('en-GB',{day:'numeric',month:'short'}):'No deadline')+'</div><div class="topics">'+banks.map(function(b){return '<a class="topic" href="forge-quiz.html">'+b+'</a>'}).join('')+'</div></article>'}).join('')}).catch(function(){el.innerHTML='<div class="empty">Assignments could not be loaded. Try again shortly.</div>'})}
</script>
</body></html>
