<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Forge — Teacher Settings</title>
  <meta name="description" content="Forge teacher settings.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&family=Rethink+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css?v=20260808-navpolish">
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/states.css">
  <link rel="stylesheet" href="css/page-overrides/settings.css">
</head>
<body>
  <script src="scripts/forge-api.js"></script>
  <script src="scripts/forge-state.js"></script>
  <script src="scripts/forge-logo.js"></script>
  <script src="scripts/forge-role.js"></script>
  <script src="scripts/forge-theme.js?v=20260808-theme2"></script>
  <script src="scripts/forge-sidebar.js?v=20260809-gearcenter"></script>
  <script>if (window.ForgeRole) ForgeRole.require('teacher', 'teacher.html');</script>
  <script src="scripts/forge-page-actions.js"></script>
  <script>
    var TEACHER_SESSION_KEY = 'forge-teacher-session';
    function loadTeacherSession() {
      try { return JSON.parse(localStorage.getItem(TEACHER_SESSION_KEY) || 'null'); } catch (e) { return null; }
    }
    function clearTeacherSession() {
      var saved = loadTeacherSession();
      if (saved && saved.access_token) ForgeAPI.auth.signOut(saved.access_token).catch(function () {});
      try { localStorage.removeItem(TEACHER_SESSION_KEY); } catch (e) {}
    }
    function teacherSettingsSignOut() {
      clearTeacherSession();
      location.href = 'teacher.html';
    }
    ForgeSidebar.mount({
      active: 'settings',
      settingsHref: 'teacher-settings.html',
      items: [
        {key:'dashboard', href:'teacher.html', label:'Overview'},
        {key:'students', href:'teacher.html', label:'Class'},
        {key:'assignments', href:'teacher.html', label:'Assignments'},
        {key:'misconceptions', href:'teacher.html', label:'Spec Points'}
      ],
      footerItems: [
        {key:'school', href:'school-overview.html', label:'School Overview'},
        {key:'present', href:'present.html', label:'Class Mode'}
      ],
      signOut: teacherSettingsSignOut
    });
  </script>

  <main class="wrap settings-page" id="main-content">
    <header class="settings-hero">
      <p class="settings-kicker">FORGE / TEACHER CONTROL PANEL</p>
      <h1>Settings</h1>
      <p>Shape Forge around the way you teach. Changes apply across the teacher app on this device.</p>
    </header>

    <section class="settings-section" aria-labelledby="appearance-title">
      <div class="settings-section-heading"><div><p class="settings-kicker">APPEARANCE</p><h2 id="appearance-title">Choose your atmosphere</h2></div><span class="settings-section-mark" aria-hidden="true">◐</span></div>
      <div class="settings-options" role="radiogroup" aria-label="Theme preference">
        <label class="settings-option"><input type="radio" name="theme" value="system"><span><strong>Use device setting</strong><small>Follow light and dark mode automatically.</small></span></label>
        <label class="settings-option"><input type="radio" name="theme" value="light"><span><strong>Light Forge</strong><small>Bright surfaces and ember accents.</small></span></label>
        <label class="settings-option"><input type="radio" name="theme" value="dark"><span><strong>Dark Forge</strong><small>Low-light contrast for focused sessions.</small></span></label>
      </div>
    </section>

    <section class="settings-section" aria-labelledby="account-title">
      <div class="settings-section-heading"><div><p class="settings-kicker">ACCOUNT</p><h2 id="account-title">Your teacher account</h2></div><span class="settings-section-mark" aria-hidden="true">T</span></div>
      <div class="settings-account" id="settings-account-copy">Checking your teacher session…</div>
      <button class="forge-button forge-button--danger" type="button" id="settings-sign-out">Sign out</button>
    </section>
  </main>

  <script>
    (function () {
      var theme = localStorage.getItem('forge-theme');
      var selected = theme === 'light' || theme === 'dark' ? theme : 'system';
      var radios = document.querySelectorAll('input[name="theme"]');
      Array.prototype.forEach.call(radios, function (radio) {
        radio.checked = radio.value === selected;
        radio.addEventListener('change', function () {
          if (this.value === 'system') localStorage.removeItem('forge-theme');
          else localStorage.setItem('forge-theme', this.value);
          var light = this.value === 'light' || (this.value === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
          if (window.setForgeTheme) window.setForgeTheme(light, false);
          setTimeout(function () { location.reload(); }, 80);
        });
      });

      var saved = loadTeacherSession();
      var account = document.getElementById('settings-account-copy');
      if (saved && saved.user) {
        account.innerHTML = '<strong>Teacher account</strong><span>' + String(saved.user.email || '').replace(/[&<>"']/g, '') + '</span>';
      } else if (saved && saved.access_token) {
        ForgeAPI.auth.user(saved.access_token).then(function (user) {
          account.innerHTML = '<strong>Teacher account</strong><span>' + String(user.email || '').replace(/[&<>"']/g, '') + '</span>';
        }).catch(function () {
          account.innerHTML = '<strong>Teacher session expired</strong><span>Sign in again to continue.</span>';
        });
      } else {
        account.innerHTML = '<strong>No teacher session</strong><span>Sign in to the teacher dashboard to continue.</span>';
      }
      document.getElementById('settings-sign-out').addEventListener('click', teacherSettingsSignOut);
    }());
  </script>
</body>
</html>
