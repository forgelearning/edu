var SUPABASE_URL = ForgeAPI.config.url;
var SUPABASE_KEY = ForgeAPI.config.key;
var hdrs = {'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY};
function supaGet(t,p){return ForgeAPI.get(t,p);}
// responses has no anon SELECT policy, so an anonymous session reads them
// through ForgeClasses (get_linked_responses / get_student_own_responses)
// rather than a direct table read, which silently returns zero rows.



// resolveBankLabel used to come from data/forge-data.js, which this page no
// longer loads (f20ccb0d moved it to the lighter forge-catalog.js). Without it
// renderProfile threw as soon as a student had a focus area or strength, and
// the profile showed zero answers. dev/test-profile-render.js guards this.
function resolveBankLabel(bankId){
  var bank = (window.BANKS || {})[bankId];
  return (bank && bank.label) || bankId;
}
function profileEscape(value){return String(value==null?'':value).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function learningTrail(responses,studentId){
  var entries=[],seen={};
  (responses||[]).forEach(function(r){
    var when=Date.parse(r.created_at||'');if(!Number.isFinite(when))return;
    var bank=r.bank||'',day=new Date(when).toDateString(),kind=r.reforge_attempted?'repair':'practice',key=kind+'|'+bank+'|'+day;
    if(seen[key])return;
    if(r.reforge_attempted){if(!r.reforge_correct)return;entries.push({when:when,label:'Repaired an idea'+(bank?' in '+resolveBankLabel(bank):''),href:'anvil.html'});}
    else if(r.is_correct&&!r.hint_used&&bank){entries.push({when:when,label:'Recalled '+resolveBankLabel(bank),href:'forge-quiz.html?bank='+encodeURIComponent(bank)});}
    else return;
    seen[key]=true;
  });
  try{
    var saved=JSON.parse(localStorage.getItem('forge-revision:'+String(studentId||'anonymous'))||'null');
    Object.keys(saved&&saved.reviews||{}).forEach(function(key){var review=saved.reviews[key],when=Date.parse(review.updatedAt||'');if(!Number.isFinite(when))return;var day=new Date(when).toDateString(),marker='review|'+day;if(seen[marker])return;seen[marker]=true;entries.push({when:when,label:'Reviewed cards from memory',href:'revision.html'});});
  }catch(e){}
  return entries.sort(function(a,b){return b.when-a.when;}).slice(0,5);
}

// Ranks, thresholds and avatar frames live in scripts/forge-ranks.js so the
// dashboard, friends list and settings show the same rank as this page.
var RANKS = ForgeRanks.RANKS;
function getRank(xp){ return ForgeRanks.rankFor(xp); }
// The student's own avatar shows their chosen emblem (scripts/forge-emblems.js).
function ownAvatar(xp,opts){
  return window.ForgeEmblems?ForgeEmblems.ownAvatarHtml(st.studentId,st.studentName,xp,opts):ForgeRanks.avatarHtml(st.studentName,xp,opts);
}
if(window.ForgeEmblems)ForgeEmblems.bind(function(){return {studentId:st.studentId,name:st.studentName};});

// A new rank or badge tier since this student last saw it opens a popup
// (scripts/forge-celebrate.js). Only on complete data: answers loaded without
// error and match XP synced. Ranks and badges are for every student, free
// tier included.
function celebrateProfile(xp,badges){
  if(!window.ForgeCelebrate||!st.studentId||st.loadError||rewardsReadyFor!==st.studentId)return;
  ForgeCelebrate.check({studentId:st.studentId,name:st.studentName,xp:xp,badges:badges});
}

// Classes are named "<year><letter>/<subject code>" (e.g. "12B/Bs" for a
// Year 12 A-Level class, "10A/Gg" for a Year 10 GCSE class). There's no
// separate level column, so level is derived from the year-group prefix:
// Year 12-13 = A-Level, Year 7-11 = GCSE. See school-overview.html's classLevel.
function classLevel(className) {
  var m = /^(\d+)/.exec(className || '');
  if (!m) return 'alevel';
  var year = parseInt(m[1], 10);
  return year >= 12 ? 'alevel' : 'gcse';
}

function calcGrade(acc, activeMCs, totalMCs, isGCSE) {
  // acc: overall accuracy 0-100
  // activeMCs: number of unresolved misconceptions
  // totalMCs: total unique misconceptions ever fired
  var mcClearance = totalMCs > 0 ? Math.max(0, 1 - (activeMCs / totalMCs)) : 1;
  var score = (acc * 0.6) + (mcClearance * 100 * 0.4);
  if (isGCSE) {
    if (score >= 85) return {grade:'9', next:null, color:'#ffd700', desc:'Exam-ready. Maintain accuracy and keep Repair mistakes clear.'};
    if (score >= 76) return {grade:'8', next:'9',  color:'var(--good)', desc:'Strong. Clear your remaining misconceptions to break into a 9.'};
    if (score >= 68) return {grade:'7', next:'8',  color:'var(--good)', desc:'Consistent top-end work. Keep Repair mistakes clear to push higher.'};
    if (score >= 60) return {grade:'6', next:'7',  color:'var(--hot)', desc:'Solid. Accuracy and repair work will push this into the 7s.'};
    if (score >= 52) return {grade:'5', next:'6',  color:'var(--hot)', desc:'Strong pass. Focus on Repair mistakes — misconceptions are costing marks.'};
    if (score >= 44) return {grade:'4', next:'5',  color:'var(--ember)', desc:'Standard pass. Daily sessions and repair work will move this up.'};
    if (score >= 36) return {grade:'3', next:'4',  color:'#b45309', desc:'Keep going. Daily sessions and repair work will move this.'};
    if (score >= 28) return {grade:'2', next:'3',  color:'var(--slate)', desc:'Early stage. More questions and misconception rework needed.'};
    if (score >= 18) return {grade:'1', next:'2',  color:'var(--slate)', desc:'Early stage. More questions and misconception rework needed.'};
    return             {grade:'U', next:'1',  color:'var(--bad)', desc:'Not enough data yet — complete more sessions to get a reliable band.'};
  }
  if (score >= 85) return {grade:'A*', next:null,    color:'#ffd700', desc:'Exam-ready. Maintain accuracy and keep Repair mistakes clear.'};
  if (score >= 72) return {grade:'A',  next:'A*',   color:'var(--good)', desc:'Strong. Clear your remaining misconceptions to break into A*.'};
  if (score >= 60) return {grade:'B',  next:'A',    color:'var(--hot)', desc:'Consistent. Accuracy and repair work will push this to an A.'};
  if (score >= 50) return {grade:'C',  next:'B',    color:'var(--ember)', desc:'Building. Focus on Repair mistakes — misconceptions are costing marks.'};
  if (score >= 40) return {grade:'D',  next:'C',    color:'#b45309', desc:'Keep going. Daily sessions and repair work will move this.'};
  if (score >= 30) return {grade:'E',  next:'D',    color:'var(--slate)', desc:'Early stage. More questions and misconception rework needed.'};
  return             {grade:'U',  next:'E',    color:'var(--bad)', desc:'Not enough data yet — complete more sessions to get a reliable band.'};
}

function calcXP(responses){
  var xp=0;
  responses.forEach(function(r){
    // Anvil rows are stored as reforge attempts, so they must be matched first
    // or a correct one would also earn the +20 reforge bonus (50 in total).
    if(r.question_id&&r.question_id.endsWith('-ANVIL')){ if(r.is_correct) xp+=30; }
    else if(r.question_id&&r.question_id.endsWith('-CRU')&&r.is_correct) xp+=30;
    else if(r.reforge_attempted&&r.reforge_correct) xp+=20;
    else if(r.is_correct&&!r.reforge_attempted) xp+=r.hint_used?5:10;
  });
  return xp;
}

var st={studentId:null,classId:null,studentName:null,responses:[],isPaid:false,isTrial:false,trialDaysLeft:0,paidSubjects:[],activeTab:'overview',isGCSE:false,loadError:false};
var rewardsLoadedFor=null;
// Set once match XP has synced (or failed to), so a celebration never runs on
// a partial total: see celebrateProfile().
var rewardsReadyFor=null;
var app=document.getElementById('app');
ForgeState.loading(app, { label: 'Loading your profile', body: 'Getting your progress, strengths, and focus areas ready.' });

function renderLogin(){
  var f='<div id="p-name-wrap" class="forge-first-name">'+ForgeAuthCard.field('p-name','Your name — first time only',{placeholder:'e.g. Alex',autocomplete:'name'})+'</div>'
       +ForgeAuthCard.field('p-student-code','Student code',{placeholder:'e.g. A1B2C3D4E5',upper:true})
       +ForgeAuthCard.field('p-code','Class code',{placeholder:'e.g. ECON-Y12-A',upper:true})
       +'<button class="auth-btn" id="p-btn" type="submit">Sign in \u2192</button>'
       +'<p class="auth-err" id="p-err"></p>';
  app.innerHTML=ForgeAuthCard.shell({
    title:'Sign in to Forge',
    sub:'Enter your name and class code to open your progress',
    foot:'No progress yet? <a href="forge-quiz.html">Start with a quiz</a>'
  },f);
  ForgeAuthCard.onSubmit(function(){document.getElementById('p-btn').onclick();});

  document.getElementById('p-btn').onclick=function(){
    var name=document.getElementById('p-name').value.trim();
    var studentCode=document.getElementById('p-student-code').value.trim();
    var code=document.getElementById('p-code').value.trim().toUpperCase();
    var err=document.getElementById('p-err');
    var btn=document.getElementById('p-btn');
    if(!studentCode||!code){err.textContent='Enter your student code and class code.';err.style.display='block';return;}
    btn.disabled=true;btn.textContent='Checking details…';
    // Look up via RPC \u2014 classes/students tables are no longer directly
    // readable by an anonymous (no login) name+code session.
    ForgeStudentCode.join(code, studentCode, name).then(function(match){
      name=match.student_name||name;
      st.studentId=match.student_id;st.classId=match.class_id;st.studentName=name;st.isGCSE=classLevel(match.class_name)==='gcse';
      var cleanStudentCode=ForgeStudentCode.clean(studentCode);
      try { localStorage.setItem('forge-student', JSON.stringify({studentId: st.studentId, classId: st.classId, classCode: code, studentCode: cleanStudentCode, studentName: st.studentName, classSubject: match.subject || null, isGCSE: st.isGCSE})); } catch(e) {}
      ForgeClasses.add({
        classId: st.classId, classCode: code, className: match.class_name || null,
        subject: match.subject || null, studentId: st.studentId, studentName: name, studentCode: cleanStudentCode
      });
      // Signing in here is still signing in — send them to the dashboard.
      // It restores from the same cached session, so no re-entry is needed.
      ForgeClasses.syncFromServer(SUPABASE_URL, SUPABASE_KEY,
        {studentId: st.studentId, classCode: code, studentName: name, studentCode: cleanStudentCode},
        function(){ ForgeAuth.goToLanding(); });
    }).catch(function(e){if(e.needsName){document.getElementById('p-name-wrap').style.display='block';document.getElementById('p-name').focus();}err.textContent=e.message||'Student code or class code not recognised.';err.style.display='block';btn.disabled=false;btn.textContent='Sign in \u2192';});
  };
}

/* Compatibility wrapper: the lifecycle itself is shared with every surface. */
function mcSummary(rows){
  return ForgeMisconceptions.summarize(rows);
}

/* Everything calcGrade needs for one slice of responses. */
function gradeFor(rows, isGCSE){
  var marked=rows.filter(function(r){return !r.reforge_attempted;});
  var right=marked.filter(function(r){return r.is_correct&&!r.hint_used;}).length;
  var acc=marked.length>0?Math.round((right/marked.length)*100):0;
  var mc=mcSummary(rows);
  return {
    grade: calcGrade(acc, mc.active.length, mc.total, isGCSE),
    isGCSE: isGCSE,
    total: marked.length
  };
}

// Display names for the subject keys stored on classes and responses.
function subjectName(key){
  if(!key)return null;
  if(SUBJ_LABELS[key])return SUBJ_LABELS[key];
  var info=typeof SUBJECTS!=='undefined'&&SUBJECTS[key];
  return info&&info.label||key;
}
var SUBJ_LABELS = {econ:'Economics',psych:'Psychology',soc:'Sociology',geo:'Geography',bus:'Business',chem:'Chemistry',bio:'Biology',phys:'Physics',hist:'History',law:'Law',crim:'Criminology',pol:'Politics',maths:'Maths',german:'German',french:'French',cs:'Computer Science',rs:'Religious Studies',hsc:'Health & Social Care'};

/* The classes the student is in, keyed by class id. Responses are tagged
   with the class they came from, so a student taking four subjects gets a
   predicted grade per subject rather than one band computed off whichever
   class they last signed in through — and each is graded on its own scale,
   since GCSE 9-1 and A-Level A*-E aren't interchangeable. */
function classInfo(){
  var map={};
  if(!window.ForgeClasses)return map;
  ForgeClasses.list().forEach(function(c){
    if(!c.classId)return;
    map[c.classId]={
      label: subjectName(c.subject) || c.className || null,
      isGCSE: classLevel(c.className)==='gcse'
    };
  });
  return map;
}

function renderProfile(){
  if(window.ForgeRewards&&st.studentId&&rewardsLoadedFor!==st.studentId){
    rewardsLoadedFor=st.studentId;
    var loadingFor=st.studentId;
    var ready=function(){rewardsReadyFor=loadingFor;if(st.studentId===loadingFor)renderProfile();};
    ForgeRewards.load({studentId:st.studentId,studentName:st.studentName}).then(ready,ready);
  }
  var responses=st.responses;
  var total=responses.filter(function(r){return !r.reforge_attempted;}).length;
  var correct=responses.filter(function(r){return !r.reforge_attempted&&r.is_correct&&!r.hint_used;}).length;
  var acc=total>0?Math.round((correct/total)*100):0;
  var accCol=acc>=75?'var(--good)':acc>=50?'var(--hot)':'var(--bad)';
  var quizXp=calcXP(responses);
  if(window.ForgeRewards)ForgeRewards.rememberQuizXp(st.studentId,quizXp);
  var xp=quizXp+(window.ForgeRewards?ForgeRewards.matchXpFor(st.studentId):0);
  var rank=getRank(xp);
  var nextRank=RANKS[RANKS.indexOf(rank)+1];
  var streak=calcStreak(responses);
  var resolved=mcSummary(responses).resolved.length;

  var mcAll=mcSummary(responses);
  var mcData=mcAll.data, activeMCs=mcAll.active, totalMCs=mcAll.total;

  /* One predicted grade per class. Responses we can't place — a class this
     device doesn't know about, or an older row with no class recorded — are
     pooled into a single unlabelled card at the level of the class they
     signed in through, which is the pre-existing behaviour. */
  var classes=classInfo();
  var byClass={}, order=[];
  responses.forEach(function(r){
    var cid = r._classId || r.class_id;
    // Older activity rows stored subject:"anvil"/"crucible". Keep them as
    // repair evidence when their class identifies the real subject, but do not
    // let an unscoped legacy row create a synthetic predicted-grade card.
    if((r.subject==='anvil'||r.subject==='crucible')&&!(cid&&classes[cid])) return;
    // Older response rows may not carry class_id. Subject is still a stable
    // boundary, so keep those results visible instead of collapsing them.
    var key = (cid && classes[cid]) ? cid : (r.subject ? 'subject:'+r.subject : '_other');
    if(!byClass[key]){ byClass[key]=[]; order.push(key); }
    byClass[key].push(r);
  });
  var grades=order.map(function(key){
    var subjectKey = key.indexOf('subject:')===0 ? key.slice(8) : null;
    var info = classes[key] || {label:subjectName(subjectKey), isGCSE:st.isGCSE};
    var g = gradeFor(byClass[key], info.isGCSE);
    g.label = info.label;
    return g;
  }).sort(function(a,b){return b.total-a.total;});
  if(!grades.length)grades=[gradeFor(responses, st.isGCSE)];
  var grade=grades[0].grade;

  // Bank accuracy
  var bankStats={};
  responses.filter(function(r){return !r.reforge_attempted&&r.bank&&!r.bank.endsWith('-MIX');}).forEach(function(r){
    if(!bankStats[r.bank])bankStats[r.bank]={t:0,c:0};
    bankStats[r.bank].t++;
    if(r.is_correct&&!r.hint_used)bankStats[r.bank].c++;
  });
  var strengths=Object.keys(bankStats).filter(function(b){return bankStats[b].t>=3;}).map(function(b){
    return{bank:b,acc:Math.round((bankStats[b].c/bankStats[b].t)*100)};
  }).sort(function(a,b){return b.acc-a.acc;});
  var goodBanks=strengths.filter(function(s){return s.acc>=75;});
  var weakBanks=strengths.filter(function(s){return s.acc<60;}).reverse();

  // Determine subject label from responses
  var subjectLabel='A Level';
  var subjectKey=responses.length>0?(responses[0].subject||''):'';
  // SUBJECTS labels already carry their level ("A Level Business",
  // "GCSE Geography"), so prefixing produced "A Level A Level Business" — and
  // "A Level GCSE Geography" for the GCSE keys.
  if(subjectKey){var skeys=Object.keys(typeof SUBJECTS!=='undefined'?SUBJECTS:{});skeys.forEach(function(k){if(k===subjectKey&&typeof SUBJECTS!=='undefined')subjectLabel=SUBJECTS[k].label;});}

  var activeTab=st.activeTab||'overview';

  function tabBtn(id,label){
    var cls='prof-tab'+(activeTab===id?' active':'');
    return '<button type="button" class="'+cls+'" data-tab="'+id+'">'+label+'</button>';
  }

  var h='';

  // Trial countdown banner
  if (st.isTrial) {
    var days = st.trialDaysLeft;
    var isUrgent = days <= 2;
    var borderCol = isUrgent ? 'rgba(255,90,90,.4)' : 'rgba(255,201,60,.35)';
    var tagCol    = isUrgent ? 'var(--bad)' : 'var(--hot)';
    var barPct    = Math.round(((7 - days) / 7) * 100);
    var barCol    = isUrgent ? 'var(--bad)' : days <= 4 ? 'var(--hot)' : 'var(--good)';
    var msg       = days === 0 ? 'Your trial expires today'
                  : days === 1 ? '1 day left on your trial'
                  : days + ' days left on your trial';

    h += '<div style="background:var(--panel);border:1px solid '+borderCol+';border-radius:var(--radius-md);padding:14px 18px;margin-bottom:18px">';
    h += '<div class="forge-u-4f9uhm">';
    h += '<div>';
    h += '<span style="font-family:\'JetBrains Mono\',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:'+tagCol+'">Free trial</span>';
    h += '<p class="forge-u-s0p829">'+msg+'</p>';
    h += '</div>';
    h += '<a class="forge-u-qwg8u0" href="forge-signup.html">Subscribe →</a>';
    h += '</div>';
    // Progress bar (fills as trial runs out)
    h += '<div class="forge-u-1rh0em3">';
    h += '<div style="height:100%;width:100%;background:'+barCol+';border-radius:var(--radius-xs);transform:scaleX('+(barPct / 100)+');transform-origin:left center;transition:transform .4s"></div>';
    h += '</div>';

function forgeSignOut(){

// ===== SHARED SESSION RESTORE =====
(function(){
  if (ForgeAuth.hasSession()) {
    ForgeAuth.getSession().then(function(result) {
      if (result && result.subscriber) {
        var sub    = result.subscriber;
        var access = result.access;
        st.studentName = sub.name;
        st.isPaid      = access === 'pro';
        st.isTrial     = access === 'trial';
        st.trialDaysLeft = result.daysLeft || 0;
        st.paidSubjects  = sub.subjects || [];
        // Check paid student cache first
        try {
          var paidCache = JSON.parse(localStorage.getItem('forge-paid-student') || 'null');
          if (paidCache && paidCache.studentId) st.studentId = paidCache.studentId;
        } catch(e) {}
        // Check for linked student record
        var saved = null;
        try { saved = JSON.parse(localStorage.getItem('forge-student') || 'null'); } catch(e) {}
        if (saved && saved.studentId && !st.studentId) {
          st.studentId = saved.studentId;
          st.classId   = saved.classId || null;
        }

        function loadProfileWithId() {
          var token = ForgeAuth.accessToken();
          var authUser = ForgeAuth.currentUser();
          if (token && authUser) {
            /* An account holds one student row per class it has joined, and
               its responses are spread across them. Read them all, with the
               access token — a token-less read of `responses` returns [] under
               RLS rather than an error, which is how a student with a full
               history was shown zeros. */
            ForgeClasses.fetchAuthResponses(token, authUser.id, function(rows, error, ids) {
              st.responses = rows || [];
              if (error) st.loadError = true;
              /* Cache an id that actually carries history, so the pages that
                 still scope themselves to one row pick the useful one. */
              if (!error && ids && ids.length) {
                var withHistory = {};
                (rows || []).forEach(function(r){ withHistory[r.student_id] = true; });
                var best = ids.filter(function(id){ return withHistory[id]; })[0] || st.studentId || ids[0];
                st.studentId = best;
                try { localStorage.setItem('forge-paid-student', JSON.stringify({ studentId: best, name: st.studentName })); } catch(e) {}
              }
              renderProfile();
            });
          } else if (st.studentId) {
            supaGet('responses','student_id=eq.'+st.studentId+'&order=created_at.desc').then(function(r){
              st.responses = r || [];
              renderProfile();
            }).catch(function(){ st.loadError=true; renderProfile(); });
          } else {
            renderProfile();
          }
        }

        loadProfileWithId();
      } else if (result) {
        ForgeAuth.restoreStudentContexts().then(checkLocalSessionProfile).catch(checkLocalSessionProfile);
      } else {
        checkLocalSessionProfile();
      }
    }).catch(function() { checkLocalSessionProfile(); });
  } else {
    checkLocalSessionProfile();
  }

  function checkLocalSessionProfile() {
    // Check free session
    var freeSession = null;
    try { freeSession = JSON.parse(localStorage.getItem('forge-free-session') || 'null'); } catch(e) {}
    if (freeSession && freeSession.studentId && ForgeStudyMode.isIndependent()) {
      st.studentId   = freeSession.studentId;
      st.studentName = freeSession.name;
      st.classId     = null;
      // anon cannot SELECT responses directly — the read succeeds and returns
      // nothing. Go through the token-gated RPC instead.
      ForgeClasses.fetchFreeResponses(SUPABASE_URL, SUPABASE_KEY, freeSession, function(r){
        if (r === null) { st.responses = []; st.loadError = true; }
        else { st.responses = r.slice().reverse(); }
        renderProfile();
      });
      return;
    }
    // Check class session
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem('forge-student') || 'null'); } catch(e) {}
    if (saved && saved.studentId) {
      st.studentId   = saved.studentId;
      st.classId     = saved.classId;
      st.studentName = saved.studentName;
      var applyLevelAndLoad = function(){
        if (!saved.classCode) { renderLogin(); return; } // older cached session predates classCode caching — needs one re-entry
        ForgeClasses.adopt(saved);
        // The profile covers every class the student is in, not just the one
        // they last signed in through — pull in the classes they've joined on
        // any device, then their responses across all of them.
        // The sync runs first because the predicted grade needs each class's
        // name to tell GCSE classes from A-Level ones.
        // studentCode is required: without it the read falls through to the
        // legacy RPC, which is disabled for coded classes and returns [], so
        // the profile reports 0% for a student with a full response history.
        var anchor = {studentId: st.studentId, classCode: saved.classCode, studentCode: saved.studentCode, studentName: st.studentName};
        ForgeClasses.syncFromServer(SUPABASE_URL, SUPABASE_KEY, anchor, function(){
          ForgeClasses.fetchStudentResponses(SUPABASE_URL, SUPABASE_KEY, anchor, function(r, error){
            st.responses = Array.isArray(r) ? r : [];
            if (error) st.loadError = true;
            renderProfile();
          });
        });
      };
      if (typeof saved.isGCSE === 'boolean') {
        st.isGCSE = saved.isGCSE;
        applyLevelAndLoad();
      } else if (st.classId) {
        // Older saved sessions predate level tracking — resolve and cache it.
        supaGet('classes','id=eq.'+st.classId).then(function(cls){
          st.isGCSE = Array.isArray(cls) && cls.length>0 && classLevel(cls[0].name)==='gcse';
          try { saved.isGCSE = st.isGCSE; localStorage.setItem('forge-student', JSON.stringify(saved)); } catch(e) {}
          applyLevelAndLoad();
        }).catch(function(){ applyLevelAndLoad(); });
      } else {
        applyLevelAndLoad();
      }
    } else {
      renderLogin();
    }
  }
})();
</script>
