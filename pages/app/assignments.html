<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forge — Assigned</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&family=Rethink+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/tokens.css"><link rel="stylesheet" href="css/base.css?v=20260808-navpolish"><link rel="stylesheet" href="css/sidebar.css"><link rel="stylesheet" href="css/states.css">

<script>function forgeSignOut(){try{localStorage.removeItem('forge-student');localStorage.removeItem('forge-anvil-open')}catch(e){}if(window.ForgeAuth)ForgeAuth.signOut();location.href='forge-quiz.html'}ForgeSidebar.mount({active:'assignments',items:[{key:'dashboard',href:'student-dashboard.html',label:'Dashboard'},{key:'forge',href:'forge-quiz.html',label:'Forge'},{key:'assignments',href:'assignments.html',label:'Assigned'},{key:'anvil',href:'anvil.html',label:'Anvil'},{key:'crucible',href:'crucible.html',label:'Crucible'}],footerItems:[{key:'profile',href:'profile.html',label:'Profile'}],signOut:forgeSignOut});</script>
<script defer src="scripts/forge-student-badges.js?v=20260810"></script>
<main class="wrap"><div class="forge-u-vxmhzc">Student work</div><h1>Assigned</h1><p>Your teacher’s current assignments appear here. The full course remains available in <a href="forge-quiz.html">Forge</a>.</p><section id="mission-control" class="mission-control" aria-labelledby="mission-control-title" aria-live="polite"></section><div id="list" class="card"></div></main>
<script>
var API=ForgeAPI.config.url,KEY=ForgeAPI.config.key,el=document.getElementById('list'),saved=null;
ForgeState.loading(el,{label:'Loading assignments',body:'Getting your teacher’s latest work ready.'});
try{saved=JSON.parse(localStorage.getItem('forge-student')||'null')}catch(e){}
function headers(){return ForgeAPI.headers(null,{'Content-Type':'application/json'})}
function jsonFetch(url,options){return ForgeAPI.request(url,options)}
function banks(v){try{return typeof v==='string'?JSON.parse(v):v||[]}catch(e){return[]}}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function normalise(v){return String(v==null?'':v).trim().toLowerCase()}
function responseRows(payload){if(Array.isArray(payload))return payload;if(payload&&Array.isArray(payload.responses))return payload.responses;if(payload&&Array.isArray(payload.data))return payload.data;return[]}
function localSessionResponses(context,assignmentRows){
  var out=[];
  (assignmentRows||[]).forEach(function(a){
    out=out.concat(ForgeAssignmentProgress.localSessionRows(a,context));
  });
  return out;
}
function responseMarker(response){
  var id=String(response&& (response.question_id||response.questionId||response.id)||'').replace(/-RF$/,'');
  return String(response&&response.bank||'')+'|'+id;
}
function bankForQuestion(id){var wanted=String(id||'').replace(/-RF$/,'');for(var b in BANKS){if((BANKS[b].questions||[]).some(function(q){return String(q.id)===wanted}))return b}return null}
function progress(a,responses){return ForgeAssignmentProgress.progress(a,responses)}
function scorePercent(p){return p&&p.answered?Math.round((p.correct/p.answered)*100):null}
function status(a,responses){var p=progress(a,responses);if(p.complete)return['Completed','complete',p];var due=a.due_date&&new Date(a.due_date)<new Date(new Date().setHours(0,0,0,0));if(due)return['Overdue','overdue',p];if(p.answered)return['In progress','progress',p];return['Not started','not-started',p]}
function renderMissionControl(rows,responses){var mission=document.getElementById('mission-control');if(!mission)return;if(!rows.length){mission.hidden=true;mission.innerHTML='';return}var next=null;for(var i=0;i<rows.length;i++){var candidate=status(rows[i],responses);if(candidate[1]!=='complete'){next={assignment:rows[i],state:candidate};break}}if(!next){mission.hidden=false;mission.innerHTML='<div class="mission-control__copy"><span class="mission-control__signal">MISSION STATUS</span><h2 id="mission-control-title">All assigned work is complete.</h2><p>You have cleared the current queue. Keep the momentum going in <a href="forge-quiz.html">Forge</a>.</p></div>';return}var a=next.assignment,p=next.state[2],bs=banks(a.banks),bank=bs[0],pct=p.total?Math.min(100,Math.round(p.answered/p.total*100)):0;var href='forge-quiz.html?bank='+encodeURIComponent(bank)+'&class_id='+encodeURIComponent(a.class_id)+'&assignment_title='+encodeURIComponent(a.title||'Assignment');var due=a.due_date?'Due '+new Date(a.due_date).toLocaleDateString('en-GB',{day:'numeric',month:'short'}):'No due date';mission.hidden=false;mission.innerHTML='<div class="mission-control__copy"><span class="mission-control__signal">NEXT MOVE</span><h2 id="mission-control-title">'+esc(a.title)+'</h2><p>'+esc(next.state[0])+' · '+esc(due)+' · '+p.answered+' of '+p.total+' questions answered</p></div><div class="mission-control__readout"><span class="mission-control__percent">'+pct+'%</span><span class="mission-control__label">complete</span><a class="mission-control__action" href="'+href+'">Open next assignment <span aria-hidden="true">→</span></a></div>'}
function syncWidgetData(rows,responses){
  if(!window.webkit||!window.webkit.messageHandlers||!window.webkit.messageHandlers.forgeWidgetSync)return;
  var open=(rows||[]).filter(function(a){return status(a,responses)[1]!=='complete';}),next=open[0],payload;
  if(next){
    var p=progress(next,responses),pct=p.total?Math.min(100,Math.round(p.answered/p.total*100)):0;
    var due=next.due_date?'Due '+new Date(next.due_date).toLocaleDateString('en-GB',{day:'numeric',month:'short'}):'No due date';
    payload={role:'student',title:String(next.title||'Assignment'),detail:String(status(next,responses)[0]+' · '+due+' · '+p.answered+' of '+p.total+' questions answered'),progress:pct,secondary:String(open.length)+' open assignment'+(open.length===1?'':'s'),deepLink:'forge://assigned'};
  }else{
    payload={role:'student',title:'All clear',detail:'All assigned work is complete',progress:100,secondary:'Keep the momentum going',deepLink:'forge://assigned'};
  }
  try{window.webkit.messageHandlers.forgeWidgetSync.postMessage({widgetData:payload})}catch(e){}
}
function render(rows,responses){var cacheKey='forge-assigned-open:'+String(saved&&saved.studentId||'anon')+':'+String(saved&&saved.classId||'none');renderMissionControl(rows,responses);syncWidgetData(rows,responses);if(!rows.length){el.innerHTML=ForgeState.html('empty',{label:'No assignments yet',body:'Your teacher’s assignments will appear here when they are ready.'});try{localStorage.setItem(cacheKey,'0')}catch(e){}if(window.ForgeSidebar)ForgeSidebar.setBadge('assignments',null);document.dispatchEvent(new CustomEvent('forge:assignments-rendered',{detail:{rows:rows}}));return}var outstanding=0;el.className='';el.innerHTML=rows.map(function(a){var s=status(a,responses);if(s[1]!=='complete')outstanding++;var p=s[2],bs=banks(a.banks),pct=p.total?Math.min(100,Math.round(p.answered/p.total*100)):0,score=scorePercent(p);return'<section class="card"><h2>'+esc(a.title)+'</h2><div class="meta">'+(a.due_date?'Due '+new Date(a.due_date).toLocaleDateString('en-GB',{day:'numeric',month:'short'}):'No due date')+'</div><span class="status status-'+s[1]+'">'+s[0]+'</span><div class="assignment-progress"><div class="assignment-progress-label"><span>'+p.answered+' of '+p.total+' questions answered</span><span>'+(score==null?'Score pending':score+'% score')+'</span></div><div class="assignment-progress-track" role="progressbar" aria-label="Assignment completion" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pct+'"><div class="assignment-progress-fill" style="--progress:'+pct+'%"></div></div></div><div>'+bs.map(function(b){return'<a class="topic" href="forge-quiz.html?bank='+encodeURIComponent(b)+'&class_id='+encodeURIComponent(a.class_id)+'">'+esc(BANKS[b]?BANKS[b].label:b)+' →</a>'}).join('')+'</div></section>'}).join('');try{localStorage.setItem(cacheKey,String(outstanding))}catch(e){}if(window.ForgeSidebar)ForgeSidebar.setBadge('assignments',outstanding||null);document.dispatchEvent(new CustomEvent('forge:assignments-rendered',{detail:{rows:rows}}))}
function showAssignmentError(){var retry=ForgeState.error(el,{label:'Assignments are unavailable',body:'We couldn’t retrieve your assignments. Check your connection and try again.'});if(retry)retry.onclick=function(){load(saved)}}
function showNoClass(){el.innerHTML=ForgeState.html('empty',{label:'Join a class to see assignments',body:'Connect to a class in Forge and your teacher’s work will appear here.',action:{label:'Open Forge',href:'forge-quiz.html'}})}
function load(s){if(!s||!s.classId){showNoClass();return}ForgeState.loading(el,{label:'Loading assignments',body:'Getting your teacher’s latest work ready.'});var registry=ForgeClasses.list().find(function(c){return c.classId===s.classId})||{};var context={studentId:s.studentId||registry.studentId,classId:s.classId,classCode:s.classCode||registry.classCode,studentName:s.studentName||registry.studentName};
  /* Assignment visibility must not depend on the optional linked-class sync.
     Fetch the student's own responses first, then reconcile other linked rows
     in the background. This keeps a valid assignment renderable even when a
     linking RPC is unavailable or slow. */
  var responsePromise=context.studentId
    ?jsonFetch(API+'/rest/v1/responses?select=*&student_id=eq.'+encodeURIComponent(context.studentId)+'&class_id=eq.'+encodeURIComponent(context.classId),{headers:headers(),token:ForgeAuth.accessToken()||KEY}).then(function(rows){
      var direct=responseRows(rows);
      // A direct table read can return 200 + [] when RLS hides the student's
      // rows. Treat that the same as a failed read and use the anon-safe RPC,
      // otherwise completed work is displayed as not started.
      if(direct.length||!context.classCode)return direct;
      return jsonFetch(API+'/rest/v1/rpc/get_student_own_responses',{method:'POST',headers:headers(),body:JSON.stringify({p_student_id:context.studentId,p_code:context.classCode,p_name:context.studentName})}).then(function(rows){return responseRows(rows)}).catch(function(){return[]});
    }).catch(function(){
      return context.classCode
        ?jsonFetch(API+'/rest/v1/rpc/get_student_own_responses',{method:'POST',headers:headers(),body:JSON.stringify({p_student_id:context.studentId,p_code:context.classCode,p_name:context.studentName})}).then(function(rows){return responseRows(rows)}).catch(function(){return[]})
        :[];
    })
    :Promise.resolve([]);
  Promise.all([jsonFetch(API+'/rest/v1/assignments?select=*&class_id=eq.'+encodeURIComponent(s.classId)+'&order=due_date.asc',{headers:headers()}),responsePromise]).then(function(d){var assignmentRows=responseRows(d[0]),serverResponses=responseRows(d[1]),localResponses=localSessionResponses(context,assignmentRows),seen={};serverResponses.concat(localResponses).forEach(function(r){var marker=String(r.bank)+'|'+String(r.question_id||r.id);if(!seen[marker])seen[marker]=r;});var mergedResponses=Object.keys(seen).map(function(k){return seen[k]});render(assignmentRows,mergedResponses);if(context.studentId&&context.classCode){ForgeClasses.adopt(context);ForgeClasses.syncFromServer(API,KEY,context,function(){})}}).catch(showAssignmentError)}
if(saved&&saved.classId)load(saved);else if(ForgeAuth.hasSession())ForgeAuth.getSession().then(function(){var token=ForgeAuth.accessToken(),user=ForgeAuth.currentUser();return ForgeAPI.response(API+'/rest/v1/students?select=id,class_id&auth_user_id=eq.'+user.id,{headers:{apikey:KEY,Authorization:'Bearer '+token}})}).then(function(r){return r.json()}).then(function(rows){if(!rows[0])throw Error('No class');saved={studentId:rows[0].id,classId:rows[0].class_id,studentName:(ForgeAuth.currentUser()||{}).user_metadata?.name||''};try{localStorage.setItem('forge-student',JSON.stringify(saved))}catch(e){}load(saved)}).catch(showNoClass);else showNoClass();
</script>  <script src="scripts/forge-page-actions.js"></script>
</body></html>
