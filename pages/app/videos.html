<!doctype html>
<html lang="en-GB" data-accent-scope="student">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Choose a Forge subject to watch selected topic explanation videos.">
  <title>Forge — Videos</title>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/page-overrides/settings.css">
  <link rel="stylesheet" href="css/page-overrides/videos.css">
</head>
<body>
  <!-- Generated by scripts/build/build-video-pages.js from scripts/build/video-library/. Edit those, not this file. -->
  <script src="scripts/forge-logo.js"></script>
  <script src="scripts/forge-role.js"></script>
  <script src="scripts/forge-rewards.js"></script>
  <script src="scripts/forge-theme.js"></script>
  <script src="scripts/forge-sidebar.js"></script>
  <script>if(window.ForgeRole)ForgeRole.guard('student','teacher.html');
  ForgeSidebar.mount({active:'videos',items:[
    {key:'dashboard',href:'student-dashboard.html',label:'Dashboard'},
    {key:'forge',href:'forge-quiz.html',label:'Forge'},
    {key:'assignments',href:'assignments.html',label:'Assigned'},
    {key:'anvil',href:'anvil.html',label:'Repair mistakes'},
    {key:'crucible',href:'crucible.html',label:'Timed practice'}
  ],footerItems:[{key:'profile',href:'profile.html',label:'Profile'}]});</script>
  <main class="wrap videos-page" id="main-content">
    <header class="settings-hero"><h1>Videos</h1><p>Choose a subject to find topic explanations. Videos play here in Forge.</p></header>
    <div class="videos-picker">
      <label for="video-subject">Subject</label>
      <select id="video-subject" name="subject">
        <option value="" disabled selected>Choose a subject</option>
        <optgroup label="A Level">
          <option value="videos-biology.html">Biology (38 videos)</option>
          <option value="videos-business.html">Business (22 videos)</option>
          <option value="videos-chemistry.html">Chemistry (42 videos)</option>
          <option value="videos-computer-science.html">Computer Science (26 videos)</option>
          <option value="videos-economics.html">Economics (38 videos)</option>
          <option value="videos-english-language-literature.html">English Language and Literature (20 videos)</option>
          <option value="videos-english-literature.html">English Literature (18 videos)</option>
          <option value="videos-french.html">French (14 videos)</option>
          <option value="videos-geography.html">Geography (20 videos)</option>
          <option value="videos-german.html">German (11 videos)</option>
          <option value="videos-health-social-care.html">Health and Social Care (11 videos)</option>
          <option value="videos-history.html">History (41 videos)</option>
          <option value="videos-law.html">Law (15 videos)</option>
          <option value="videos-maths.html">Mathematics (35 videos)</option>
          <option value="videos-media.html">Media Studies (19 videos)</option>
          <option value="videos-pe.html">Physical Education (20 videos)</option>
          <option value="videos-physics.html">Physics (31 videos)</option>
          <option value="videos-politics.html">Politics (20 videos)</option>
          <option value="videos-psychology.html">Psychology (32 videos)</option>
          <option value="videos-religious-studies.html">Religious Studies (18 videos)</option>
          <option value="videos-sociology.html">Sociology (28 videos)</option>
          <option value="videos-spanish.html">Spanish (12 videos)</option>
        </optgroup>
        <optgroup label="GCSE">
          <option value="videos-gcse-biology.html">Biology (36 videos)</option>
          <option value="videos-gcse-chemistry.html">Chemistry (36 videos)</option>
          <option value="videos-gcse-combined-science.html">Combined Science (94 videos)</option>
          <option value="videos-gcse-economics.html">Economics (27 videos)</option>
          <option value="videos-gcse-geography.html">Geography (26 videos)</option>
          <option value="videos-gcse-history.html">History (20 videos)</option>
          <option value="videos-gcse-maths.html">Maths (40 videos)</option>
          <option value="videos-gcse-physics.html">Physics (42 videos)</option>
          <option value="videos-gcse-psychology.html">Psychology (23 videos)</option>
        </optgroup>
        <optgroup label="Other qualifications">
          <option value="videos-criminology.html">Criminology (23 videos)</option>
          <option value="videos-mandarin.html">Mandarin (14 videos)</option>
        </optgroup>
      </select>
    </div>
  </main>
  <script src="scripts/forge-video-player.js"></script>
  <script src="scripts/videos.js"></script>
  <script src="scripts/forge-page-actions.js"></script>
</body>
</html>
