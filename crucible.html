*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--coal);color:var(--slate);font-family:'Inter',sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh}
h1,h2,h3{font-family:'Sora',sans-serif;color:var(--white);line-height:1.1;letter-spacing:-.015em}
.mono{font-family:'JetBrains Mono',monospace}
.wrap{max-width:680px;margin:0 auto;padding:28px 20px}
.tag{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ember)}
.logo{font-family:'Sora',sans-serif;font-weight:800;font-size:20px;color:var(--white);text-decoration:none;display:inline-flex;align-items:center;gap:8px;margin-bottom:0}
.logo .spark{width:9px;height:9px;background:var(--ember);border-radius:var(--radius-xs);transform:rotate(45deg);box-shadow:0 0 10px rgba(255,107,44,.7)}
.theme-toggle{background:var(--panel);border:1px solid var(--line);color:var(--slate);font-family:'JetBrains Mono',monospace;font-size:12px;padding:6px 12px;border-radius:var(--radius-sm);cursor:pointer;z-index:99}
.theme-toggle:hover{color:var(--white);border-color:var(--ember)}

/* join */
.join-input{width:100%;padding:12px 14px;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--panel);color:var(--white);font-family:'Inter',sans-serif;font-size:15px;margin-bottom:14px}
.join-input:focus{outline:none;border-color:var(--ember)}
.join-input::placeholder{color:#7A756E}
.join-btn{width:100%;padding:13px;border-radius:var(--radius-sm);background:var(--ember);color:#fff;border:none;font-family:'Inter',sans-serif;font-weight:600;font-size:15px;cursor:pointer}
.join-btn:hover{background:var(--hot)}
.join-btn:disabled{opacity:.5;cursor:wait}
.join-err{color:var(--bad);font-size:13px;margin-top:10px;display:none}
.center{text-align:center}
.back-btn{background:none;border:none;cursor:pointer;font-size:13px;color:#8A857E;font-family:'Inter',sans-serif;margin-bottom:16px;padding:0;display:block}
.back-btn:hover{color:var(--white)}

/* subject/bank picker */
.subject-list,.bank-list{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.pick-btn{padding:16px 18px;border-radius:var(--radius-md);border:1.5px solid var(--line);background:var(--panel);cursor:pointer;text-align:left;font-family:'Inter',sans-serif;transition:border-color .15s}
.pick-btn:hover{border-color:var(--ember)}
.pick-btn h3{font-size:16px;color:var(--white);margin-bottom:2px}
.pick-btn .sub{font-size:12px;color:#8A857E}

/* timer ring */
.timer-wrap{position:relative;width:120px;height:120px;margin:0 auto 20px}
.timer-svg{transform:rotate(-90deg)}
.timer-bg{fill:none;stroke:var(--line);stroke-width:6}
.timer-ring{fill:none;stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .5s linear,stroke .5s}
.timer-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Sora',sans-serif;font-size:28px;font-weight:800;color:var(--white)}
.timer-text.urgent{color:var(--bad)}

/* progress bar */
.progress-bar{height:3px;background:var(--line);border-radius:var(--radius-xs);margin-bottom:20px}
.progress-fill{height:3px;border-radius:var(--radius-xs);background:var(--bad);transition:width .3s}

/* question */
.q-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;font-size:13px;color:#8A857E}
.q-id{font-family:'JetBrains Mono',monospace;font-size:11px;background:rgba(255,90,90,.12);color:var(--bad);padding:2px 8px;border-radius:var(--radius-xs)}
.stem{font-size:16px;line-height:1.55;color:var(--white);margin-bottom:20px;font-weight:500}
.options{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:var(--radius-md);border:1.5px solid var(--line);background:var(--panel-2);color:var(--white);cursor:pointer;text-align:left;font-family:'Inter',sans-serif;font-size:15px;line-height:1.45;transition:border-color .15s,background .15s,opacity .15s;width:100%}
.opt:hover:not(.answered){border-color:var(--bad)}
.opt .letter{font-weight:700;min-width:20px;color:#8A857E}
.opt.answered{cursor:default}
.opt.correct{border-color:var(--good);background:rgba(127,217,138,.08)}
.opt.correct .letter{color:var(--good)}
.opt.wrong{border-color:var(--bad);background:rgba(255,90,90,.07)}
.opt.wrong .letter{color:var(--bad)}
.opt.dimmed{opacity:.4}
.no-scaffold{margin-top:14px;padding:12px 14px;border-radius:var(--radius-md);background:rgba(255,90,90,.06);border:1px solid rgba(255,90,90,.2);font-size:13px;color:var(--slate)}
.no-scaffold b{color:var(--bad)}
.next-btn{margin-top:18px;padding:10px 24px;border-radius:var(--radius-sm);background:var(--bad);color:#fff;border:none;cursor:pointer;font-weight:600;font-size:14px;font-family:'Inter',sans-serif;float:right}
.clear{clear:both}
.time-up-banner{margin-top:16px;padding:14px;border-radius:var(--radius-md);background:rgba(255,90,90,.08);border:1px solid rgba(255,90,90,.3);color:var(--bad);font-weight:600;font-size:14px;text-align:center}

/* results */
.results-card{background:var(--panel);border:1px solid rgba(255,90,90,.4);border-radius:var(--radius-lg);padding:28px;text-align:center;margin-bottom:20px;position:relative}
.big-pct{font-family:'Sora',sans-serif;font-size:80px;font-weight:900;line-height:1}
.results-detail{font-size:14px;color:var(--slate);margin:8px 0 20px}
.result-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;text-align:left}
.result-row:last-child{border-bottom:none}
.result-icon{font-size:16px;min-width:20px}
.result-info{flex:1;color:var(--white)}
.result-mc{font-family:'JetBrains Mono',monospace;font-size:11px;padding:2px 7px;border-radius:var(--radius-xs);background:rgba(255,90,90,.12);color:var(--bad)}
.result-mc.correct{background:rgba(127,217,138,.12);color:var(--good)}
.results-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.results-btns button{padding:10px 20px;border-radius:var(--radius-sm);border:none;cursor:pointer;font-weight:600;font-size:14px;font-family:'Inter',sans-serif}
.btn-danger{background:var(--bad);color:#fff}
.btn-ghost{background:var(--panel-2);color:var(--white);border:1px solid var(--line)!important}

[data-theme="light"] .join-btn,[data-theme="light"] .next-btn,[data-theme="light"] .btn-danger{color:#fff}
@media(max-width:600px){.big-pct{font-size:60px}}
[data-theme="light"] .forge-logo-dark{display:none!important}[data-theme="light"] .forge-logo-light{display:inline!important}</style>

function supaGet(t,p){return fetch(SUPABASE_URL+'/rest/v1/'+t+'?select=*'+(p?'&'+p:''),{headers:getHdrs}).then(function(r){return r.json();});}
// Write-only. anon may insert into responses but has no SELECT policy on it,
// so asking for the inserted row back fails the whole request (42501) and
// silently writes nothing.
function supaInsert(t,row){
  return fetch(SUPABASE_URL+'/rest/v1/'+t,{
    method:'POST',
    headers:Object.assign({},hdrs,{'Prefer':'return=minimal'}),
    body:JSON.stringify(row)
  }).then(function(r){
    if(!r.ok) return r.text().then(function(x){console.error('insert into '+t+' failed:',r.status,x);return null;});
    return null;
  }).catch(function(e){console.error('insert into '+t+' failed:',e);return null;});
}

// ===== DATA =====
</script>
<script src="data/forge-data.js"></script>
<script>

// ===== END DATA =====

var CRUCIBLE_TIME = 5 * 60; // 5 minutes
var QUESTIONS_PER_RUN = 6;
var CRUCIBLE_RUN_PREFIX = 'forge-crucible-run:';
function crucibleRunKey() { return CRUCIBLE_RUN_PREFIX + String(state.studentId || 'anon') + ':' + String(state.classId || 'none'); }
function loadCrucibleRun() { try { return JSON.parse(localStorage.getItem(crucibleRunKey()) || 'null'); } catch(e) { return null; } }
function saveCrucibleRun() { try { localStorage.setItem(crucibleRunKey(), JSON.stringify({status:'active',subject:state.subject,bank:state.bank,questionIds:state.questions.map(function(q){return q.id;}),answers:state.answers.map(function(a){return {id:a.q.id,selected:a.selected,correct:a.correct,timedOut:a.timedOut};}),idx:state.idx,timeLeft:state.timeLeft,updatedAt:Date.now()})); } catch(e) {} }
function clearCrucibleRun() { try { localStorage.removeItem(crucibleRunKey()); } catch(e) {} }
function restoreCrucibleRun() {
  var saved=loadCrucibleRun();
  if(!saved||saved.status!=='active'||!saved.bank||!saved.questionIds) return false;
  var pool=saved.bank==='ALL'?SUBJECTS[saved.subject].banks.reduce(function(all,bk){return all.concat(BANKS[bk]?BANKS[bk].questions.filter(function(q){return !q.type&&q.reforge;}):[]);},[]):(BANKS[saved.bank]?BANKS[saved.bank].questions.filter(function(q){return !q.type&&q.reforge;}):[]);
  var byId={};pool.forEach(function(q){byId[q.id]=q;});
  var questions=saved.questionIds.map(function(id){return byId[id];}).filter(Boolean);
  if(!questions.length) return false;
  state.subject=saved.subject; state.bank=saved.bank; state.questions=questions; state.idx=Math.min(saved.idx||0,questions.length-1); state.timeLeft=saved.timeLeft||CRUCIBLE_TIME;
  state.answers=(saved.answers||[]).map(function(a){return {q:byId[a.id],selected:a.selected,correct:a.correct,timedOut:a.timedOut};}).filter(function(a){return a.q;});
  state.phase='quiz'; return true;
}

function shuffle(a){var b=[...a];for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}

var state = {
  phase: 'join',
  studentId: null, classId: null, studentName: null,
  classSubject: null,
  paidSubjects: [],
  extraTime: 0,
  subject: null, bank: null,
  questions: [], idx: 0,
  answers: [], // {q, selected, correct, timeLeft}
  timeLeft: CRUCIBLE_TIME,
  timer: null
};

var app = document.getElementById('app');

// ===== JOIN =====
function renderJoin(){
  var f=ForgeAuthCard.field('j-name','Your first name',{placeholder:'e.g. Alex',autocomplete:'given-name'})
       +ForgeAuthCard.field('j-code','Class code',{placeholder:'e.g. ECON-Y12',upper:true})
       +'<button class="auth-btn danger" id="j-btn" type="submit">Enter the Crucible \u2192</button>'
       +'<p class="auth-err" id="j-err"></p>'
       +'<button class="auth-btn-ghost" id="j-skip" type="button">Practise without a class</button>';
  app.innerHTML=ForgeAuthCard.shell({
    title:'No hints. No scaffolds.<br>Just the question.',
    sub:'5 minutes. 6 questions. Wrong answers go straight to your Anvil.'
  },f);
  ForgeAuthCard.onSubmit(function(){document.getElementById('j-btn').onclick();});

  document.getElementById('j-btn').onclick=function(){
    var name=document.getElementById('j-name').value.trim();
    var code=document.getElementById('j-code').value.trim().toUpperCase();
    var err=document.getElementById('j-err');
    var btn=document.getElementById('j-btn');
    if(!name||!code){err.textContent='Enter your name and class code.';err.style.display='block';return;}
    btn.disabled=true;btn.textContent='Joining...';
    // Look up via RPC \u2014 classes/students tables are no longer directly
    // readable by an anonymous (no login) name+code session.
    fetch(SUPABASE_URL + '/rest/v1/rpc/get_student_by_name_and_code', {
      method: 'POST', headers: Object.assign({}, getHdrs, {'Content-Type':'application/json'}),
      body: JSON.stringify({ p_code: code, p_name: name })
    }).then(function(r){ return r.json(); }).then(function(rows){
      if(!Array.isArray(rows)||rows.length===0){err.textContent='Class or name not found. Join via the quiz first.';err.style.display='block';btn.disabled=false;btn.textContent='Enter the Crucible \u2192';return;}
      var match=rows[0];
      state.studentId=match.student_id;state.classId=match.class_id;state.studentName=name;
      ForgeClasses.use(name);
      state.classSubject=match.subject||null;
      state.extraTime=match.extra_time||0;
      try { localStorage.setItem('forge-student', JSON.stringify({studentId: state.studentId, classId: state.classId, classCode: code, studentName: state.studentName, classSubject: state.classSubject})); } catch(e) {}
      ForgeClasses.add({
        classId: state.classId, classCode: code, className: match.class_name || null,
        subject: state.classSubject, studentId: state.studentId, studentName: name
      });
      ForgeClasses.syncFromServer(SUPABASE_URL, SUPABASE_KEY,
        {studentId: state.studentId, classCode: code, studentName: name}, function(){ render(); });
      var joined = ForgeClasses.subjects(SUBJECTS);
      if(joined.length===1){
        state.subject=joined[0];
        state.phase='bank';
      } else if(joined.length>1){
        state.phase='subject';
      } else if(state.classSubject&&SUBJECTS[state.classSubject]){
        state.subject=state.classSubject;
        state.phase='bank';
      } else {
        state.phase='subject';
      }
      render();
    });
  };
  document.getElementById('j-skip').onclick=function(){state.studentName='Anonymous';state.phase='subject';render();};
}

// ===== SUBJECT PICKER =====
function renderSubject(){
  var h='<p class="tag" style="color:var(--bad);margin-bottom:4px">THE CRUCIBLE</p>';
  h+='<h2 style="font-size:22px;margin-bottom:6px">Choose a subject</h2>';
  h+='<p style="color:#8A857E;font-size:14px;margin-bottom:4px">You\u2019ll get up to 6 questions from that subject at random. No scaffolds.</p>';
  h+='<div class="subject-list">';

  // Subjects of every class joined (in Crucible or Forge \u2014 the list is
  // shared). Paid/trial students without classes see their plan's subjects.
  var joinedSubjects = ForgeClasses.subjects(SUBJECTS);
  var subjectKeys = Object.keys(SUBJECTS);
  if (joinedSubjects.length > 0) {
    subjectKeys = joinedSubjects;
  } else if (state.paidSubjects && state.paidSubjects.length > 0) {
    subjectKeys = state.paidSubjects.filter(function(k) { return SUBJECTS[k]; });
  }

  subjectKeys.forEach(function(k) {
    var s=SUBJECTS[k];
    var total=s.banks.reduce(function(t,b){return t+(BANKS[b]?BANKS[b].questions.filter(function(q){return !q.type&&q.reforge;}).length:0);},0);
    if(total<3) return;
    var entry = ForgeClasses.forSubject(k);
    h+='<button class="pick-btn" data-key="'+k+'">';
    h+='<h3 style="color:'+s.color+'">'+s.label+'</h3>';
    h+='<div class="sub">'+s.sub+' \u00b7 '+total+' questions available'+(entry&&entry.className?' \u00b7 '+entry.className:'')+'</div>';
    h+='</button>';
  });
  h+='</div>';
  var saved=loadCrucibleRun();
  if(saved&&saved.status==='active'&&saved.subject&&saved.bank){
    h+='<div class="forge-status forge-status--focus" style="margin-top:18px"><strong>Crucible run in progress</strong><br><span class="forge-text-13">You have answered '+(saved.answers||[]).length+' of '+(saved.questionIds||[]).length+' questions.</span><br><button class="forge-button forge-button--primary" id="resume-crucible" style="margin-top:10px">Resume run →</button> <button class="forge-button forge-button--secondary" id="discard-crucible" style="margin-top:10px">Start fresh</button></div>';
  }
  app.innerHTML=h + sessionBar();
  var resumeBtn=document.getElementById('resume-crucible');
  if(resumeBtn) resumeBtn.onclick=function(){if(restoreCrucibleRun()){startCrucible();}};
  var discardBtn=document.getElementById('discard-crucible');
  if(discardBtn) discardBtn.onclick=function(){clearCrucibleRun();renderSubject();};
  app.querySelectorAll('.pick-btn').forEach(function(b){
    b.onclick=function(){
      state.subject=b.dataset.key;
      // Attribute this run to the class that owns the subject.
      var entry = ForgeClasses.forSubject(b.dataset.key);
      if (entry) {
        state.classId      = entry.classId;
        state.studentId    = entry.studentId;
        state.classSubject = entry.subject || null;
      }
      state.phase='bank';
      render();
    };
  });
}

// ===== BANK PICKER =====
function renderBank(){
  var subj=SUBJECTS[state.subject];
  var locked=state.classSubject&&state.classSubject===state.subject;
  var h=locked?'':'<button class="back-btn" onclick="state.phase=\'subject\';render()">\u2190 Subjects</button>';
  h+='<p class="tag" style="color:var(--bad);margin-bottom:4px">THE CRUCIBLE</p>';
  h+='<h2 style="font-size:22px;margin-bottom:6px">'+subj.label+'</h2>';
  h+='<p style="color:#8A857E;font-size:14px;margin-bottom:4px">Pick a topic bank or run the full subject mix.</p>';
  h+='<div class="bank-list">';
  // All banks option
  var allQs=[];
  subj.banks.forEach(function(bk){if(BANKS[bk])allQs=allQs.concat(BANKS[bk].questions.filter(function(q){return !q.type&&q.reforge;}));});
  h+='<button class="pick-btn" data-bank="ALL" style="border-color:'+subj.color+'30">';
  h+='<h3 style="color:'+subj.color+'">All topics mixed</h3>';
  h+='<div class="sub">'+allQs.length+' questions \u00b7 randomised</div>';
  h+='</button>';
  subj.banks.forEach(function(bk){
    if(!BANKS[bk]) return;
    var qs=BANKS[bk].questions.filter(function(q){return !q.type&&q.reforge;});
    if(qs.length<2) return;
    h+='<button class="pick-btn" data-bank="'+bk+'">';
    h+='<h3>'+BANKS[bk].label+'</h3>';
    h+='<div class="sub">'+qs.length+' questions</div>';
    h+='</button>';
  });
  h+='</div>';
  app.innerHTML=h + sessionBar();
  app.querySelectorAll('.pick-btn').forEach(function(b){
    b.onclick=function(){
      state.bank=b.dataset.bank;
      buildQuestions();
      state.phase='ready';render();
    };
  });
}

function buildQuestions(){
  var pool=[];
  if(state.bank==='ALL'){
    SUBJECTS[state.subject].banks.forEach(function(bk){
      if(BANKS[bk])pool=pool.concat(BANKS[bk].questions.filter(function(q){return !q.type&&q.reforge;}));
    });
  } else {
    pool=BANKS[state.bank].questions.filter(function(q){return !q.type&&q.reforge;});
  }
  state.questions=shuffle(pool).slice(0,QUESTIONS_PER_RUN);
  state.idx=0;state.answers=[];state.timeLeft=CRUCIBLE_TIME;
}

// ===== READY SCREEN =====
function renderReady(){
  var subj=SUBJECTS[state.subject];
  var bankName=state.bank==='ALL'?'All topics':BANKS[state.bank].label;
  var h='<button class="back-btn" onclick="state.phase=\'bank\';render()">\u2190 Back</button>';
  h+='<div class="center">';
  h+='<p class="tag" style="color:var(--bad);margin-bottom:10px">THE CRUCIBLE</p>';
  h+='<h1 style="font-size:32px;margin-bottom:10px">Ready?</h1>';
  h+='<p style="color:var(--white);font-size:17px;margin-bottom:6px">'+bankName+'</p>';
  var totalSecs = Math.round(CRUCIBLE_TIME * (1 + ((state.extraTime || 0) / 100)));
  var totalMins = Math.round(totalSecs / 60);
  var timeLabel = totalMins + ' minute' + (totalMins !== 1 ? 's' : '');
  var extraNote = state.extraTime > 0 ? ' <span style="font-family:\'JetBrains Mono\',monospace;font-size:11px;color:var(--good)">(+' + state.extraTime + '% time arrangement applied)</span>' : '';
  h+='<p style="color:#8A857E;font-size:14px;margin-bottom:32px">'+state.questions.length+' questions \u00b7 ' + timeLabel + ' \u00b7 no scaffolds \u00b7 no re-forges' + extraNote + '</p>';
  h+='<div style="display:flex;flex-direction:column;gap:10px;max-width:280px;margin:0 auto;font-size:14px;color:var(--slate);text-align:left">';
  h+='<div>\u2715 No hints if you get it wrong</div>';
  h+='<div>\u2715 No re-forge twin to soften the blow</div>';
  h+='<div>\u2713 Wrong answers go to your Anvil automatically</div>';
  h+='<div>\u2713 Timer stops for no one</div>';
  h+='</div>';
  h+='<button class="forge-button forge-button--primary" onclick="startCrucible()" style="margin-top:32px;min-height:48px;padding:0 28px;font-size:17px">Begin \u2192</button>';
  h+='</div>';
  app.innerHTML=h;
}

// ===== CRUCIBLE QUESTION =====
window.startCrucible=function(){
  state.phase='quiz';
  if(window.forgeTrack) forgeTrack('crucible_started',{bank:state.bank,question_count:state.questions.length});
  // Apply extra time if student has access arrangement
  var multiplier = 1 + ((state.extraTime || 0) / 100);
  if(!state.answers.length || !state.timeLeft) state.timeLeft = Math.round(CRUCIBLE_TIME * multiplier);
  if(state.timer) clearInterval(state.timer);
  state.timer=setInterval(function(){
    state.timeLeft--;
    updateTimer();
    if(state.timeLeft<=0){
      clearInterval(state.timer);
      state.timer=null;
      timeUp();
    }
  },1000);
  renderQuestion();
};

function updateTimer(){
  var el=document.getElementById('timer-text');
  var ring=document.getElementById('timer-ring');
  if(!el||!ring) return;
  var mins=Math.floor(state.timeLeft/60);
  var secs=state.timeLeft%60;
  el.textContent=mins+':'+(secs<10?'0':'')+secs;
  el.className='timer-text'+(state.timeLeft<=30?' urgent':'');
  var pct=state.timeLeft/CRUCIBLE_TIME;
  var circ=2*Math.PI*52;
  ring.style.strokeDashoffset=circ*(1-pct);
  ring.style.stroke=state.timeLeft<=30?'var(--bad)':state.timeLeft<=60?'var(--hot)':'var(--ember)';
}

function timeUp(){
  if(window.forgeTrack) forgeTrack('crucible_timed_out',{bank:state.bank,answered:state.answers.length,total:state.questions.length});
  // Auto-submit current question if unanswered
  var opts=document.querySelectorAll('.opt:not(.answered)');
  if(opts.length>0){
    var q=state.questions[state.idx];
    state.answers.push({q:q,selected:null,correct:false,timedOut:true});
    logAnswer(q,null,false);
  }
  // Move to results
  state.phase='results';
  render();
}

function renderQuestion(){
  var q=state.questions[state.idx];
  var keys=Object.keys(q.options);
  var pct=(state.idx/state.questions.length)*100;
  var circ=2*Math.PI*52;
  var timeRatio=state.timeLeft/CRUCIBLE_TIME;

  var h='<div class="progress-bar"><div class="progress-fill" style="width:'+pct+'%"></div></div>';
  h+='<div class="q-header">';
  h+='<span class="q-id">'+q.id+'</span>';
  h+='<span>'+(state.idx+1)+' / '+state.questions.length+'</span>';
  h+='</div>';

  // Timer
  h+='<div class="timer-wrap">';
  h+='<svg class="timer-svg" width="120" height="120" viewBox="0 0 120 120">';
  h+='<circle class="timer-bg" cx="60" cy="60" r="52"/>';
  h+='<circle id="timer-ring" class="timer-ring" cx="60" cy="60" r="52" stroke="var(--ember)" stroke-dasharray="'+circ+'" stroke-dashoffset="'+(circ*(1-timeRatio))+'"/>';
  h+='</svg>';
  h+='<div id="timer-text" class="timer-text" aria-live="polite" aria-label="Time remaining">';
  var m=Math.floor(state.timeLeft/60),s=state.timeLeft%60;
  h+=m+':'+(s<10?'0':'')+s;
  h+='</div></div>';

  h+='<div class="stem">'+q.stem+'</div>';
  h+='<div class="options" id="c-opts">';
  keys.forEach(function(k){
    h+='<button class="opt forge-option" data-k="'+k+'"><span class="letter">'+k+'</span><span>'+q.options[k]+'</span></button>';
  });
  h+='</div>';
  h+='<div id="c-feedback"></div><div class="clear"></div>';
  app.innerHTML=h;

  var opts=document.querySelectorAll('#c-opts .opt');
  var answered=false;
  opts.forEach(function(o){
    o.onclick=function(){
      if(answered) return;
      answered=true;
      var k=o.dataset.k;
      var isCorrect=k===q.correct;
      if(window.forgeTrack) forgeTrack('crucible_question_answered',{bank:state.bank,correct:isCorrect});
      state.answers.push({q:q,selected:k,correct:isCorrect,timedOut:false});
      saveCrucibleRun();
      logAnswer(q,k,isCorrect);

      opts.forEach(function(x){
        x.classList.add('answered');
        if(x.dataset.k===q.correct) x.classList.add('correct');
        else if(x===o&&!isCorrect) x.classList.add('wrong');
        else x.classList.add('dimmed');
      });

      var fb=document.getElementById('c-feedback');
      if(isCorrect){
        fb.innerHTML='<div style="margin-top:14px;padding:12px 14px;border-radius:var(--radius-md);background:rgba(127,217,138,.08);border:1px solid rgba(127,217,138,.3);color:var(--good);font-weight:600;font-size:14px">\u2713 Correct.</div>';
      } else {
        fb.innerHTML='<div class="no-scaffold"><b>No scaffold here.</b> That error has been sent to your Anvil. Rework it after.</div>';
      }
      fb.innerHTML+='<button class="next-btn btn-glass btn-crimson" id="c-next">'+(state.idx+1<state.questions.length?'Next \u2192':'Finish \u2192')+'</button><div class="clear"></div>';
      document.getElementById('c-next').onclick=function(){
        state.idx++;
        saveCrucibleRun();
        if(state.idx>=state.questions.length){
          if(state.timer){clearInterval(state.timer);state.timer=null;}
          state.phase='results';render();
        } else {
          renderQuestion();
        }
      };
    };
  });
}

function logAnswer(q,selectedKey,isCorrect){
  if(!state.studentId) return;
  supaInsert('responses',{
    student_id:state.studentId,
    class_id:state.classId,
    question_id:q.id+'-CRU',
    bank:state.bank==='ALL'?q.id.split('-')[0]+'-MIX':state.bank,
    subject:state.subject,
    selected_option:selectedKey||'TIMEOUT',
    is_correct:isCorrect,
    misconception_tag:isCorrect?null:(q.tag||null),
    reforge_attempted:false,
    reforge_correct:null
  });
}

// ===== RESULTS =====
function renderResults(){
  var correct=state.answers.filter(function(a){return a.correct;}).length;
  var total=state.answers.length;
  var pct=total>0?Math.round((correct/total)*100):0;
  var col=pct>=75?'var(--good)':pct>=50?'var(--hot)':'var(--bad)';
  var timeUsed=CRUCIBLE_TIME-state.timeLeft;
  var mins=Math.floor(timeUsed/60),secs=timeUsed%60;

  var h='<div class="results-card">';
  clearCrucibleRun();
  if(window.forgeTrack) forgeTrack('crucible_completed',{bank:state.bank,score:correct,total:total});
  h+='<p class="tag" style="color:var(--bad);margin-bottom:8px">CRUCIBLE COMPLETE</p>';
  h+='<div class="big-pct" style="color:'+col+'">'+pct+'%</div>';
  h+='<div class="results-detail">'+correct+' / '+total+' correct \u00b7 '+mins+'m '+(secs<10?'0':'')+secs+'s</div>';
  h+='<div class="forge-success" style="margin-top:18px"><div class="forge-success-title">'+(pct>=75?'Strong pressure-test.':'Useful pressure-test.')+'</div><div class="forge-success-copy">'+(pct>=75?'You held up well under timed conditions.':'Your weak spots are now visible. Rework your Anvil, then try the Crucible again.')+'</div></div>';
  h+='</div>';

  // Per-question breakdown
  var wrong=state.answers.filter(function(a){return !a.correct;});
  if(wrong.length>0){
    h+='<div style="background:var(--panel);border:1px solid rgba(255,90,90,.3);border-radius:var(--radius-lg);padding:20px;margin-bottom:18px">';
    h+='<p class="tag" style="color:var(--bad);margin-bottom:12px">Sent to your Anvil</p>';
    wrong.forEach(function(a){
      var tag=a.q.tag;
      if(Array.isArray(tag)) tag=tag[0];
      h+='<div class="result-row">';
      h+='<span class="result-icon forge-text-bad">\u2715</span>';
      h+='<span class="result-info">'+a.q.stem.substring(0,80)+(a.q.stem.length>80?'\u2026':'')+'</span>';
      h+='<span class="result-mc">'+(tag||'—')+'</span>';
      h+='</div>';
    });
    h+='</div>';
  }

  // Correct summary
  var rightAnswers=state.answers.filter(function(a){return a.correct;});
  if(rightAnswers.length>0){
    h+='<div style="background:var(--panel);border:1px solid rgba(127,217,138,.2);border-radius:var(--radius-lg);padding:20px;margin-bottom:18px">';
    h+='<p class="tag" style="color:var(--good);margin-bottom:12px">Got these right</p>';
    rightAnswers.forEach(function(a){
      h+='<div class="result-row">';
      h+='<span class="result-icon forge-text-good">\u2713</span>';
      h+='<span class="result-info">'+a.q.stem.substring(0,80)+(a.q.stem.length>80?'\u2026':'')+'</span>';
      h+='<span class="result-mc correct">'+a.q.id+'</span>';
      h+='</div>';
    });
    h+='</div>';
  }

  h+='<div class="forge-action-row">';
  h+='<button class="forge-button forge-button--primary" onclick="buildQuestions();state.phase=\'ready\';render()">Run it again</button>';
  h+='<button class="forge-button forge-button--secondary" onclick="state.phase=\'bank\';render()">Change bank</button>';
  h+='<button class="forge-button forge-button--secondary" onclick="state.phase=state.classSubject?\'bank\':\'subject\';render()">Change subject</button>';
  h+='</div>';
  h+='<div class="center forge-mt-4">';
  h+='<a href="anvil.html" style="font-size:13px;color:var(--ember);font-family:JetBrains Mono,monospace;text-decoration:none">Rework your Anvil \u2192</a>';
  h+='</div>';
  app.innerHTML=h;
}

function render(){
  if(state.phase==='join') renderJoin();
  else if(state.phase==='subject') renderSubject();
  else if(state.phase==='bank') renderBank();
  else if(state.phase==='ready') renderReady();
  else if(state.phase==='quiz') renderQuestion();
  else if(state.phase==='results') renderResults();
}

function forgeLogout(){
  try { localStorage.removeItem('forge-student'); } catch(e) {}
  try { localStorage.removeItem('forge-free-session'); } catch(e) {}
  ForgeAuth.signOut();
  location.reload();
}
function sessionBar(){
  if (!state.studentId || !state.studentName || state.studentName === 'Anonymous') return '';
  return '<div style="text-align:center;margin-top:26px;padding-top:14px;border-top:1px solid var(--line)"><span style="font-size:12px;color:#8A857E">Signed in as <b style="color:var(--slate)">' + state.studentName + '</b> \u00b7 <a href="#" onclick="forgeLogout();return false" style="color:var(--ember);text-decoration:none">Not you? Switch student</a></span></div>';
}

// ===== SHARED SESSION RESTORE =====
function restoreSession() {
  if (ForgeAuth.hasSession()) {
    ForgeAuth.getSession().then(function(result) {
      if (result && result.subscriber) {
        var sub = result.subscriber;
        state.studentName  = sub.name;
        state.paidSubjects = sub.subjects || [];
        state.classSubject = null;

        // Look up ALL class enrolments for this auth user
        var token = ForgeAuth.accessToken();
        var authUser = ForgeAuth.currentUser();
        if (!authUser) { checkLocalSessionCrucible(); return; }

        fetch(SUPABASE_URL + '/rest/v1/students?select=id,class_id,extra_time&auth_user_id=eq.' + authUser.id + '&class_id=not.is.null', {
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + (token || SUPABASE_KEY) }
        }).then(function(r) { return r.json(); }).then(function(rows) {
          if (!Array.isArray(rows) || rows.length === 0) {
            // No class enrolments — use paidSubjects or show all
            state.phase = 'subject';
            render();
            return;
          }

          // Get all class IDs
          var classIds = rows.map(function(r) { return r.class_id; });

          // Fetch class details to get subjects — via RPC, since the
          // classes table itself is no longer directly readable by students.
          fetch(SUPABASE_URL + '/rest/v1/rpc/get_enrolled_class_subjects', {
            method: 'POST',
            headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + (token || SUPABASE_KEY), 'Content-Type': 'application/json' },
            body: JSON.stringify({ p_class_ids: classIds })
          }).then(function(r) { return r.json(); }).then(function(classes) {
            // Build list of enrolled subjects
            var enrolledSubjects = [];
            classes.forEach(function(cls) {
              if (cls.subject && enrolledSubjects.indexOf(cls.subject) === -1) {
                enrolledSubjects.push(cls.subject);
              }
            });

            // Store enrolled subjects for subject picker
            state.paidSubjects = enrolledSubjects.length > 0 ? enrolledSubjects : sub.subjects || [];

            // Get max extra_time across all student rows
            var maxExtraTime = 0;
            rows.forEach(function(r) { if ((r.extra_time || 0) > maxExtraTime) maxExtraTime = r.extra_time || 0; });
            state.extraTime = maxExtraTime;

            // Store most recent class for fallback
            var saved = null;
            try { saved = JSON.parse(localStorage.getItem('forge-student') || 'null'); } catch(e) {}
            if (saved && saved.studentId) {
              state.studentId = saved.studentId;
              state.classId   = saved.classId || null;
            }

            if (enrolledSubjects.length === 1) {
              // Only one subject enrolled — go straight to bank
              state.subject = enrolledSubjects[0];
              state.phase   = 'bank';
            } else {
              state.phase = 'subject';
            }
            render();
          }).catch(function() { state.phase = 'subject'; render(); });
        }).catch(function() { checkLocalSessionCrucible(); });
      } else {
        checkLocalSessionCrucible();
      }
    }).catch(function() { checkLocalSessionCrucible(); });
  } else {
    checkLocalSessionCrucible();
  }
}

function checkLocalSessionCrucible() {
  // Check free session
  var freeSession = null;
  try { freeSession = JSON.parse(localStorage.getItem('forge-free-session') || 'null'); } catch(e) {}
  if (freeSession && freeSession.studentId) {
    state.studentId   = freeSession.studentId;
    state.studentName = freeSession.name;
    state.classId     = null;
    state.phase = 'subject';
    render();
    return;
  }
  // Check class session
  try {
    var savedSession = JSON.parse(localStorage.getItem('forge-student') || 'null');
    if (savedSession && savedSession.studentId) {
      state.studentId    = savedSession.studentId;
      state.classId      = savedSession.classId;
      state.studentName  = savedSession.studentName;
      state.classSubject = savedSession.classSubject || null;

      // Sessions from before multi-class support only know about one class.
      ForgeClasses.adopt(savedSession);

      // Fetch student record for extra_time
      supaGet('students', 'id=eq.' + state.studentId + (state.classId ? '&class_id=eq.' + state.classId : '')).then(function(rows) {
        if (rows && rows[0]) state.extraTime = rows[0].extra_time || 0;
        settlePhase();
      }).catch(function() { settlePhase(); });

      // Pick up classes joined on the student's other devices.
      ForgeClasses.syncFromServer(SUPABASE_URL, SUPABASE_KEY, {
        studentId: state.studentId, classCode: savedSession.classCode, studentName: state.studentName
      }, function(){ settlePhase(); });

      // Offer every class the student has joined (in Crucible or Forge —
      // the list is shared), rather than only the one cached last.
      function settlePhase() {
        var joined = ForgeClasses.subjects(SUBJECTS);
        if (joined.length === 1) {
          state.subject      = joined[0];
          state.classSubject = joined[0];
          state.phase        = 'bank';
        } else if (joined.length > 1) {
          state.phase = 'subject';
        } else if (state.classSubject && typeof SUBJECTS !== 'undefined' && SUBJECTS[state.classSubject]) {
          state.subject = state.classSubject;
          state.phase   = 'bank';
        } else {
          state.phase = 'subject';
          ForgeClasses.backfillSubjects(SUPABASE_URL, SUPABASE_KEY, function() {
            var subs = ForgeClasses.subjects(SUBJECTS);
            if (subs.length === 1) {
              state.subject = subs[0]; state.classSubject = subs[0]; state.phase = 'bank';
            }
            if (subs.length) render();
          });
        }
        render();
      }
      return;
    }
  } catch(e) {}
  render();
}

restoreSession();
</script>
