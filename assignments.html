<!doctype html>
<html lang="en-GB">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forge — Assigned</title><link rel="stylesheet" href="css/tokens.css"><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/sidebar.css"><link rel="stylesheet" href="css/states.css">
  <link rel="stylesheet" href="css/generated-utilities.css">
  <link rel="stylesheet" href="css/page-overrides/assignments.css">
</head>
<body>
<script src="scripts/forge-api.js"></script>
<script src="scripts/forge-state.js"></script>
<link rel="stylesheet" href="css/components.css"><script src="scripts/forge-logo.js"></script><script src="forge-auth.js"></script><script src="scripts/forge-sidebar.js?v=20260802"></script><script src="scripts/forge-product-analytics.js"></script><script src="data/forge-data.js"></script><script>window.ForgeAssignmentBanks=BANKS;</script><script src="scripts/forge-assignment-progress.js"></script><script src="scripts/forge-classes.js"></script>
<script>function forgeSignOut(){try{localStorage.removeItem('forge-student');localStorage.removeItem('forge-anvil-open')}catch(e){}if(window.ForgeAuth)ForgeAuth.signOut();location.href='forge-quiz.html'}ForgeSidebar.mount({active:'assignments',items:[{key:'dashboard',href:'student-dashboard.html',label:'Dashboard'},{key:'forge',href:'forge-quiz.html',label:'Forge'},{key:'assignments',href:'assignments.html',label:'Assigned'},{key:'anvil',href:'anvil.html',label:'Anvil'},{key:'crucible',href:'crucible.html',label:'Crucible'}],footerItems:[{key:'profile',href:'profile.html',label:'Profile'}],signOut:forgeSignOut});</script>
<script src="scripts/forge-student-badges.js"></script>
<main class="wrap"><div class="forge-u-vxmhzc">Student work</div><h1>Assigned</h1><p>Your teacher’s current assignments appear here. The full course remains available in <a href="forge-quiz.html">Forge</a>.</p><div id="list" class="card"></div></main>
<script>
var API=ForgeAPI.config.url,KEY=ForgeAPI.config.key,el=document.getElementById('list'),saved=null;
ForgeState.loading(el,{label:'Loading assignments',body:'Getting your teacher’s latest work ready.'});
try{saved=JSON.parse(localStorage.getItem('forge-student')||'null')}catch(e){}
function headers(){return ForgeAPI.headers(null,{'Content-Type':'application/json'})}
function jsonFetch(url,options){return ForgeAPI.request(url,options)}
function banks(v){try{return typeof v==='string'?JSON.parse(v):v||[]}catch(e){return[]}}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function normalise(v){return String(v==null?'':v).trim().toLowerCase()}
function responseRows(payload){if(Array.isArray(payload))return payload;if(payload&&Array.isArray(payload.responses))return payload.responses;if(payload&&Array.isArray(payload.data))return payload.data;return[]}
function localSessionResponses(context,assignmentRows){
  var out=[];
  (assignmentRows||[]).forEach(function(a){banks(a.banks).forEach(function(bank){
    try{
      var saved=JSON.parse(localStorage.getItem('forge-session:'+String(context.studentId||'anon')+':'+String(context.classId||'none')+':'+bank)||'null');
      (saved&&saved.completedIds||[]).forEach(function(id){out.push({question_id:id,bank:bank,is_correct:false});});
    }catch(e){}
  });});
  return out;
}
function bankForQuestion(id){var wanted=String(id||'').replace(/-RF$/,'');for(var b in BANKS){if((BANKS[b].questions||[]).some(function(q){return String(q.id)===wanted}))return b}return null}
function progress(a,responses){return ForgeAssignmentProgress.progress(a,responses)}
function status(a,responses){var p=progress(a,responses);if(p.complete)return['Completed','complete',p];var due=a.due_date&&new Date(a.due_date)<new Date(new Date().setHours(0,0,0,0));if(due)return['Overdue','overdue',p];if(p.answered)return['In progress','progress',p];return['Not started','not-started',p]}
function render(rows,responses){var cacheKey='forge-assigned-open:'+String(saved&&saved.studentId||'anon')+':'+String(saved&&saved.classId||'none');if(!rows.length){el.innerHTML=ForgeState.html('empty',{label:'No assignments yet',body:'Your teacher’s assignments will appear here when they are ready.'});try{localStorage.setItem(cacheKey,'0')}catch(e){}if(window.ForgeSidebar)ForgeSidebar.setBadge('assignments',null);return}var outstanding=0;el.className='';el.innerHTML=rows.map(function(a){var s=status(a,responses);if(s[1]!=='complete')outstanding++;var p=s[2],bs=banks(a.banks),pct=p.total?Math.min(100,Math.round(p.answered/p.total*100)):0;return'<section class="card"><h2>'+esc(a.title)+'</h2><div class="meta">'+(a.due_date?'Due '+new Date(a.due_date).toLocaleDateString('en-GB',{day:'numeric',month:'short'}):'No due date')+'</div><span class="status status-'+s[1]+'">'+s[0]+'</span><div class="assignment-progress" aria-label="Assignment progress"><div class="assignment-progress-label"><span>'+p.answered+' of '+p.total+' questions answered</span><span>'+pct+'%</span></div><div class="assignment-progress-track"><div class="assignment-progress-fill" style="width:'+pct+'%"></div></div></div><div>'+bs.map(function(b){return'<a class="topic" href="forge-quiz.html?bank='+encodeURIComponent(b)+'">'+esc(BANKS[b]?BANKS[b].label:b)+' →</a>'}).join('')+'</div></section>'}).join('');try{localStorage.setItem(cacheKey,String(outstanding))}catch(e){}if(window.ForgeSidebar)ForgeSidebar.setBadge('assignments',outstanding||null)}
function showAssignmentError(){var retry=ForgeState.error(el,{label:'Assignments are unavailable',body:'We couldn’t retrieve your assignments. Check your connection and try again.'});if(retry)retry.onclick=function(){load(saved)}}
function showNoClass(){el.innerHTML=ForgeState.html('empty',{label:'Join a class to see assignments',body:'Connect to a class in Forge and your teacher’s work will appear here.',action:{label:'Open Forge',href:'forge-quiz.html'}})}
function load(s){if(!s||!s.classId){showNoClass();return}ForgeState.loading(el,{label:'Loading assignments',body:'Getting your teacher’s latest work ready.'});var registry=ForgeClasses.list().find(function(c){return c.classId===s.classId})||{};var context={studentId:s.studentId||registry.studentId,classId:s.classId,classCode:s.classCode||registry.classCode,studentName:s.studentName||registry.studentName};
  /* Assignment visibility must not depend on the optional linked-class sync.
     Fetch the student's own responses first, then reconcile other linked rows
     in the background. This keeps a valid assignment renderable even when a
     linking RPC is unavailable or slow. */
  var responsePromise=context.studentId
    ?jsonFetch(API+'/rest/v1/responses?select=*&student_id=eq.'+encodeURIComponent(context.studentId)+'&class_id=eq.'+encodeURIComponent(context.classId),{headers:headers(),token:ForgeAuth.accessToken()||KEY}).then(function(rows){return responseRows(rows)}).catch(function(){
      return context.classCode
        ?jsonFetch(API+'/rest/v1/rpc/get_student_own_responses',{method:'POST',headers:headers(),body:JSON.stringify({p_student_id:context.studentId,p_code:context.classCode,p_name:context.studentName})}).then(function(rows){return responseRows(rows)}).catch(function(){return[]})
        :[];
    })
    :Promise.resolve([]);
  Promise.all([jsonFetch(API+'/rest/v1/assignments?select=*&class_id=eq.'+encodeURIComponent(s.classId)+'&order=due_date.asc',{headers:headers()}),responsePromise]).then(function(d){var assignmentRows=responseRows(d[0]),serverResponses=responseRows(d[1]),localResponses=localSessionResponses(context,assignmentRows),seen={};serverResponses.concat(localResponses).forEach(function(r){var marker=String(r.bank)+'|'+String(r.question_id||r.id);if(!seen[marker])seen[marker]=r;});render(assignmentRows,Object.keys(seen).map(function(k){return seen[k]}));if(context.studentId&&context.classCode){ForgeClasses.adopt(context);ForgeClasses.syncFromServer(API,KEY,context,function(){})}}).catch(showAssignmentError)}
if(saved&&saved.classId)load(saved);else if(ForgeAuth.hasSession())ForgeAuth.getSession().then(function(){var token=ForgeAuth.accessToken(),user=ForgeAuth.currentUser();return ForgeAPI.response(API+'/rest/v1/students?select=id,class_id&auth_user_id=eq.'+user.id,{headers:{apikey:KEY,Authorization:'Bearer '+token}})}).then(function(r){return r.json()}).then(function(rows){if(!rows[0])throw Error('No class');saved={studentId:rows[0].id,classId:rows[0].class_id,studentName:(ForgeAuth.currentUser()||{}).user_metadata?.name||''};try{localStorage.setItem('forge-student',JSON.stringify(saved))}catch(e){}load(saved)}).catch(showNoClass);else showNoClass();
</script>  <script src="scripts/forge-page-actions.js"></script>
</body></html>
