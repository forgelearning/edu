name: Deploy static site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deployment
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate question bank
        run: node scripts/checks/check-question-bank.js

      - name: Validate subject-page counts
        run: node scripts/checks/check-subject-counts.js

      - name: Validate specification coverage
        run: node scripts/checks/check-spec-coverage.js

      - name: Validate stem diversity
        run: node scripts/checks/check-stem-diversity.js

      - name: Validate stem language
        run: node scripts/checks/check-stem-language.js

      - name: Audit distractor balance and structure
        run: node dev/audit-banks.js

      - name: Ratchet longest-answer cues in the source
        run: node dev/check-source-cues.js

      - name: Audit Supabase security boundary
        run: node dev/audit-supabase-security.js

      - name: Run Forge regression tests
        run: node dev/test-forge.js

      - name: Run Forge auth contract tests
        run: node dev/test-auth.js

      - name: Run Forge API failure-contract tests
        run: node dev/test-forge-api.js

      - name: Run Forge persistence recovery tests
        run: node dev/test-persistence.js

      - name: Build public site
        run: node scripts/build/build-pages-site.js

      # check-routes.js is an HTTP smoke test, not a static check — it needs the
      # site actually being served before it can request anything.
      - name: Serve site for route smoke test
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory _site >/dev/null 2>&1 &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          echo "Static server did not come up on 127.0.0.1:4173" >&2
          exit 1

      - name: Validate routes and local links
        run: node scripts/checks/check-routes.js

      - name: Stop static server
        if: always()
        run: kill "$SERVER_PID" 2>/dev/null || true

      - name: Validate UI system
        run: node scripts/checks/check-ui-system.js

      - name: Validate content status freshness
        run: node scripts/build/build-content-status.js --check

      - name: Validate button types
        run: node scripts/checks/check-button-types.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Public URLs stay flat in _site even though their sources are organized
      # under pages/ in the repository.
      - name: Verify public site
        run: test -f _site/index.html && echo "Built $(find _site -type f | wc -l) public files"

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site

      # The Pages backend has been taking longer than deploy-pages' 10 minute
      # default to finish a deployment that it accepts within seconds, so every
      # run since 2026-08-06 12:30 aborted mid-deploy rather than failing on
      # anything in this repo. Give it room instead of failing the site build.
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          timeout: 1800000
