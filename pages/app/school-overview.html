<script>
var SUPABASE_URL = ForgeAPI.config.url;
var SUPABASE_KEY = ForgeAPI.config.key;

var hdrs = { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY };
var app = document.getElementById('app');
var activeTab = window.location.hash === '#analytics' ? 'misconceptions' : 'subjects';
// Defaults to the whole school. The stat card is labelled "School-wide
// accuracy", and it used to open on the A-Level tab and quietly report the
// A-Level figure under that label — the one number a leader is most likely to
// quote in a meeting. 'all' keeps the headline honest; the key-stage tabs
// remain available and relabel the card when selected.
var activeLevel = 'all';

// Classes are named "<year><letter>/<subject code>" (e.g. "12B/Bs" for a
// Year 12 A-Level class, "10A/Gg" for a Year 10 GCSE class). There's no
// separate level column, so level is derived from the year-group prefix:
// Year 12-13 = A-Level, Year 7-11 = GCSE.
function classLevel(cls) {
  var m = /^(\d+)/.exec((cls && cls.name) || '');
  if (!m) return 'alevel';
  var year = parseInt(m[1], 10);
  return year >= 12 ? 'alevel' : 'gcse';
}

function switchLevel(level) {
  activeLevel = level;
  renderDashboard();
}

// 'all' means no key-stage filter at all.
function matchesLevel(level) { return activeLevel === 'all' || level === activeLevel; }
function levelLabel() { return activeLevel === 'all' ? 'School-wide' : activeLevel === 'gcse' ? 'GCSE' : 'A-Level'; }



function supaGet(table, params) { return ForgeAPI.get(table, params); }

// get_school_overview is scoped to the signed-in teacher's school, so the call
// has to carry their token. Sent with the anon key it can only ever come back
// unauthorised.
function supaRpc(fn) {
  var saved = teacherSession();
  return ForgeAPI.rpc(fn, {}, saved && saved.access_token ? { token: saved.access_token } : {});
}

// ── AUTH ─────────────────────────────────────────────────────
var TEACHER_SESSION_KEY = 'forge-teacher-session';

function teacherSession() {
  try { return JSON.parse(localStorage.getItem(TEACHER_SESSION_KEY) || 'null'); } catch (e) { return null; }
}

function renderLogin(message) {
  app.innerHTML = ForgeAuthCard.shell({
    title: 'Leadership Dashboard',
    sub: message || 'Sign in as a teacher to view cross-class analytics.',
    foot: 'Teacher access required · read-only school-wide reporting.'
  }, '<a class="auth-btn forge-u-6nfrks" href="teacher.html">Sign in to Teacher Dashboard →</a>');
}

function signOut() {
  schoolSignOut();
}

function schoolSignOut() {
  var saved = teacherSession();
  if (saved && saved.access_token && window.ForgeAPI && ForgeAPI.auth) ForgeAPI.auth.signOut(saved.access_token).catch(function() {});
  try { localStorage.removeItem(TEACHER_SESSION_KEY); } catch (e) {}
  if (window.ForgeRole) ForgeRole.clear('teacher');
  if (window.ForgeSidebar && typeof ForgeSidebar.destroy === 'function') ForgeSidebar.destroy();
  renderLogin('You have been signed out.');
}

window.forgeLogout = schoolSignOut;

function verifyTeacherAccess() {
  var saved = teacherSession();
  if (!saved || !saved.access_token) {
    if (window.ForgeSidebar && typeof ForgeSidebar.destroy === 'function') ForgeSidebar.destroy();
    renderLogin();
    return;
  }
  ForgeAPI.auth.user(saved.access_token).then(function(user) {
    if (!user || !user.id) throw new Error('Teacher session invalid');
    hdrs.Authorization = 'Bearer ' + saved.access_token;
    mountSchoolSidebar();
    renderLoading();
    loadData();
  }).catch(function() {
    localStorage.removeItem(TEACHER_SESSION_KEY);
    if (window.ForgeSidebar && typeof ForgeSidebar.destroy === 'function') ForgeSidebar.destroy();
    renderLogin('Your teacher session has expired. Please sign in again.');
  });
}

// ── ROUTING ──────────────────────────────────────────────────
verifyTeacherAccess();

function renderLoading() {
  ForgeState.loading(app, { label: 'Loading school overview', body: 'Getting the latest classes, students, and learning data ready.' });
}

// ── DATA ─────────────────────────────────────────────────────
var data = { classes: [], students: [], responses: [], schoolName: null };
// Rows for the tables renderDashboard builds that exportCSV would otherwise
// have to recompute. Kept here so the CSV can never drift from the table.
var extraExportRows = {};

function loadData() {
  supaRpc('get_school_overview').then(function(result) {
    // The RPC is scoped to the caller's school and reports refusal in the
    // payload rather than as an HTTP error. Without this branch an
    // unauthorised caller would fall through to an empty-but-normal overview,
    // which reads as "your school has no data" instead of "you can't see it".
    if (result && result.authorized === false) {
      if (result.reason === 'no_school') {
        ForgeState.empty(app, {
          label: 'No school linked to your account',
          body: 'The overview covers the school on your teacher invite. Create your account with your school\u2019s invite code to see it here.'
        });
      } else {
        renderLogin('Please sign in again to view the school overview.');
      }
      return;
    }
    // The heading used to be a hardcoded string, so every school saw another
    // school's name over its own figures. The RPC reports whose data this is.
    data.schoolName = result.school_name || null;
    data.classes   = result.classes   || [];
    data.students  = result.students  || [];
    data.responses = (result.responses || []).slice().sort(function(a, b) {
      return new Date(b.created_at) - new Date(a.created_at);
    });
    renderDashboard();
  }).catch(function() {
    var retry = ForgeState.error(app, { label: 'School data is unavailable', body: 'We couldn’t retrieve the overview. Check your connection and try again.' });
    if (retry) retry.onclick = loadData;
  });
}

// ── DASHBOARD ────────────────────────────────────────────────
function renderDashboard() {
  // Smallest group this dashboard will report on its own. Used by the
  // performance bands lower down and by the cohort comparison.
  var MIN_BAND_COHORT = 10;

  // Resolve level from the *full* unfiltered data first, so orphaned
  // responses (class_id = null) still get attributed to the right level
  // via their student's class, before we filter anything down.
  var fullStudentClassMap = {};
  data.students.forEach(function(s) { if (s.class_id) fullStudentClassMap[s.id] = s.class_id; });
  var classLevelMap = {};
  data.classes.forEach(function(c) { classLevelMap[c.id] = classLevel(c); });
  function responseLevel(r) {
    var cid = r.class_id || fullStudentClassMap[r.student_id] || null;
    return cid ? classLevelMap[cid] : null;
  }

  var classes   = data.classes.filter(function(c) { return matchesLevel(classLevel(c)); });
  var classIdSet = {}; classes.forEach(function(c) { classIdSet[c.id] = true; });
  var students  = data.students.filter(function(s) { return s.class_id && classIdSet[s.class_id]; });
  // On 'all', keep rows whose level can't be resolved rather than dropping
  // them — otherwise the school total silently undercounts.
  var responses = data.responses.filter(function(r) { return activeLevel === 'all' ? true : responseLevel(r) === activeLevel; });
  var scoredResponses=ForgeMetrics.scored(responses);

  // Aggregate stats
  var totalClasses  = classes.length;
  var totalStudents = students.length;
  var totalResponses = scoredResponses.length;
  var avgAcc = null;
  if (totalResponses > 0) {
    var correct = scoredResponses.filter(function(r) { return r.is_correct&&!r.hint_used; }).length;
    avgAcc = Math.round((correct / totalResponses) * 100);
  }

  // Last 7 days activity
  var weekAgo = new Date(); weekAgo.setDate(weekAgo.getDate() - 7);
  var recentActivityResponses = responses.filter(function(r) { return new Date(r.created_at) > weekAgo; });
  var activeStudents7d = new Set(recentActivityResponses.map(function(r) { return r.student_id; })).size;

  // Build lookup maps so orphaned responses (class_id = null) can be
  // attributed to the correct class/subject via student_id -> students -> class_id.
  var studentClassMap = {}; // student_id -> class_id
  var classSubjectMap = {}; // class_id -> subject
  students.forEach(function(s) { if (s.class_id) studentClassMap[s.id] = s.class_id; });
  classes.forEach(function(cls) { if (cls.subject) classSubjectMap[cls.id] = cls.subject; });

  // Question id / misconception tag → subject key. Mirrors teacher.html: the
  // Legacy Anvil rows log subject:'anvil' (the source page, not the subject), so without
  // this an Economics reforge is indistinguishable from a Computing one and
  // gets counted against whichever class the student happens to sit in.
  var QID_TO_SUBJECT = typeof FORGE_QUESTION_INDEX !== 'undefined' ? FORGE_QUESTION_INDEX.subjects || {} : {};
  var MC_TO_SUBJECT = typeof FORGE_QUESTION_INDEX !== 'undefined' ? FORGE_QUESTION_INDEX.misconceptionSubjects || {} : {};

  // Reforge suffixes stack (GRO-01-RF-ANVIL), so strip them repeatedly.
  function baseQuestionId(qid) {
    if (!qid) return '';
    var out = qid, prev;
    do { prev = out; out = out.replace(/-(RF|ANVIL|CHK|CRU\d*)$/, ''); } while (out !== prev);
    return out;
  }

  // The real subject a response belongs to, seeing through the 'anvil' and
  // 'crucible' placeholders. Empty string when it can't be established.
  function subjectForResponse(r) {
    var rs = (r.subject || '').toLowerCase();
    if (rs && rs !== 'anvil' && rs !== 'crucible' && rs !== 'unknown') return rs;
    return QID_TO_SUBJECT[baseQuestionId(r.question_id)]
        || MC_TO_SUBJECT[r.misconception_tag]
        || MC_TO_SUBJECT[r.bank]
        || '';
  }

  // Does this response belong to a class teaching this subject? Rows whose
  // subject can't be established are kept, matching the teacher dashboard.
  function subjectMatches(r, cls) {
    var rSubj = subjectForResponse(r);
    var clsSubj = (cls.subject || '').toLowerCase();
    return !rSubj || rSubj === clsSubj ||
      (clsSubj === 'englit' && rSubj === 'engll') ||
      (clsSubj === 'engll' && rSubj === 'englit');
  }

  // Resolve the effective class_id and subject for a response.
  // Prefers the stored class_id; falls back to the student's class if null.
  function resolveResponse(r) {
    var classId = r.class_id || studentClassMap[r.student_id] || null;
    // subjectForResponse, not r.subject: legacy rows may store the source page
    // instead of a real subject key, so reforges fell out of the subject
    // breakdown entirely instead of counting toward the subject they came from.
    var subject  = subjectForResponse(r) || (classId ? classSubjectMap[classId] : null) || null;
    return { classId: classId, subject: subject };
  }

  // Subject breakdown - counts and students come from classes (authoritative);
  // responses are attributed via resolveResponse so orphaned rows don't
  // create phantom subject entries with 0 classes / 0 students.
  var subjectMap = {};
  classes.forEach(function(cls) {
    if (!cls.subject) return;
    if (!subjectMap[cls.subject]) subjectMap[cls.subject] = { classes: 0, students: 0, responses: 0, correct: 0, mcs: {} };
    subjectMap[cls.subject].classes++;
    students.filter(function(s) { return s.class_id === cls.id; }).forEach(function() {
      subjectMap[cls.subject].students++;
    });
  });
  scoredResponses.forEach(function(r) {
    var resolved = resolveResponse(r);
    var subj = resolved.subject;
    if (!subj) return; // genuinely unattributable - skip
    // Only count against subjects that have a real class (no phantom rows)
    if (!subjectMap[subj]) return;
    subjectMap[subj].responses++;
    if (r.is_correct&&!r.hint_used) subjectMap[subj].correct++;
    var scoredTag=ForgeMisconceptions.tagForRow(r);
    if (!r.is_correct && scoredTag) {
      subjectMap[subj].mcs[scoredTag] = (subjectMap[subj].mcs[scoredTag] || 0) + 1;
    }
  });

  // School-wide misconception league table (top 10)
  var mcTotals = {};
  var mcReforgeTotals = {};   // tag -> reforge attempts
  var mcReforgeCorrect = {};  // tag -> reforge successes
  var mcSubjectTotals = {}; // tag -> { subject -> count }
  responses.forEach(function(r) {
    var tag=ForgeMisconceptions.tagForRow(r);
    if (!r.reforge_attempted && !r.is_correct && tag) {
      mcTotals[tag] = (mcTotals[tag] || 0) + 1;
      var resolved = resolveResponse(r);
      var subj = resolved.subject;
      // Exclude page-source values that aren't real subjects
      var ignoredSources = ['anvil','crucible','forge',''];
      if (subj && ignoredSources.indexOf(subj.toLowerCase()) === -1) {
        if (!mcSubjectTotals[tag]) mcSubjectTotals[tag] = {};
        mcSubjectTotals[tag][subj] = (mcSubjectTotals[tag][subj] || 0) + 1;
      }
    }
    if (r.reforge_attempted && tag) {
      mcReforgeTotals[tag] = (mcReforgeTotals[tag] || 0) + 1;
      if (r.reforge_correct) {
        mcReforgeCorrect[tag] = (mcReforgeCorrect[tag] || 0) + 1;
      }
    }
  });
  // For each tag, find the subject it fires in most often
  function topSubjectForTag(tag) {
    var subs = mcSubjectTotals[tag];
    if (!subs) return null;
    return Object.keys(subs).sort(function(a,b){ return subs[b]-subs[a]; })[0] || null;
  }
  var mcLeague = Object.keys(mcTotals).map(function(mc) {
    return {
      mc: mc,
      count: mcTotals[mc],
      reforges: mcReforgeTotals[mc] || 0,
      reforgeCorrect: mcReforgeCorrect[mc] || 0
    };
  }).sort(function(a, b) { return b.count - a.count; }).slice(0, 10);

  // Class engagement table
  var classEngagement = classes.map(function(cls) {
    var classStudents = students.filter(function(s) { return s.class_id === cls.id; });
    // Include responses logged with this class_id AND orphaned responses
    // from students in this class (class_id = null but student belongs here)
    var classStudentIds = new Set(classStudents.map(function(s) { return s.id; }));
    var classResponses = scoredResponses.filter(function(r) {
      // Only include responses that match this class's subject, resolving the
      // real subject of a reforge rather than waving all reforges through.
      if (!subjectMatches(r, cls)) return false;
      if (r.class_id === cls.id) return true;
      if (!r.class_id && classStudentIds.has(r.student_id)) return true;
      return false;
    });
    var activeIds = new Set(recentActivityResponses.filter(function(r) {
      if (!subjectMatches(r, cls)) return false;
      if (r.class_id === cls.id) return true;
      if (!r.class_id && classStudentIds.has(r.student_id)) return true;
      return false;
    }).map(function(r) { return r.student_id; }));
    var acc = 0;
    if (classResponses.length > 0) {
      acc = Math.round((classResponses.filter(function(r) { return r.is_correct&&!r.hint_used; }).length / classResponses.length) * 100);
    }
    return {
      name: cls.name || cls.code,
      code: cls.code,
      subject: cls.subject || '—',
      students: classStudents.length,
      responses: classResponses.length,
      active7d: activeIds.size,

    };
  }).sort(function(a, b) { return b.responses - a.responses; });

  // Build HTML
  var h = '';

  // Header
  h += '<div class="forge-u-7547uz">';
  h += '<div><p class="tag forge-u-l8gta7">School Overview</p>';
  h += '<h1 class="ui-stat-large">' + ForgeTeacherUI.escape(data.schoolName || 'Your school') + '</h1>';
  // The old wording was "no individual student names". Initials plus class and
  // subject are not anonymous in a small group, so state what is actually
  // shown rather than implying more protection than exists.
  h += '<p class="dash-meta">Read-only \u00b7 initials only, and individual bands hidden below 10 qualifying students \u00b7 updated live</p></div>';
  h += '<button type="button" class="signout-btn" data-forge-action="logout">Sign out</button>';
  h += '</div>';

  // Level toggle
  var alevelCount = data.classes.filter(function(c) { return classLevel(c) === 'alevel'; }).length;
  var gcseCount   = data.classes.filter(function(c) { return classLevel(c) === 'gcse'; }).length;
  h += '<div class="tabs" role="group" aria-label="Filter overview by qualification level">';
  h += '<button type="button" class="tab' + (activeLevel === 'all' ? ' active' : '') + '" data-forge-action="switch-level" data-level="all">All (' + (alevelCount + gcseCount) + ')</button>';
  h += '<button type="button" class="tab' + (activeLevel === 'alevel' ? ' active' : '') + '" data-forge-action="switch-level" data-level="alevel">A-Level (' + alevelCount + ')</button>';
  h += '<button type="button" class="tab' + (activeLevel === 'gcse' ? ' active' : '') + '" data-forge-action="switch-level" data-level="gcse">GCSE (' + gcseCount + ')</button>';
  h += '</div>';

  // Stat cards
  h += '<div class="stat-grid">';
  h += statCard(totalClasses, 'Classes in view', 'var(--white)');

  // when it isn't.
  h += statCard(avgAcc==null?'—':avgAcc + '%', levelLabel() + ' accuracy', avgAcc==null?'var(--dim)':avgAcc >= 70 ? 'var(--good)' : avgAcc >= 50 ? 'var(--hot)' : 'var(--bad)');
  h += '</div>';
  h += '<div class="stat-support"><span>' + totalStudents + ' student' + (totalStudents !== 1 ? 's' : '') + ' enrolled</span><span>' + activeStudents7d + ' active in 7 days</span><span>' + totalResponses + ' scored answer' + (totalResponses !== 1 ? 's' : '') + '</span></div>';
  h += '<p class="forge-meta">Accuracy = correct scored answers ÷ scored answers in the selected view. First answers in practice, assignments and timed practice are scored; answers to a similar question after a mistake are not. Active in 7 days means at least one recorded learning activity.</p>';

  var focusClass = classEngagement.filter(function(cls){return cls.responses>=5;}).sort(function(a, b) {

    h += '<section class="ui-recommendation" aria-labelledby="school-focus-title">';

    h += '<h2 class="ui-recommendation__title" id="school-focus-title">Start with ' + focusClass.name + '</h2>';
    h += '<p class="ui-recommendation__copy">' + focusCopy + '</p>';
    h += '<a class="ui-state-action" href="teacher.html">Open priority signals</a>';
    h += '</section>';

    h += '<p class="ui-recommendation__copy">No class in this view has five scored answers yet, so an accuracy-based priority would be unreliable. Collect more responses before comparing classes.</p>';
    h += '<a class="ui-state-action" href="teacher.html">Open classes</a></section>';

  }

  /* ── Is it working? (P3) ─────────────────────────────────────────────────

  var DAY_MS = 86400000;

  var esc = window.ForgeTeacherUI ? ForgeTeacherUI.escape : function (v) { return String(v == null ? '' : v); };
  function pct(correct, total) { return total ? Math.round((correct / total) * 100) : null; }

  // A. Momentum — scored answers and accuracy per week, most recent last.

  }
  scoredResponses.forEach(function (r) {
    var t = Date.parse(r.created_at || '');
    if (!t) return;
    for (var i = 0; i < weeks.length; i++) {
      if (t > weeks[i].start && t <= weeks[i].end) {
        weeks[i].total++;
        if (r.is_correct&&!r.hint_used) weeks[i].correct++;
        weeks[i].students[r.student_id] = true;
        break;
      }
    }
  });
  var weeksWithData = weeks.filter(function (x) { return x.total > 0; });
  var latest = weeks[weeks.length - 1];
  var priorWeeks = weeks.slice(0, -1).filter(function (x) { return x.total > 0; });
  var priorTotal = priorWeeks.reduce(function (a, x) { return a + x.total; }, 0);
  var priorCorrect = priorWeeks.reduce(function (a, x) { return a + x.correct; }, 0);
  var latestAcc = pct(latest.correct, latest.total);
  var priorAcc = pct(priorCorrect, priorTotal);
  var accDelta = (latestAcc == null || priorAcc == null) ? null : latestAcc - priorAcc;

  h += '<section class="card school-momentum" aria-labelledby="momentum-title">';
  h += '<div class="card-title" id="momentum-title">Momentum <span class="forge-u-1dueybt">· last ' + WEEKS + ' weeks, scored answers only</span></div>';
  if (!weeksWithData.length) {
    h += '<p class="ui-meta-muted">No scored answers in the last ' + WEEKS + ' weeks, so there is no trend to show yet.</p>';
  } else {
    var peak = Math.max.apply(null, weeks.map(function (x) { return x.total; })) || 1;
    h += '<p class="school-momentum__lead">This week: <b>' + latest.total + '</b> scored answer' + (latest.total !== 1 ? 's' : '')
      + ' from <b>' + Object.keys(latest.students).length + '</b> student' + (Object.keys(latest.students).length !== 1 ? 's' : '')
      + ', accuracy <b>' + showPct(latestAcc) + '</b>'
      + (accDelta == null ? ' (no earlier weeks to compare)'
          : ' — <span class="' + (accDelta > 0 ? 'forge-text-good' : accDelta < 0 ? 'forge-text-bad' : '') + '">'
            + (accDelta > 0 ? '+' : '') + accDelta + ' point' + (Math.abs(accDelta) !== 1 ? 's' : '') + ' on the previous ' + priorWeeks.length + ' week' + (priorWeeks.length !== 1 ? 's' : '') + '</span>')
      + '.</p>';
    h += '<ol class="school-weeks">';
    weeks.forEach(function (x) {
      var label = new Date(x.end - DAY_MS).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
      var a = pct(x.correct, x.total);
      h += '<li><span class="school-weeks__label">w/e ' + esc(label) + '</span>'
        + '<span class="school-weeks__bar" role="img" aria-label="' + x.total + ' scored answers">'
        + '<span class="school-weeks__fill" style="--scale:' + Math.round((x.total / peak) * 100) + '%"></span></span>'
        + '<span class="school-weeks__n">' + x.total + '</span>'
        + '<span class="school-weeks__acc">' + showPct(a) + '</span></li>';
    });
    h += '</ol>';
  }
  h += '</section>';

  // B. Adoption — a class that stopped is invisible in an accuracy table.
  var lastByClass = {};
  var recent14ByClass = {};
  scoredResponses.forEach(function (r) {
    var cid = r.class_id || studentClassMap[r.student_id];
    if (!cid) return;
    var t = Date.parse(r.created_at || '');
    if (!t) return;
    if (!lastByClass[cid] || t > lastByClass[cid]) lastByClass[cid] = t;
    if (t > now - (14 * DAY_MS)) recent14ByClass[cid] = (recent14ByClass[cid] || 0) + 1;
  });
  var adoption = classes.map(function (c) {
    var last = lastByClass[c.id] || null;
    var days = last ? Math.floor((now - last) / DAY_MS) : null;
    var state = last == null ? 'never' : days <= 7 ? 'active' : days <= 14 ? 'slowing' : 'dormant';
    return { cls: c, last: last, days: days, recent: recent14ByClass[c.id] || 0, state: state };
  }).sort(function (a, b) {
    var rank = { never: 0, dormant: 1, slowing: 2, active: 3 };
    if (rank[a.state] !== rank[b.state]) return rank[a.state] - rank[b.state];
    return (b.last || 0) - (a.last || 0);
  });
  var stalled = adoption.filter(function (x) { return x.state === 'never' || x.state === 'dormant'; });
  var stateLabel = { never: 'Never started', dormant: 'Dormant', slowing: 'Slowing', active: 'Active' };

  h += '<section class="card school-adoption" aria-labelledby="adoption-title">';
  h += '<div class="card-title" id="adoption-title">Adoption <span class="forge-u-1dueybt">· needs attention first</span>'
    + ' <button type="button" class="export-btn" data-forge-action="export-csv" data-tab="adoption">Export CSV</button></div>';
  h += '<p class="school-adoption__lead">' + (stalled.length
    ? '<b>' + stalled.length + '</b> of <b>' + adoption.length + '</b> class' + (adoption.length !== 1 ? 'es' : '') + ' have recorded nothing in the last fortnight.'
    : 'Every class has recorded work in the last fortnight.') + '</p>';
  h += '<div class="table-scroll"><table class="overview-table"><thead><tr><th>Class</th><th>Teacher</th><th>Status</th><th>Last answer</th><th>Answers (14d)</th></tr></thead><tbody>';
  adoption.forEach(function (x) {
    h += '<tr><td>' + esc(x.cls.name || x.cls.code) + '</td>'
      + '<td>' + esc(x.cls.teacher_name || '—') + '</td>'
      + '<td><span class="adoption-pill adoption-pill--' + x.state + '">' + stateLabel[x.state] + '</span></td>'
      + '<td>' + (x.days == null ? 'never' : x.days === 0 ? 'today' : x.days + ' day' + (x.days !== 1 ? 's' : '') + ' ago') + '</td>'
      + '<td>' + x.recent + '</td></tr>';
  });
  h += '</tbody></table></div></section>';
  extraExportRows.adoption = [['Class','Teacher','Status','Days since last answer','Answers last 14 days']].concat(
    adoption.map(function (x) {
      return [x.cls.name || x.cls.code, x.cls.teacher_name || '', stateLabel[x.state], x.days == null ? 'never' : x.days, x.recent];
    }));

  // C. Grouping — schools are run by year group and by teacher, not by class id.
  function groupRows(keyOf) {
    var map = {};
    classes.forEach(function (c) {
      var key = keyOf(c);
      if (!key) return;
      if (!map[key]) map[key] = { key: key, classes: 0, students: 0, total: 0, correct: 0 };
      map[key].classes++;
    });
    students.forEach(function (st) {
      var c = classes.find(function (x) { return x.id === st.class_id; });
      var key = c && keyOf(c);
      if (key && map[key]) map[key].students++;
    });
    scoredResponses.forEach(function (r) {
      var cid = r.class_id || studentClassMap[r.student_id];
      var c = cid && classes.find(function (x) { return x.id === cid; });
      var key = c && keyOf(c);
      if (!key || !map[key]) return;
      map[key].total++;
      if (r.is_correct&&!r.hint_used) map[key].correct++;
    });
    return Object.keys(map).map(function (k) { return map[k]; }).sort(function (a, b) {

      if (bb == null) return -1;

    });
  }

    out += '<div class="card-title">' + esc(title) + ' <span class="forge-u-1dueybt">· weakest first</span>'

    out += '<div class="table-scroll"><table class="overview-table"><thead><tr><th>' + esc(firstHeading) + '</th><th>Classes</th><th>Students</th><th>Scored answers</th><th>Accuracy</th></tr></thead><tbody>';
    rows.forEach(function (r) {
      var a = pct(r.correct, r.total);
      out += '<tr><td>' + esc(r.key) + '</td><td>' + r.classes + '</td><td>' + r.students + '</td><td>' + r.total + '</td>'

    });

  }
  h += groupTable('By year group', byYear, 'Year group', 'years');
  h += groupTable('By teacher', byTeacher, 'Teacher', 'teachers');
  function groupExport(heading, rows) {
    return [[heading,'Classes','Students','Scored answers','Accuracy']].concat(rows.map(function (r) {
      var a = pct(r.correct, r.total);
      return [r.key, r.classes, r.students, r.total, a == null ? '' : a + '%'];

  }
  extraExportRows.years = groupExport('Year group', byYear);
  extraExportRows.teachers = groupExport('Teacher', byTeacher);

  // D. Access arrangements. Forge records extra time per pupil; it does not
  // hold pupil premium, SEND or EAL, so those splits are not available here
  // without collecting them first.
  var cohorts = { extra: { label: 'With extra time', students: 0, total: 0, correct: 0 },
                  standard: { label: 'Standard time', students: 0, total: 0, correct: 0 } };
  var cohortOf = {};
  students.forEach(function (st) {
    var key = (Number(st.extra_time) > 0) ? 'extra' : 'standard';
    cohortOf[st.id] = key;
    cohorts[key].students++;
  });
  scoredResponses.forEach(function (r) {
    var key = cohortOf[r.student_id];
    if (!key) return;
    cohorts[key].total++;
    if (r.is_correct&&!r.hint_used) cohorts[key].correct++;
  });
  h += '<section class="card school-cohort" aria-labelledby="cohort-title">';
  h += '<div class="card-title" id="cohort-title">Access arrangements <span class="forge-u-1dueybt">· extra time vs standard</span></div>';
  if (cohorts.extra.students < MIN_BAND_COHORT) {
    h += '<p class="ui-meta-muted">Withheld until at least ' + MIN_BAND_COHORT + ' students in this view have extra time recorded — '
      + 'with fewer, the comparison identifies them. Currently ' + cohorts.extra.students + '.</p>';
  } else {
    h += '<div class="table-scroll"><table class="overview-table"><thead><tr><th>Cohort</th><th>Students</th><th>Scored answers</th><th>Accuracy</th></tr></thead><tbody>';
    ['extra', 'standard'].forEach(function (key) {
      var c = cohorts[key];

    h += '</tbody></table></div>';
  }
  h += '<p class="ui-meta-muted">Pupil premium, SEND and EAL are not shown: Forge does not record them.</p>';
  h += '</section>';

  // Detail views are deliberately secondary to the leadership focus above.
  h += '<details class="tab-more school-detail-views"' + (activeTab !== 'subjects' ? ' open' : '') + '>';

function wireSortableTables() {
  app.querySelectorAll('#tab-subjects table, #tab-classes table, #tab-misconceptions table, #tab-performance table, #tab-spec table').forEach(function(table) {
    var headers = table.querySelectorAll('thead th');
    Array.prototype.forEach.call(headers, function(th, index) {
      var label = th.textContent.trim() || 'Value';
      var button = document.createElement('button');
      button.type = 'button';
      button.className = 'table-sort-button';
      button.setAttribute('aria-label', 'Sort by ' + label);
      button.setAttribute('aria-sort', 'none');
      button.innerHTML = '<span>' + label + '</span><span class="table-sort-icon" aria-hidden="true">↕</span>';
      th.textContent = '';
      th.appendChild(button);
      button.addEventListener('click', function() {
        var ascending = button.getAttribute('aria-sort') !== 'ascending';
        Array.prototype.forEach.call(headers, function(other) {
          var otherButton = other.querySelector('.table-sort-button');
          if (otherButton) { otherButton.setAttribute('aria-sort', 'none'); otherButton.querySelector('.table-sort-icon').textContent = '↕'; }
        });
        button.setAttribute('aria-sort', ascending ? 'ascending' : 'descending');
        button.querySelector('.table-sort-icon').textContent = ascending ? '↑' : '↓';
        var rows = Array.prototype.slice.call(table.querySelectorAll('tbody tr'));
        rows.sort(function(a, b) {
          var aCell = a.cells[index], bCell = b.cells[index];
          var aBar = aCell && aCell.querySelector('.heat-fill'), bBar = bCell && bCell.querySelector('.heat-fill');
          var aText = aCell ? aCell.textContent.trim() : '', bText = bCell ? bCell.textContent.trim() : '';
          var aValue = aBar ? parseFloat(aBar.style.width) : parseFloat((aText.match(/-?\d+(?:\.\d+)?/) || [])[0]);
          var bValue = bBar ? parseFloat(bBar.style.width) : parseFloat((bText.match(/-?\d+(?:\.\d+)?/) || [])[0]);
          var result = !isNaN(aValue) && !isNaN(bValue) ? aValue - bValue : !isNaN(aValue) ? -1 : !isNaN(bValue) ? 1 : aText.localeCompare(bText, undefined, {numeric:true, sensitivity:'base'});
          return (ascending ? 1 : -1) * result;
        });
        rows.forEach(function(row) { table.tBodies[0].appendChild(row); });
      });
    });
  });
}

function statCard(val, label, col) {
  return '<div class="stat-card"><span class="stat-n" style="color:' + col + '">' + val + '</span><span class="stat-l">' + label + '</span></div>';
}

window.switchTab = function(tab, selectedButton) {
  activeTab = tab;
  ['subjects','classes','misconceptions','performance','spec'].forEach(function(t) {
    var el = document.getElementById('tab-' + t);
    if (el) el.hidden = t !== tab;
  });
  document.querySelectorAll('.school-detail-views [role="tab"]').forEach(function(btn) {
    var selected=btn===selectedButton||btn.dataset.tab===tab;
    btn.classList.toggle('active',selected);btn.setAttribute('aria-selected',String(selected));btn.tabIndex=selected?0:-1;
  });
};

// ── EXPORT ───────────────────────────────────────────────────
window.exportCSV = function(type) {
  var rows = [];
  // Shared lookup maps (same logic as renderDashboard)
  var studentClassMapExp = {};
  var classSubjectMapExp = {};
  data.students.forEach(function(s) { if (s.class_id) studentClassMapExp[s.id] = s.class_id; });
  data.classes.forEach(function(cls) { if (cls.subject) classSubjectMapExp[cls.id] = cls.subject; });
  function resolveExp(r) {
    var classId = r.class_id || studentClassMapExp[r.student_id] || null;
    var subject  = r.subject  || (classId ? classSubjectMapExp[classId] : null) || null;
    return { classId: classId, subject: subject };
  }
  var exportClasses=data.classes.filter(function(cls){return matchesLevel(classLevel(cls));});
  var exportClassIds=new Set(exportClasses.map(function(cls){return cls.id;}));
  var exportStudents=data.students.filter(function(student){return student.class_id&&exportClassIds.has(student.class_id);});
  var exportResponses=data.responses.filter(function(r){
    if(activeLevel==='all') return true;
    var resolved=resolveExp(r);
    return resolved.classId&&exportClassIds.has(resolved.classId);
  });
  var exportScored=ForgeMetrics.scored(exportResponses);

  if (extraExportRows[type]) {
    rows = extraExportRows[type];
  } else if (type === 'subjects') {
    rows.push(['Subject','Classes','Students','Scored answers','Accuracy','Top misconception']);
    var subjectMap = {};
    exportClasses.forEach(function(cls) {
      if (!cls.subject) return;
      if (!subjectMap[cls.subject]) subjectMap[cls.subject] = { classes:0, students:0, responses:0, correct:0, mcs:{} };
      subjectMap[cls.subject].classes++;
      exportStudents.filter(function(s){return s.class_id===cls.id;}).forEach(function(){subjectMap[cls.subject].students++;});
    });
    exportScored.forEach(function(r) {
      var resolved = resolveExp(r);
      var subj = resolved.subject;
      if (!subj || !subjectMap[subj]) return;
      subjectMap[subj].responses++;
      if (r.is_correct&&!r.hint_used) subjectMap[subj].correct++;
      var tag=ForgeMisconceptions.tagForRow(r);
      if (!r.is_correct && tag) subjectMap[subj].mcs[tag] = (subjectMap[subj].mcs[tag]||0)+1;
    });
    Object.keys(subjectMap).sort().forEach(function(s) {
      var sm = subjectMap[s];
      var acc = sm.responses > 0 ? Math.round((sm.correct/sm.responses)*100) : 0;
      var topMC = Object.keys(sm.mcs).sort(function(a,b){return sm.mcs[b]-sm.mcs[a];})[0] || '';
      rows.push([s, sm.classes, sm.students, sm.responses, acc+'%', topMC]);
    });
  } else if (type === 'classes') {
    rows.push(['Class','Subject','Students','Scored answers','Active last 7d','Accuracy']);
    var weekAgo = new Date(); weekAgo.setDate(weekAgo.getDate()-7);
    exportClasses.forEach(function(cls) {
      var cs = exportStudents.filter(function(s){return s.class_id===cls.id;});
      var csIds = new Set(cs.map(function(s){return s.id;}));
      var cr = exportScored.filter(function(r){
        return r.class_id===cls.id || (!r.class_id && csIds.has(r.student_id));
      });
      var activeIds = new Set(exportResponses.filter(function(r){
        return (r.class_id===cls.id||(!r.class_id&&csIds.has(r.student_id)))&&new Date(r.created_at)>weekAgo;
      }).map(function(r){return r.student_id;}));
      var acc = cr.length>0?Math.round((cr.filter(function(r){return r.is_correct&&!r.hint_used;}).length/cr.length)*100):0;
      rows.push([cls.name||cls.code, cls.subject||'', cs.length, cr.length, activeIds.size, acc+'%']);
    });
  } else if (type === 'misconceptions') {
    rows.push(['Rank','Tag','Description','Errors','Similar-question attempts','Similar-question correct','Similar-question %']);
    var mcTotalsExp = {};
    var mcReforgesExp = {};
    var mcReforgeCorrectExp = {};
    exportResponses.forEach(function(r){
      var tag=ForgeMisconceptions.tagForRow(r);
      if(!r.reforge_attempted&&!r.is_correct&&tag) mcTotalsExp[tag]=(mcTotalsExp[tag]||0)+1;
      if(r.reforge_attempted&&tag){
        mcReforgesExp[tag]=(mcReforgesExp[tag]||0)+1;
        if(r.reforge_correct) mcReforgeCorrectExp[tag]=(mcReforgeCorrectExp[tag]||0)+1;
      }
    });
    Object.keys(mcTotalsExp).sort(function(a,b){return mcTotalsExp[b]-mcTotalsExp[a];}).slice(0,20).forEach(function(mc,i){
      var att = mcReforgesExp[mc]||0;
      var corr = mcReforgeCorrectExp[mc]||0;
      var pct = att>0?Math.round((corr/att)*100)+'%':'—';
      rows.push([i+1, mc, resolveMCLabel(mc)||'', mcTotalsExp[mc], att, corr, pct]);
    });
  }

  var csv = rows.map(function(row){return row.map(function(cell){return '"'+String(cell).replace(/"/g,'""')+'"';}).join(',');}).join('\n');
  var blob = new Blob([csv], {type:'text/csv'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'forge-' + type + '-' + new Date().toISOString().slice(0,10) + '.csv';
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  setTimeout(function() {
    a.remove();
    URL.revokeObjectURL(url);
  }, 1000);
};
