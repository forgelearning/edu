<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--coal);color:var(--slate);font-family:'Inter',sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh}
h1,h2,h3{font-family:'Sora',sans-serif;color:var(--white);line-height:1.1;letter-spacing:-.015em}
.mono{font-family:'JetBrains Mono',monospace}
.wrap{max-width:680px;margin:0 auto;padding:28px 20px}
.tag{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ember)}
.logo{font-family:'Sora',sans-serif;font-weight:800;font-size:20px;color:var(--white);text-decoration:none;display:inline-flex;align-items:center;gap:8px;margin-bottom:0}
.logo .spark{width:9px;height:9px;background:var(--ember);border-radius:var(--radius-xs);transform:rotate(45deg);box-shadow:0 0 10px rgba(255,107,44,.7)}
.subject-list{display:flex;flex-direction:column;gap:12px;margin-top:28px}
.subject-btn{padding:20px 22px;border-radius:var(--radius-md);border:2px solid transparent;background:var(--panel);cursor:pointer;text-align:left;font-family:'Inter',sans-serif;transition:border-color .15s}
.subject-btn:hover{border-color:var(--ember)}
.subject-btn h3{font-size:18px;margin-bottom:2px}
.subject-btn .sub{font-size:13px;color:var(--slate)}
.subject-btn .count{font-size:12px;color:#8A857E;margin-top:3px}
.back-btn{background:none;border:none;cursor:pointer;font-size:13px;color:#8A857E;font-family:'Inter',sans-serif;margin-bottom:16px;padding:0}
.back-btn:hover{color:var(--white)}
.bank-list{display:flex;flex-direction:column;gap:8px;margin-top:20px}
.bank-btn{padding:14px 18px;border-radius:var(--radius-md);border:1.5px solid var(--line);background:var(--panel);cursor:pointer;text-align:left;font-family:'Inter',sans-serif;transition:border-color .15s}
.bank-btn:hover{border-color:var(--ember)}
.bank-btn .code{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.bank-btn .name{font-size:16px;font-weight:700;color:var(--white);margin-top:1px}
.bank-btn .qcount{font-size:12px;color:#8A857E;margin-top:1px}
.progress-bar{height:3px;background:var(--line);border-radius:var(--radius-xs);margin-bottom:24px}
.progress-fill{height:3px;border-radius:var(--radius-xs);transition:width .3s}
.quiz-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;font-size:13px;color:#8A857E}
.quiz-header .bank-name{font-weight:700;font-size:14px}
.q-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:13px;color:#8A857E}
.q-id{font-weight:600;padding:2px 10px;border-radius:var(--radius-xs);font-size:12px}
.stem{font-size:16px;line-height:1.55;color:var(--white);margin-bottom:20px}
.options{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:var(--radius-md);border:1.5px solid var(--line);background:var(--panel-2);color:var(--white);cursor:pointer;text-align:left;font-family:'Inter',sans-serif;font-size:15px;line-height:1.45;transition:border-color .15s,background .15s,opacity .15s;width:100%}
.opt:hover:not(.answered){border-color:var(--ember)}
.opt .letter{font-weight:700;min-width:20px;color:#8A857E}
.opt.answered{cursor:default}
.opt.correct{border-color:var(--good);background:rgba(127,217,138,.08);opacity:1}
.opt.correct .letter{color:var(--good)}
.opt.wrong{border-color:var(--bad);background:rgba(255,90,90,.07);opacity:1}
.opt.wrong .letter{color:var(--bad)}
.opt.dimmed{opacity:.5}
.fb-sentence{font-size:16px;line-height:2.6;color:var(--white)}
.fb-blank{display:inline-block;min-width:100px;padding:3px 10px;margin:2px 3px;border-radius:var(--radius-sm);border:1.5px dashed var(--line);background:var(--panel-2);text-align:center;cursor:pointer;font-weight:600;color:#8A857E;vertical-align:middle;transition:border-color .15s,background .15s}
.fb-blank:hover:not(.locked){border-color:var(--ember)}
.fb-blank.filled{border-style:solid;border-color:var(--ember);color:var(--white);background:rgba(255,107,44,.08)}
.fb-blank.correct{border-style:solid;border-color:var(--good);background:rgba(127,217,138,.08);color:var(--good)}
.fb-blank.wrong{border-style:solid;border-color:var(--bad);background:rgba(255,90,90,.07);color:var(--bad)}
.fb-blank.locked{cursor:default}
.fb-wordbank{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}
.fb-word{padding:8px 16px;border-radius:var(--radius-sm);border:1.5px solid var(--line);background:var(--panel-2);color:var(--white);cursor:pointer;font-family:'Inter',sans-serif;font-size:14px;font-weight:600;transition:border-color .15s,opacity .15s}
.fb-word:hover:not(.used){border-color:var(--ember)}
.fb-word.used{opacity:.25;pointer-events:none}
.fb-check-btn{margin-top:20px;padding:10px 24px;border-radius:var(--radius-sm);background:var(--white);color:var(--coal);border:none;cursor:pointer;font-weight:600;font-size:14px;font-family:'Inter',sans-serif;opacity:.4;pointer-events:none}
.fb-check-btn.ready{opacity:1;pointer-events:auto}
.scaffold-box{margin-top:16px;padding:14px 16px;border-radius:var(--radius-md);border:1px solid rgba(255,201,60,.4);background:rgba(255,107,44,.075);animation:heat .5s ease}
@keyframes heat{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.scaffold-box .stag{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--coal);background:var(--hot);padding:2px 8px;border-radius:var(--radius-xs);font-weight:600;margin-bottom:8px}
.scaffold-box p{font-size:14px;color:var(--white);line-height:1.5}
.praise-box{margin-top:16px;padding:14px 16px;border-radius:var(--radius-md);border:1px solid var(--good);background:rgba(127,217,138,.08);color:var(--good);font-weight:600;font-size:14px}
.reforge-trigger{margin-top:14px;padding:10px 20px;border-radius:var(--radius-sm);background:var(--ember);color:var(--coal);border:none;cursor:pointer;font-weight:600;font-size:14px;font-family:'Inter',sans-serif}
.reforge-box{margin-top:20px;padding:18px 16px;border-radius:var(--radius-md);border:1.5px solid var(--line);background:var(--panel)}
.reforge-box .rf-tag{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.reforge-box .rf-stem{font-size:15px;line-height:1.5;color:var(--white);margin-bottom:14px}
.reforge-box .opt{font-size:14px;padding:10px 12px;border-radius:var(--radius-sm)}
.rf-scaffold{margin-top:12px;padding:12px 14px;border-radius:var(--radius-sm);border:1px solid rgba(255,201,60,.4);background:rgba(255,107,44,.06);font-size:13px;line-height:1.5}
.rf-scaffold .stag{font-size:10px;margin-bottom:6px;display:inline-block;font-family:'JetBrains Mono',monospace;color:var(--coal);background:var(--hot);padding:2px 6px;border-radius:var(--radius-xs);font-weight:600}
.rf-scaffold p{color:var(--white);font-size:13px}
.next-btn{margin-top:18px;padding:10px 24px;border-radius:var(--radius-sm);background:var(--white);color:var(--coal);border:none;cursor:pointer;font-weight:600;font-size:14px;font-family:'Inter',sans-serif;float:right}
.clear{clear:both}
.results{text-align:center;padding-top:80px}
.results .pct{font-size:72px;font-weight:900;font-family:'Sora',sans-serif}
.results .detail{font-size:17px;color:#8A857E;margin:4px 0 28px}
.results .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.results .btns button{padding:10px 20px;border-radius:var(--radius-sm);border:none;cursor:pointer;font-weight:600;font-size:14px;font-family:'Inter',sans-serif}
.btn-primary{background:var(--ember);color:var(--coal)}
.btn-secondary{background:var(--panel);color:var(--white);border:1px solid var(--line)!important}
.center{text-align:center}
.hidden{display:none}
/* join screen */
.join-input{width:100%;padding:12px 14px;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--panel);color:var(--white);font-family:'Inter',sans-serif;font-size:15px;margin-bottom:14px}
.join-input::placeholder{color:#7A756E}
.join-input:focus{outline:none;border-color:var(--ember)}
.join-btn{width:100%;padding:13px;border-radius:var(--radius-sm);background:var(--ember);color:var(--coal);border:none;font-family:'Inter',sans-serif;font-weight:600;font-size:15px;cursor:pointer}
.join-btn:hover{background:var(--hot)}
.join-btn:disabled{opacity:.5;cursor:wait}
.skip-btn{background:none;border:none;color:var(--slate);font-size:13px;margin-top:16px;cursor:pointer;width:100%;text-align:center;font-family:'Inter',sans-serif}
.skip-btn:hover{color:var(--white)}
.join-err{color:var(--bad);font-size:13px;margin-top:10px;display:none}

/* free tier limit wall */

var supa = {
  _headers: function() {
    return {
      'Content-Type': 'application/json',
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Prefer': 'return=representation'
    };
  },
  _configured: function() {
    return SUPABASE_URL.indexOf('YOUR-PROJECT') === -1;
  },
  // Writes only — never asks for the row back. anon may insert into
  // responses but has no SELECT policy on it, so requesting the inserted row
  // fails the whole request (42501) and silently writes nothing. Anything
  // needing the new row's id goes through an RPC instead.
  insert: function(table, row) {
    if (!this._configured()) return Promise.resolve(null);
    return fetch(SUPABASE_URL + '/rest/v1/' + table, {
      method: 'POST',
      headers: Object.assign(this._headers(), { 'Prefer': 'return=minimal' }),
      body: JSON.stringify(row)
    }).then(function(r) {
      if (!r.ok) return r.text().then(function(t) { console.error('insert into ' + table + ' failed:', r.status, t); return null; });
      return null;
    }).catch(function(e) { console.error('insert into ' + table + ' failed:', e); return null; });
  },
  select: function(table, filters) {
    if (!this._configured()) return Promise.resolve([]);
    var params = ['select=*'];
    if (filters) {
      for (var k in filters) { params.push(k + '=eq.' + filters[k]); }
    }
    return fetch(SUPABASE_URL + '/rest/v1/' + table + '?' + params.join('&'), {
      headers: this._headers()
    }).then(function(r) { return r.json(); }).catch(function() { return []; });
  },
  // responses has no anon SELECT policy — a returning (cached) session must
  // go through this RPC (same one used at login) rather than a direct table
  // read, or it silently gets back zero rows instead of an error.
  ownResponses: function(studentId, code, name) {
    if (!this._configured()) return Promise.resolve([]);
    return fetch(SUPABASE_URL + '/rest/v1/rpc/get_student_own_responses', {
      method: 'POST',
      headers: this._headers(),
      body: JSON.stringify({ p_student_id: studentId, p_code: code, p_name: name })
    }).then(function(r) { return r.json(); }).catch(function() { return []; });
  }
};

function logResponse(q, selectedKey, isCorrect, isReforge, reforgeCorrect) {
  if (!state.studentId) return;
  var row = {
    student_id: state.studentId,
    class_id: state.classId,
    question_id: isReforge ? q.id + '-RF' : q.id,
    bank: state.bank,
    subject: getSubjectForBank(state.bank),
    selected_option: selectedKey,
    is_correct: isCorrect,
    misconception_tag: isCorrect ? null : (q.tag || null),
    // Fall back to the tag map: most banks carry a tag but no explicit spec, and
    // without this correct answers logged no spec point at all.
    spec_point: q.spec || MC_TO_SPEC[q.tag] || null,
    reforge_attempted: isReforge || false,
    reforge_correct: isReforge ? reforgeCorrect : null
  };
  // Use auth token for trial/paid students so RLS policies pass correctly
  var token = (state.isPaid || state.isTrial) ? ForgeAuth.accessToken() : null;
  if (token) {
    fetch(SUPABASE_URL + '/rest/v1/responses', {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + token,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify(row)
    }).catch(function(e) { console.error('logResponse failed:', e); });
  } else {
    supa.insert('responses', row);
  }
}

<script>

function shuffle(a){var b=[...a];for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}

var state = {
  subject: null, bank: null, questions: [], idx: 0, score: 0,
  phase: 'join',
  studentId: null,
  classId: null,
  studentName: null,
  classSubject: null,  // locked subject from class code
  isPaid: false,
  isTrial: false,
  trialDaysLeft: 0,
  paidSubjects: [],
  weightMap: {}        // spaced repetition: questionId → priority weight
};
var requestedBank = new URLSearchParams(location.search).get('bank');

// ── JOINING A CLASS ───────────────────────────────────────────
// Each class the student joins gets its own `students` row, so their answers
// in that subject are attributed to that class — and therefore to the teacher
// who handed out the code. Re-entering a code they've already used reuses the
// existing row instead of creating a duplicate.
// cb(err, {cls, studentId}).
function joinClassByCode(name, code, cb) {
  // One call: finds or creates this student's row for the class and returns
  // its id. A direct insert can't do this — anon may write to students but
  // can't read it back, so asking for the row returned fails the whole
  // request and silently creates nothing.
  fetch(SUPABASE_URL + '/rest/v1/rpc/join_class_as_student', {
    method: 'POST',
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ p_code: code, p_name: name })
  }).then(function(r) { return r.json(); }).then(function(rows) {
    if (!Array.isArray(rows) || rows.length === 0 || !rows[0].student_id) {
      cb('Class code not found. Check with your teacher.');
      return;
    }
    var row = rows[0];
    var cls = { id: row.class_id, name: row.class_name, subject: row.subject };

    ForgeClasses.add({
      classId: cls.id, classCode: code, className: cls.name || null,
      subject: cls.subject || null, studentId: row.student_id, studentName: name
    });

    // Tie this class to one the student already holds a code for, so both
    // follow them onto any other device. Linking needs two codes, which is
    // exactly what the student has just demonstrated.
    //
    // The class they're actively working in is the natural anchor, but its
    // cached code can be missing: syncFromServer only knows the code of the
    // class signed in with, so every other class it restores has none. Any
    // other cached class with a code proves the same thing and links into the
    // same group, so fall back to that rather than silently skipping the link
    // — an unlinked row keeps its answers to itself, and the student's history
    // looks reset the next time they sign in with this code.
    var anchor = null;
    if (state.studentId && state.classId !== cls.id) {
      var coded = ForgeClasses.list().filter(function(c){
        return c.classCode && c.studentId && c.studentId !== row.student_id;
      });
      anchor = coded.filter(function(c){ return c.studentId === state.studentId; })[0] || coded[0] || null;
    }
    if (anchor) {
      ForgeClasses.linkToServer(SUPABASE_URL, SUPABASE_KEY, anchor,
        { studentId: row.student_id, classCode: code }, function() {
          cb(null, { cls: cls, studentId: row.student_id });
        });
      return;
    }
    cb(null, { cls: cls, studentId: row.student_id });
  }).catch(function() { cb('Connection error. Try again.'); });
}

// Point state at a given class — used when the student picks a subject, so
// their answers land against that class's student row.
function activateClass(entry) {
  if (!entry) return;
  state.classId      = entry.classId;
  state.studentId    = entry.studentId;
  state.classSubject = entry.subject || null;
  if (entry.studentName) state.studentName = entry.studentName;
  try {
    localStorage.setItem('forge-student', JSON.stringify({
      studentId: entry.studentId, classId: entry.classId, classCode: entry.classCode,
      studentName: state.studentName, classSubject: entry.subject || null
    }));
  } catch(e) {}
}

// Another teacher hands out another code — students add it here rather than
// signing out and back in. Rendered on both the subject picker and the bank
// list, because a student with a single class is taken straight past the
// picker and would otherwise have no way to reach this.
function joinMoreHtml() {
  if (!state.classId && ForgeClasses.subjects(SUBJECTS).length === 0) return '';
  var h = '<div id="join-more" style="margin-top:18px;border:1px solid var(--line);border-radius:var(--radius-md);padding:14px 16px">';
  h += '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px">';
  h += '<span style="font-size:13px;color:var(--slate)">Got a code for another class?</span>';
  h += '<button id="jm-toggle" style="background:none;border:none;color:var(--ember);font-size:12px;font-weight:600;cursor:pointer;font-family:Inter,sans-serif;white-space:nowrap">Join another class ↓</button>';
  h += '</div>';
  h += '<div id="jm-form" style="display:none;margin-top:12px">';
  h += '<input id="jm-code" class="join-input" type="text" placeholder="e.g. LH-RVN9" style="text-transform:uppercase;margin-bottom:8px">';
  h += '<button id="jm-btn" class="join-btn btn-glass btn-ember" style="padding:10px">Join class →</button>';
  h += '<p class="join-err" id="jm-err"></p>';
  h += '</div></div>';
  return h;
}

function wireJoinMore() {
  var toggle = document.getElementById('jm-toggle');
  if (!toggle) return;
  toggle.onclick = function() {
    var f = document.getElementById('jm-form');
    f.style.display = f.style.display === 'none' ? 'block' : 'none';
    if (f.style.display === 'block') document.getElementById('jm-code').focus();
  };
  document.getElementById('jm-btn').onclick = function() {
    var code = document.getElementById('jm-code').value.trim().toUpperCase();
    var err  = document.getElementById('jm-err');
    var btn  = document.getElementById('jm-btn');
    err.style.display = 'none';
    if (!code) { err.textContent = 'Enter your class code.'; err.style.display = 'block'; return; }
    btn.disabled = true; btn.textContent = 'Joining…';
    joinClassByCode(state.studentName, code, function(joinErr, res) {
      btn.disabled = false; btn.textContent = 'Join class →';
      if (joinErr) { err.textContent = joinErr; err.style.display = 'block'; return; }
      if (!res.cls.subject || !SUBJECTS[res.cls.subject]) {
        err.textContent = 'Joined ' + (res.cls.name || code) + ', but that subject has no questions yet.';
        err.style.display = 'block';
        return;
      }
      // Land on the picker so the newly added subject is visible.
      state.phase = 'subjects';
      render();
    });
  };
}

// ── FREE TIER DAILY LIMIT ─────────────────────────────────────
var FREE_DAILY_LIMIT = 10;
var DAILY_KEY = 'forge-daily-' + new Date().toISOString().slice(0,10); // resets at midnight

function getDailyCount() {
  try { return parseInt(localStorage.getItem(DAILY_KEY) || '0', 10); } catch(e) { return 0; }
}

function incrementDailyCount() {
  try { localStorage.setItem(DAILY_KEY, getDailyCount() + 1); } catch(e) {}
}

function isFreeTier() {
  // Paid, trial, and class-joined students all get unlimited questions
  return !state.isPaid && !state.isTrial && !state.classId;
}

function isAtDailyLimit() {
  return isFreeTier() && getDailyCount() >= FREE_DAILY_LIMIT;
}

function secondsUntilMidnight() {
  var now = new Date();
  var midnight = new Date(now);
  midnight.setHours(24, 0, 0, 0);
  return Math.floor((midnight - now) / 1000);
}

function formatCountdown(secs) {
  var h = Math.floor(secs / 3600);
  var m = Math.floor((secs % 3600) / 60);
  var s = secs % 60;
  return (h > 0 ? h + 'h ' : '') + (m > 0 ? m + 'm ' : '') + s + 's';
}

// ── FREE STUDENT PERSISTENCE ──────────────────────────────────
// ── PAID/TRIAL STUDENT ID ─────────────────────────────────────
// Trial/paid students need a students table row to log responses.
// We create one on first quiz start and cache it in localStorage.

function ensurePaidStudentId() {
  if (state.studentId) return Promise.resolve(state.studentId);
  if (!state.isPaid && !state.isTrial) return Promise.resolve(null);

  // Check localStorage cache first
  var cached = null;
  try { cached = JSON.parse(localStorage.getItem('forge-paid-student') || 'null'); } catch(e) {}
  if (cached && cached.studentId && cached.name === state.studentName) {
    state.studentId = cached.studentId;
    return Promise.resolve(state.studentId);
  }

  var authUser = ForgeAuth.currentUser();
  var token = ForgeAuth.accessToken();
  if (!authUser || !token) return Promise.resolve(null);

  // Use the user's own auth token — anon key won't pass RLS policies
  var authHdrs = {
    'apikey': SUPABASE_KEY,
    'Authorization': 'Bearer ' + token,
    'Content-Type': 'application/json'
  };

  // Look up existing student row
  return fetch(SUPABASE_URL + '/rest/v1/students?select=*&auth_user_id=eq.' + authUser.id + '&order=created_at.asc&limit=1', {
    headers: authHdrs
  }).then(function(r) { return r.json(); }).then(function(rows) {
    if (rows && rows.length > 0) {
      var id = rows[0].id;
      state.studentId = id;
      try { localStorage.setItem('forge-paid-student', JSON.stringify({ studentId: id, name: state.studentName })); } catch(e) {}
      return id;
    }
    // No existing row — create one
    return fetch(SUPABASE_URL + '/rest/v1/students', {
      method: 'POST',
      headers: Object.assign({}, authHdrs, { 'Prefer': 'return=representation' }),
      body: JSON.stringify({ name: state.studentName || 'Student', class_id: null, auth_user_id: authUser.id })
    }).then(function(r) {
      if (!r.ok) { return r.text().then(function(t){ console.error('student insert failed:', r.status, t); return null; }); }
      return r.json();
    }).then(function(inserted) {
      var id = (Array.isArray(inserted) && inserted[0]) ? inserted[0].id : null;
      if (id) {
        state.studentId = id;
        try { localStorage.setItem('forge-paid-student', JSON.stringify({ studentId: id, name: state.studentName })); } catch(e) {}
      }
      return id;
    });
  }).catch(function(e) { console.error('ensurePaidStudentId error:', e); return null; });
}
var FREE_SESSION_KEY = 'forge-free-session';

function loadFreeSession() {
  try { return JSON.parse(localStorage.getItem(FREE_SESSION_KEY) || 'null'); } catch(e) { return null; }
}

function saveFreeSession(name, studentId) {
  try { localStorage.setItem(FREE_SESSION_KEY, JSON.stringify({ name: name, studentId: studentId })); } catch(e) {}
}

function generateFreeId() {
  // Random 12-char alphanumeric token
  var chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
  var id = 'free-';
  for (var i = 0; i < 12; i++) id += chars[Math.floor(Math.random() * chars.length)];
  return id;
}

// Register a free student in Supabase (or reuse existing record)
// Uses a deterministic lookup: students table has a 'free_token' column
// Falls back gracefully if column doesn't exist yet
function registerFreeStudent(name, token) {
  // Goes through an RPC for the same reason as joining a class: anon can
  // insert into students but not read it back, so a direct insert asking for
  // the new row fails outright. Reuses the row matching this device's token.
  return fetch(SUPABASE_URL + '/rest/v1/rpc/create_free_student', {
    method: 'POST',
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ p_name: name, p_free_token: token })
  }).then(function(r) { return r.json(); }).then(function(rows) {
    return (Array.isArray(rows) && rows[0]) ? rows[0].student_id : null;
  }).catch(function() { return null; });
}

var app = document.getElementById('app');

function render() {
  if (requestedBank && BANKS[requestedBank] && (state.studentName || state.classId) && state.phase !== 'quiz') {
    // Assignment links are bank-specific. Establish both the bank and its
    // subject before starting so restoration cannot fall back to the full
    // subject bank list.
    state.subject = getSubjectForBank(requestedBank);
    var requestedClass = ForgeClasses.forSubject(state.subject);
    if (requestedClass) activateClass(requestedClass);
    state.bank = requestedBank;
    state.questions = weightedShuffle(BANKS[requestedBank].questions.filter(function(q){return !q.type||q.type==='fill_blank';}), state.weightMap||{});
    state.idx = 0; state.score = 0; state.phase = 'quiz';
    requestedBank = null;
  }
  if (state.phase === 'join') renderJoin();
  else if (state.phase === 'trial-expired') renderTrialExpiredWall();
  else if (state.phase === 'subjects') renderSubjects();
  else if (state.phase === 'banks') renderBanks();
  else if (state.phase === 'quiz') renderQuiz();
  else if (state.phase === 'results') renderResults();
  else if (state.phase === 'mandarin-reader') renderMandarinReader();
}

  wireJoinMore();

  var qlBtn = document.getElementById('ql-btn');
  if (qlBtn) {

      btn.disabled = true; btn.textContent = 'Linking…';

      fetch(SUPABASE_URL + '/rest/v1/rpc/get_class_by_code', {
        method: 'POST',
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ p_code: code })
      }).then(function(r) { return r.json(); }).then(function(classes) {
        if (!Array.isArray(classes) || classes.length === 0) {
          err.textContent = 'Class code not found. Check with your teacher.';
          err.style.display = 'block';
          btn.disabled = false; btn.textContent = 'Link to class →';
          return;
        }
        var cls = classes[0];
        var token = ForgeAuth.accessToken();
        var authHdrs = { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + (token || SUPABASE_KEY), 'Content-Type': 'application/json', 'Prefer': 'return=representation' };

        function finishLink(studentId) {
          state.classId      = cls.id;
          state.studentId    = studentId;
          state.classSubject = cls.subject || null;
          try { localStorage.setItem('forge-student', JSON.stringify({ studentId: studentId, classId: cls.id, classCode: code, studentName: state.studentName, classSubject: cls.subject || null })); } catch(e) {}
          try { localStorage.setItem('forge-paid-student', JSON.stringify({ studentId: studentId, name: state.studentName })); } catch(e) {}
          ForgeClasses.add({
            classId: cls.id, classCode: code, className: cls.name || null,
            subject: cls.subject || null, studentId: studentId, studentName: state.studentName
          });

          // Backfill responses — update student_id to the new class row AND set class_id
          // This ensures teacher dashboard shows the student's history correctly
          if (authUser && token) {
            var subjectFilter = cls.subject ? '&subject=eq.' + encodeURIComponent(cls.subject) : '';
            var userAuthHdrs = { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' };
            // Find ALL student rows for this auth user
            fetch(SUPABASE_URL + '/rest/v1/students?select=id&auth_user_id=eq.' + authUser.id, {
              headers: userAuthHdrs
            }).then(function(r) { return r.json(); }).then(function(studentRows) {
              if (!Array.isArray(studentRows) || studentRows.length === 0) return;
              // For each existing student row, move matching subject responses to the new class row
              studentRows.forEach(function(sr) {
                if (sr.id === studentId) return; // skip the new row itself
                fetch(SUPABASE_URL + '/rest/v1/responses?student_id=eq.' + sr.id + subjectFilter, {
                  method: 'PATCH',
                  headers: userAuthHdrs,
                  body: JSON.stringify({ student_id: studentId, class_id: cls.id })
                }).catch(function(e) { console.error('Backfill failed:', sr.id, e); });
              });
            }).catch(function(e) { console.error('Backfill lookup failed:', e); });
          }
          var banner = document.getElementById('class-link-banner');
          if (banner) {
            banner.innerHTML = '<p style="font-size:13px;color:var(--good)">✓ Linked to <b>' + (cls.name || code) + '</b> — your teacher can now see your progress and your quiz history has carried over.</p>';
          }
          setTimeout(function() { render(); }, 1500);
        }

        // Insert as the signed-in user, not anon: the new row carries their
        // auth_user_id, which is what lets them read it back. Under the anon
        // key there's no SELECT policy, so asking for the row returned fails
        // the whole insert and no row is created.
        var anonHdrs = authHdrs;

        // Always look up existing student row first by auth_user_id to find canonical row
        var authUser = ForgeAuth.currentUser();
        var lookupHdrs = { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + (token || SUPABASE_KEY) };

        function lookupAndLink() {
          if (!authUser) {
            insertNewStudent();
            return;
          }
          // Look for an existing row already linked to THIS specific class
          fetch(SUPABASE_URL + '/rest/v1/students?select=*&auth_user_id=eq.' + authUser.id + '&class_id=eq.' + cls.id, {
            headers: lookupHdrs
          }).then(function(r) { return r.json(); }).then(function(rows) {
            if (Array.isArray(rows) && rows.length > 0) {
              // Already linked to this class — just finish
              finishLink(rows[0].id);
              return;
            }
            // No row for this class yet — create one
            insertNewStudent();
          }).catch(function() { insertNewStudent(); });
        }

        function insertNewStudent() {
          fetch(SUPABASE_URL + '/rest/v1/students', {
            method: 'POST',
            headers: anonHdrs,
            body: JSON.stringify({ name: state.studentName, class_id: cls.id, auth_user_id: authUser ? authUser.id : null })
          }).then(function(r) { return r.json(); }).then(function(rows) {
            var studentId = (Array.isArray(rows) && rows[0]) ? rows[0].id : null;
            finishLink(studentId);
          }).catch(function(e) {
            console.error('INSERT error:', e);
            err.textContent = 'Could not link. Try again.';
            err.style.display = 'block';
            btn.disabled = false; btn.textContent = 'Link to class →';
          });
        }

        lookupAndLink();
      }).catch(function() {
        err.textContent = 'Connection error. Try again.';
        err.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Link to class →';
      });
    };
  }
}

function renderFillBlankQuiz(q,bk,headerHtml){
  var parts=q.template.split('___');
  var sentHtml='<div class="fb-sentence">';
  parts.forEach(function(part,i){
    sentHtml+=part.replace(/\n/g,'<br>');
    if(i<parts.length-1) sentHtml+='<span class="fb-blank" data-idx="'+i+'" data-word=""></span>';
  });
  sentHtml+='</div>';

  var bankWords=q.bank.slice();
  for(var i=bankWords.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var tmp=bankWords[i];bankWords[i]=bankWords[j];bankWords[j]=tmp;
  }

  var h=headerHtml+sentHtml;
  h+='<div class="fb-wordbank" id="fb-bank">';
  bankWords.forEach(function(w,i){
    h+='<button class="fb-word" data-word="'+w+'" data-wi="'+i+'">'+w+'</button>';
  });
  h+='</div>';
  h+='<button class="fb-check-btn" id="fb-check">Check answer</button>';
  h+='<div id="feedback"></div>';
  h+='<div class="clear"></div>';

  app.innerHTML=h;
  document.getElementById('back-banks').onclick=function(){state.phase='banks';render();};

  var blanks=app.querySelectorAll('.fb-blank');
  var words=app.querySelectorAll('.fb-word');
  var checkBtn=document.getElementById('fb-check');
  var answered=false;

  function nextEmptyBlank(){
    for(var k=0;k<blanks.length;k++){ if(!blanks[k].dataset.word) return blanks[k]; }
    return null;
  }
  function updateCheckState(){
    var allFilled=nextEmptyBlank()===null;
    checkBtn.classList.toggle('ready',allFilled&&!answered);
  }

  words.forEach(function(w){
    w.onclick=function(){
      if(answered||w.classList.contains('used'))return;
      var target=nextEmptyBlank();
      if(!target)return;
      target.textContent=w.dataset.word;
      target.dataset.word=w.dataset.word;
      target.dataset.wi=w.dataset.wi;
      target.classList.add('filled');
      w.classList.add('used');
      updateCheckState();
    };
  });

  blanks.forEach(function(b){
    b.onclick=function(){
      if(answered||!b.dataset.word)return;
      var wi=b.dataset.wi;
      var w=app.querySelector('.fb-word[data-wi="'+wi+'"]');
      if(w) w.classList.remove('used');
      b.textContent='';
      b.dataset.word='';
      b.dataset.wi='';
      b.classList.remove('filled');
      updateCheckState();
    };
  });

  checkBtn.onclick=function(){
    if(answered||!checkBtn.classList.contains('ready'))return;
    answered=true;
    var allCorrect=true;
    var given=[];
    blanks.forEach(function(b){
      var idx=parseInt(b.dataset.idx,10);
      var correctWord=q.blanks[idx];
      given.push(b.dataset.word);
      b.classList.add('locked');
      if(b.dataset.word===correctWord){
        b.classList.add('correct');
      }else{
        b.classList.add('wrong');
        allCorrect=false;
      }
    });
    if(allCorrect) state.score++;
    if(isFreeTier()) incrementDailyCount();
    if(state.weightMap){
      if(allCorrect){ state.weightMap[q.id]=Math.max(0.2,(state.weightMap[q.id]||1)*0.5); }
      else{ state.weightMap[q.id]=3; }
    }
    logResponse(q,given.join('|'),allCorrect,false,null);

    checkBtn.style.display='none';

    var fb=document.getElementById('feedback');
    if(allCorrect){
      fb.innerHTML='<div class="praise-box">✓ Nailed it.</div><button class="next-btn btn-glass btn-ember" id="next-btn">Next →</button><div class="clear"></div>';
    }else{
      var fh='<div class="scaffold-box"><span class="stag">'+q.tag+'</span><p>'+q.scaffold+'</p></div>';
      if(q.reforge){
        fh+='<button class="reforge-trigger" id="rf-btn">Re-forge →</button>';
        fh+='<div id="rf-area" class="hidden"></div>';
      }
      fh+='<button class="next-btn btn-glass btn-ember" id="next-btn">Next →</button><div class="clear"></div>';
      fb.innerHTML=fh;
      if(q.reforge){
        document.getElementById('rf-btn').onclick=function(){
          document.getElementById('rf-btn').classList.add('hidden');
          renderReforge(q,document.getElementById('rf-area'),bk.color);
        };
      }
    }
    document.getElementById('next-btn').onclick=function(){
      state.idx++;render();
    };
  };
}

function calcXPFromResponses(responses){
  var xp=0;
  responses.forEach(function(r){
    if(r.question_id&&r.question_id.endsWith('-CRU')&&r.is_correct) xp+=30;
    else if(r.reforge_attempted&&r.reforge_correct) xp+=20;
    else if(r.is_correct&&!r.reforge_attempted) xp+=10;
  });
  return xp;
}
function calcStreakFromResponses(responses){
  if(!responses.length) return 0;
  var dates=[...new Set(responses.map(function(r){return r.created_at?r.created_at.substring(0,10):'';}))].filter(Boolean).sort().reverse();
  if(!dates.length) return 0;
  var today=new Date().toISOString().substring(0,10);
  var yesterday=new Date(Date.now()-86400000).toISOString().substring(0,10);
  if(dates[0]!==today&&dates[0]!==yesterday) return 0;
  var streak=1;
  for(var i=1;i<dates.length;i++){
    var prev=new Date(dates[i-1]);prev.setDate(prev.getDate()-1);
    if(dates[i]===prev.toISOString().substring(0,10)) streak++;
    else break;
  }
  return streak;
}

// ===== SPACED REPETITION ENGINE =====
function buildWeightMap(responses) {
  var now = Date.now();
  var DAY = 86400000;
  var qData = {};
  responses.forEach(function(r) {
    if (!r.question_id || r.reforge_attempted) return;
    var id = r.question_id;
    if (!qData[id]) qData[id] = {correct:0, wrong:0, lastWrong:0};
    if (r.is_correct) qData[id].correct++;
    else {
      qData[id].wrong++;
      var ts = r.created_at ? new Date(r.created_at).getTime() : 0;
      if (ts > qData[id].lastWrong) qData[id].lastWrong = ts;
    }
  });
  var weights = {};
  Object.keys(qData).forEach(function(id) {
    var d = qData[id];
    var daysSinceWrong = d.lastWrong ? (now - d.lastWrong) / DAY : 999;
    if (d.correct >= 3 && d.wrong === 0) weights[id] = 0.2;
    else if (d.wrong > 0 && daysSinceWrong <= 7) weights[id] = 3;
    else if (d.wrong > 0) weights[id] = 2;
  });
  return weights;
}

function weightedShuffle(questions, weightMap) {
  var scored = questions.map(function(q) {
    var w = (weightMap && weightMap[q.id] !== undefined) ? weightMap[q.id] : 1;
    return {q: q, score: w * (0.5 + Math.random())};
  });
  scored.sort(function(a, b) { return b.score - a.score; });
  return scored.map(function(s) { return s.q; });
}

if (ForgeAuth.hasSession()) {
  ForgeAuth.getSession().then(function(result) {
    if (result && result.subscriber) {
      var sub    = result.subscriber;
      var access = result.access;
      state.studentName  = sub.name;
      ForgeClasses.use(sub.name);
      state.paidSubjects = sub.subjects || [];

      // Restore cached studentId if available
      try {
        var paidCache = JSON.parse(localStorage.getItem('forge-paid-student') || 'null');
        if (paidCache && paidCache.studentId) state.studentId = paidCache.studentId;
      } catch(e) {}

      if (access === 'pro') {
        state.isPaid  = true;
        state.isTrial = false;
      } else if (access === 'trial') {
        state.isPaid       = false;
        state.isTrial      = true;
        state.trialDaysLeft = result.daysLeft;
      } else {
        state.isPaid  = false;
        state.isTrial = false;
      }
      if (access === 'expired') {
        state.phase = 'trial-expired';
      } else if (state.paidSubjects.length === 1 && SUBJECTS[state.paidSubjects[0]]) {
        state.subject      = state.paidSubjects[0];
        state.classSubject = state.paidSubjects[0];
        state.phase        = 'banks';
      } else {
        state.phase = 'subjects';
      }
    }
    render();
  }).catch(function() { render(); });
} else {
  var restored = false;
  try {
    var savedSession = JSON.parse(localStorage.getItem('forge-student') || 'null');
    if (savedSession && savedSession.studentName && savedSession.classId) {
      state.studentId    = savedSession.studentId    || null;
      state.classId      = savedSession.classId;
      state.studentName  = savedSession.studentName;
      state.classSubject = savedSession.classSubject || null;
      state.isPaid       = false;
      state.isTrial      = false;

      // Sessions from before multi-class support only know about one class —
      // fold it into the list so it sits alongside any joined since.
      ForgeClasses.adopt(savedSession);

      function settlePhase() {
        var joined = ForgeClasses.subjects(SUBJECTS);
        if (joined.length === 1) {
          state.subject      = joined[0];
          state.classSubject = joined[0];
          state.phase        = 'banks';
        } else if (joined.length > 1) {
          state.phase = 'subjects';
        } else if (state.classSubject && SUBJECTS[state.classSubject]) {
          state.subject = state.classSubject;
          state.phase   = 'banks';
        } else {
          state.phase = 'subjects';
          // Stored without a subject (the classes table has no anon SELECT
          // policy, so this has to come back through the RPC).
          ForgeClasses.backfillSubjects(SUPABASE_URL, SUPABASE_KEY, function() {
            var subs = ForgeClasses.subjects(SUBJECTS);
            if (subs.length === 1) {
              state.subject = subs[0]; state.classSubject = subs[0]; state.phase = 'banks';
            }
            if (subs.length) render();
          });
        }
      }

      settlePhase();
      // Pick up classes joined on the student's other devices.
      ForgeClasses.syncFromServer(SUPABASE_URL, SUPABASE_KEY, {
        studentId: state.studentId, classCode: savedSession.classCode, studentName: state.studentName
      }, function() { settlePhase(); render(); });
      if (state.studentId && savedSession.classCode) {
        supa.ownResponses(state.studentId, savedSession.classCode, state.studentName).then(function(r) {
          state.weightMap = buildWeightMap(Array.isArray(r) ? r : []);
        }).catch(function() { state.weightMap = {}; });
      }
      restored = true;
    }
  } catch(e) {}

  if (!restored) {
    var freeSession = loadFreeSession();

    if (freeSession && freeSession.studentId) {
      state.studentName   = freeSession.name;
      ForgeClasses.use(freeSession.name);
      state.studentId     = freeSession.studentId;
      state.classId       = null;
      state.isPaid        = false;
      state.isTrial       = false;
      state.phase         = 'subjects';
      supa.select('responses', { student_id: freeSession.studentId }).then(function(r) {
        state.weightMap = buildWeightMap(r || []);
      }).catch(function() { state.weightMap = {}; });
      restored = true;
    }
  }
  render();
}

    h += '<div style="background:rgba(255,255,255,.04);border-radius:var(--radius-sm);padding:8px 14px;text-align:center"><div style="font-size:18px;font-weight:700;color:var(--white)">'+grade+'</div><div style="font-size:10px;color:#8A857E">Rank</div></div>';
    h += '</div>';
    h += '<button onclick="(function(){state.mrState={submitted:{},tfSel:{},mcqSel:{},correct:0,total:'+qs.length+',passageIdx:0};render();})()" style="padding:9px 24px;border-radius:var(--radius-sm);border:1px solid #e8472a;background:transparent;color:#e8472a;font-family:Inter,sans-serif;font-weight:600;font-size:13px;cursor:pointer">Try again</button>';
    h += '</div>';
  }

  // Questions
  qs.forEach(function(q, qi) {
    var isSubmitted = !!mrs.submitted[q.id];
    var isCorrect = mrs.submitted[q.id] === true;
    var borderCol = isSubmitted ? (isCorrect ? 'var(--good)' : 'var(--bad)') : 'var(--line)';

    h += '<div id="mr-card-'+q.id+'" style="background:var(--panel);border:1px solid '+borderCol+';border-radius:var(--radius-md);padding:20px;margin-bottom:14px">';

    // Header
    var badgeColors = {tf:'rgba(201,168,76,0.15)|#c9a84c|rgba(201,168,76,0.3)', find:'rgba(99,179,237,0.12)|#63b3ed|rgba(99,179,237,0.25)', mcq:'rgba(154,117,237,0.12)|#b794f4|rgba(154,117,237,0.25)', format:'rgba(232,71,42,0.12)|#e8472a|rgba(232,71,42,0.25)', grammar:'rgba(72,187,120,0.12)|#68d391|rgba(72,187,120,0.25)'};
    var bc = (badgeColors[q.type]||'rgba(255,255,255,.08)|#8A857E|rgba(255,255,255,.15)').split('|');
    h += '<div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:14px">';
    h += '<span style="font-size:11px;font-weight:700;color:#5a5858;padding-top:2px">'+(qi+1)+'.</span>';
    h += '<span style="font-size:9px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;padding:3px 7px;border-radius:var(--radius-xs);background:'+bc[0]+';color:'+bc[1]+';border:1px solid '+bc[2]+';flex-shrink:0">'+q.badge+'</span>';
    h += '</div>';

    // Question text
    var qtext = q.textZh ? '<span style="font-family:\'Noto Sans SC\',STHeiti,SimHei,sans-serif;font-size:15px">'+q.text+'</span>' : q.text;
    h += '<div style="font-size:14px;line-height:1.6;color:var(--white);margin-bottom:14px">'+qtext+'</div>';
    if (q.textZh && q.subtext) {
      h += '<div style="font-size:12px;color:#8A857E;margin-top:-10px;margin-bottom:12px">'+q.subtext+'</div>';
    }

    // Input
    if (q.type === 'tf') {
      var tfVal = mrs.tfSel[q.id] || '';
      h += '<div style="display:flex;gap:10px;margin-bottom:12px">';
      ['true','false'].forEach(function(v){
        var sel = tfVal === v;
        h += '<button onclick="mrSelectTF(\''+q.id+'\',\''+v+'\')" style="flex:1;padding:9px;border-radius:var(--radius-sm);border:1px solid '+(sel?'#c9a84c':'var(--line)')+';background:'+(sel?'rgba(201,168,76,0.08)':'transparent')+';color:'+(sel?'#c9a84c':'#8A857E')+';font-size:13px;font-weight:600;cursor:pointer;font-family:Inter,sans-serif">'+(v==='true'?'✓ True':'✗ False')+'</button>';
      });
      h += '</div>';
      h += '<div id="mr-just-area-'+q.id+'" style="display:'+(tfVal?'block':'none')+'">';
      h += '<div style="font-size:11px;color:#8A857E;margin-bottom:5px;font-weight:500">Justify — quote directly from the text (in Chinese):</div>';
      h += '<textarea id="mr-just-'+q.id+'" style="width:100%;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:var(--radius-sm);padding:9px 12px;color:var(--white);font-family:\'Noto Sans SC\',STHeiti,SimHei,sans-serif;font-size:14px;resize:none;min-height:56px;outline:none;line-height:1.8" placeholder="Copy the relevant characters from the passage…"></textarea>';
      h += '</div>';
      h += '<button onclick="mrSubmit(\''+q.id+'\')" id="mr-sbtn-'+q.id+'" '+(isSubmitted||!tfVal?'disabled':'')+' style="width:100%;padding:10px;border-radius:var(--radius-sm);border:none;background:#e8472a;color:#fff;font-family:Inter,sans-serif;font-size:13px;font-weight:600;cursor:pointer;margin-top:12px;opacity:'+(isSubmitted||!tfVal?'.4':'1')+'">Check answer</button>';
    } else if (q.type === 'find') {
      h += '<div style="font-size:11px;color:#5a5858;margin-bottom:8px">📌 '+q.lineRef+'</div>';
      h += '<input id="mr-find-'+q.id+'" oninput="mrFindInput(\''+q.id+'\')" style="width:100%;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:var(--radius-sm);padding:9px 12px;color:var(--white);font-family:\'Noto Sans SC\',STHeiti,SimHei,sans-serif;font-size:15px;outline:none" placeholder="Type the character(s) here…">';
      h += '<button onclick="mrSubmit(\''+q.id+'\')" id="mr-sbtn-'+q.id+'" disabled style="width:100%;padding:10px;border-radius:var(--radius-sm);border:none;background:#e8472a;color:#fff;font-family:Inter,sans-serif;font-size:13px;font-weight:600;cursor:pointer;margin-top:12px;opacity:.4">Check answer</button>';
    } else {
      var selK = mrs.mcqSel[q.id] || '';
      q.opts.forEach(function(o){
        var sel = selK === o.k;
        var corr = isSubmitted && o.k === q.answer;
        var wrong = isSubmitted && sel && !corr;
        var borderC = corr ? 'var(--good)' : wrong ? 'var(--bad)' : sel ? '#c9a84c' : 'var(--line)';
        var bgC = corr ? 'rgba(127,217,138,.08)' : wrong ? 'rgba(255,90,90,.07)' : sel ? 'rgba(201,168,76,.06)' : 'var(--panel-2)';
        var letterC = corr ? 'var(--good)' : wrong ? 'var(--bad)' : sel ? '#c9a84c' : '#8A857E';
        var textStyle = o.zh ? 'font-family:\'Noto Sans SC\',STHeiti,SimHei,sans-serif;font-size:14px' : '';
        h += '<button onclick="mrSelectMCQ(\''+q.id+'\',\''+o.k+'\')" style="display:flex;align-items:flex-start;gap:10px;padding:11px 13px;border-radius:var(--radius-sm);border:1px solid '+borderC+';background:'+bgC+';cursor:pointer;text-align:left;width:100%;margin-bottom:7px;font-family:Inter,sans-serif">';
        h += '<span style="width:20px;height:20px;border-radius:50%;border:1px solid '+letterC+';display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;color:'+letterC+'">'+o.k+'</span>';
        h += '<span style="font-size:13px;line-height:1.5;color:var(--white);padding-top:1px;'+textStyle+'">'+o.t+'</span>';
        h += '</button>';
      });
      h += '<button onclick="mrSubmit(\''+q.id+'\')" id="mr-sbtn-'+q.id+'" '+(isSubmitted||!selK?'disabled':'')+' style="width:100%;padding:10px;border-radius:var(--radius-sm);border:none;background:#e8472a;color:#fff;font-family:Inter,sans-serif;font-size:13px;font-weight:600;cursor:pointer;margin-top:4px;opacity:'+(isSubmitted||!selK?'.4':'1')+'">Check answer</button>';
    }

    // Feedback
    if (isSubmitted) {
      h += '<div style="margin-top:12px;padding:12px 14px;border-radius:var(--radius-sm);'+(isCorrect?'background:rgba(127,217,138,.1);border:1px solid rgba(127,217,138,.25)':'background:rgba(255,90,90,.08);border:1px solid rgba(255,90,90,.2)')+'">';
      h += '<div style="font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;margin-bottom:5px;color:'+(isCorrect?'var(--good)':'var(--bad)')+'">'+(isCorrect?'✓ Correct':'✗ Review')+'</div>';
      h += '<div style="font-size:13px;line-height:1.6;color:#8A857E">'+q.fb[isCorrect?'correct':'incorrect']+'</div>';
      h += '</div>';
    }

    h += '</div>';
  });

  h += '</div></div>'; // close questions panel + layout

  app.innerHTML = h;
}

function mrSelectTF(qid, val) {
  if (state.mrState.submitted[qid]) return;
  state.mrState.tfSel[qid] = val;
  render();
}

function mrFindInput(qid) {
  var el = document.getElementById('mr-find-'+qid);
  var btn = document.getElementById('mr-sbtn-'+qid);
  if (!el || !btn) return;
  var hasVal = el.value.trim().length > 0;
  btn.disabled = !hasVal;
  btn.style.opacity = hasVal ? '1' : '.4';
}

function mrSelectMCQ(qid, letter) {
  if (state.mrState.submitted[qid]) return;
  state.mrState.mcqSel[qid] = letter;
  render();
}

function mrSubmit(qid) {
  if (state.mrState.submitted[qid]) return;
  var p = MANDARIN_PASSAGES[state.mrState.passageIdx || 0];
  var q = p.questions.find(function(x){ return x.id === qid; });
  var isCorrect = false;

  if (q.type === 'tf') {
    var tfOk = state.mrState.tfSel[qid] === q.tfAnswer;
    var just = (document.getElementById('mr-just-'+qid)||{}).value || '';
    var justOk = just.trim().length > 0 && q.justKeys.some(function(kw){ return just.includes(kw); });
    isCorrect = tfOk && justOk;
  } else if (q.type === 'find') {
    var val = ((document.getElementById('mr-find-'+qid)||{}).value||'').trim();
    isCorrect = val.includes(q.answer);
  } else {
    isCorrect = state.mrState.mcqSel[qid] === q.answer;
  }

  state.mrState.submitted[qid] = isCorrect;
  if (isCorrect) state.mrState.correct++;

  // Log to Supabase
  if (state.studentId) {
    var row = { student_id: state.studentId, class_id: state.classId, question_id: qid, bank: 'MAN-EXP-1', subject: 'mandarin', selected_option: isCorrect ? q.answer : '?', is_correct: isCorrect, misconception_tag: isCorrect ? null : 'MC-MAN-01', reforge_attempted: false, reforge_correct: null };
    supa.insert('responses', row);
  }

  render();
}
</script>
<script src="scripts/nav.js"></script>
